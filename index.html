百萬 token 輸入 1.36、輸出 4.18 美元；開放權重預計 10 月底才釋出。訓練用了 3,800 張 Nvidia Grace Blackwell，在 Mistral 自己的歐洲資料中心。官方自報資安測驗 Cybench 93%，還說在一項漏洞重現評測上贏過 Claude Opus 5.5 和 GPT-6 Astra——這些都是自家公布的數字，目前還沒有第三方實測。", "why": "這是歐洲少數能拼前沿的開放權重模型。但一兆參數就算開放下載，也不是個人電腦跑得動的；它的意義在於企業能自己架、資料不必出公司。跑分是自報、權重還沒放，先別當定論。", "source_name": "Mistral AI", "source_url": "https://mistral.ai/news/mistral-large-4"}, {"tag": "產業", "title": "Anthropic 把找漏洞的最強能力改成三級申請制：防禦、紅隊、特殊，個人研究者也能申請最低級", "body": "Anthropic 10/6 把原本只給少數大廠的 Project Glasswing 和「資安驗證計畫」（Cyber Verification Program）合併成三級：防禦級（資安監控、事件應變、惡意程式逆向、漏洞分析；企業、學校、開源維護者、個人研究者都能申請，審核約幾天）、紅隊級（再加上授權滲透測試，只收組織，審核約幾週，仍會即時擋可能造成實體傷害或大規模癱瘓的動作）、特殊級（封鎖最少，用來測航空、電網、電信、金融、政府網路這類系統，與美國政府合作深度審查，Glasswing 成員自動轉入）。通過後可用 Opus 5.5、Sonnet 5.5 與 Mythos 5.1，攔截用的分類器會放寬。Anthropic 自述 Glasswing 夥伴在 4–7 月找到至少 12.9 萬個經確認的漏洞，其中三萬三千多個屬高危或重大。", "analogy": "像化學品倉庫的分級門禁：一般員工領得到清潔劑，持證工程師才領得到強酸，最危險的那櫃要主管加外部稽核一起簽。", "why": "同一個模型，對不同身分的人開不同程度的能力——AI 安全正從「一律擋」走向「看人給」。今天的今日一詞就講這套做法。", "source_name": "Anthropic", "source_url": "https://www.anthropic.com/news/cyber-verification-program"}], "industry": [{"text": "芬蘭監管機關要求 Google 子公司暫停兩座資料中心（Muhos、Kajaani）的伐林、開挖、爆破等工程，最晚 10/23 前停工，直到環境影響評估完成；Google 已承認兩地共砍了約 530 公頃森林，表示會檢視主管機關的認定。AI 算力蓋得快，土地和環評開始踩煞車。", "source_name": "CNBC", "source_url": "https://www.cnbc.com/2026/10/07/google-finland-data-center-halt.html"}, {"text": "美國兒少媒體評鑑組織 Common Sense Media 把「ChatGPT for Teens」評為「不可接受的風險」：用 13–17 歲帳號測了 4,000 多個提示，談自傷、飲食失調的對話可以持續近一小時都沒通知家長，超過四分之一該轉介危機資源的情況沒轉。OpenAI 反駁測試方式不符實際運作。", "source_name": "Common Sense Media", "source_url": "https://www.commonsensemedia.org/press-releases/chatgpt-for-teens-poses-unacceptable-risk-to-kids-common-sense-media-finds"}], "term": {"zh": "分級存取", "en": "Tiered Access / Structured Access", "explain": "不把模型能力當成「全開或全關」二選一，而是依使用者的身分、用途和審核程度，開放不同範圍的能力。一般人用的版本由分類器擋掉高風險請求；通過身分與用途審查的人，拿到放寬的版本；最高級只給經過深度審查的機構，而且持續監控使用狀況。前提是模型只透過 API 提供、權重不外流——權重一旦開放下載，就沒有門禁可言，這也是為什麼開放權重模型的資安能力（像今天 Mistral 自報的 Cybench 分數）特別受關注。", "analogy": "像產線設備的權限分級：作業員只能按啟動，技術員可以調參數，工程師才能改韌體。權限跟著人和工作內容走，而不是誰站到機台前誰就能動。", "why": "越強的模型越不會對所有人全開，你會看到越來越多「要申請才能用」的功能。看到這類消息，可以問三件事：分幾級？靠什麼審核？權重有沒有外流的可能？"}} 佔位符。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>

<script>
  const D = {"day": 20, "date": "2026-10-07", "weekday": "週三", "headline": "OpenAI 一口氣公開 372 個數學結果，說幾乎都是「一個 prompt 交給一個 agent」做出來的，但模型和 prompt 都不公開，數學家直說「沒辦法重現就先當未驗證」；同一天 Anthropic 把最會找漏洞的能力改成三級申請制、Mistral 推出一兆參數的 Large 4——能力越強，「誰能用、怎麼驗」就越是重點。", "top": [{"tag": "工具", "title": "Claude Code 2.1.292：派 subagent 可以指定努力等級，另修好「/resume 之後建的排程永遠不觸發」和 Grep 讀不到檔卻回「沒找到」", "body": "10/6 發布。跟你最有關的幾項：Agent 工具多了 `effort` 參數，派 subagent 時可以指定它用哪個努力等級跑；修好 `/resume`、`/branch`、`/clear` 之後才建立的排程任務永遠不會觸發；Grep／Glob 遇到讀不到的檔案或資料夾，以前會安靜回「沒有符合」，現在會重試一次或明講讀不到；Read 讀 PDF 時 `pages` 給 \"6,9,15\" 這種清單只回第一頁、也不報錯，現在改成報錯要你分開讀。安全修正兩項：hook 核准或 auto mode 讀取網路路徑（UNC，像 `\\\\server\\share`）時會跳過權限提示；在 Windows 用 8.3 短檔名或其他寫法指到家目錄或整顆磁碟時，`rm -rf` 沒被當成「刪整個家目錄」來擋。", "analogy": "`effort` 參數就像派工單上多了一欄「加工等級」：以前只能指定交給哪台機器（haiku／sonnet／opus），現在連「精車還是粗車」都能逐張寫。", "why": "你的派工規則本來就是「掃檔 haiku、審查 opus」，現在連努力等級都能逐件指定。Grep 誤報「沒找到」這個修正特別要注意：你的第一條硬規則是「大檔先 Grep 定位」，舊版遇到讀不到的路徑會讓你誤以為檔案裡沒有那段字。", "source_name": "Claude Code CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "研究", "title": "OpenAI 公開 372 個數學結果，宣稱幾乎都由單一 agent 一次做出；模型、prompt 都不公開，數學界要求先能重現", "body": "OpenAI 10/6 把 372 個數學結果放上 GitHub，全部出自一個還沒發布的內部模型。發言人告訴《科學人》（Scientific American），幾乎每一個都是「把同一個 prompt 交給同一個 agent」做出來的，有些試了不只一次。宣稱內容包括四維 Kakeya 猜想的解答，以及朝黎曼猜想的進展。但模型、確切的 prompt、每題花了多少算力都沒公開，只給平均值。MIT 數學家 Andrew Sutherland 的看法是：模型公開、別人能重現之前，「單一 agent 一次解出」這種說法都該當作未驗證。", "analogy": "像供應商一次送來 372 份「良率 99%」的報告，但不讓你看產線、不給製程參數。報告可能是真的，可是你沒辦法自己再做一次來驗。", "why": "「agent 自己跑出重大成果」的新聞只會越來越多，判斷的關鍵是能不能重現、證明有沒有人獨立檢查過。你自己用多 agent 交叉審查，也是同一個道理：結論要讓別人能再跑一次。", "source_name": "Scientific American", "source_url": "https://www.scientificamerican.com/article/openai-unleashes-hundreds-more-math-results-upon-a-field-already-in-shock/"}, {"tag": "新模型", "title": "Mistral Large 4：一兆參數、每次只動 490 億，先開 API，權重月底才放", "body": "法國 Mistral 10/6 發表 Large 4：總參數 1 兆、每次推論只啟用 490 億，原生多模態，一般模式和推理模式合在同一個模型。現在先開 API 公開預覽，每百萬 token 輸入 1.36、輸出 4.18 美元；開放權重預計 10 月底才釋出。訓練用了 3,800 張 Nvidia Grace Blackwell，在 Mistral 自己的歐洲資料中心。官方自報資安測驗 Cybench 93%，還說在一項漏洞重現評測上贏過 Claude Opus 5.5 和 GPT-6 Astra——這些都是自家公布的數字，目前還沒有第三方實測。", "why": "這是歐洲少數能拼前沿的開放權重模型。但一兆參數就算開放下載，也不是個人電腦跑得動的；它的意義在於企業能自己架、資料不必出公司。跑分是自報、權重還沒放，先別當定論。", "source_name": "Mistral AI", "source_url": "https://mistral.ai/news/mistral-large-4"}, {"tag": "產業", "title": "Anthropic 把找漏洞的最強能力改成三級申請制：防禦、紅隊、特殊，個人研究者也能申請最低級", "body": "Anthropic 10/6 把原本只給少數大廠的 Project Glasswing 和「資安驗證計畫」（Cyber Verification Program）合併成三級：防禦級（資安監控、事件應變、惡意程式逆向、漏洞分析；企業、學校、開源維護者、個人研究者都能申請，審核約幾天）、紅隊級（再加上授權滲透測試，只收組織，審核約幾週，仍會即時擋可能造成實體傷害或大規模癱瘓的動作）、特殊級（封鎖最少，用來測航空、電網、電信、金融、政府網路這類系統，與美國政府合作深度審查，Glasswing 成員自動轉入）。通過後可用 Opus 5.5、Sonnet 5.5 與 Mythos 5.1，攔截用的分類器會放寬。Anthropic 自述 Glasswing 夥伴在 4–7 月找到至少 12.9 萬個經確認的漏洞，其中三萬三千多個屬高危或重大。", "analogy": "像化學品倉庫的分級門禁：一般員工領得到清潔劑，持證工程師才領得到強酸，最危險的那櫃要主管加外部稽核一起簽。", "why": "同一個模型，對不同身分的人開不同程度的能力——AI 安全正從「一律擋」走向「看人給」。今天的今日一詞就講這套做法。", "source_name": "Anthropic", "source_url": "https://www.anthropic.com/news/cyber-verification-program"}], "industry": [{"text": "芬蘭監管機關要求 Google 子公司暫停兩座資料中心（Muhos、Kajaani）的伐林、開挖、爆破等工程，最晚 10/23 前停工，直到環境影響評估完成；Google 已承認兩地共砍了約 530 公頃森林，表示會檢視主管機關的認定。AI 算力蓋得快，土地和環評開始踩煞車。", "source_name": "CNBC", "source_url": "https://www.cnbc.com/2026/10/07/google-finland-data-center-halt.html"}, {"text": "美國兒少媒體評鑑組織 Common Sense Media 把「ChatGPT for Teens」評為「不可接受的風險」：用 13–17 歲帳號測了 4,000 多個提示，談自傷、飲食失調的對話可以持續近一小時都沒通知家長，超過四分之一該轉介危機資源的情況沒轉。OpenAI 反駁測試方式不符實際運作。", "source_name": "Common Sense Media", "source_url": "https://www.commonsensemedia.org/press-releases/chatgpt-for-teens-poses-unacceptable-risk-to-kids-common-sense-media-finds"}], "term": {"zh": "分級存取", "en": "Tiered Access / Structured Access", "explain": "不把模型能力當成「全開或全關」二選一，而是依使用者的身分、用途和審核程度，開放不同範圍的能力。一般人用的版本由分類器擋掉高風險請求；通過身分與用途審查的人，拿到放寬的版本；最高級只給經過深度審查的機構，而且持續監控使用狀況。前提是模型只透過 API 提供、權重不外流——權重一旦開放下載，就沒有門禁可言，這也是為什麼開放權重模型的資安能力（像今天 Mistral 自報的 Cybench 分數）特別受關注。", "analogy": "像產線設備的權限分級：作業員只能按啟動，技術員可以調參數，工程師才能改韌體。權限跟著人和工作內容走，而不是誰站到機台前誰就能動。", "why": "越強的模型越不會對所有人全開，你會看到越來越多「要申請才能用」的功能。看到這類消息，可以問三件事：分幾級？靠什麼審核？權重有沒有外流的可能？"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  document.title = "每日 AI 情報 #" + (D.day||"") + " · " + (D.date||"");
  document.getElementById("term-file").textContent = "ai-daily.log — day " + (D.day||"") + " (" + (D.date||"") + ")";
  document.getElementById("h-title").textContent = "AI 每日速報 #" + (D.day||"");
  document.getElementById("h-date").textContent = (D.date||"") + (D.weekday?("（"+D.weekday+"）"):"");
  document.getElementById("headline").textContent = D.headline||"";

  document.getElementById("top").innerHTML = (D.top||[]).map(t=>`
    <div class="card">
      ${t.tag?`<span class="chip">${esc(t.tag)}</span>`:""}
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.body)}</p>
      ${t.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(t.analogy)}</div>`:""}
      ${t.why?`<div class="why"><b>為什麼你該知道：</b>${esc(t.why)}</div>`:""}
      ${t.source_url?`<div class="src">來源：<a href="${esc(t.source_url)}" target="_blank" rel="noopener">${esc(t.source_name||t.source_url)}</a></div>`:""}
    </div>`).join("");

  document.getElementById("industry").innerHTML = (D.industry||[]).map(i=>`
    <li>${esc(i.text)} ${i.source_url?`· <a href="${esc(i.source_url)}" target="_blank" rel="noopener">${esc(i.source_name||"來源")}</a>`:""}</li>`).join("");

  const tm = D.term||{};
  document.getElementById("term").innerHTML = `
    <div class="term">
      <div class="name">${esc(tm.zh||"")}<span class="en">${esc(tm.en||"")}</span></div>
      <p>${esc(tm.explain||"")}</p>
      ${tm.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(tm.analogy)}</div>`:""}
      ${tm.why?`<p class="why"><b>為什麼重要：</b>${esc(tm.why)}</p>`:""}
    </div>`;

  document.getElementById("footer").innerHTML =
    "每天自動更新 · 由 Claude 依當日公開新聞整理，僅供快速掌握趨勢，重要決策請點來源查證<br>#" +
    (D.day||"") + " · " + (D.date||"");
</script>
