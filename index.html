  build_ai_page.py 會把 content.json 的內容以 JSON 塞進 {"day": 28, "date": "2026-10-17", "weekday": "週六", "headline": "Google DeepMind 讓四個 Gemini 4 Argon agent 從零打通 Minecraft，花了 27 小時、死了 605 次——能做完長任務了，但離「每次都做得完」還很遠；同一天中國公布草案，要把大模型、智慧體與模型權重等 23 項 AI 技術列入出口管制。", "top": [{"tag": "工具", "title": "Claude Code 2.1.302：桌面版 subagent 一律放背景跑、分叉 subagent 預設開啟，Claude Design 獨立版 12/14 關閉", "body": "10/17 凌晨（台灣時間）釋出的 2.1.302 改了幾個你在桌面版天天會碰到的行為：主對話派出的 subagent 一律在背景執行（跟終端機版一致，不再由 Claude 自己決定前景或背景）；「分叉 subagent」（fork，會繼承目前對話脈絡的那種）在桌面版、VS Code 與 `claude -p` 改成預設開啟，可用 `CLAUDE_CODE_FORK_SUBAGENT=0` 關掉。另外修了 PowerShell 工具把 rg／grep 找不到結果接到 `Select-Object` 時誤報錯誤、exFAT／FAT32 隨身碟上的專案每次寫檔都被擋或被問的問題；`/config` 新增「閒置壓縮」開關。這版也在 `/design-sync` 加上提醒：獨立的 Claude Design（claude.ai/design）將在 12 月 14 日關閉。", "analogy": "像產線把「要不要外包某一站」的判斷權收回來統一規定：以前每個領班自己決定，現在規定一律外包、主線不停等；行為變得可預期，但你排程時要記得那一站的結果是之後才回來。", "why": "你的排程與多 agent 審查都靠 subagent；背景化之後主對話會先往下走，派工 prompt 要寫清楚「等結果回來再做下一步」。插在 exFAT 隨身碟上的專案也終於能正常寫檔。", "source_name": "Claude Code CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "研究", "title": "四個 Gemini 4 Argon agent 從隨機世界打倒終界龍：27 小時、2,783 支程式、死 605 次", "body": "Google DeepMind 研究員在 arXiv 發表論文（10/15），讓四個 Gemini 4 Argon agent 在 Minecraft Java 1.20.4、簡單難度、隨機生成的生存世界裡，不經人工介入一路打到擊敗終界龍，共花 27 小時 14 分。agent 不看畫面也不按鍵，而是透過開源的 Mineflayer 函式庫寫 JavaScript 小程式操控角色、讀回文字結果；彼此靠遊戲內聊天與共享記憶協調，分工沒有預先指定。作者自己列出限制：只跑了一次（就是第一次嘗試）、只有簡單難度、Mineflayer 給的資訊比人類玩家看到的多（連石頭後面的方塊都知道），22% 的程式執行出錯，光終界戰就耗了將近 14 小時。論文估算到勝利為止的 API 費用約 520 美元（導入期價格，標準價約 1,040 美元）。", "analogy": "像試產第一批就整線跑通、出了貨，但只跑了一批：證明製程「做得出來」，還不能說良率穩定。", "why": "你自己的 Minecraft AI 地圖專案也是讓 AI 寫程式去操作遊戲；這篇的架構（agent 寫小程式、讀文字回饋、靠共享記憶協作）和它列的失敗數字，都是很實際的參考。", "source_name": "arXiv 2610.22319（Faldor、Singh、Raileanu）", "source_url": "https://arxiv.org/html/2610.22319"}, {"tag": "工具", "title": "Perplexity 開源 agent 沙箱 SPACE：自家測試九個前沿模型都沒逃出來", "body": "Perplexity 10/15 把內部用來關住 AI agent 的沙箱平台 SPACE 開源（Apache 2.0）。它用 Rust 寫成，每個沙箱是一台 Firecracker 微型虛擬機（microVM），外部程式透過 HTTP API 開 Linux 環境、執行指令。Perplexity 說讓九個前沿模型嘗試逃脫、共 118 次都沒成功（官方公告另列 108 次「從 VM 逃到主機」的測試），但也承認舊環境的網路限制曾被繞過 11 次、事後已補上。CoreWeave、Akamai、Crusoe 三家雲端會提供給客戶使用。以上數字都是 Perplexity 自己測的，尚無第三方驗證。", "analogy": "像把可能失控的測試品關進獨立的隔離房，而不是在同一間廠房用膠帶圍一圈：牆是硬體虛擬化畫出來的，比較難鑽過去；但通風管（網路出口）仍是最常出事的地方。", "why": "前幾期講過沙箱隔離與網路出口管控，這次是可以直接拿來用的開源實作；也再次印證「網路」比「牆」更容易漏。", "source_name": "Semafor", "source_url": "https://www.semafor.com/article/10/15/2026/perplexity-to-give-away-its-ai-security-software"}, {"tag": "政策", "title": "中國公布出口管制草案：大模型、智慧體、模型權重等 23 項 AI 技術擬列管", "body": "中國商務部與科技部 10/16 發布公告，草擬修訂《禁止出口限制出口技術目錄》，新增 40 項，其中 AI 23 項、光電／太陽能 12 項、生物醫藥 5 項；多家報導指 AI 項目涵蓋大模型、智慧體（agent）、模型權重與晶片設計工具。意見徵集到 11 月 15 日，目錄還沒正式生效，但同時先上路一項臨時規定：要出口清單上的技術，得先登記。管的是技術本身與授權轉移，不是已經做好的成品；有報導說 API、App 與 SaaS 服務不在範圍內，但官方原文未見此說明，屬未證實。", "why": "美國管晶片、中國開始管模型與權重，AI 正式變成兩邊都列管的戰略物資；之後用中國開放權重模型、或跟兩岸供應鏈合作做 AI 功能，合規條件可能會變。", "source_name": "Geopolitechs", "source_url": "https://www.geopolitechs.org/p/china-imposes-temporary-export-registration"}], "industry": [{"text": "Anthropic 說明獨立版 Claude Design（claude.ai/design）12 月 14 日關閉、之後導向 Claude：設計系統現在就能從 Artifacts 頁面一鍵遷移，專案的遷移方式還沒公布；在獨立版裡的對話與留言不會搬過來，關閉後依保留政策刪除，公開分享連結也會失效。", "source_name": "Claude 說明中心", "source_url": "https://support.claude.com/en/articles/17440474-migrate-from-standalone-claude-design-to-claude"}, {"text": "Meta 10/30 生效的新商業條款寫明：商家帳號繼續使用 Facebook、Instagram、WhatsApp，就等於同意 Meta 爬取跟該帳號相關的網站，並可用來訓練 Meta 的產品；三位法律專家向 Nieman Lab 表示條款裡沒有退出選項，新聞網站首當其衝。", "source_name": "Nieman Lab", "source_url": "https://www.niemanlab.org/?p=254251"}], "term": {"zh": "長時程任務", "en": "Long-horizon Task", "explain": "需要 agent 連續做很多步、跑很久（幾小時到幾天）才完成的任務，例如今天新聞裡打通 Minecraft。難處不在單一步驟，而在「步驟一多，小錯會累積」：就算每一步有 99% 成功，連做 100 步全對的機率只剩約 37%。所以長時程任務的關鍵能力是「出錯後察覺並修回來」——寫程式失敗就讀錯誤訊息重寫、死了就重新規劃——而不是每步都不出錯。評測時也要注意：成功一次不等於穩定成功，要看重跑多次的成功率。", "analogy": "就是產線的累積良率（Rolled Throughput Yield）：每站良率 99% 看起來很好，串 100 站下來直通率只剩三成多；所以真正撐住產量的是每站後面的檢測與重工站，而不是要求每站完美。", "why": "你派給 Claude 的排程（例如這份每日網頁要搜尋、寫稿、建置、發布、驗證）本身就是長時程任務；流程裡每一步都設「做完要驗證、失敗要報錯」，就是在補累積良率。"}} 佔位符。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>

    <ul class="ind" id="industry"></ul>

    <div class="sec-title">今日一詞</div>
    <div id="term"></div>

    <footer id="footer"></footer>
  </div>
</div>
<script>
  const D = {"day": 28, "date": "2026-10-17", "weekday": "週六", "headline": "Google DeepMind 讓四個 Gemini 4 Argon agent 從零打通 Minecraft，花了 27 小時、死了 605 次——能做完長任務了，但離「每次都做得完」還很遠；同一天中國公布草案，要把大模型、智慧體與模型權重等 23 項 AI 技術列入出口管制。", "top": [{"tag": "工具", "title": "Claude Code 2.1.302：桌面版 subagent 一律放背景跑、分叉 subagent 預設開啟，Claude Design 獨立版 12/14 關閉", "body": "10/17 凌晨（台灣時間）釋出的 2.1.302 改了幾個你在桌面版天天會碰到的行為：主對話派出的 subagent 一律在背景執行（跟終端機版一致，不再由 Claude 自己決定前景或背景）；「分叉 subagent」（fork，會繼承目前對話脈絡的那種）在桌面版、VS Code 與 `claude -p` 改成預設開啟，可用 `CLAUDE_CODE_FORK_SUBAGENT=0` 關掉。另外修了 PowerShell 工具把 rg／grep 找不到結果接到 `Select-Object` 時誤報錯誤、exFAT／FAT32 隨身碟上的專案每次寫檔都被擋或被問的問題；`/config` 新增「閒置壓縮」開關。這版也在 `/design-sync` 加上提醒：獨立的 Claude Design（claude.ai/design）將在 12 月 14 日關閉。", "analogy": "像產線把「要不要外包某一站」的判斷權收回來統一規定：以前每個領班自己決定，現在規定一律外包、主線不停等；行為變得可預期，但你排程時要記得那一站的結果是之後才回來。", "why": "你的排程與多 agent 審查都靠 subagent；背景化之後主對話會先往下走，派工 prompt 要寫清楚「等結果回來再做下一步」。插在 exFAT 隨身碟上的專案也終於能正常寫檔。", "source_name": "Claude Code CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "研究", "title": "四個 Gemini 4 Argon agent 從隨機世界打倒終界龍：27 小時、2,783 支程式、死 605 次", "body": "Google DeepMind 研究員在 arXiv 發表論文（10/15），讓四個 Gemini 4 Argon agent 在 Minecraft Java 1.20.4、簡單難度、隨機生成的生存世界裡，不經人工介入一路打到擊敗終界龍，共花 27 小時 14 分。agent 不看畫面也不按鍵，而是透過開源的 Mineflayer 函式庫寫 JavaScript 小程式操控角色、讀回文字結果；彼此靠遊戲內聊天與共享記憶協調，分工沒有預先指定。作者自己列出限制：只跑了一次（就是第一次嘗試）、只有簡單難度、Mineflayer 給的資訊比人類玩家看到的多（連石頭後面的方塊都知道），22% 的程式執行出錯，光終界戰就耗了將近 14 小時。論文估算到勝利為止的 API 費用約 520 美元（導入期價格，標準價約 1,040 美元）。", "analogy": "像試產第一批就整線跑通、出了貨，但只跑了一批：證明製程「做得出來」，還不能說良率穩定。", "why": "你自己的 Minecraft AI 地圖專案也是讓 AI 寫程式去操作遊戲；這篇的架構（agent 寫小程式、讀文字回饋、靠共享記憶協作）和它列的失敗數字，都是很實際的參考。", "source_name": "arXiv 2610.22319（Faldor、Singh、Raileanu）", "source_url": "https://arxiv.org/html/2610.22319"}, {"tag": "工具", "title": "Perplexity 開源 agent 沙箱 SPACE：自家測試九個前沿模型都沒逃出來", "body": "Perplexity 10/15 把內部用來關住 AI agent 的沙箱平台 SPACE 開源（Apache 2.0）。它用 Rust 寫成，每個沙箱是一台 Firecracker 微型虛擬機（microVM），外部程式透過 HTTP API 開 Linux 環境、執行指令。Perplexity 說讓九個前沿模型嘗試逃脫、共 118 次都沒成功（官方公告另列 108 次「從 VM 逃到主機」的測試），但也承認舊環境的網路限制曾被繞過 11 次、事後已補上。CoreWeave、Akamai、Crusoe 三家雲端會提供給客戶使用。以上數字都是 Perplexity 自己測的，尚無第三方驗證。", "analogy": "像把可能失控的測試品關進獨立的隔離房，而不是在同一間廠房用膠帶圍一圈：牆是硬體虛擬化畫出來的，比較難鑽過去；但通風管（網路出口）仍是最常出事的地方。", "why": "前幾期講過沙箱隔離與網路出口管控，這次是可以直接拿來用的開源實作；也再次印證「網路」比「牆」更容易漏。", "source_name": "Semafor", "source_url": "https://www.semafor.com/article/10/15/2026/perplexity-to-give-away-its-ai-security-software"}, {"tag": "政策", "title": "中國公布出口管制草案：大模型、智慧體、模型權重等 23 項 AI 技術擬列管", "body": "中國商務部與科技部 10/16 發布公告，草擬修訂《禁止出口限制出口技術目錄》，新增 40 項，其中 AI 23 項、光電／太陽能 12 項、生物醫藥 5 項；多家報導指 AI 項目涵蓋大模型、智慧體（agent）、模型權重與晶片設計工具。意見徵集到 11 月 15 日，目錄還沒正式生效，但同時先上路一項臨時規定：要出口清單上的技術，得先登記。管的是技術本身與授權轉移，不是已經做好的成品；有報導說 API、App 與 SaaS 服務不在範圍內，但官方原文未見此說明，屬未證實。", "why": "美國管晶片、中國開始管模型與權重，AI 正式變成兩邊都列管的戰略物資；之後用中國開放權重模型、或跟兩岸供應鏈合作做 AI 功能，合規條件可能會變。", "source_name": "Geopolitechs", "source_url": "https://www.geopolitechs.org/p/china-imposes-temporary-export-registration"}], "industry": [{"text": "Anthropic 說明獨立版 Claude Design（claude.ai/design）12 月 14 日關閉、之後導向 Claude：設計系統現在就能從 Artifacts 頁面一鍵遷移，專案的遷移方式還沒公布；在獨立版裡的對話與留言不會搬過來，關閉後依保留政策刪除，公開分享連結也會失效。", "source_name": "Claude 說明中心", "source_url": "https://support.claude.com/en/articles/17440474-migrate-from-standalone-claude-design-to-claude"}, {"text": "Meta 10/30 生效的新商業條款寫明：商家帳號繼續使用 Facebook、Instagram、WhatsApp，就等於同意 Meta 爬取跟該帳號相關的網站，並可用來訓練 Meta 的產品；三位法律專家向 Nieman Lab 表示條款裡沒有退出選項，新聞網站首當其衝。", "source_name": "Nieman Lab", "source_url": "https://www.niemanlab.org/?p=254251"}], "term": {"zh": "長時程任務", "en": "Long-horizon Task", "explain": "需要 agent 連續做很多步、跑很久（幾小時到幾天）才完成的任務，例如今天新聞裡打通 Minecraft。難處不在單一步驟，而在「步驟一多，小錯會累積」：就算每一步有 99% 成功，連做 100 步全對的機率只剩約 37%。所以長時程任務的關鍵能力是「出錯後察覺並修回來」——寫程式失敗就讀錯誤訊息重寫、死了就重新規劃——而不是每步都不出錯。評測時也要注意：成功一次不等於穩定成功，要看重跑多次的成功率。", "analogy": "就是產線的累積良率（Rolled Throughput Yield）：每站良率 99% 看起來很好，串 100 站下來直通率只剩三成多；所以真正撐住產量的是每站後面的檢測與重工站，而不是要求每站完美。", "why": "你派給 Claude 的排程（例如這份每日網頁要搜尋、寫稿、建置、發布、驗證）本身就是長時程任務；流程裡每一步都設「做完要驗證、失敗要報錯」，就是在補累積良率。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  document.title = "每日 AI 情報 #" + (D.day||"") + " · " + (D.date||"");
  document.getElementById("term-file").textContent = "ai-daily.log — day " + (D.day||"") + " (" + (D.date||"") + ")";
  document.getElementById("h-title").textContent = "AI 每日速報 #" + (D.day||"");
  document.getElementById("h-date").textContent = (D.date||"") + (D.weekday?("（"+D.weekday+"）"):"");
  document.getElementById("headline").textContent = D.headline||"";

  document.getElementById("top").innerHTML = (D.top||[]).map(t=>`
    <div class="card">
      ${t.tag?`<span class="chip">${esc(t.tag)}</span>`:""}
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.body)}</p>
      ${t.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(t.analogy)}</div>`:""}
      ${t.why?`<div class="why"><b>為什麼你該知道：</b>${esc(t.why)}</div>`:""}
      ${t.source_url?`<div class="src">來源：<a href="${esc(t.source_url)}" target="_blank" rel="noopener">${esc(t.source_name||t.source_url)}</a></div>`:""}
    </div>`).join("");

  document.getElementById("industry").innerHTML = (D.industry||[]).map(i=>`
    <li>${esc(i.text)} ${i.source_url?`· <a href="${esc(i.source_url)}" target="_blank" rel="noopener">${esc(i.source_name||"來源")}</a>`:""}</li>`).join("");

  const tm = D.term||{};
  document.getElementById("term").innerHTML = `
    <div class="term">
      <div class="name">${esc(tm.zh||"")}<span class="en">${esc(tm.en||"")}</span></div>
      <p>${esc(tm.explain||"")}</p>
      ${tm.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(tm.analogy)}</div>`:""}
      ${tm.why?`<p class="why"><b>為什麼重要：</b>${esc(tm.why)}</p>`:""}
    </div>`;

  document.getElementById("footer").innerHTML =
    "每天自動更新 · 由 Claude 依當日公開新聞整理，僅供快速掌握趨勢，重要決策請點來源查證<br>#" +
    (D.day||"") + " · " + (D.date||"");
</script>
