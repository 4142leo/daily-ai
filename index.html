<!--

  build_ai_page.py 會把 content.json 的內容以 JSON 塞進 {"day": 50, "date": "2026-11-27", "weekday": "週五", "headline": "微軟公開 AI 攻擊框架 ARTEX 的拆解報告：中國與北韓國家級駭客已拿它「多 agent 分工」自動入侵，最快五分鐘從 GitHub 外洩金鑰走到偷出雲端資料；同時記憶體缺貨燒到中小電子廠，有些料一年漲十倍，Nvidia 也暫停把伺服器出到東南亞四國。", "top": [{"tag": "研究", "title": "微軟拆解 AI 攻擊框架 ARTEX：一個 agent 拆目標、一個排工作、一群去執行，中國與北韓國家級駭客都在用", "body": "微軟威脅情報團隊 11/25 發布報告：ARTEX 是今年 7 月有人在 GitHub 以開源方式放出的 AI 滲透測試框架，10 月原作者下架，但複本仍在流傳，中國資安公司微步在線（ThreatBook）還開始賣 Pro 版。微軟點名中國的 Salt Typhoon、Crystal Typhoon 與北韓的 Onyx Sleet、Pearl Sleet 等團體都已納入工具箱。它沒有發明新攻擊手法，而是讓 agent 自己操作 Nmap、Metasploit 這類現成工具：目標模型把指令拆成可驗證的子目標，規劃 agent 看著一張「已發現系統與漏洞」的知識圖譜派短任務，工作 agent 實際下指令，報告 agent 記錄成果；還能在出錯或撞額度時自動換模型、換 API 金鑰。微軟記錄到一個 agent 五分鐘內從 GitHub 搜到外洩的密鑰、一路拿走 Azure Key Vault 裡的資料；另一波密碼猜測超過 15.1 萬次失敗登入、尖峰每分鐘 2,900 次。", "analogy": "像一條自動化產線被拿去做壞事：工序都是既有的標準工序（現成駭客工具），新的是有一套 MES 系統在排程、派工、回報，而且一台機台掛了會自動換備用機，所以速度從「人工一天」壓到「機器幾分鐘」。", "why": "兩個直接相關的教訓：第一，金鑰一旦進了程式碼或 repo，被 agent 撿走只要幾分鐘，外洩就該立刻換掉（這也是你備份腳本掃憑證的理由）；第二，它的架構跟你開會用的「拆目標→派工→回報」幾乎一樣——同一套 agent 模式，換個目標就是攻擊工具。微軟建議的防法包括蜜罐、拖延回應的焦油坑（tarpit），以及讓 agent 以為已經得手而自己收工的「假勝利」；微軟自己也說，攻擊者一旦放慢速度、或模型學會識破測試環境，這些招數可能就不靈了。", "source_name": "The Decoder（整理微軟威脅情報報告）", "source_url": "https://the-decoder.com/microsoft-details-how-state-backed-hackers-use-the-artex-ai-framework-to-automate-cyberattacks/"}, {"tag": "基礎設施", "title": "記憶體缺貨燒到中小電子廠：有些料一年漲十倍，採購開「戰情室」上 eBay 一次買 5 到 12 顆", "body": "《華爾街日報》報導（TNW 轉述）：電子廠紛紛成立採購戰情室找記憶體，部分晶片價格一年內漲了十倍。採購人員上 eBay、一次打給上百家貿易商，連 5 到 12 顆的小批都收。大廠能跟原廠簽長約鎖貨，小公司只能靠貿易商與灰色市場，而灰市有人把舊料混進新料出貨。台灣記憶體模組廠宇瞻（Apacer）甚至先借錢備好現金，貨一出現就收；印尼還有公司倉庫被偷走約 10 萬美元的快閃記憶體。原因是三星、SK 海力士、美光把產能轉去做 AI 晶片用的高頻寬記憶體（HBM），SK 海力士說吃緊可能持續到 2030 年。", "analogy": "AI 晶片就是那個一次包下整條產線的超級大客戶：原廠把機台都排給利潤最高的 HBM，一般 DRAM／Flash 的排程自然被擠掉，剩下的現貨只能在通路上搶。", "why": "這是你本業會直接碰到的事：NFC 電子紙產品的 MCU 外掛 Flash 或 RAM，報價和交期都可能被 AI 需求牽動。BOM 有記憶體的料，值得早點確認替代料與庫存，向貿易商補料時也要留意混入舊品的風險。", "source_name": "TNW（轉述《華爾街日報》）", "source_url": "https://thenextweb.com/news/memory-shortage-war-rooms-musk-samsung-wsj"}, {"tag": "政策", "title": "美國新出口規定見效：Nvidia 傳要 Dell、Supermicro 暫停把伺服器出到馬來西亞、新加坡、泰國、印尼", "body": "《金融時報》引述三位知情人士，Nvidia 已要求 Dell、Supermicro 等組裝夥伴停止出貨伺服器到這四國，尚不清楚是不是暫時性的。背景是美國商務部 11 月中的新規定，目標是擋住中國公司透過第三國雲端業者「租用」AI 算力；當地雲端業者有 90 天申請許可，並要證明客戶中沒有受限企業，一位業者形容現況「一片混亂、沒有申請指引」。連鎖效應已出現：銀行暫停約 5 億美元、要借給新加坡雲端業者 Aolani 的貸款（該案原本要把算力租給字節跳動）；CNBC 也報導二手市場突然冒出大量 Nvidia GPU 待售，包括數千顆原本要給中國租用客戶的 B300。", "analogy": "像海關突然要求轉運倉逐筆申報最終買主：貨本身沒變，但只要說不清楚最後用在誰手上，整條轉口路線就先停擺，原本壓在倉裡的貨只好轉賣。", "why": "東南亞是台灣伺服器供應鏈的重要出口市場，這條規定的影響會一路回到組裝與零組件訂單（這部分是推論，目前報導只寫到 Nvidia 與組裝夥伴這一層）。", "source_name": "The Decoder（整理《金融時報》與 CNBC）", "source_url": "https://the-decoder.com/nvidia-halts-server-shipments-to-malaysia-singapore-thailand-and-indonesia-after-tighter-us-export-controls/"}, {"tag": "工具", "title": "OpenAI 承認 GPT-6.2 計費算錯：修正後 Astra 的額度用完速度比上週快 40%、Sol 快 25%", "body": "OpenAI Codex 工程師 Thibault Sottiaux 在 X 上說明：GPT-6.2 上線時有個計費錯誤，讓多數使用者在 Astra 與 Sol 兩個模型上拿到錯的折扣。修正後，同樣用量撞到上限的速度 Astra 比上週快 40%、Sol 快 25%，但仍比舊版 GPT-6 Astra、GPT-6.1 Sol 耐用；其他模型不受影響，差額也不會回溯收費。補償方式是 Go、Plus、Pro、Business 訂閱者多一次可保留的額度重設，Business 方案到年底免費用 Fast Mode。", "analogy": "像供應商發現報價單的折扣算錯，下個月起恢復原價：不追討已出貨的差額，另外送一批補償品，但你的單位成本從此就是比上週高。", "why": "訂閱方案的「額度」是廠商隨時可以重算的規格，不是寫死的合約數字——Claude 也一樣。如果你的排程或 agent 流程是照「上週大概夠用」在估，換模型或廠商一調整就可能半路撞上限。", "source_name": "The Decoder", "source_url": "https://the-decoder.com/gpt-6-2-astra-users-now-hit-limits-40-faster-after-openai-patched-a-pricing-error/"}], "industry": [{"text": "Nvidia 信用評等出現壓力：Moody's 把展望從「正向」調回「穩定」，S&P Global 也點出執行長黃仁勳辭職又回任的疑慮。Semafor 指出 Nvidia 常用自己的 AA 評等替客戶的債務、租約與硬體採購做擔保，一旦降評會連帶影響整個 AI 生態的融資。", "source_name": "Semafor", "source_url": "https://www.semafor.com/article/11/26/2026/nvidias-credit-rating-the-ai-trades-collateral-is-at-risk"}, {"text": "加拿大追加 7 億加幣到「AI 算力補助基金」，總額達 10 億加幣；新一期補助對使用加拿大本地營運算力的公司給得更多，第一輪開放健康與生命科學專案，另有 45 家公司從第一期拿到 5,200 多萬加幣。", "source_name": "TNW", "source_url": "https://thenextweb.com/news/canada-ai-compute-access-fund-700m-expansion"}], "term": {"zh": "知識圖譜", "en": "Knowledge Graph", "explain": "把資訊存成「節點＋關係」的網狀結構：節點是東西（一台主機、一個帳號、一個漏洞），連線是它們之間的關係（「主機 A 上有帳號 B」「帳號 B 可登入資料庫 C」）。好處是可以沿著關係一步一步走，回答「從這裡能走到哪裡」這類多步問題。今天 ARTEX 的規劃 agent 就是盯著一張不斷長大的知識圖譜在派工：每發現一台主機或一個漏洞就加一個節點，再從圖上挑下一步。跟你在用的 RAG 不同——RAG 是「找跟問題最像的段落」，知識圖譜是「沿著連線推下去」，兩者也常合用（GraphRAG）。", "analogy": "就是電路的網表（netlist）：BOM 只告訴你有哪些零件（像 RAG 找到相關段落），網表才告訴你哪支腳接到哪條網路、訊號能一路傳到哪裡。要追「這個 GPIO 最後驅動了什麼」，你看的是網表，不是 BOM。", "why": "多 agent 系統需要一份大家共用、會隨工作更新的「現況地圖」，知識圖譜是常見做法。你的 Obsidian vault 用 [[雙向連結]] 串起筆記，其實就是一張手工知識圖譜——Obsidian 的關係圖（Graph view）畫的正是它。"}} 佔位符。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>

<script>
  const D = {"day": 50, "date": "2026-11-27", "weekday": "週五", "headline": "微軟公開 AI 攻擊框架 ARTEX 的拆解報告：中國與北韓國家級駭客已拿它「多 agent 分工」自動入侵，最快五分鐘從 GitHub 外洩金鑰走到偷出雲端資料；同時記憶體缺貨燒到中小電子廠，有些料一年漲十倍，Nvidia 也暫停把伺服器出到東南亞四國。", "top": [{"tag": "研究", "title": "微軟拆解 AI 攻擊框架 ARTEX：一個 agent 拆目標、一個排工作、一群去執行，中國與北韓國家級駭客都在用", "body": "微軟威脅情報團隊 11/25 發布報告：ARTEX 是今年 7 月有人在 GitHub 以開源方式放出的 AI 滲透測試框架，10 月原作者下架，但複本仍在流傳，中國資安公司微步在線（ThreatBook）還開始賣 Pro 版。微軟點名中國的 Salt Typhoon、Crystal Typhoon 與北韓的 Onyx Sleet、Pearl Sleet 等團體都已納入工具箱。它沒有發明新攻擊手法，而是讓 agent 自己操作 Nmap、Metasploit 這類現成工具：目標模型把指令拆成可驗證的子目標，規劃 agent 看著一張「已發現系統與漏洞」的知識圖譜派短任務，工作 agent 實際下指令，報告 agent 記錄成果；還能在出錯或撞額度時自動換模型、換 API 金鑰。微軟記錄到一個 agent 五分鐘內從 GitHub 搜到外洩的密鑰、一路拿走 Azure Key Vault 裡的資料；另一波密碼猜測超過 15.1 萬次失敗登入、尖峰每分鐘 2,900 次。", "analogy": "像一條自動化產線被拿去做壞事：工序都是既有的標準工序（現成駭客工具），新的是有一套 MES 系統在排程、派工、回報，而且一台機台掛了會自動換備用機，所以速度從「人工一天」壓到「機器幾分鐘」。", "why": "兩個直接相關的教訓：第一，金鑰一旦進了程式碼或 repo，被 agent 撿走只要幾分鐘，外洩就該立刻換掉（這也是你備份腳本掃憑證的理由）；第二，它的架構跟你開會用的「拆目標→派工→回報」幾乎一樣——同一套 agent 模式，換個目標就是攻擊工具。微軟建議的防法包括蜜罐、拖延回應的焦油坑（tarpit），以及讓 agent 以為已經得手而自己收工的「假勝利」；微軟自己也說，攻擊者一旦放慢速度、或模型學會識破測試環境，這些招數可能就不靈了。", "source_name": "The Decoder（整理微軟威脅情報報告）", "source_url": "https://the-decoder.com/microsoft-details-how-state-backed-hackers-use-the-artex-ai-framework-to-automate-cyberattacks/"}, {"tag": "基礎設施", "title": "記憶體缺貨燒到中小電子廠：有些料一年漲十倍，採購開「戰情室」上 eBay 一次買 5 到 12 顆", "body": "《華爾街日報》報導（TNW 轉述）：電子廠紛紛成立採購戰情室找記憶體，部分晶片價格一年內漲了十倍。採購人員上 eBay、一次打給上百家貿易商，連 5 到 12 顆的小批都收。大廠能跟原廠簽長約鎖貨，小公司只能靠貿易商與灰色市場，而灰市有人把舊料混進新料出貨。台灣記憶體模組廠宇瞻（Apacer）甚至先借錢備好現金，貨一出現就收；印尼還有公司倉庫被偷走約 10 萬美元的快閃記憶體。原因是三星、SK 海力士、美光把產能轉去做 AI 晶片用的高頻寬記憶體（HBM），SK 海力士說吃緊可能持續到 2030 年。", "analogy": "AI 晶片就是那個一次包下整條產線的超級大客戶：原廠把機台都排給利潤最高的 HBM，一般 DRAM／Flash 的排程自然被擠掉，剩下的現貨只能在通路上搶。", "why": "這是你本業會直接碰到的事：NFC 電子紙產品的 MCU 外掛 Flash 或 RAM，報價和交期都可能被 AI 需求牽動。BOM 有記憶體的料，值得早點確認替代料與庫存，向貿易商補料時也要留意混入舊品的風險。", "source_name": "TNW（轉述《華爾街日報》）", "source_url": "https://thenextweb.com/news/memory-shortage-war-rooms-musk-samsung-wsj"}, {"tag": "政策", "title": "美國新出口規定見效：Nvidia 傳要 Dell、Supermicro 暫停把伺服器出到馬來西亞、新加坡、泰國、印尼", "body": "《金融時報》引述三位知情人士，Nvidia 已要求 Dell、Supermicro 等組裝夥伴停止出貨伺服器到這四國，尚不清楚是不是暫時性的。背景是美國商務部 11 月中的新規定，目標是擋住中國公司透過第三國雲端業者「租用」AI 算力；當地雲端業者有 90 天申請許可，並要證明客戶中沒有受限企業，一位業者形容現況「一片混亂、沒有申請指引」。連鎖效應已出現：銀行暫停約 5 億美元、要借給新加坡雲端業者 Aolani 的貸款（該案原本要把算力租給字節跳動）；CNBC 也報導二手市場突然冒出大量 Nvidia GPU 待售，包括數千顆原本要給中國租用客戶的 B300。", "analogy": "像海關突然要求轉運倉逐筆申報最終買主：貨本身沒變，但只要說不清楚最後用在誰手上，整條轉口路線就先停擺，原本壓在倉裡的貨只好轉賣。", "why": "東南亞是台灣伺服器供應鏈的重要出口市場，這條規定的影響會一路回到組裝與零組件訂單（這部分是推論，目前報導只寫到 Nvidia 與組裝夥伴這一層）。", "source_name": "The Decoder（整理《金融時報》與 CNBC）", "source_url": "https://the-decoder.com/nvidia-halts-server-shipments-to-malaysia-singapore-thailand-and-indonesia-after-tighter-us-export-controls/"}, {"tag": "工具", "title": "OpenAI 承認 GPT-6.2 計費算錯：修正後 Astra 的額度用完速度比上週快 40%、Sol 快 25%", "body": "OpenAI Codex 工程師 Thibault Sottiaux 在 X 上說明：GPT-6.2 上線時有個計費錯誤，讓多數使用者在 Astra 與 Sol 兩個模型上拿到錯的折扣。修正後，同樣用量撞到上限的速度 Astra 比上週快 40%、Sol 快 25%，但仍比舊版 GPT-6 Astra、GPT-6.1 Sol 耐用；其他模型不受影響，差額也不會回溯收費。補償方式是 Go、Plus、Pro、Business 訂閱者多一次可保留的額度重設，Business 方案到年底免費用 Fast Mode。", "analogy": "像供應商發現報價單的折扣算錯，下個月起恢復原價：不追討已出貨的差額，另外送一批補償品，但你的單位成本從此就是比上週高。", "why": "訂閱方案的「額度」是廠商隨時可以重算的規格，不是寫死的合約數字——Claude 也一樣。如果你的排程或 agent 流程是照「上週大概夠用」在估，換模型或廠商一調整就可能半路撞上限。", "source_name": "The Decoder", "source_url": "https://the-decoder.com/gpt-6-2-astra-users-now-hit-limits-40-faster-after-openai-patched-a-pricing-error/"}], "industry": [{"text": "Nvidia 信用評等出現壓力：Moody's 把展望從「正向」調回「穩定」，S&P Global 也點出執行長黃仁勳辭職又回任的疑慮。Semafor 指出 Nvidia 常用自己的 AA 評等替客戶的債務、租約與硬體採購做擔保，一旦降評會連帶影響整個 AI 生態的融資。", "source_name": "Semafor", "source_url": "https://www.semafor.com/article/11/26/2026/nvidias-credit-rating-the-ai-trades-collateral-is-at-risk"}, {"text": "加拿大追加 7 億加幣到「AI 算力補助基金」，總額達 10 億加幣；新一期補助對使用加拿大本地營運算力的公司給得更多，第一輪開放健康與生命科學專案，另有 45 家公司從第一期拿到 5,200 多萬加幣。", "source_name": "TNW", "source_url": "https://thenextweb.com/news/canada-ai-compute-access-fund-700m-expansion"}], "term": {"zh": "知識圖譜", "en": "Knowledge Graph", "explain": "把資訊存成「節點＋關係」的網狀結構：節點是東西（一台主機、一個帳號、一個漏洞），連線是它們之間的關係（「主機 A 上有帳號 B」「帳號 B 可登入資料庫 C」）。好處是可以沿著關係一步一步走，回答「從這裡能走到哪裡」這類多步問題。今天 ARTEX 的規劃 agent 就是盯著一張不斷長大的知識圖譜在派工：每發現一台主機或一個漏洞就加一個節點，再從圖上挑下一步。跟你在用的 RAG 不同——RAG 是「找跟問題最像的段落」，知識圖譜是「沿著連線推下去」，兩者也常合用（GraphRAG）。", "analogy": "就是電路的網表（netlist）：BOM 只告訴你有哪些零件（像 RAG 找到相關段落），網表才告訴你哪支腳接到哪條網路、訊號能一路傳到哪裡。要追「這個 GPIO 最後驅動了什麼」，你看的是網表，不是 BOM。", "why": "多 agent 系統需要一份大家共用、會隨工作更新的「現況地圖」，知識圖譜是常見做法。你的 Obsidian vault 用 [[雙向連結]] 串起筆記，其實就是一張手工知識圖譜——Obsidian 的關係圖（Graph view）畫的正是它。"}};
