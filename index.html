<!doctype html>
<!--
  每日 AI 情報 網頁範本（終端機／hacker 風，強制深色）
  build_ai_page.py 會把 content.json 的內容以 JSON 塞進 {"day": 48, "date": "2026-11-25", "weekday": "週三", "headline": "Anthropic 一口氣推出 Claude Ship（AI 審 PR、修 PR、照團隊規則決定能不能合併）和「Artifact 安裝成桌面 app」；Claude Code 2.1.332 讓 MCP 伺服器也能帶 skill 進來；另一份研究測了 8 家搜尋 API，每一家都曾把已知惡意內容餵給寫程式的 agent。", "top": [{"tag": "工具", "title": "Claude Code 2.1.331／2.1.332：MCP 伺服器可以帶 skill 進來、新 hook 能擋 skill 夾帶的指令、壓縮失敗與 hook 洗版卡死修正", "body": "兩版分別在 11/23、11/24（UTC）上 npm。2.1.332 最大的新功能是 MCP 伺服器也能提供 skill（beta），在 / 選單裡顯示成「伺服器名:skill 名」；同時新增 PreSkillShellCommand 這個 hook 時機點，可以在 skill 或指令載入時，拒絕它裡面夾帶的 shell 指令。修正方面：讀到沒人寫入的具名管道（例如被密碼管理器鎖住的 .env）會卡死，現在 20 秒後放棄；連續自動壓縮失敗導致「Prompt is too long」結束、摘要一直寫超過上限而壓縮失敗，都有補救；hook 狂印輸出或印出超大紀錄造成的卡死與脈絡爆掉也修了。2.1.331 則新增 CLAUDE_CODE_DISABLE_RESPONSE_COMPRESSION，給「會把壓縮過的回應截斷」的代理伺服器環境用；claude doctor 多了 API 連線檢查；並修正 Claude Desktop 裡 Stop hook 讀不到最後一則回覆、auto mode 有時拒絕停止 /loop。", "analogy": "MCP 帶 skill 進來，就像外包廠出貨時順便附上自己的作業指導書；PreSkillShellCommand 則是進料檢驗站——指導書裡寫了「請執行這條指令」，你可以在它被照做之前先攔下來看。", "why": "你的 skill、hook、排程、Desktop Code 分頁全都踩在這兩版的修正範圍裡。最值得記的兩件：以後裝別人的 MCP 伺服器，可能連帶多出一批 skill，要像看第三方 skill 一樣先看內容；公司網路有 SSL 攔截代理，如果哪天遇到回應莫名被截斷，可以試 CLAUDE_CODE_DISABLE_RESPONSE_COMPRESSION（官方註明自架 runner 與 Remote Control 暫不建議）。", "source_name": "Claude Code CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "工具", "title": "Anthropic 推出 Claude Ship（beta）：AI 審 PR、自己修到綠燈、再照團隊寫好的規則檔決定能不能合併", "body": "11/23 推出，由三個 agent 組成：已正式上線的 Code Review（多角度審查、對發現的問題做反向驗證再貼到 PR，分 Quick／Standard／Deep 三級）、新的 PR Steward（CI 失敗、合併衝突、審查意見都由它接手修，每次推送都留言說改了什麼、怎麼復原，設計上不會自己核准或合併；留言 @claude stop 就退開），以及新的 Claude Approvals（讀團隊放在 repo 裡的核准規則檔，例行變更可以自己核准，指定情況仍要人簽）。官方建議先開「只觀察」模式，信任了再接上分支保護。個人開發者在 Claude Code 打 /ship 就能用。Anthropic 自報：Claude Code 團隊 6 月到 9 月合併的 PR 增加一倍多、被退回的比例降 40% 以上（Code Review 只是其中一層）。", "analogy": "像產線的三站：檢驗站挑出瑕疵、重工站把瑕疵修掉並在批號卡上寫明改了什麼、放行站照品管手冊決定這批能不能出貨——手冊是你自己寫的，關鍵品項照樣要品保主管簽名。", "why": "你的 session 裡已經看得到 /ship 和 /steward 這兩個指令，背後就是這套。不過你目前多半直接在 main 提交、很少開 PR，所以短期影響不大；值得學的是它的設計：會動手修的 agent 不給核准權、核准規則寫成檔案、先觀察再放權——跟你「改程式前先經同意」的規矩是同一個思路。", "source_name": "Claude 官方文章〈Introducing Claude Ship〉", "source_url": "https://claude.com/resources/articles/introducing-claude-ship"}, {"tag": "工具", "title": "Claude 的 Artifact 可以「安裝成 app」（beta）：Mac／Windows 上有自己的圖示和視窗，權限分三級、每次更新都重新問", "body": "11/24 起在 Mac 與 Windows 版 Claude 陸續開放，所有方案都有。做好的 Artifact 按「Install as app」就變成獨立桌面程式：自己的圖示、自己的視窗，可以發通知、放到系統匣，能用 Claude 和你的連接器，Artifact 改了它會自動更新，不用打包、簽章或 API 金鑰。權限分三級：預設只能做瀏覽器能做的事；「app 權限」可要求置頂視窗、全域快捷鍵、通知；「完整電腦存取」可執行程式、不經詢問讀改刪檔案。授權只對當前版本有效，每次更新（包括你自己改）都會重問；完整存取只能給自己做的、或同組織成員做的 app。官方明講 Anthropic 不會事先審查這些 app，app 呼叫 Claude 也算你方案的用量。需要連網並登入 Claude 才能開。", "analogy": "像把治具從「借用工作站上的軟體」升級成「獨立一台設備」：插電就能用，但要接上產線的電源和氣壓（完整存取）時，每次改機都得重新驗收一次。", "why": "你現在的每日網站（日文、多益、心理學卡片）是給手機開的，走 GitHub Pages 仍然比較合適；但只在電腦上用的小工具（例如工作日誌追蹤、零件清單查詢）可以考慮做成這種 app。要給「完整電腦存取」之前，記得它等於讓一段程式不問就能刪你的檔案。", "source_name": "Claude 官方文章〈Install as app〉", "source_url": "https://claude.com/resources/articles/install-as-app"}, {"tag": "研究", "title": "測了 8 家搜尋 API：每一家都曾把已知惡意內容交給寫程式的 agent，比例約 1%，最常出現在「怎麼安裝」這類搜尋", "body": "AIR Research Lab 的 WebSec Benchmark 從真實的寫程式 agent 任務取出 4,719 個搜尋，送進 Firecrawl、Tavily、Perplexity、Parallel、Exa、Nimble、Brave、You.com 八家搜尋 API，檢查回來的 28 萬多筆結果。八家都至少一次回傳已知惡意內容；在約 37,700 次搜尋裡有 534 次出現已知惡意內容，各家比例 0.8%–2.2%，以安裝、套件類搜尋最高——剛好是 agent 準備執行程式的時候。案例 SolanaCry：一個 286 顆星的 GitHub 專案，README 叫你用一行 PowerShell 安裝，實際裝的是遠端控制木馬 NetSupport Manager。他們歸納六種手法：提示注入、仿冒名稱、幻覺套件名搶註、SEO 操弄、接手過期網域、誘導性內容。注意：這篇刊在 The Hacker News 的專家投稿欄，各家排名是研究方自報，宜保守看。", "analogy": "像叫實習生上網找某顆料的替代品，他直接照搜尋第一名的連結下單、收貨就上線——人會在「這家店怎麼沒聽過」的時候停一下，agent 不會。", "why": "你的 agent 每天都在 WebSearch，也會照網頁指示跑 pip install。實務上：搜尋結果叫你「一行指令安裝」的東西，執行前一定要人看過來源；這也是你制度裡「不從不明來源下載或執行檔案」那條規矩的實際理由。", "source_name": "The Hacker News（專家投稿：AIR Research Lab）", "source_url": "https://thehackernews.com/expert-insights/2026/11/ai-coding-agents-are-getting-malicious.html"}], "industry": [{"text": "Anthropic 在 GitHub 公開一篇由 Claude 撰寫的論文與 Lean 4 形式化證明，宣稱證明 VP ≠ VNP（P vs NP 在「代數電路」世界的對應版本，但不等於解決 P vs NP）。README 自己寫明：論文和證明都是 AI 寫的、還沒有人類數學家檢查過；Lean 能檢查證明，但沒有機器能確認陳述檔說的就是宣稱的內容。", "source_name": "Anthropic formal-math repo（GitHub）", "source_url": "https://github.com/anthropics/formal-math/tree/main/vp-vnp"}, {"text": "Dell 11/24 公布季報：營收 549.4 億美元、年增一倍多（市場預期 493.2 億）；AI 伺服器 220 億、年增 291%，AI 伺服器待交付訂單 1,323 億；基礎設施部門已占營收 85%，個人電腦部門低於預期。", "source_name": "CNBC", "source_url": "https://www.cnbc.com/2026/11/24/dell-earnings-report-q3-2027.html"}, {"text": "Semafor 報導：美國商務部 11/23 把與 Nvidia 黃仁勳事件有關的新加坡公司 Megaspeed 及其在新加坡、馬來西亞、泰國的六家關係企業列入實體清單，沒有許可就不能賣美國晶片給它們（本刊只讀到 AI Weekly 轉述，未讀 Semafor 原文）。", "source_name": "AI Weekly（轉述 Semafor）", "source_url": "https://aiweekly.co/alerts/commerce-set-to-add-nvidia-linked-megaspeed-to-entity-list-monday-blocking-chip"}], "term": {"zh": "幻覺套件搶註", "en": "Slopsquatting", "explain": "AI 寫程式時，有時會編出一個聽起來很合理、其實不存在的套件名稱，而且同一個錯名常會被不同人、不同次重複編出來。攻擊者就先去 PyPI、npm 這類套件庫把這個名字註冊下來，放進惡意程式；下次 agent 又編出同一個名字、照著 pip install，裝到的就是攻擊者的東西。名稱是把 typosquatting（打錯字搶註）裡的 typo 換成 slop（AI 產出的劣質內容）。今天 WebSec Benchmark 的「幻覺攻擊」就是這一類：他們找到一些安裝步驟，指向從沒正式發布過的套件。", "analogy": "像 BOM 上被 AI 寫了一個根本不存在的料號，有心人看準了，搶先用這個料號在通路上架假貨；採購照單下訂，收到的就是仿冒品。", "why": "防法很樸素：agent 建議裝一個你沒聽過的套件時，先查它在套件庫上是否真的存在、上架多久、下載量多少、是不是官方文件提到的那個；專案用鎖定檔（lock file）固定版本，就不會在某次重裝時悄悄換成別的東西。"}} 佔位符。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>

  <div class="term-bar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>

    <div class="sec-title">今日一詞</div>
    <div id="term"></div>

    <footer id="footer"></footer>
  </div>

<script>
  const D = {"day": 48, "date": "2026-11-25", "weekday": "週三", "headline": "Anthropic 一口氣推出 Claude Ship（AI 審 PR、修 PR、照團隊規則決定能不能合併）和「Artifact 安裝成桌面 app」；Claude Code 2.1.332 讓 MCP 伺服器也能帶 skill 進來；另一份研究測了 8 家搜尋 API，每一家都曾把已知惡意內容餵給寫程式的 agent。", "top": [{"tag": "工具", "title": "Claude Code 2.1.331／2.1.332：MCP 伺服器可以帶 skill 進來、新 hook 能擋 skill 夾帶的指令、壓縮失敗與 hook 洗版卡死修正", "body": "兩版分別在 11/23、11/24（UTC）上 npm。2.1.332 最大的新功能是 MCP 伺服器也能提供 skill（beta），在 / 選單裡顯示成「伺服器名:skill 名」；同時新增 PreSkillShellCommand 這個 hook 時機點，可以在 skill 或指令載入時，拒絕它裡面夾帶的 shell 指令。修正方面：讀到沒人寫入的具名管道（例如被密碼管理器鎖住的 .env）會卡死，現在 20 秒後放棄；連續自動壓縮失敗導致「Prompt is too long」結束、摘要一直寫超過上限而壓縮失敗，都有補救；hook 狂印輸出或印出超大紀錄造成的卡死與脈絡爆掉也修了。2.1.331 則新增 CLAUDE_CODE_DISABLE_RESPONSE_COMPRESSION，給「會把壓縮過的回應截斷」的代理伺服器環境用；claude doctor 多了 API 連線檢查；並修正 Claude Desktop 裡 Stop hook 讀不到最後一則回覆、auto mode 有時拒絕停止 /loop。", "analogy": "MCP 帶 skill 進來，就像外包廠出貨時順便附上自己的作業指導書；PreSkillShellCommand 則是進料檢驗站——指導書裡寫了「請執行這條指令」，你可以在它被照做之前先攔下來看。", "why": "你的 skill、hook、排程、Desktop Code 分頁全都踩在這兩版的修正範圍裡。最值得記的兩件：以後裝別人的 MCP 伺服器，可能連帶多出一批 skill，要像看第三方 skill 一樣先看內容；公司網路有 SSL 攔截代理，如果哪天遇到回應莫名被截斷，可以試 CLAUDE_CODE_DISABLE_RESPONSE_COMPRESSION（官方註明自架 runner 與 Remote Control 暫不建議）。", "source_name": "Claude Code CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "工具", "title": "Anthropic 推出 Claude Ship（beta）：AI 審 PR、自己修到綠燈、再照團隊寫好的規則檔決定能不能合併", "body": "11/23 推出，由三個 agent 組成：已正式上線的 Code Review（多角度審查、對發現的問題做反向驗證再貼到 PR，分 Quick／Standard／Deep 三級）、新的 PR Steward（CI 失敗、合併衝突、審查意見都由它接手修，每次推送都留言說改了什麼、怎麼復原，設計上不會自己核准或合併；留言 @claude stop 就退開），以及新的 Claude Approvals（讀團隊放在 repo 裡的核准規則檔，例行變更可以自己核准，指定情況仍要人簽）。官方建議先開「只觀察」模式，信任了再接上分支保護。個人開發者在 Claude Code 打 /ship 就能用。Anthropic 自報：Claude Code 團隊 6 月到 9 月合併的 PR 增加一倍多、被退回的比例降 40% 以上（Code Review 只是其中一層）。", "analogy": "像產線的三站：檢驗站挑出瑕疵、重工站把瑕疵修掉並在批號卡上寫明改了什麼、放行站照品管手冊決定這批能不能出貨——手冊是你自己寫的，關鍵品項照樣要品保主管簽名。", "why": "你的 session 裡已經看得到 /ship 和 /steward 這兩個指令，背後就是這套。不過你目前多半直接在 main 提交、很少開 PR，所以短期影響不大；值得學的是它的設計：會動手修的 agent 不給核准權、核准規則寫成檔案、先觀察再放權——跟你「改程式前先經同意」的規矩是同一個思路。", "source_name": "Claude 官方文章〈Introducing Claude Ship〉", "source_url": "https://claude.com/resources/articles/introducing-claude-ship"}, {"tag": "工具", "title": "Claude 的 Artifact 可以「安裝成 app」（beta）：Mac／Windows 上有自己的圖示和視窗，權限分三級、每次更新都重新問", "body": "11/24 起在 Mac 與 Windows 版 Claude 陸續開放，所有方案都有。做好的 Artifact 按「Install as app」就變成獨立桌面程式：自己的圖示、自己的視窗，可以發通知、放到系統匣，能用 Claude 和你的連接器，Artifact 改了它會自動更新，不用打包、簽章或 API 金鑰。權限分三級：預設只能做瀏覽器能做的事；「app 權限」可要求置頂視窗、全域快捷鍵、通知；「完整電腦存取」可執行程式、不經詢問讀改刪檔案。授權只對當前版本有效，每次更新（包括你自己改）都會重問；完整存取只能給自己做的、或同組織成員做的 app。官方明講 Anthropic 不會事先審查這些 app，app 呼叫 Claude 也算你方案的用量。需要連網並登入 Claude 才能開。", "analogy": "像把治具從「借用工作站上的軟體」升級成「獨立一台設備」：插電就能用，但要接上產線的電源和氣壓（完整存取）時，每次改機都得重新驗收一次。", "why": "你現在的每日網站（日文、多益、心理學卡片）是給手機開的，走 GitHub Pages 仍然比較合適；但只在電腦上用的小工具（例如工作日誌追蹤、零件清單查詢）可以考慮做成這種 app。要給「完整電腦存取」之前，記得它等於讓一段程式不問就能刪你的檔案。", "source_name": "Claude 官方文章〈Install as app〉", "source_url": "https://claude.com/resources/articles/install-as-app"}, {"tag": "研究", "title": "測了 8 家搜尋 API：每一家都曾把已知惡意內容交給寫程式的 agent，比例約 1%，最常出現在「怎麼安裝」這類搜尋", "body": "AIR Research Lab 的 WebSec Benchmark 從真實的寫程式 agent 任務取出 4,719 個搜尋，送進 Firecrawl、Tavily、Perplexity、Parallel、Exa、Nimble、Brave、You.com 八家搜尋 API，檢查回來的 28 萬多筆結果。八家都至少一次回傳已知惡意內容；在約 37,700 次搜尋裡有 534 次出現已知惡意內容，各家比例 0.8%–2.2%，以安裝、套件類搜尋最高——剛好是 agent 準備執行程式的時候。案例 SolanaCry：一個 286 顆星的 GitHub 專案，README 叫你用一行 PowerShell 安裝，實際裝的是遠端控制木馬 NetSupport Manager。他們歸納六種手法：提示注入、仿冒名稱、幻覺套件名搶註、SEO 操弄、接手過期網域、誘導性內容。注意：這篇刊在 The Hacker News 的專家投稿欄，各家排名是研究方自報，宜保守看。", "analogy": "像叫實習生上網找某顆料的替代品，他直接照搜尋第一名的連結下單、收貨就上線——人會在「這家店怎麼沒聽過」的時候停一下，agent 不會。", "why": "你的 agent 每天都在 WebSearch，也會照網頁指示跑 pip install。實務上：搜尋結果叫你「一行指令安裝」的東西，執行前一定要人看過來源；這也是你制度裡「不從不明來源下載或執行檔案」那條規矩的實際理由。", "source_name": "The Hacker News（專家投稿：AIR Research Lab）", "source_url": "https://thehackernews.com/expert-insights/2026/11/ai-coding-agents-are-getting-malicious.html"}], "industry": [{"text": "Anthropic 在 GitHub 公開一篇由 Claude 撰寫的論文與 Lean 4 形式化證明，宣稱證明 VP ≠ VNP（P vs NP 在「代數電路」世界的對應版本，但不等於解決 P vs NP）。README 自己寫明：論文和證明都是 AI 寫的、還沒有人類數學家檢查過；Lean 能檢查證明，但沒有機器能確認陳述檔說的就是宣稱的內容。", "source_name": "Anthropic formal-math repo（GitHub）", "source_url": "https://github.com/anthropics/formal-math/tree/main/vp-vnp"}, {"text": "Dell 11/24 公布季報：營收 549.4 億美元、年增一倍多（市場預期 493.2 億）；AI 伺服器 220 億、年增 291%，AI 伺服器待交付訂單 1,323 億；基礎設施部門已占營收 85%，個人電腦部門低於預期。", "source_name": "CNBC", "source_url": "https://www.cnbc.com/2026/11/24/dell-earnings-report-q3-2027.html"}, {"text": "Semafor 報導：美國商務部 11/23 把與 Nvidia 黃仁勳事件有關的新加坡公司 Megaspeed 及其在新加坡、馬來西亞、泰國的六家關係企業列入實體清單，沒有許可就不能賣美國晶片給它們（本刊只讀到 AI Weekly 轉述，未讀 Semafor 原文）。", "source_name": "AI Weekly（轉述 Semafor）", "source_url": "https://aiweekly.co/alerts/commerce-set-to-add-nvidia-linked-megaspeed-to-entity-list-monday-blocking-chip"}], "term": {"zh": "幻覺套件搶註", "en": "Slopsquatting", "explain": "AI 寫程式時，有時會編出一個聽起來很合理、其實不存在的套件名稱，而且同一個錯名常會被不同人、不同次重複編出來。攻擊者就先去 PyPI、npm 這類套件庫把這個名字註冊下來，放進惡意程式；下次 agent 又編出同一個名字、照著 pip install，裝到的就是攻擊者的東西。名稱是把 typosquatting（打錯字搶註）裡的 typo 換成 slop（AI 產出的劣質內容）。今天 WebSec Benchmark 的「幻覺攻擊」就是這一類：他們找到一些安裝步驟，指向從沒正式發布過的套件。", "analogy": "像 BOM 上被 AI 寫了一個根本不存在的料號，有心人看準了，搶先用這個料號在通路上架假貨；採購照單下訂，收到的就是仿冒品。", "why": "防法很樸素：agent 建議裝一個你沒聽過的套件時，先查它在套件庫上是否真的存在、上架多久、下載量多少、是不是官方文件提到的那個；專案用鎖定檔（lock file）固定版本，就不會在某次重裝時悄悄換成別的東西。"}};
