<!doctype html>
<!--
  每日 AI 情報 網頁範本（終端機／hacker 風，強制深色）
  build_ai_page.py 會把 content.json 的內容以 JSON 塞進 {"day": 47, "date": "2026-11-23", "weekday": "週一", "headline": "資安公司 Dragos 用約 200 萬則埋了假金鑰的「誘餌提示詞」，抓到至少三家 AI 推論供應商被入侵、低價轉售商直接讀客戶提示詞；Anthropic 數學家宣稱和 Claude 證明了黎曼猜想，只發 Lean 程式碼、初步獨立檢查過關但仍有爭議；新創稱 AI 從零設計出每瓦效能 4.59 倍的新 CPU，但還只是模擬。", "top": [{"tag": "工具", "title": "Dragos 追蹤 200 萬則誘餌提示詞：至少三家 AI 推論供應商被入侵、自己都不知道；低價轉售商開個紀錄就能讀客戶提示詞", "body": "資安公司 Dragos 從 7 月到 11 月，把約 200 萬則夾帶獨一無二假網址、假 AWS 金鑰的提示詞送進各家 AI 服務，再看這些誘餌之後被誰拿去用。結果：至少三家推論供應商被入侵，直到 Dragos 通知前都不知道；最大一起事件裡約兩百把假金鑰全被偷，有的幾小時內就被拿去試、翻 S3 儲存、想開 Bedrock 和建自己的帳號——連供應商在模型開跑前就擋掉的請求也被偷，代表攻擊者是在「大門口」複製流量。另外，AI 路由市集（router）上以最低價搶單的轉售商，不用任何漏洞，只要打開請求紀錄就讀得到客戶提示詞；「零資料保留（Zero Data Retention, ZDR）」設定也常被無視。The Decoder 報導 OpenRouter 已下架三家供應商、撤銷 125 個端點的 ZDR 資格。", "analogy": "就像在送去代工的圖檔裡偷偷埋一組只有你知道的假料號：哪天這個料號出現在別處，就知道是哪個環節外流。這次還發現圖檔不是直接到工廠，而是經過好幾層中間商，每一層都看得到整份圖。", "why": "「對話裡不要貼金鑰、token」這條習慣再次被證明值得。你現在直接用 Anthropic 官方服務、不經第三方路由，路徑最短；但如果哪天為了便宜改走路由或轉售商，提示詞會多經過好幾手，每一手都看得到。", "source_name": "Dragos 官方部落格（HD Moore）", "source_url": "https://www.dragos.com/blog/ai-supply-chain-security-canary-tokens"}, {"tag": "研究", "title": "Anthropic 數學家宣稱和 Claude 證明黎曼猜想：沒有論文、只有 Lean 程式碼，獨立編譯初步過關，但本人承認還沒完全看懂", "body": "11/20，Anthropic 的數學家 Levent Alpöge 在個人網站發四頁說明，宣稱和 Claude 一起證明了 1859 年提出、懸賞一百萬美元的黎曼猜想（他說也一併證明了更廣的「廣義黎曼猜想」）。證明只以 Lean（會逐步檢查每個邏輯步驟的證明程式）發布，沒有給人讀的論文——他說人讀版草稿已超過 25 萬頁；他也承認自己還沒完全掌握整個論證，最後一段主要是 Claude 推進的。MIT 數學家 Sutherland 當天獨立編譯通過，The Decoder 報導 Lean／Mathlib 社群隨後發聲明表示「完全有信心」證明正確。但 TNW 發稿時還有一項檢查沒跑完：確認程式碼證的確實是黎曼猜想原題、不是一個稍微不同的命題；Stanford 數學家 Conrad 則批評發布自己沒看懂的證明「完全離譜」。", "analogy": "像一顆晶片沒人看得懂完整電路，但通過了形式化等價性檢查（equivalence check）——工具保證網表跟規格一致。最後要問的是：規格本身寫的是不是你真正要的東西？對應這裡那項「命題有沒有寫對」的檢查。", "why": "這是之前教過的形式化驗證最極端的例子：機器能保證每一步都對，但人還沒理解為什麼對。你用 AI 產規格書、寫程式也一樣——自動檢查過關不等於你懂了，關鍵在檢查的標準本身有沒有定對。", "source_name": "The Next Web", "source_url": "https://thenextweb.com/news/anthropic-alpoge-claude-riemann-hypothesis-proof-lean"}, {"tag": "基礎設施", "title": "新創 Architect Labs 稱 AI 從零設計出新 CPU「Frostbite」：每瓦效能 4.59 倍，但是 7nm 模擬、還沒做成晶片", "body": "帕羅奧圖新創 Architect Labs 11/18 宣布，它的 AI 系統從指令集、編譯器到電路一路設計並驗證出 Frostbite CPU。它不走傳統「硬體在執行時才找出哪些指令能平行」的路，而是把程式編譯成交互網（interaction nets，1990 年提出的計算模型）：程式本身就把能平行的工作攤開，每個值只用一次，資料可以留在每個小運算區塊（tile）自己的記憶體，不需要大的共享快取。在 25 個工作負載上，4 個 tile 的叢集每瓦效能是一顆「已量產驗證」的雙發射循序核心的 4.59 倍（幾何平均）、每面積效能 8.77 倍。但這是模擬設計、尚未流片；比較對象因法律理由不能公開；時脈從初步綜合的 800 MHz 掉到最終佈局的 500 MHz。以上都是公司自報。", "analogy": "傳統 CPU 像產線上有個調度員，在現場隨時判斷哪些工單可以並行；Frostbite 是在下工單前就把先後關係排好，產線只管照做——調度員和他那塊共用大白板（快取一致性）都省掉了。", "why": "這是你本行的語言：模擬數字不是實測、比較基準不公開、綜合到佈局時脈縮水——每一項都是讀晶片廠宣稱時該打的問號。另一面是 AI 能碰的設計範圍，已經從軟體延伸到電路了。", "source_name": "Tom's Hardware", "source_url": "https://www.tomshardware.com/tech-industry/semiconductors/ai-agents-design-an-entirely-new-cpu-architecture-from-scratch-startup-claims-frostbite-posts-4-59x-the-performance-per-watt-of-an-in-order-core-in-pre-silicon-tests"}], "industry": [{"text": "Nvidia 風波續延：華爾街日報報導 SEC 已對 Nvidia 展開民事調查，部分在查揭露是否誤導投資人（焦點在亞洲銷售）；財政部長 Bessent 要董事會 10 天內給答案；暫代執行長 Kress 則把下個財年營收成長預估從 70% 上調到約 75%。", "source_name": "InvestmentNews（轉述 WSJ）", "source_url": "https://www.investmentnews.com/equities/embattled-nvidia-faces-sec-probe-as-california-attorney-general-mulls-action/269054"}, {"text": "美國兩黨州長聯名呼籲華府為最強大的 AI 系統訂聯邦規則，同時保留各州保護消費者、勞工與兒童的空間。", "source_name": "Bloomberg（僅讀到摘要）", "source_url": "https://www.bloomberg.com/news/articles/2026-11-22/governors-call-for-federal-ai-rules-without-sidelining-states"}, {"text": "傳聞（未證實）：金融時報引述消息人士，Amazon 接近以 75 億美元收購 AI 新創 Decart，最快下週談定。", "source_name": "RIO Rundown（轉述 FT）", "source_url": "https://riorundown.substack.com/p/ai-news-nov-22-2026-autonomous-systems"}], "term": {"zh": "金絲雀權杖", "en": "Canary Token", "explain": "故意放出去的假資料——假帳密、假網址、假文件——正常流程永遠不會用到它，所以只要有人去用，就會觸發警報，並記下是誰、何時、從哪裡用的。它不會阻止外洩，而是讓外洩「被看見」。Dragos 這次就是把大量獨一無二的 canary 塞進提示詞，才追出哪一手偷看了、偷了多久。實務上可以在雲端帳號、共用資料夾、甚至提示詞範本裡埋一把假金鑰，一收到警報就知道哪條管線漏了。名字來自早年礦工帶金絲雀下礦坑，鳥先出事就代表有毒氣。", "analogy": "出貨時每一批都貼一張編號唯一的追蹤標籤，哪一批出現在水貨市場，馬上知道是哪個經銷商流出去的——跟你 NFC 標籤每顆都有唯一 UID 是同一個道理。", "why": "跟之前教過的最小權限原則、網路出口管控是一組：最小權限負責縮小外洩後的損失，canary 負責發現外洩——一個像防火門，一個像煙霧偵測器，兩個都要有。"}} 佔位符。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>
<div class="term-window">
  <div class="term-bar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="file" id="term-file">ai-daily.log</span>
  </div>
  <div class="wrap">
    <header>
      <div class="kicker">每日 AI 情報</div>
      <h1 id="h-title">AI 每日速報</h1>
      <div class="date" id="h-date"></div>
    </header>
    <div class="headline" id="headline"></div>

    <div class="sec-title">今日重點</div>
    <div id="top"></div>

    <div class="sec-title">產業動態</div>
    <ul class="ind" id="industry"></ul>

    <div class="sec-title">今日一詞</div>
    <div id="term"></div>

    <footer id="footer"></footer>
  </div>
</div>
<script>
  const D = {"day": 47, "date": "2026-11-23", "weekday": "週一", "headline": "資安公司 Dragos 用約 200 萬則埋了假金鑰的「誘餌提示詞」，抓到至少三家 AI 推論供應商被入侵、低價轉售商直接讀客戶提示詞；Anthropic 數學家宣稱和 Claude 證明了黎曼猜想，只發 Lean 程式碼、初步獨立檢查過關但仍有爭議；新創稱 AI 從零設計出每瓦效能 4.59 倍的新 CPU，但還只是模擬。", "top": [{"tag": "工具", "title": "Dragos 追蹤 200 萬則誘餌提示詞：至少三家 AI 推論供應商被入侵、自己都不知道；低價轉售商開個紀錄就能讀客戶提示詞", "body": "資安公司 Dragos 從 7 月到 11 月，把約 200 萬則夾帶獨一無二假網址、假 AWS 金鑰的提示詞送進各家 AI 服務，再看這些誘餌之後被誰拿去用。結果：至少三家推論供應商被入侵，直到 Dragos 通知前都不知道；最大一起事件裡約兩百把假金鑰全被偷，有的幾小時內就被拿去試、翻 S3 儲存、想開 Bedrock 和建自己的帳號——連供應商在模型開跑前就擋掉的請求也被偷，代表攻擊者是在「大門口」複製流量。另外，AI 路由市集（router）上以最低價搶單的轉售商，不用任何漏洞，只要打開請求紀錄就讀得到客戶提示詞；「零資料保留（Zero Data Retention, ZDR）」設定也常被無視。The Decoder 報導 OpenRouter 已下架三家供應商、撤銷 125 個端點的 ZDR 資格。", "analogy": "就像在送去代工的圖檔裡偷偷埋一組只有你知道的假料號：哪天這個料號出現在別處，就知道是哪個環節外流。這次還發現圖檔不是直接到工廠，而是經過好幾層中間商，每一層都看得到整份圖。", "why": "「對話裡不要貼金鑰、token」這條習慣再次被證明值得。你現在直接用 Anthropic 官方服務、不經第三方路由，路徑最短；但如果哪天為了便宜改走路由或轉售商，提示詞會多經過好幾手，每一手都看得到。", "source_name": "Dragos 官方部落格（HD Moore）", "source_url": "https://www.dragos.com/blog/ai-supply-chain-security-canary-tokens"}, {"tag": "研究", "title": "Anthropic 數學家宣稱和 Claude 證明黎曼猜想：沒有論文、只有 Lean 程式碼，獨立編譯初步過關，但本人承認還沒完全看懂", "body": "11/20，Anthropic 的數學家 Levent Alpöge 在個人網站發四頁說明，宣稱和 Claude 一起證明了 1859 年提出、懸賞一百萬美元的黎曼猜想（他說也一併證明了更廣的「廣義黎曼猜想」）。證明只以 Lean（會逐步檢查每個邏輯步驟的證明程式）發布，沒有給人讀的論文——他說人讀版草稿已超過 25 萬頁；他也承認自己還沒完全掌握整個論證，最後一段主要是 Claude 推進的。MIT 數學家 Sutherland 當天獨立編譯通過，The Decoder 報導 Lean／Mathlib 社群隨後發聲明表示「完全有信心」證明正確。但 TNW 發稿時還有一項檢查沒跑完：確認程式碼證的確實是黎曼猜想原題、不是一個稍微不同的命題；Stanford 數學家 Conrad 則批評發布自己沒看懂的證明「完全離譜」。", "analogy": "像一顆晶片沒人看得懂完整電路，但通過了形式化等價性檢查（equivalence check）——工具保證網表跟規格一致。最後要問的是：規格本身寫的是不是你真正要的東西？對應這裡那項「命題有沒有寫對」的檢查。", "why": "這是之前教過的形式化驗證最極端的例子：機器能保證每一步都對，但人還沒理解為什麼對。你用 AI 產規格書、寫程式也一樣——自動檢查過關不等於你懂了，關鍵在檢查的標準本身有沒有定對。", "source_name": "The Next Web", "source_url": "https://thenextweb.com/news/anthropic-alpoge-claude-riemann-hypothesis-proof-lean"}, {"tag": "基礎設施", "title": "新創 Architect Labs 稱 AI 從零設計出新 CPU「Frostbite」：每瓦效能 4.59 倍，但是 7nm 模擬、還沒做成晶片", "body": "帕羅奧圖新創 Architect Labs 11/18 宣布，它的 AI 系統從指令集、編譯器到電路一路設計並驗證出 Frostbite CPU。它不走傳統「硬體在執行時才找出哪些指令能平行」的路，而是把程式編譯成交互網（interaction nets，1990 年提出的計算模型）：程式本身就把能平行的工作攤開，每個值只用一次，資料可以留在每個小運算區塊（tile）自己的記憶體，不需要大的共享快取。在 25 個工作負載上，4 個 tile 的叢集每瓦效能是一顆「已量產驗證」的雙發射循序核心的 4.59 倍（幾何平均）、每面積效能 8.77 倍。但這是模擬設計、尚未流片；比較對象因法律理由不能公開；時脈從初步綜合的 800 MHz 掉到最終佈局的 500 MHz。以上都是公司自報。", "analogy": "傳統 CPU 像產線上有個調度員，在現場隨時判斷哪些工單可以並行；Frostbite 是在下工單前就把先後關係排好，產線只管照做——調度員和他那塊共用大白板（快取一致性）都省掉了。", "why": "這是你本行的語言：模擬數字不是實測、比較基準不公開、綜合到佈局時脈縮水——每一項都是讀晶片廠宣稱時該打的問號。另一面是 AI 能碰的設計範圍，已經從軟體延伸到電路了。", "source_name": "Tom's Hardware", "source_url": "https://www.tomshardware.com/tech-industry/semiconductors/ai-agents-design-an-entirely-new-cpu-architecture-from-scratch-startup-claims-frostbite-posts-4-59x-the-performance-per-watt-of-an-in-order-core-in-pre-silicon-tests"}], "industry": [{"text": "Nvidia 風波續延：華爾街日報報導 SEC 已對 Nvidia 展開民事調查，部分在查揭露是否誤導投資人（焦點在亞洲銷售）；財政部長 Bessent 要董事會 10 天內給答案；暫代執行長 Kress 則把下個財年營收成長預估從 70% 上調到約 75%。", "source_name": "InvestmentNews（轉述 WSJ）", "source_url": "https://www.investmentnews.com/equities/embattled-nvidia-faces-sec-probe-as-california-attorney-general-mulls-action/269054"}, {"text": "美國兩黨州長聯名呼籲華府為最強大的 AI 系統訂聯邦規則，同時保留各州保護消費者、勞工與兒童的空間。", "source_name": "Bloomberg（僅讀到摘要）", "source_url": "https://www.bloomberg.com/news/articles/2026-11-22/governors-call-for-federal-ai-rules-without-sidelining-states"}, {"text": "傳聞（未證實）：金融時報引述消息人士，Amazon 接近以 75 億美元收購 AI 新創 Decart，最快下週談定。", "source_name": "RIO Rundown（轉述 FT）", "source_url": "https://riorundown.substack.com/p/ai-news-nov-22-2026-autonomous-systems"}], "term": {"zh": "金絲雀權杖", "en": "Canary Token", "explain": "故意放出去的假資料——假帳密、假網址、假文件——正常流程永遠不會用到它，所以只要有人去用，就會觸發警報，並記下是誰、何時、從哪裡用的。它不會阻止外洩，而是讓外洩「被看見」。Dragos 這次就是把大量獨一無二的 canary 塞進提示詞，才追出哪一手偷看了、偷了多久。實務上可以在雲端帳號、共用資料夾、甚至提示詞範本裡埋一把假金鑰，一收到警報就知道哪條管線漏了。名字來自早年礦工帶金絲雀下礦坑，鳥先出事就代表有毒氣。", "analogy": "出貨時每一批都貼一張編號唯一的追蹤標籤，哪一批出現在水貨市場，馬上知道是哪個經銷商流出去的——跟你 NFC 標籤每顆都有唯一 UID 是同一個道理。", "why": "跟之前教過的最小權限原則、網路出口管控是一組：最小權限負責縮小外洩後的損失，canary 負責發現外洩——一個像防火門，一個像煙霧偵測器，兩個都要有。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

    (D.day||"") + " · " + (D.date||"");
