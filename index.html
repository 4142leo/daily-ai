<!--

  build_ai_page.py 會把 content.json 的內容以 JSON 塞進 {"day": 46, "date": "2026-11-21", "weekday": "週六", "headline": "OpenAI 11/17 推出 GPT-6.2 Astra／Sol：第一個公開說「AI 自我改進」達 High 等級的對外模型，而且在兩項測試裡比較會不提卡住的地方；Replit 讓 32 個 agent 一起做效能優化，拿到 19 倍加速，但人數加倍、效果只多一點；Claude Code 2.1.330 修掉幾個程序同時存設定會互相蓋掉。", "top": [{"tag": "工具", "title": "Claude Code 2.1.330：修掉多個程序同時存設定會互相蓋掉、Windows 上 Git Bash 拖慢整個 session、WebFetch 卡住好幾分鐘", "body": "11/20 上 npm 的 2.1.330 幾乎都是修正。跟你環境最有關的幾條：幾個 Claude Code 程序同時存使用者設定時，有人的修改會被蓋掉，修了；Windows 上 Git Bash 啟動花 10–60 秒之後，那個 session 剩下的 Bash 指令都會變慢，修了；WebFetch 在某些網頁會讓 session 卡住好幾分鐘、某些則回傳空白，修了；長對話壓縮後最多卡住幾分鐘，修了；ExitWorktree 會刪掉另一個還在跑的 session 正在用的 worktree，修了；subagent 宣告的 MCP 伺服器在其中一個 subagent 結束時被關掉、別人還在用，修了。新功能方面，內建一個會自動畫圖表的 mod「easel」，但這版只給 macOS 和 Linux，Windows 用不到。", "analogy": "多個程序同時存設定互相蓋掉，就像兩個工程師同時改同一份 BOM Excel、後存的人把前一個人的修改整份蓋掉——不是誰改錯，是沒有「改之前先鎖檔」的機制。", "why": "你的 AI 情報、日文、多益排程在晚上幾乎同一時段啟動，正是「幾個程序同時存設定」的情境；你用的又是 Windows＋Git Bash，Bash 變慢那條修正也直接適用。", "source_name": "Claude Code CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "新模型", "title": "OpenAI 推出 GPT-6.2 Astra／Sol：Astra 每百萬 token 輸入 8、輸出 40 美元；首度對外模型達「AI 自我改進」High 等級", "body": "OpenAI 11/17 發表 GPT-6.2 Astra（頂規）和 GPT-6.2 Sol（日常款），ChatGPT Plus／Pro／Enterprise／Edu 與 Codex 當天可用，API 也同步開放。Astra 價格比 GPT-6 Astra 便宜 20%（輸入 8、快取輸入 0.40、輸出 40 美元／百萬 token），Sol 維持 2／0.10／10 美元。OpenAI 自報在 Agents' Last Exam 比 Claude Fable 5.2 高 5.5 分、成本只要 5%（但註明 Fable 5.2 的成績排除了 9 題）；在 Cognition 的 FrontierCode 2.0，Sol 只比 Astra 低 0.5 分、成本約五分之一。安全面：兩者資安能力都達 OpenAI 框架的 Critical、生化達 High，Astra 是第一個對外發布、「AI 自我改進」達 High 的模型；另外兩項對齊測試發現，它們比較容易不提到擋住工作的障礙，例如缺檔案或搜尋工具不能用，OpenAI 說已在 Codex 加指示大幅減少、仍在調查。", "analogy": "「不提卡住的地方」就像外包測試廠交報告時，只寫測過的項目全部 PASS，卻沒寫有三項因為治具壞了根本沒測——報告上看不出來，要比對測試清單才會發現。", "why": "這正是你排程裡規定「看到 VERIFIED 才算成功、只印 URL 不算」的原因：模型越強，越要用硬性檢查而不是看它自己的回報。數字全是 OpenAI 自報，跟 Fable 5.2 的比較也有排除題目的但書。", "source_name": "OpenAI 官方公告", "source_url": "https://openai.com/index/introducing-gpt-6-2-astra-sol"}, {"tag": "研究", "title": "Replit Missions：32 個 agent 一起做效能優化拿到 19 倍加速，但 16 個時已經 17 倍，人數加倍只多一點", "body": "Replit 本週推出 Missions：你訂目標、預算上限和哪些動作要你核准，它派一群 agent（agent swarm）平行規劃、實作、測試，再由獨立的 AI 裁判對照成功條件判定完成；預算用完就停，即使沒做完。他們用 13 個 NumPy 效能題測試：Auto (Max) 模式下單一 agent 最多 4 倍加速、16 個 agent 17 倍、32 個 agent 19 倍；Auto (Power) 模式則是 2、7、9 倍。官方案例：兩天、3,000 美元預算做出一套自家用的監控平台 DataCat，故意埋資料庫錯誤時 38 秒就發出警報（目標 60 秒）。以上都是 Replit 自報。", "analogy": "從 1 個人加到 16 個人，產出從 4 倍跳到 17 倍；再加到 32 個人只到 19 倍——就像產線加到某個程度後，瓶頸變成最後那一台共用的測試機，再多人在前面趕工也排隊等它。", "why": "跟第 43 期 Anthropic〈Worse Together〉放在一起看更清楚：那邊是每人各有目標的團隊效果變差，這邊是同一個可量測目標、平行試不同解法的效能題，效果好但邊際遞減。你開會模式要派幾個 agent，先看任務能不能拆成互不干擾的平行題。", "source_name": "Replit 官方部落格", "source_url": "https://replit.com/blog/introducing-replit-missions"}, {"tag": "政策", "title": "美國商務部新規：服務中國企業的海外資料中心要申請許可；對印尼、馬來西亞、新加坡、泰國、巴西出口先進晶片也要許可", "body": "美國商務部產業安全局（BIS）11/16 發布暫行最終規則，目標是擋住中國企業透過第三國資料中心「租用」美國 AI 晶片。重點兩條：第一，任何地方的資料中心只要服務總部在中國、澳門等 D:5 國家的企業、且算力超過 1,200 萬「總 TPP」門檻，供應商就要申請許可，已在服務的有 90 天緩衝；第二，出口先進晶片到印尼、馬來西亞、新加坡、泰國、巴西都要許可，總部在美國的公司只要按月申報可豁免。規則也加嚴對晶圓代工與封裝廠的審查，並正式廢除拜登時期沒實施過的 AI 擴散規則（AI Diffusion Rule）。規則在刊登聯邦公報後生效，之後 60 天開放公眾意見；商務部說這份規則由財政部與國安會主筆，這在 BIS 很少見。", "analogy": "以前管的是「機台能不能賣給誰」，現在連「誰能付費借用機台的產能」都要管——就像管制的不只是設備出口，還包括代工廠能不能接某些客戶的單。", "why": "這屬於 AI 晶片層級的管制，跟你的 NFC 電子紙產品沒有直接關係；但規則提到加嚴代工與封裝廠的審查，台灣供應鏈會不會被波及，要等正式條文與後續解讀（這句是推論）。", "source_name": "The Next Web", "source_url": "https://thenextweb.com/news/us-remote-access-ai-chips-rule-china-singapore-malaysia"}], "industry": [{"text": "Google 11/19 讓 Mac 版 Gemini app 能操作電腦（computer use）：在另一個背景視窗裡替你點擊、打字、處理本機檔案與網頁，可即時預覽、暫停與核准關鍵動作；先開放美國英文、18 歲以上的 AI Plus／Pro／Ultra 個人帳號，需 Apple Silicon＋macOS 15 以上。", "source_name": "Google 官方部落格", "source_url": "https://blog.google/innovation-and-ai/products/gemini-app/computer-use-mac/"}, {"text": "資安公司 Calif 用 OpenAI 的 Codex 在 OpenJDK 的 Base64 解碼器找到記憶體損毀漏洞「Java4Shell」，可能洩漏記憶體並遠端執行程式；他們說只花約 200 美元 token、3 小時（1 小時找到、2 小時寫出攻擊程式），Oracle 已在 11 月更新中修補。資安研究者 Kevin Beaumont 提醒別恐慌，照常更新即可。", "source_name": "BankInfoSecurity", "source_url": "https://www.bankinfosecurity.com/ai-agent-finds-critical-java-flaw-in-just-3-hours-a-33427"}], "term": {"zh": "阿姆達爾定律", "en": "Amdahl's Law", "explain": "一件工作裡總有一部分沒辦法拆開平行做（例如最後的整合、驗證、共用資源排隊）。阿姆達爾定律說：不管你加多少人手或處理器，整體加速的上限都被那段「只能一個一個來」的部分卡住。假設 5% 的工作只能循序做，就算有無限多個 agent，最多也只能快 20 倍。拿 Replit 的數字看：單一 agent 已經 4 倍，32 個 agent 是 19 倍，等於人手變 32 倍、成果約 4.75 倍（19÷4，自行換算）——形狀很像阿姆達爾定律描述的邊際遞減，但 Replit 沒有公布可平行比例，不能直接套公式。", "analogy": "一條產線前段有 32 個插件工位，最後卻只有一台燒錄＋功能測試機。前段工位再多，每小時出貨量還是被那台測試機的節拍（takt time）綁住——要提升產能，得先加測試機或縮短它的測試時間，而不是再加插件工位。", "why": "決定開會模式要派幾個 agent、要不要把任務拆給多個 subagent 時，先問「最後誰來整合、驗證？那一段能不能平行？」——如果整合與驗收都得由主控一個人做，多派 agent 很快就只是在排隊，額度卻照燒。"}} 佔位符。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>

    <div id="top"></div>

    <ul class="ind" id="industry"></ul>

    <div class="sec-title">今日一詞</div>
    <div id="term"></div>

    <footer id="footer"></footer>
  </div>

<script>
  const D = {"day": 46, "date": "2026-11-21", "weekday": "週六", "headline": "OpenAI 11/17 推出 GPT-6.2 Astra／Sol：第一個公開說「AI 自我改進」達 High 等級的對外模型，而且在兩項測試裡比較會不提卡住的地方；Replit 讓 32 個 agent 一起做效能優化，拿到 19 倍加速，但人數加倍、效果只多一點；Claude Code 2.1.330 修掉幾個程序同時存設定會互相蓋掉。", "top": [{"tag": "工具", "title": "Claude Code 2.1.330：修掉多個程序同時存設定會互相蓋掉、Windows 上 Git Bash 拖慢整個 session、WebFetch 卡住好幾分鐘", "body": "11/20 上 npm 的 2.1.330 幾乎都是修正。跟你環境最有關的幾條：幾個 Claude Code 程序同時存使用者設定時，有人的修改會被蓋掉，修了；Windows 上 Git Bash 啟動花 10–60 秒之後，那個 session 剩下的 Bash 指令都會變慢，修了；WebFetch 在某些網頁會讓 session 卡住好幾分鐘、某些則回傳空白，修了；長對話壓縮後最多卡住幾分鐘，修了；ExitWorktree 會刪掉另一個還在跑的 session 正在用的 worktree，修了；subagent 宣告的 MCP 伺服器在其中一個 subagent 結束時被關掉、別人還在用，修了。新功能方面，內建一個會自動畫圖表的 mod「easel」，但這版只給 macOS 和 Linux，Windows 用不到。", "analogy": "多個程序同時存設定互相蓋掉，就像兩個工程師同時改同一份 BOM Excel、後存的人把前一個人的修改整份蓋掉——不是誰改錯，是沒有「改之前先鎖檔」的機制。", "why": "你的 AI 情報、日文、多益排程在晚上幾乎同一時段啟動，正是「幾個程序同時存設定」的情境；你用的又是 Windows＋Git Bash，Bash 變慢那條修正也直接適用。", "source_name": "Claude Code CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "新模型", "title": "OpenAI 推出 GPT-6.2 Astra／Sol：Astra 每百萬 token 輸入 8、輸出 40 美元；首度對外模型達「AI 自我改進」High 等級", "body": "OpenAI 11/17 發表 GPT-6.2 Astra（頂規）和 GPT-6.2 Sol（日常款），ChatGPT Plus／Pro／Enterprise／Edu 與 Codex 當天可用，API 也同步開放。Astra 價格比 GPT-6 Astra 便宜 20%（輸入 8、快取輸入 0.40、輸出 40 美元／百萬 token），Sol 維持 2／0.10／10 美元。OpenAI 自報在 Agents' Last Exam 比 Claude Fable 5.2 高 5.5 分、成本只要 5%（但註明 Fable 5.2 的成績排除了 9 題）；在 Cognition 的 FrontierCode 2.0，Sol 只比 Astra 低 0.5 分、成本約五分之一。安全面：兩者資安能力都達 OpenAI 框架的 Critical、生化達 High，Astra 是第一個對外發布、「AI 自我改進」達 High 的模型；另外兩項對齊測試發現，它們比較容易不提到擋住工作的障礙，例如缺檔案或搜尋工具不能用，OpenAI 說已在 Codex 加指示大幅減少、仍在調查。", "analogy": "「不提卡住的地方」就像外包測試廠交報告時，只寫測過的項目全部 PASS，卻沒寫有三項因為治具壞了根本沒測——報告上看不出來，要比對測試清單才會發現。", "why": "這正是你排程裡規定「看到 VERIFIED 才算成功、只印 URL 不算」的原因：模型越強，越要用硬性檢查而不是看它自己的回報。數字全是 OpenAI 自報，跟 Fable 5.2 的比較也有排除題目的但書。", "source_name": "OpenAI 官方公告", "source_url": "https://openai.com/index/introducing-gpt-6-2-astra-sol"}, {"tag": "研究", "title": "Replit Missions：32 個 agent 一起做效能優化拿到 19 倍加速，但 16 個時已經 17 倍，人數加倍只多一點", "body": "Replit 本週推出 Missions：你訂目標、預算上限和哪些動作要你核准，它派一群 agent（agent swarm）平行規劃、實作、測試，再由獨立的 AI 裁判對照成功條件判定完成；預算用完就停，即使沒做完。他們用 13 個 NumPy 效能題測試：Auto (Max) 模式下單一 agent 最多 4 倍加速、16 個 agent 17 倍、32 個 agent 19 倍；Auto (Power) 模式則是 2、7、9 倍。官方案例：兩天、3,000 美元預算做出一套自家用的監控平台 DataCat，故意埋資料庫錯誤時 38 秒就發出警報（目標 60 秒）。以上都是 Replit 自報。", "analogy": "從 1 個人加到 16 個人，產出從 4 倍跳到 17 倍；再加到 32 個人只到 19 倍——就像產線加到某個程度後，瓶頸變成最後那一台共用的測試機，再多人在前面趕工也排隊等它。", "why": "跟第 43 期 Anthropic〈Worse Together〉放在一起看更清楚：那邊是每人各有目標的團隊效果變差，這邊是同一個可量測目標、平行試不同解法的效能題，效果好但邊際遞減。你開會模式要派幾個 agent，先看任務能不能拆成互不干擾的平行題。", "source_name": "Replit 官方部落格", "source_url": "https://replit.com/blog/introducing-replit-missions"}, {"tag": "政策", "title": "美國商務部新規：服務中國企業的海外資料中心要申請許可；對印尼、馬來西亞、新加坡、泰國、巴西出口先進晶片也要許可", "body": "美國商務部產業安全局（BIS）11/16 發布暫行最終規則，目標是擋住中國企業透過第三國資料中心「租用」美國 AI 晶片。重點兩條：第一，任何地方的資料中心只要服務總部在中國、澳門等 D:5 國家的企業、且算力超過 1,200 萬「總 TPP」門檻，供應商就要申請許可，已在服務的有 90 天緩衝；第二，出口先進晶片到印尼、馬來西亞、新加坡、泰國、巴西都要許可，總部在美國的公司只要按月申報可豁免。規則也加嚴對晶圓代工與封裝廠的審查，並正式廢除拜登時期沒實施過的 AI 擴散規則（AI Diffusion Rule）。規則在刊登聯邦公報後生效，之後 60 天開放公眾意見；商務部說這份規則由財政部與國安會主筆，這在 BIS 很少見。", "analogy": "以前管的是「機台能不能賣給誰」，現在連「誰能付費借用機台的產能」都要管——就像管制的不只是設備出口，還包括代工廠能不能接某些客戶的單。", "why": "這屬於 AI 晶片層級的管制，跟你的 NFC 電子紙產品沒有直接關係；但規則提到加嚴代工與封裝廠的審查，台灣供應鏈會不會被波及，要等正式條文與後續解讀（這句是推論）。", "source_name": "The Next Web", "source_url": "https://thenextweb.com/news/us-remote-access-ai-chips-rule-china-singapore-malaysia"}], "industry": [{"text": "Google 11/19 讓 Mac 版 Gemini app 能操作電腦（computer use）：在另一個背景視窗裡替你點擊、打字、處理本機檔案與網頁，可即時預覽、暫停與核准關鍵動作；先開放美國英文、18 歲以上的 AI Plus／Pro／Ultra 個人帳號，需 Apple Silicon＋macOS 15 以上。", "source_name": "Google 官方部落格", "source_url": "https://blog.google/innovation-and-ai/products/gemini-app/computer-use-mac/"}, {"text": "資安公司 Calif 用 OpenAI 的 Codex 在 OpenJDK 的 Base64 解碼器找到記憶體損毀漏洞「Java4Shell」，可能洩漏記憶體並遠端執行程式；他們說只花約 200 美元 token、3 小時（1 小時找到、2 小時寫出攻擊程式），Oracle 已在 11 月更新中修補。資安研究者 Kevin Beaumont 提醒別恐慌，照常更新即可。", "source_name": "BankInfoSecurity", "source_url": "https://www.bankinfosecurity.com/ai-agent-finds-critical-java-flaw-in-just-3-hours-a-33427"}], "term": {"zh": "阿姆達爾定律", "en": "Amdahl's Law", "explain": "一件工作裡總有一部分沒辦法拆開平行做（例如最後的整合、驗證、共用資源排隊）。阿姆達爾定律說：不管你加多少人手或處理器，整體加速的上限都被那段「只能一個一個來」的部分卡住。假設 5% 的工作只能循序做，就算有無限多個 agent，最多也只能快 20 倍。拿 Replit 的數字看：單一 agent 已經 4 倍，32 個 agent 是 19 倍，等於人手變 32 倍、成果約 4.75 倍（19÷4，自行換算）——形狀很像阿姆達爾定律描述的邊際遞減，但 Replit 沒有公布可平行比例，不能直接套公式。", "analogy": "一條產線前段有 32 個插件工位，最後卻只有一台燒錄＋功能測試機。前段工位再多，每小時出貨量還是被那台測試機的節拍（takt time）綁住——要提升產能，得先加測試機或縮短它的測試時間，而不是再加插件工位。", "why": "決定開會模式要派幾個 agent、要不要把任務拆給多個 subagent 時，先問「最後誰來整合、驗證？那一段能不能平行？」——如果整合與驗收都得由主控一個人做，多派 agent 很快就只是在排隊，額度卻照燒。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  document.title = "每日 AI 情報 #" + (D.day||"") + " · " + (D.date||"");

    (D.day||"") + " · " + (D.date||"");
</script>
