<!--
  每日 AI 情報 網頁範本（終端機／hacker 風，強制深色）
  build_ai_page.py 會把 content.json 的內容以 JSON 塞進 {"day": 38, "date": "2026-11-10", "weekday": "週二", "headline": "Anthropic 11/9 推出 Claude Fable 5.2／Mythos 5.2，同時公開一篇研究：Fable 5.2 從規格、線路圖、四層板佈線、外殼到韌體，自己設計出三台能用的小裝置，打樣的電路不用改；另一邊，資安公司 Apiiro 發現 Claude Code 的「Yes, and don't ask again」會把指令裡的密碼原封不動存進專案設定檔，公開 GitHub 上已找到 1,122 份帶密鑰的檔案。", "top": [{"tag": "研究", "title": "Claude 設計三台電子裝置：自己擺件、拉線、跑 DFM，打樣的電路板不用改線就能動", "body": "Anthropic 跟做電路板設計與製造的 Diode Computers 合作（Anthropic 註明兩家有商業關係），讓 Fable 5.2 從一段簡短需求開始，設計 USB 免持喇叭、語音助理集線器、手持電子寵物三台裝置：寫規格、畫線路圖、擺零件、拉四層板的銅線、畫 3D 列印外殼、寫韌體、出 BOM。Diode 照檔案打樣，三台都能用、電路沒有修改，用了幾週仍正常。幾個細節：先拉 USB／乙太網路差動對並做等長蛇形線；發現線「纏到看不清楚」就整片拆掉重拉；嫌 KiCad 內建的單線佈線太慢，半小時內自己寫了一個網格搜尋的佈線器；算出 25 mm 麥克風孔會在約 3.4 kHz 共振、改成楔形外殼把孔縮到約 10 mm。在 Diode 的內部測試 PCB Gym 拿 69%（Fable 5 是 25%），公開的 BenchCAD 2.1 拿 83.5（Fable 5.1 為 44.4）。限制也寫得清楚：還沒做電性驗證、天線調校、熱測試與認證，不是為量產設計，組裝測試仍由 Diode 的工程師動手。", "analogy": "像一個新進 Layout 工程師第一次把板子丟出去打樣就一次過：值得注意的不是「會畫」，而是會自己判斷「這區畫爛了，打掉重來」，並且出圖前自己跑 DFM 把 solder mask 太細的地方修掉、把誤報的地方標成可忽略。", "why": "這是目前跟你本業最貼近的一篇：四層板、差動對、天線淨空、DFM、料件查庫存，跟你用 pcb-layer-route 做的事是同一條線。可以當成「哪些步驟 AI 已經做得到、哪些還是要人（驗證、認證、量產）」的參考清單；跑分是 Anthropic 與合作方自報。", "source_name": "Anthropic Research", "source_url": "https://www.anthropic.com/research/claude-electronics-design"}, {"tag": "新模型", "title": "Claude Fable 5.2／Mythos 5.2 推出：更便宜、更快，官方仍建議日常先用 Opus 5.5", "body": "11/9 發布。Fable 與 Mythos 是同一個底層模型，差別在 Fable 加了資安與生物方面的防護、開放所有人用，Mythos 要透過驗證計畫申請。價格降到每百萬輸入 token 8 美元、輸出 40 美元，輸出速度比 5.1 快最多 30%；另有選配快速模式（Fast mode），生成快最多 2.5 倍、價格加倍（16／80 美元）。官方自報的跑分大多高過 Opus 5.5，例如 FrontierSWE v2 69.9%（Opus 5.5 是 62.3%），FrontierCode 2.0 在 High 努力等級就和 Opus 5.5 最高分打平、每任務成本約一半。Anthropic 也舉例：一位工程師讓它協調超過 1,000 個 subagent、連跑 8 天，從空資料夾做出一個能在筆電開機的原型作業系統。不過官方明講：大部分寫程式與知識工作先用 Opus 5.5，碰到最難、最開放的技術題再往上換 Fable。", "why": "Claude Code 2.1.321 已把 Fable 5.2 設成預設的 Fable 型號。對你來說重點是「升級不等於該全換」：官方自己的建議跟你現在的派工規則（小事 haiku、一般 sonnet、審查 opus）是同一個邏輯，Fable 適合拿來處理像佈線卡關這類真正難的題目。", "source_name": "Anthropic", "source_url": "https://www.anthropic.com/claude-fable-and-mythos-5-2"}, {"tag": "工具", "title": "Apiiro：Claude Code 的「不要再問」會把指令裡的密碼存進專案設定檔，公開 GitHub 找到 1,122 份", "body": "資安公司 Apiiro 11/5 發表研究：在 Claude Code 對某個指令按「Yes, and don't ask again」，它會把整串指令原封不動存成 .claude/settings.local.json 裡的放行規則；如果那串指令裡夾了密碼或金鑰，就跟著被存下來。Apiiro 掃了 11/1–11/3 公開 GitHub 上 104,185 份這個檔案，1,122 份（約 1.1%）至少帶一個密鑰，包括 379 組資料庫密碼、23 把 AWS 金鑰；另有 734 個密鑰只存在 git 歷史裡（檔案刪了但還看得到）。Anthropic 的設計是第一次寫這個檔時，把它加進開發者本機的全域 git 排除清單——但這只在那台電腦有效，換機器、被 fork 或檔案早已被追蹤就擋不住。數字是 Apiiro 自己的統計（它本身賣資安產品），沒有驗證密鑰是否仍有效；Apiiro 研究原文我沒讀到，以 ITWire 的整理為準。", "analogy": "像產線為了省事，把「這張工單直接放行」的紀錄連同倉庫密碼一起抄在工單上、貼在公佈欄：放行規則本身沒錯，錯在抄進去的東西太多。", "why": "你有好幾個 repo 會推上 GitHub（包括每週備份）。實務上兩件事：指令裡別直接打密碼（改用環境變數或讀檔）；在 repo 自己的 .gitignore 寫上 .claude/settings.local.json，不要只靠本機的全域排除。", "source_name": "ITWire", "source_url": "https://itwire.com/business-it-news/security/claude-code-approval-files-found-exposing-company-secrets-on-github-says-apirro-researchers"}, {"tag": "基礎設施", "title": "Anthropic 花約 34 億美元接手別人排隊兩年的 1.7 GW 燃氣發電機訂單", "body": "據英國《金融時報》引述一位知情人士、CNBC 轉述：Anthropic 9 月底和德州的設備商 OnePWR 簽約，用約 34 億美元買下 OnePWR 約兩年前向 Caterpillar 下的 1.7 GW 燃氣發電機訂單，連同安裝所需的工程與施工能力（不含公司本身、也沒有人員轉過去）。原本 Anthropic 只是要跟 OnePWR 買電，後來改成直接接手整個排隊位置。FT 稱這是目前已知 AI 實驗室單筆最大的發電設備採購。我沒有找到 Anthropic 對這筆交易的公開說明。", "analogy": "像關鍵料缺貨、交期排到兩年後時，直接把別家已經排在前面的訂單整批買下來——買到的主要不是貨，是交期。", "why": "這兩個月 AI 的瓶頸從晶片一路往上游移到電力與發電設備；跟你做產品時遇到長交期料一樣，「誰先排到產能」比「誰出價高」更決定進度。", "source_name": "AI Weekly（整理 FT／CNBC 報導）", "source_url": "https://aiweekly.co/alerts/anthropic-pays-34b-for-onepwrs-17gw-generator-order"}], "industry": [{"text": "Claude Code 2.1.321（11/9）：把 Fable 5.2 設為預設 Fable 型號；修正 MCP OAuth 在伺服器轉址時把 refresh token 送到別的主機、cp／mv 到資料夾時拒絕規則沒套到目標檔、桌面版 Code 分頁在桌面 App 有同名 MCP 時專案 MCP 第一則訊息後斷線、Bash 一次送多個指令時跑錯資料夾。這版沒有處理上面 Apiiro 講的設定檔問題。", "source_name": "Claude Code CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"text": "Dropbox 11/3 同意以約 3.5 億美元現金收購 Tigris Data（給 AI 工作負載用、相容 S3 的物件儲存），是 Dropbox 成立以來最大的收購；11/5 同時宣布 DBX Agent Cloud，先從物件儲存做起。金額出自 Dropbox 向 SEC 申報的 8-K。", "source_name": "ITPro", "source_url": "https://www.itpro.com/business/acquisition/dropbox-targets-ai-infrastructure-gains-with-usd350m-tigris-data-acquisition"}, {"text": "Anthropic 上週另外公開兩篇研究：「Agent 記憶由哪些元件組成」與「教 AI 建立科學模型」（都是 11/6），想理解 agent 怎麼記事情可以從第一篇看起。", "source_name": "Anthropic Research", "source_url": "https://www.anthropic.com/research/components-of-agent-memory"}], "term": {"zh": "顧問模式", "en": "Advisor Pattern", "explain": "一種 agent 分工方式：日常的工作交給便宜、快的小模型（例如 Haiku、Sonnet）一路做下去，遇到卡關或關鍵決策時，小模型主動去「請教」一個更強、更貴的大模型，拿到建議後再自己繼續做。跟你學過的「編排者–工作者（Orchestrator–Workers）」方向相反：編排者模式是大模型當主管、把小事派下去；顧問模式是小模型當主力、只在必要時往上問。這次 Fable 5.2 的公告就把這兩種角色都列為建議用法。", "analogy": "像產線上的作業員自己照 SOP 做，遇到判斷不了的異常才按呼叫鈴請資深工程師來看一眼：工程師的時間很貴，所以只花在真正需要判斷的那幾次，其餘時間產線照常跑。", "why": "你派 subagent 時已經在用「按難度選模型」的思路；顧問模式是把這個思路放進同一個任務裡——大部分步驟用便宜模型，只有關卡點才付大模型的錢。評估一個任務適不適合時，看的是「卡關點少而明確」還是「處處都要深度判斷」。"}} 佔位符。

<style>

<script>
  const D = {"day": 38, "date": "2026-11-10", "weekday": "週二", "headline": "Anthropic 11/9 推出 Claude Fable 5.2／Mythos 5.2，同時公開一篇研究：Fable 5.2 從規格、線路圖、四層板佈線、外殼到韌體，自己設計出三台能用的小裝置，打樣的電路不用改；另一邊，資安公司 Apiiro 發現 Claude Code 的「Yes, and don't ask again」會把指令裡的密碼原封不動存進專案設定檔，公開 GitHub 上已找到 1,122 份帶密鑰的檔案。", "top": [{"tag": "研究", "title": "Claude 設計三台電子裝置：自己擺件、拉線、跑 DFM，打樣的電路板不用改線就能動", "body": "Anthropic 跟做電路板設計與製造的 Diode Computers 合作（Anthropic 註明兩家有商業關係），讓 Fable 5.2 從一段簡短需求開始，設計 USB 免持喇叭、語音助理集線器、手持電子寵物三台裝置：寫規格、畫線路圖、擺零件、拉四層板的銅線、畫 3D 列印外殼、寫韌體、出 BOM。Diode 照檔案打樣，三台都能用、電路沒有修改，用了幾週仍正常。幾個細節：先拉 USB／乙太網路差動對並做等長蛇形線；發現線「纏到看不清楚」就整片拆掉重拉；嫌 KiCad 內建的單線佈線太慢，半小時內自己寫了一個網格搜尋的佈線器；算出 25 mm 麥克風孔會在約 3.4 kHz 共振、改成楔形外殼把孔縮到約 10 mm。在 Diode 的內部測試 PCB Gym 拿 69%（Fable 5 是 25%），公開的 BenchCAD 2.1 拿 83.5（Fable 5.1 為 44.4）。限制也寫得清楚：還沒做電性驗證、天線調校、熱測試與認證，不是為量產設計，組裝測試仍由 Diode 的工程師動手。", "analogy": "像一個新進 Layout 工程師第一次把板子丟出去打樣就一次過：值得注意的不是「會畫」，而是會自己判斷「這區畫爛了，打掉重來」，並且出圖前自己跑 DFM 把 solder mask 太細的地方修掉、把誤報的地方標成可忽略。", "why": "這是目前跟你本業最貼近的一篇：四層板、差動對、天線淨空、DFM、料件查庫存，跟你用 pcb-layer-route 做的事是同一條線。可以當成「哪些步驟 AI 已經做得到、哪些還是要人（驗證、認證、量產）」的參考清單；跑分是 Anthropic 與合作方自報。", "source_name": "Anthropic Research", "source_url": "https://www.anthropic.com/research/claude-electronics-design"}, {"tag": "新模型", "title": "Claude Fable 5.2／Mythos 5.2 推出：更便宜、更快，官方仍建議日常先用 Opus 5.5", "body": "11/9 發布。Fable 與 Mythos 是同一個底層模型，差別在 Fable 加了資安與生物方面的防護、開放所有人用，Mythos 要透過驗證計畫申請。價格降到每百萬輸入 token 8 美元、輸出 40 美元，輸出速度比 5.1 快最多 30%；另有選配快速模式（Fast mode），生成快最多 2.5 倍、價格加倍（16／80 美元）。官方自報的跑分大多高過 Opus 5.5，例如 FrontierSWE v2 69.9%（Opus 5.5 是 62.3%），FrontierCode 2.0 在 High 努力等級就和 Opus 5.5 最高分打平、每任務成本約一半。Anthropic 也舉例：一位工程師讓它協調超過 1,000 個 subagent、連跑 8 天，從空資料夾做出一個能在筆電開機的原型作業系統。不過官方明講：大部分寫程式與知識工作先用 Opus 5.5，碰到最難、最開放的技術題再往上換 Fable。", "why": "Claude Code 2.1.321 已把 Fable 5.2 設成預設的 Fable 型號。對你來說重點是「升級不等於該全換」：官方自己的建議跟你現在的派工規則（小事 haiku、一般 sonnet、審查 opus）是同一個邏輯，Fable 適合拿來處理像佈線卡關這類真正難的題目。", "source_name": "Anthropic", "source_url": "https://www.anthropic.com/claude-fable-and-mythos-5-2"}, {"tag": "工具", "title": "Apiiro：Claude Code 的「不要再問」會把指令裡的密碼存進專案設定檔，公開 GitHub 找到 1,122 份", "body": "資安公司 Apiiro 11/5 發表研究：在 Claude Code 對某個指令按「Yes, and don't ask again」，它會把整串指令原封不動存成 .claude/settings.local.json 裡的放行規則；如果那串指令裡夾了密碼或金鑰，就跟著被存下來。Apiiro 掃了 11/1–11/3 公開 GitHub 上 104,185 份這個檔案，1,122 份（約 1.1%）至少帶一個密鑰，包括 379 組資料庫密碼、23 把 AWS 金鑰；另有 734 個密鑰只存在 git 歷史裡（檔案刪了但還看得到）。Anthropic 的設計是第一次寫這個檔時，把它加進開發者本機的全域 git 排除清單——但這只在那台電腦有效，換機器、被 fork 或檔案早已被追蹤就擋不住。數字是 Apiiro 自己的統計（它本身賣資安產品），沒有驗證密鑰是否仍有效；Apiiro 研究原文我沒讀到，以 ITWire 的整理為準。", "analogy": "像產線為了省事，把「這張工單直接放行」的紀錄連同倉庫密碼一起抄在工單上、貼在公佈欄：放行規則本身沒錯，錯在抄進去的東西太多。", "why": "你有好幾個 repo 會推上 GitHub（包括每週備份）。實務上兩件事：指令裡別直接打密碼（改用環境變數或讀檔）；在 repo 自己的 .gitignore 寫上 .claude/settings.local.json，不要只靠本機的全域排除。", "source_name": "ITWire", "source_url": "https://itwire.com/business-it-news/security/claude-code-approval-files-found-exposing-company-secrets-on-github-says-apirro-researchers"}, {"tag": "基礎設施", "title": "Anthropic 花約 34 億美元接手別人排隊兩年的 1.7 GW 燃氣發電機訂單", "body": "據英國《金融時報》引述一位知情人士、CNBC 轉述：Anthropic 9 月底和德州的設備商 OnePWR 簽約，用約 34 億美元買下 OnePWR 約兩年前向 Caterpillar 下的 1.7 GW 燃氣發電機訂單，連同安裝所需的工程與施工能力（不含公司本身、也沒有人員轉過去）。原本 Anthropic 只是要跟 OnePWR 買電，後來改成直接接手整個排隊位置。FT 稱這是目前已知 AI 實驗室單筆最大的發電設備採購。我沒有找到 Anthropic 對這筆交易的公開說明。", "analogy": "像關鍵料缺貨、交期排到兩年後時，直接把別家已經排在前面的訂單整批買下來——買到的主要不是貨，是交期。", "why": "這兩個月 AI 的瓶頸從晶片一路往上游移到電力與發電設備；跟你做產品時遇到長交期料一樣，「誰先排到產能」比「誰出價高」更決定進度。", "source_name": "AI Weekly（整理 FT／CNBC 報導）", "source_url": "https://aiweekly.co/alerts/anthropic-pays-34b-for-onepwrs-17gw-generator-order"}], "industry": [{"text": "Claude Code 2.1.321（11/9）：把 Fable 5.2 設為預設 Fable 型號；修正 MCP OAuth 在伺服器轉址時把 refresh token 送到別的主機、cp／mv 到資料夾時拒絕規則沒套到目標檔、桌面版 Code 分頁在桌面 App 有同名 MCP 時專案 MCP 第一則訊息後斷線、Bash 一次送多個指令時跑錯資料夾。這版沒有處理上面 Apiiro 講的設定檔問題。", "source_name": "Claude Code CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"text": "Dropbox 11/3 同意以約 3.5 億美元現金收購 Tigris Data（給 AI 工作負載用、相容 S3 的物件儲存），是 Dropbox 成立以來最大的收購；11/5 同時宣布 DBX Agent Cloud，先從物件儲存做起。金額出自 Dropbox 向 SEC 申報的 8-K。", "source_name": "ITPro", "source_url": "https://www.itpro.com/business/acquisition/dropbox-targets-ai-infrastructure-gains-with-usd350m-tigris-data-acquisition"}, {"text": "Anthropic 上週另外公開兩篇研究：「Agent 記憶由哪些元件組成」與「教 AI 建立科學模型」（都是 11/6），想理解 agent 怎麼記事情可以從第一篇看起。", "source_name": "Anthropic Research", "source_url": "https://www.anthropic.com/research/components-of-agent-memory"}], "term": {"zh": "顧問模式", "en": "Advisor Pattern", "explain": "一種 agent 分工方式：日常的工作交給便宜、快的小模型（例如 Haiku、Sonnet）一路做下去，遇到卡關或關鍵決策時，小模型主動去「請教」一個更強、更貴的大模型，拿到建議後再自己繼續做。跟你學過的「編排者–工作者（Orchestrator–Workers）」方向相反：編排者模式是大模型當主管、把小事派下去；顧問模式是小模型當主力、只在必要時往上問。這次 Fable 5.2 的公告就把這兩種角色都列為建議用法。", "analogy": "像產線上的作業員自己照 SOP 做，遇到判斷不了的異常才按呼叫鈴請資深工程師來看一眼：工程師的時間很貴，所以只花在真正需要判斷的那幾次，其餘時間產線照常跑。", "why": "你派 subagent 時已經在用「按難度選模型」的思路；顧問模式是把這個思路放進同一個任務裡——大部分步驟用便宜模型，只有關卡點才付大模型的錢。評估一個任務適不適合時，看的是「卡關點少而明確」還是「處處都要深度判斷」。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
