  build_ai_page.py 會把 content.json 的內容以 JSON 塞進 {"day": 15, "date": "2026-10-01", "weekday": "週四", "headline": "Google 終於拿出 Gemini 4 第一顆旗艦「Argon」：自家公布的跑分大多領先，但第三方 Artificial Analysis 實測只跟 GPT-6 Astra 打平、還落後 Claude Opus 5.5——它真正突出的是「不知道就說不知道」；同一天美國 FTC 對 OpenAI、Anthropic 等 AI 實驗室展開消費者保護調查。", "top": [{"tag": "新模型", "title": "Gemini 4 Argon：Google 自報多項領先，第三方實測與 GPT-6 Astra 打平（53 分）、落後 Opus 5.5（58 分），幻覺率 15% 是同級最低", "body": "Google 9/30 發表 Gemini 4 世代第一顆旗艦模型 Argon，比過去的 Pro 系列更大，原本預定的 Gemini 3.5 Pro 直接取消。Google 自己的測試表裡 Argon 多數項目領先，但 Reuters 也指出四項程式基準裡有兩項落後。獨立評測機構 Artificial Analysis 的綜合指數上，Argon 53 分、跟 GPT-6 Astra 並列，Claude Opus 5.5 是 58 分。最亮眼的是幻覺率 15%（Astra 51%、GPT-6.1 Sol 54%）：答不出來時比較會說不知道；不過答對率約 50%，反而低於 Astra 的 63%。另外每個任務平均吐出約 6.2 萬個 token，是 Astra 的兩倍多。目前只開放給 Google「Fairwind」計畫裡的資安防禦夥伴，一般開發者還沒有日期，公布的入門價是每百萬 token 輸入 2 美元、輸出 10 美元。", "analogy": "像新料號的 datasheet：原廠標的 typical 值都很漂亮，送去第三方實驗室量才知道實際落在哪一檔——這次量出來是「跟對手同級，但漏電流特別低」。", "why": "這期正好示範怎麼讀新模型發表：先看自報 vs 第三方、再看單價 × 每任務 token 數（第 13 期教過的每任務成本）。單價便宜但 token 吃兩倍，實際帳單不一定省；而且你現在也還用不到。", "source_name": "The Decoder（彙整 Google 自報與 Artificial Analysis 數據）", "source_url": "https://the-decoder.com/google-gemini-4-argon-closes-the-gap-with-openai-and-anthropic-but-doesnt-take-a-clear-lead/"}, {"tag": "工具", "title": "Claude Code 2.1.286：權限詢問會顯示「第 2 個／共 5 個」、預設模型被拒時自動退回上一版、修掉 PowerShell 能刪除磁碟根目錄的漏洞", "body": "9/30 釋出，88 項變更。跟你最有關的幾件：一、好幾個權限詢問疊在一起時，會標出「2 of 5」讓你知道還剩幾個；二、如果 Anthropic API 拒絕你設定的預設模型，以前會每一輪都失敗，現在會自動退回同等級的上一版重試一次，並在退回導致脈絡從 1M 降到 200K 時明講；三、Windows 上修正 PowerShell 工具透過 cmd /c rd、del 等指令可以刪掉磁碟根目錄、家目錄等受保護資料夾的問題；四、背景工作在等你核准時，不會再被誤顯示成「已完成」。另外修了好幾處日誌與錯誤訊息沒把密碼、Bearer token 完整遮住的情況，以及 MCP 伺服器換新版握手後、連接器最長一天列不出工具的問題。", "analogy": "像治具多加了兩道防呆：一道是工單排隊時螢幕顯示「第 2 張／共 5 張」，一道是把「誤按就整台格式化」的按鈕加上護蓋。", "why": "你這台是 Windows＋PowerShell，刪除保護那條直接相關；「背景工作等核准卻顯示完成」也可能讓排程任務（像這份 AI 情報的發布）看起來跑完、其實卡在等你按允許。", "source_name": "GitHub：anthropics/claude-code Releases（v2.1.286）", "source_url": "https://github.com/anthropics/claude-code/releases/tag/v2.1.286"}, {"tag": "政策", "title": "美國 FTC 對 OpenAI、Anthropic、METR 等 AI 實驗室展開消費者保護調查，幾週內可能發出要求高層作證的調查令", "body": "《紐約郵報》9/30 引述政府消息報導、FTC 主席 Ferguson 隨後證實：FTC 正調查 OpenAI、Anthropic、評測機構 METR 等前沿 AI 實驗室，是否有違反《FTC 法》的不公平或欺騙行為，焦點是 agent 出事的案例和各家對安全性的說法。接下來預計發出「民事調查令（Civil Investigative Demand）」，性質接近傳票，可以要求交文件、要求高層出面說明。時間點很微妙：前一天這些公司才在白宮簽了自願的超級智慧協議（第 14 期），Ferguson 還提醒業者別推動「只有自己做得到的規則」來排擠對手。", "why": "第 14 期的白宮協議沒有罰則，這次的 FTC 調查則是用既有法律去管——後續怎麼走，會決定 agent 出事時責任算誰的，也會影響各家工具未來的權限設計會不會更保守。", "source_name": "The Decoder（引述《紐約郵報》，FTC 主席證實）", "source_url": "https://the-decoder.com/ftc-launches-sweeping-probe-into-openai-anthropic-and-other-ai-labs-over-consumer-protection-concerns/"}, {"tag": "研究", "title": "Anthropic 研究：美國 74% 的體力工作任務，機器人技術上做得到，但划算的只有 0.3%", "body": "Anthropic 用 Claude 對照美國職業資料庫 O*NET 的每項任務，搜尋現有機器人展示與商用部署，評估「技術上能不能做」。結果 74% 的體力任務技術上可行（大多要在專用或結構化的場地，雜亂環境只有 2%），但把機器人成本算進去、比人工便宜的只有 0.3%。如果機器人價格照 1990 年代以來每年約 3% 的速度下降，要約 40 年才會有 10% 的任務划算；目前最容易被取代的前十名大多是駕駛類職業。研究自己也列了限制：任務描述很簡略、評分有主觀判斷，也沒算法規與導入摩擦。", "analogy": "像做新產品的 DFM 評估：「做得出來」跟「量產划算」是兩回事——樣品能跑，不代表 BOM 成本壓得進售價。", "why": "你做硬體產品，最清楚 BOM 成本跟良率才是量產的門檻；這份研究把同樣的邏輯套到機器人上，提醒「AI 會取代工作」的新聞要先問：技術可行，還是成本已經划算？", "source_name": "Anthropic Research：What work can robots do?", "source_url": "https://www.anthropic.com/research/what-work-can-robots-do"}], "industry": [{"text": "語音 AI 公司 ElevenLabs 透過 3 億美元的員工股份出售，估值來到 220 億美元，是今年 2 月的兩倍；旗下語音 agent 每週處理超過 1,500 萬通對話，是 2 月的三倍。", "source_name": "ElevenLabs 官方部落格", "source_url": "https://elevenlabs.io/blog/tender-22bn"}, {"text": "Claude for Government 結束 7 月以來的公測、正式開放給美國聯邦與州政府機關，跑在 FedRAMP High（美國政府處理敏感但非機密資料的最高雲端資安等級）認證的環境裡。", "source_name": "Claude 官方部落格", "source_url": "https://claude.com/blog/claude-for-government-is-now-generally-available"}, {"text": "澳洲參議院 AI 調查原訂今天（10/1）請 Altman、Amodei 出席，兩家都表示不會到場；Anthropic 以邀請太晚為由要求改期，公司代表預計參加下週另一場聽證。", "source_name": "Reuters（經 Yahoo News 轉載）", "source_url": "https://www.yahoo.com/news/world/articles/anthropic-openai-not-attend-australian-151231643.html"}], "term": {"zh": "自報分數與第三方評測", "en": "Self-reported vs Independent Benchmarks", "explain": "AI 公司發表新模型時附的跑分表，是自己挑基準、自己跑、自己設定參數的「自報分數（Self-reported）」；Artificial Analysis、LMArena 這類「第三方評測（Independent Benchmark）」則用同一套題目和設定去測所有模型。兩者常有落差：自報表通常只列對自己有利的項目，還可能開到最高推論努力等級；第三方分數比較能橫向比較，但也只代表它那套題目。讀的時候看三件事：一是同一個指標上，第三方跟自報差多少；二是分數用了多少 token、多少錢換來的；三是那個基準在測什麼，例如「幻覺率」低，不等於「答對率」高，Argon 就是幻覺率最低、答對率卻輸給 Astra 的例子。", "analogy": "像元件 datasheet 的 typical 值 vs 你自己或第三方實驗室的量測報告：原廠會挑最漂亮的條件標規格，要放進量產設計，還是得看在你的條件下實際量到多少。", "why": "以後每週都會有「新模型在 X 基準登頂」的新聞。先分清楚是自報還是第三方、再看每任務成本，就不會因為一張跑分表就急著換工具。"}} 佔位符。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>

  </div>
</div>
<script>
  const D = {"day": 15, "date": "2026-10-01", "weekday": "週四", "headline": "Google 終於拿出 Gemini 4 第一顆旗艦「Argon」：自家公布的跑分大多領先，但第三方 Artificial Analysis 實測只跟 GPT-6 Astra 打平、還落後 Claude Opus 5.5——它真正突出的是「不知道就說不知道」；同一天美國 FTC 對 OpenAI、Anthropic 等 AI 實驗室展開消費者保護調查。", "top": [{"tag": "新模型", "title": "Gemini 4 Argon：Google 自報多項領先，第三方實測與 GPT-6 Astra 打平（53 分）、落後 Opus 5.5（58 分），幻覺率 15% 是同級最低", "body": "Google 9/30 發表 Gemini 4 世代第一顆旗艦模型 Argon，比過去的 Pro 系列更大，原本預定的 Gemini 3.5 Pro 直接取消。Google 自己的測試表裡 Argon 多數項目領先，但 Reuters 也指出四項程式基準裡有兩項落後。獨立評測機構 Artificial Analysis 的綜合指數上，Argon 53 分、跟 GPT-6 Astra 並列，Claude Opus 5.5 是 58 分。最亮眼的是幻覺率 15%（Astra 51%、GPT-6.1 Sol 54%）：答不出來時比較會說不知道；不過答對率約 50%，反而低於 Astra 的 63%。另外每個任務平均吐出約 6.2 萬個 token，是 Astra 的兩倍多。目前只開放給 Google「Fairwind」計畫裡的資安防禦夥伴，一般開發者還沒有日期，公布的入門價是每百萬 token 輸入 2 美元、輸出 10 美元。", "analogy": "像新料號的 datasheet：原廠標的 typical 值都很漂亮，送去第三方實驗室量才知道實際落在哪一檔——這次量出來是「跟對手同級，但漏電流特別低」。", "why": "這期正好示範怎麼讀新模型發表：先看自報 vs 第三方、再看單價 × 每任務 token 數（第 13 期教過的每任務成本）。單價便宜但 token 吃兩倍，實際帳單不一定省；而且你現在也還用不到。", "source_name": "The Decoder（彙整 Google 自報與 Artificial Analysis 數據）", "source_url": "https://the-decoder.com/google-gemini-4-argon-closes-the-gap-with-openai-and-anthropic-but-doesnt-take-a-clear-lead/"}, {"tag": "工具", "title": "Claude Code 2.1.286：權限詢問會顯示「第 2 個／共 5 個」、預設模型被拒時自動退回上一版、修掉 PowerShell 能刪除磁碟根目錄的漏洞", "body": "9/30 釋出，88 項變更。跟你最有關的幾件：一、好幾個權限詢問疊在一起時，會標出「2 of 5」讓你知道還剩幾個；二、如果 Anthropic API 拒絕你設定的預設模型，以前會每一輪都失敗，現在會自動退回同等級的上一版重試一次，並在退回導致脈絡從 1M 降到 200K 時明講；三、Windows 上修正 PowerShell 工具透過 cmd /c rd、del 等指令可以刪掉磁碟根目錄、家目錄等受保護資料夾的問題；四、背景工作在等你核准時，不會再被誤顯示成「已完成」。另外修了好幾處日誌與錯誤訊息沒把密碼、Bearer token 完整遮住的情況，以及 MCP 伺服器換新版握手後、連接器最長一天列不出工具的問題。", "analogy": "像治具多加了兩道防呆：一道是工單排隊時螢幕顯示「第 2 張／共 5 張」，一道是把「誤按就整台格式化」的按鈕加上護蓋。", "why": "你這台是 Windows＋PowerShell，刪除保護那條直接相關；「背景工作等核准卻顯示完成」也可能讓排程任務（像這份 AI 情報的發布）看起來跑完、其實卡在等你按允許。", "source_name": "GitHub：anthropics/claude-code Releases（v2.1.286）", "source_url": "https://github.com/anthropics/claude-code/releases/tag/v2.1.286"}, {"tag": "政策", "title": "美國 FTC 對 OpenAI、Anthropic、METR 等 AI 實驗室展開消費者保護調查，幾週內可能發出要求高層作證的調查令", "body": "《紐約郵報》9/30 引述政府消息報導、FTC 主席 Ferguson 隨後證實：FTC 正調查 OpenAI、Anthropic、評測機構 METR 等前沿 AI 實驗室，是否有違反《FTC 法》的不公平或欺騙行為，焦點是 agent 出事的案例和各家對安全性的說法。接下來預計發出「民事調查令（Civil Investigative Demand）」，性質接近傳票，可以要求交文件、要求高層出面說明。時間點很微妙：前一天這些公司才在白宮簽了自願的超級智慧協議（第 14 期），Ferguson 還提醒業者別推動「只有自己做得到的規則」來排擠對手。", "why": "第 14 期的白宮協議沒有罰則，這次的 FTC 調查則是用既有法律去管——後續怎麼走，會決定 agent 出事時責任算誰的，也會影響各家工具未來的權限設計會不會更保守。", "source_name": "The Decoder（引述《紐約郵報》，FTC 主席證實）", "source_url": "https://the-decoder.com/ftc-launches-sweeping-probe-into-openai-anthropic-and-other-ai-labs-over-consumer-protection-concerns/"}, {"tag": "研究", "title": "Anthropic 研究：美國 74% 的體力工作任務，機器人技術上做得到，但划算的只有 0.3%", "body": "Anthropic 用 Claude 對照美國職業資料庫 O*NET 的每項任務，搜尋現有機器人展示與商用部署，評估「技術上能不能做」。結果 74% 的體力任務技術上可行（大多要在專用或結構化的場地，雜亂環境只有 2%），但把機器人成本算進去、比人工便宜的只有 0.3%。如果機器人價格照 1990 年代以來每年約 3% 的速度下降，要約 40 年才會有 10% 的任務划算；目前最容易被取代的前十名大多是駕駛類職業。研究自己也列了限制：任務描述很簡略、評分有主觀判斷，也沒算法規與導入摩擦。", "analogy": "像做新產品的 DFM 評估：「做得出來」跟「量產划算」是兩回事——樣品能跑，不代表 BOM 成本壓得進售價。", "why": "你做硬體產品，最清楚 BOM 成本跟良率才是量產的門檻；這份研究把同樣的邏輯套到機器人上，提醒「AI 會取代工作」的新聞要先問：技術可行，還是成本已經划算？", "source_name": "Anthropic Research：What work can robots do?", "source_url": "https://www.anthropic.com/research/what-work-can-robots-do"}], "industry": [{"text": "語音 AI 公司 ElevenLabs 透過 3 億美元的員工股份出售，估值來到 220 億美元，是今年 2 月的兩倍；旗下語音 agent 每週處理超過 1,500 萬通對話，是 2 月的三倍。", "source_name": "ElevenLabs 官方部落格", "source_url": "https://elevenlabs.io/blog/tender-22bn"}, {"text": "Claude for Government 結束 7 月以來的公測、正式開放給美國聯邦與州政府機關，跑在 FedRAMP High（美國政府處理敏感但非機密資料的最高雲端資安等級）認證的環境裡。", "source_name": "Claude 官方部落格", "source_url": "https://claude.com/blog/claude-for-government-is-now-generally-available"}, {"text": "澳洲參議院 AI 調查原訂今天（10/1）請 Altman、Amodei 出席，兩家都表示不會到場；Anthropic 以邀請太晚為由要求改期，公司代表預計參加下週另一場聽證。", "source_name": "Reuters（經 Yahoo News 轉載）", "source_url": "https://www.yahoo.com/news/world/articles/anthropic-openai-not-attend-australian-151231643.html"}], "term": {"zh": "自報分數與第三方評測", "en": "Self-reported vs Independent Benchmarks", "explain": "AI 公司發表新模型時附的跑分表，是自己挑基準、自己跑、自己設定參數的「自報分數（Self-reported）」；Artificial Analysis、LMArena 這類「第三方評測（Independent Benchmark）」則用同一套題目和設定去測所有模型。兩者常有落差：自報表通常只列對自己有利的項目，還可能開到最高推論努力等級；第三方分數比較能橫向比較，但也只代表它那套題目。讀的時候看三件事：一是同一個指標上，第三方跟自報差多少；二是分數用了多少 token、多少錢換來的；三是那個基準在測什麼，例如「幻覺率」低，不等於「答對率」高，Argon 就是幻覺率最低、答對率卻輸給 Astra 的例子。", "analogy": "像元件 datasheet 的 typical 值 vs 你自己或第三方實驗室的量測報告：原廠會挑最漂亮的條件標規格，要放進量產設計，還是得看在你的條件下實際量到多少。", "why": "以後每週都會有「新模型在 X 基準登頂」的新聞。先分清楚是自報還是第三方、再看每任務成本，就不會因為一張跑分表就急著換工具。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  document.title = "每日 AI 情報 #" + (D.day||"") + " · " + (D.date||"");
  document.getElementById("term-file").textContent = "ai-daily.log — day " + (D.day||"") + " (" + (D.date||"") + ")";
  document.getElementById("h-title").textContent = "AI 每日速報 #" + (D.day||"");
  document.getElementById("h-date").textContent = (D.date||"") + (D.weekday?("（"+D.weekday+"）"):"");
  document.getElementById("headline").textContent = D.headline||"";

  document.getElementById("top").innerHTML = (D.top||[]).map(t=>`
    <div class="card">
      ${t.tag?`<span class="chip">${esc(t.tag)}</span>`:""}
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.body)}</p>
      ${t.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(t.analogy)}</div>`:""}
      ${t.why?`<div class="why"><b>為什麼你該知道：</b>${esc(t.why)}</div>`:""}
      ${t.source_url?`<div class="src">來源：<a href="${esc(t.source_url)}" target="_blank" rel="noopener">${esc(t.source_name||t.source_url)}</a></div>`:""}
    </div>`).join("");

  document.getElementById("industry").innerHTML = (D.industry||[]).map(i=>`
    <li>${esc(i.text)} ${i.source_url?`· <a href="${esc(i.source_url)}" target="_blank" rel="noopener">${esc(i.source_name||"來源")}</a>`:""}</li>`).join("");

  const tm = D.term||{};
  document.getElementById("term").innerHTML = `
    <div class="term">
      <div class="name">${esc(tm.zh||"")}<span class="en">${esc(tm.en||"")}</span></div>
      <p>${esc(tm.explain||"")}</p>
      ${tm.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(tm.analogy)}</div>`:""}
      ${tm.why?`<p class="why"><b>為什麼重要：</b>${esc(tm.why)}</p>`:""}
    </div>`;

  document.getElementById("footer").innerHTML =
    "每天自動更新 · 由 Claude 依當日公開新聞整理，僅供快速掌握趨勢，重要決策請點來源查證<br>#" +
    (D.day||"") + " · " + (D.date||"");
</script>
