N。", "analogy": "像把產線的判斷站換成「三取二表決電路」——原本是用來提高可靠度的冗餘設計，現在被拿來讓惡意程式不需要人在旁邊也能自己做決定。關鍵是它的選項被限制在四個按鈕裡：人蓋好了盒子，AI 只負責在盒子裡選。", "why": "這跟你在用的 agent 架構是同一套思路（把大決策空間收斂成少數固定動作、讓模型選），只是被反過來用。防守建議也值得記：看行為組合，不是只擋網域。", "source_name": "Cisco Talos 官方部落格", "source_url": "https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/"}, {"tag": "政策", "title": "安理會 AI 專場落幕：業者喊國際標準，川普在川習會前先說「維持現狀」", "body": "昨天（9/23）的聯合國安理會 AI 專場，Altman 與 Amodei 分別發言、都主張需要國際標準與合作；Amodei 具體提了三件事：窄範圍的全球協議（例如禁止用 AI 製造生物武器）、讓各國能互相查核承諾的評測與驗證機制、以及共同的 AI 測試標準加上「AI 資安事件通報」系統。會議本來就不預期產出書面協議。今天川普與習近平在華府開峰會，AI 在議程上，但川普事先表示不預期推動任何 AI 護欄，說超級智慧「我想讓它維持現狀，中國也是這個立場」；比較務實的進展是美方財長 Bessent 提議建立雙邊的 AI 重大事故通報機制。", "why": "國際「煞車」這週又停在口頭上；真正可能落地的反而是很工程的東西——事故通報與測試標準。這類機制一旦成形，最後會變成出口與合規文件上的欄位。", "source_name": "CNN Business", "source_url": "https://www.cnn.com/2026/09/23/tech/altman-amodei-ai-safety-un-security-council"}], "industry": [{"text": "AMD 市值 9/21 突破 1 兆美元，成為繼 Nvidia、Broadcom、Micron 之後第四家兆元晶片公司；第二季資料中心營收 67 億美元、年增 107%，蘇姿丰點名 Helios 機櫃（72 顆 Instinct 加速器＋18 顆 EPYC CPU）需求強。", "source_name": "Build Fast with AI", "source_url": "https://blog.buildfastwithai.com/ai-news-today-september-23-2026"}, {"text": "上週才被 Shopify 接上代理結帳的 Meta AI 助理 Muse，Mac 版被資安研究者 Objective-See 揭露一個可竊取登入 token 的零時差漏洞；Meta 也承認 Muse「大量參考」開源專案 OpenClaw（兩者的 SOUL.md 設定檔一模一樣）。", "source_name": "Build Fast with AI", "source_url": "https://blog.buildfastwithai.com/ai-news-today-september-23-2026"}, {"text": "幫前沿實驗室做「人工驗證訓練資料」的 Snorkel AI 募得 3.5 億美元、估值 35 億（年經常性營收約 3.5 億、一年成長約 17 倍）；同類公司 micro1 估值也衝到 40 億——模型越強，高品質人工標註反而越值錢。", "source_name": "Build Fast with AI", "source_url": "https://blog.buildfastwithai.com/ai-news-today-september-23-2026"}], "term": {"zh": "提示詞快取", "en": "Prompt Caching", "explain": "每次你跟模型對話，其實都會把整段前文（系統指示、工具清單、CLAUDE.md、之前的對話）重新送一次。提示詞快取就是讓伺服器記住「這一大段開頭跟上次一模一樣」，直接沿用上次算好的中間結果，不必重算。命中快取的部分按折扣價計費、回應也更快——Opus 5.5 的快取讀取是每百萬 token 0.20 美元，只有一般輸入 4 美元的二十分之一。但有個硬條件：前綴必須逐字相同，開頭只要動了一個字（例如工具清單順序變了、某個時間戳變了）， <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>

    <div id="term"></div>

  </div>
</div>
<script>
  const D = {"day": 8, "date": "2026-09-24", "weekday": "週四", "headline": "Opus 5.5 上架才 90 分鐘，OpenAI 就把 GPT-6 Sol 砍到半價應戰——價格戰開打，但能力幾乎沒動；同一時間，聯合國安理會聽完 AI 業者喊「要國際標準」，今天的川習會川普卻先說「超級智慧就讓它維持現狀」。", "top": [{"tag": "工具", "title": "Claude Code 本週修掉 auto mode 一個會「不問就遞迴刪檔」的洞，還補了幾個讓快取失效的漏", "body": "9/23 的 2.1.281 版修正：在 auto mode 下，如果 rm 遞迴刪除的目標是「另一個指令的輸出結果」（command substitution，例如 rm -rf $(某指令)），原本會不經詢問直接執行，現在會擋下來。同一版也修了「MCP 伺服器對話中途斷線、或 resume 時還沒連上，提示詞快取就整個失效」的問題，以及 proxy 把回應截斷卻顯示成完整回應、沒有任何警告。前一版 2.1.280 把 Opus 5.5 設為預設 Opus，並新增 CLAUDE_CODE_MAX_MCP_DESCRIPTION_LENGTH 限制 MCP 工具描述長度（預設 2,048 字元）；另外 npm 來源的外掛改用 --ignore-scripts 下載並驗證完整性，堵住安裝時偷跑腳本的路。", "analogy": "像設備商發了一份韌體勘誤：自動模式下有一種特定按鍵組合會跳過安全確認直接執行刪除，這版把連鎖保護補上了。平常用不到，但一撞到就是整批報廢。", "why": "你的排程（每日網頁、週備份）大量跑在自動模式、又掛了一堆 MCP。前者是安全面的修正，後者直接關係到你的帳單——快取一失效，同一段脈絡就得用全價重算。", "source_name": "Claude Code 官方 Changelog", "source_url": "https://code.claude.com/docs/en/changelog"}, {"tag": "新模型", "title": "OpenAI 在 Opus 5.5 發布 90 分鐘後推出 GPT-6 Sol／Luna，價格直接砍半", "body": "9/22 Anthropic 先發 Opus 5.5（每百萬 token 輸入 4／輸出 20 美元），大約 90 分鐘後 OpenAI 推出 GPT-6 Sol（2／10 美元）與輕量版 Luna（0.10／0.50 美元），都比上一代 GPT-5.6 便宜一半，而且官方說沒有期限。OpenAI 把降價歸功於快取與推論效率的改進，快取輸入打一折。但第三方評測 Artificial Analysis 的綜合智力指數顯示 Sol 只從 47 升到 48、Luna 沒變，部分知識工作評測還退步——這一代賣的是「每件任務的成本」，不是變聰明。", "analogy": "像兩家晶片廠同一天各自發表新製程：一家說效能更好、價格小降，另一家效能幾乎持平但直接半價。買家要問的已經不是「誰最強」，而是「我這個應用需要哪個規格等級、每顆成本多少」。", "why": "價格戰對你是好消息，但看降價公告時要像看 datasheet 一樣看測試條件：同一個努力等級、同一種任務下比，才比得出真正的每件成本。", "source_name": "The Decoder", "source_url": "https://the-decoder.com/openais-gpt-6-sol-and-luna-cut-prices-in-half-but-barely-move-the-needle-on-performance/"}, {"tag": "研究", "title": "Cisco Talos 揭露首個「AI 自己下決策」的惡意程式：四個模型投票決定下一步", "body": "資安團隊 Cisco Talos 在 9/22 公布一支叫 CLOSEDQUORUM 的 Windows 惡意程式。它被植入後不等駭客下指令，而是把「下一步做什麼」交給 DeepSeek、Qwen、Mistral、Gemini 四個商用模型各自回答，用多數決選出動作，平手由 DeepSeek 決定；可選的動作只有四種：竊取、注入、常駐、橫向移動，目標是帳密、加密錢包與瀏覽器密碼。Talos 強調目前沒有在野外（實際受害環境）發現它被部署，公開樣本裡的 API 金鑰都是假的；同時開源了追蹤 AI 惡意程式的工具包 CAIRN。", "analogy": "像把產線的判斷站換成「三取二表決電路」——原本是用來提高可靠度的冗餘設計，現在被拿來讓惡意程式不需要人在旁邊也能自己做決定。關鍵是它的選項被限制在四個按鈕裡：人蓋好了盒子，AI 只負責在盒子裡選。", "why": "這跟你在用的 agent 架構是同一套思路（把大決策空間收斂成少數固定動作、讓模型選），只是被反過來用。防守建議也值得記：看行為組合，不是只擋網域。", "source_name": "Cisco Talos 官方部落格", "source_url": "https://blog.talosintelligence.com/the-closed-quorum-inside-the-first-reported-autonomous-ai-c2-implant/"}, {"tag": "政策", "title": "安理會 AI 專場落幕：業者喊國際標準，川普在川習會前先說「維持現狀」", "body": "昨天（9/23）的聯合國安理會 AI 專場，Altman 與 Amodei 分別發言、都主張需要國際標準與合作；Amodei 具體提了三件事：窄範圍的全球協議（例如禁止用 AI 製造生物武器）、讓各國能互相查核承諾的評測與驗證機制、以及共同的 AI 測試標準加上「AI 資安事件通報」系統。會議本來就不預期產出書面協議。今天川普與習近平在華府開峰會，AI 在議程上，但川普事先表示不預期推動任何 AI 護欄，說超級智慧「我想讓它維持現狀，中國也是這個立場」；比較務實的進展是美方財長 Bessent 提議建立雙邊的 AI 重大事故通報機制。", "why": "國際「煞車」這週又停在口頭上；真正可能落地的反而是很工程的東西——事故通報與測試標準。這類機制一旦成形，最後會變成出口與合規文件上的欄位。", "source_name": "CNN Business", "source_url": "https://www.cnn.com/2026/09/23/tech/altman-amodei-ai-safety-un-security-council"}], "industry": [{"text": "AMD 市值 9/21 突破 1 兆美元，成為繼 Nvidia、Broadcom、Micron 之後第四家兆元晶片公司；第二季資料中心營收 67 億美元、年增 107%，蘇姿丰點名 Helios 機櫃（72 顆 Instinct 加速器＋18 顆 EPYC CPU）需求強。", "source_name": "Build Fast with AI", "source_url": "https://blog.buildfastwithai.com/ai-news-today-september-23-2026"}, {"text": "上週才被 Shopify 接上代理結帳的 Meta AI 助理 Muse，Mac 版被資安研究者 Objective-See 揭露一個可竊取登入 token 的零時差漏洞；Meta 也承認 Muse「大量參考」開源專案 OpenClaw（兩者的 SOUL.md 設定檔一模一樣）。", "source_name": "Build Fast with AI", "source_url": "https://blog.buildfastwithai.com/ai-news-today-september-23-2026"}, {"text": "幫前沿實驗室做「人工驗證訓練資料」的 Snorkel AI 募得 3.5 億美元、估值 35 億（年經常性營收約 3.5 億、一年成長約 17 倍）；同類公司 micro1 估值也衝到 40 億——模型越強，高品質人工標註反而越值錢。", "source_name": "Build Fast with AI", "source_url": "https://blog.buildfastwithai.com/ai-news-today-september-23-2026"}], "term": {"zh": "提示詞快取", "en": "Prompt Caching", "explain": "每次你跟模型對話，其實都會把整段前文（系統指示、工具清單、CLAUDE.md、之前的對話）重新送一次。提示詞快取就是讓伺服器記住「這一大段開頭跟上次一模一樣」，直接沿用上次算好的中間結果，不必重算。命中快取的部分按折扣價計費、回應也更快——Opus 5.5 的快取讀取是每百萬 token 0.20 美元，只有一般輸入 4 美元的二十分之一。但有個硬條件：前綴必須逐字相同，開頭只要動了一個字（例如工具清單順序變了、某個時間戳變了），後面全部失效、全價重算。", "analogy": "像 SMT 產線換線：同一款板子連續生產，鋼板、料架、程式都不用動，直接接著打；只要換了一顆料的站位，就得重新架線、重新試產。快取失效就是那次「重新架線」的成本。", "why": "這解釋了為什麼 Claude Code 的更新日誌裡一直出現「修正某某情況導致快取失效」——MCP 斷線、工具清單重建、記憶檔的時間註記變動，都會讓你付全價。你在 CLAUDE.md 或 skill 開頭放會每天變動的內容，也會有同樣效果：穩定的東西放前面、變動的東西放後面。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  document.title = "每日 AI 情報 #" + (D.day||"") + " · " + (D.date||"");
  document.getElementById("term-file").textContent = "ai-daily.log — day " + (D.day||"") + " (" + (D.date||"") + ")";
  document.getElementById("h-title").textContent = "AI 每日速報 #" + (D.day||"");
  document.getElementById("h-date").textContent = (D.date||"") + (D.weekday?("（"+D.weekday+"）"):"");
  document.getElementById("headline").textContent = D.headline||"";

  document.getElementById("top").innerHTML = (D.top||[]).map(t=>`
    <div class="card">
      ${t.tag?`<span class="chip">${esc(t.tag)}</span>`:""}
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.body)}</p>
      ${t.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(t.analogy)}</div>`:""}
      ${t.why?`<div class="why"><b>為什麼你該知道：</b>${esc(t.why)}</div>`:""}
      ${t.source_url?`<div class="src">來源：<a href="${esc(t.source_url)}" target="_blank" rel="noopener">${esc(t.source_name||t.source_url)}</a></div>`:""}
    </div>`).join("");

  document.getElementById("industry").innerHTML = (D.industry||[]).map(i=>`
    <li>${esc(i.text)} ${i.source_url?`· <a href="${esc(i.source_url)}" target="_blank" rel="noopener">${esc(i.source_name||"來源")}</a>`:""}</li>`).join("");

  const tm = D.term||{};
  document.getElementById("term").innerHTML = `
    <div class="term">
      <div class="name">${esc(tm.zh||"")}<span class="en">${esc(tm.en||"")}</span></div>
      <p>${esc(tm.explain||"")}</p>
      ${tm.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(tm.analogy)}</div>`:""}
      ${tm.why?`<p class="why"><b>為什麼重要：</b>${esc(tm.why)}</p>`:""}
    </div>`;

  document.getElementById("footer").innerHTML =
    "每天自動更新 · 由 Claude 依當日公開新聞整理，僅供快速掌握趨勢，重要決策請點來源查證<br>#" +
    (D.day||"") + " · " + (D.date||"");
</script>
