  .term-bar .dot.g{background:#27c93f}

  header{padding:4px 2px 18px}

  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>

  const D = {"day": 44, "date": "2026-11-16", "weekday": "週一", "headline": "OpenAI 推出 ChatGPT Wallet：agent 替你付款時只拿到發卡組織給的「替身卡號」，每一筆都要你刷臉核准；OpenAI 同時公布醫療 computer-use agent 的評估與企業實際用例；本週兩件大事接連登場——Nvidia 11/17 財報、Anthropic 預計 11/18 定價上市。", "top": [{"tag": "工具", "title": "ChatGPT Wallet：agent 可以替你結帳，但只拿得到「替身卡號」，每筆都要你本人刷臉核准", "body": "OpenAI 11/13 推出 ChatGPT Wallet，跟 American Express、Mastercard、Visa 合作，先開放給美國 ChatGPT Pro 訂閱者（18 歲以上、美國發行的卡），在個人 agent「dots」裡使用。流程是：卡片只綁一次；agent 找好商品後，你看過商品、總額、用哪張卡，再用 Face ID 或指紋核准；核准後由發卡組織產生一組替身卡號（payment token，有自己的卡號、安全碼、到期日），商家照原本的結帳系統收款，agent 和商家都看不到你真正的卡號。每次核准都會留下一筆「你授權它買了什麼」的紀錄。OpenAI 說未來想讓使用者預先設定額度、品類、期間後直接放行，但目前還沒有，每筆都要人核准；也坦承有些網站的防詐系統會把 agent 下的單誤判成詐騙而拒絕。", "analogy": "像產線給外包搬運商一張「只能開今天這一批貨、用完就失效」的臨時門禁卡，而不是把總廠的主鑰匙交出去；每開一次門還要廠長按指紋放行，警衛室同時記一筆誰在幾點開了哪扇門。", "why": "上週才看到 Cursor 事件裡「貼在對話裡的金鑰被一路撿走」，這次是同一個問題的正面解法：不要把真正的憑證交給 agent，改給「範圍小、可撤銷、有紀錄」的替身。你以後設計任何讓 agent 碰帳號或金鑰的流程，都可以拿這個架構當參考。", "source_name": "The Paypers", "source_url": "https://thepaypers.com/payments/news/openai-launches-chatgpt-wallet-for-agentic-payments-in-the-us"}, {"tag": "產業", "title": "OpenAI 推醫療用 computer-use agent：自家評估 325 項任務 99% 評為臨床安全，CVS 用它一個週末清完積壓數月的文件", "body": "OpenAI 11/16 在美國 HLTH 大會公布醫療用的「電腦操作代理（computer-use agent）」——讓 AI 像人一樣看螢幕、移游標、點按鈕，去操作沒有 API 可接的電子病歷系統與保險公司網站。OpenAI 自家評估：GPT-6 Astra 在臨床收件匣類任務中，325 項經審查的任務有 99% 被評為臨床安全，646 次評分中 93% 被醫師評為「非常／極有幫助」；剩下 1% 的問題主要是「沒等該有的簽核就先動作」。已上線的例子：CVS Health 一個生產流程的 agent 一個週末清掉積壓數月的文件寄送，另一個每天處理數萬件會診的系統步驟。可透過 ChatGPT for Healthcare、ChatGPT for Clinicians 與 API 使用，同時新增 20 多個醫療外掛。", "analogy": "就像老產線的機台沒有通訊介面、只有操作面板，與其等廠商出 SDK，不如裝一支機械手臂直接去按面板上的按鈕——慢一點、但任何舊機台都能接。", "why": "數字全是 OpenAI 自報，而且失敗模式正好是「跳過簽核」——跟你在 Claude Code 裡設權限、要它先問再做是同一件事。對硬體產品來說，computer-use 也是讓 AI 操作沒有 API 的舊工具（燒錄軟體、量測儀器 GUI）的一條路。", "source_name": "Fierce Healthcare", "source_url": "https://www.fiercehealthcare.com/ai-and-machine-learning/hlth26-cvs-health-cigna-and-ambience-collaborating-openai-test-computer-use"}, {"tag": "產業", "title": "本週兩場大考：Nvidia 11/17 交出黃仁勳辭職後第一份財報，Anthropic 預計 11/18 定價、11/19 掛牌", "body": "Nvidia 將在美西時間 11/17 下午約 1:20 公布截至 10/25 的第三季財報、2:00 開法說會，由財務長 Colette Kress 提供書面說明——她在黃仁勳 11/12 辭職後兼任暫代執行長，這是換人後第一次面對市場；週末另有媒體報導黃仁勳可能回任，屬未證實傳聞。Anthropic 則已啟動上市路演，官方公告發行 8.25 億股、每股 70–78 美元、代號 ANT，媒體報導預計 11/18 定價、11/19 在 Nasdaq 開始交易。", "why": "這兩件事會直接影響接下來 AI 算力的供給與定價：Nvidia 的訂單與出貨展望決定 GPU 還缺不缺；Anthropic 上市後每季要公開財報，Claude 的成本與定價會攤在陽光下，你付的訂閱費和 API 價格長期走向也會比較看得清楚。", "source_name": "NVIDIA 新聞室", "source_url": "https://nvidianews.nvidia.com/news/nvidia-sets-conference-call-for-third-quarter-financial-results-6928873"}], "industry": [{"text": "OpenAI 11/15 開了科學部落格，第一篇講物理學家用 GPT-6 Astra 把「在時空格點上定義標準模型」的構想推成一份詳細證明——官方定位是一個候選定義，不是已解決的物理問題。", "source_name": "OpenAI", "source_url": "https://openai.com/index/step-toward-defining-the-standard-model"}, {"text": "OpenAI 11/16 宣布與 LVMH 媒體部門合作，用 AI 支援新聞編輯並讓旗下刊物內容可在 ChatGPT 中取得；同日與英國 King's Trust 推出 100 萬英鎊計畫，幫最多 2.5 萬名年輕人學實用 AI 技能。", "source_name": "OpenAI", "source_url": "https://openai.com/index/lvmh-media-division-partnership"}], "term": {"zh": "委派授權", "en": "Delegated Authorization", "explain": "讓 agent「代替你做事」時，不是把你的身分整個交出去，而是發給它一張權限被切小的通行證：只能做哪幾件事、上限多少、多久失效、可以隨時撤銷，而且每次使用都留紀錄。ChatGPT Wallet 的替身卡號、OAuth 登入時「只允許讀取信箱、不允許寄信」的勾選畫面、Claude Code 的權限規則，都是同一個概念在不同地方的樣子。重點有兩個：範圍（scope）要小到剛好夠用；憑證要跟你的本尊分開，出事時只要作廢那張通行證，不用換掉整套帳號密碼。", "analogy": "像工廠給外包工程師的臨時識別證：只刷得開 3 號線那兩道門、今天下班就失效、每刷一次警衛室都有紀錄；萬一證件掉了，作廢這張就好，不用把全廠門鎖換掉。", "why": "你學過的「最小權限原則」是設計心法，委派授權是它落地到 agent 身上的做法。agent 能做的事越多（付款、寄信、改檔案），越需要這層隔離——上週 Cursor 事件就是金鑰以本尊形式出現在對話紀錄裡，才會被一路串起來。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  document.title = "每日 AI 情報 #" + (D.day||"") + " · " + (D.date||"");
  document.getElementById("term-file").textContent = "ai-daily.log — day " + (D.day||"") + " (" + (D.date||"") + ")";
  document.getElementById("h-title").textContent = "AI 每日速報 #" + (D.day||"");
  document.getElementById("h-date").textContent = (D.date||"") + (D.weekday?("（"+D.weekday+"）"):"");
  document.getElementById("headline").textContent = D.headline||"";

  document.getElementById("top").innerHTML = (D.top||[]).map(t=>`
    <div class="card">
      ${t.tag?`<span class="chip">${esc(t.tag)}</span>`:""}
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.body)}</p>
      ${t.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(t.analogy)}</div>`:""}
      ${t.why?`<div class="why"><b>為什麼你該知道：</b>${esc(t.why)}</div>`:""}
      ${t.source_url?`<div class="src">來源：<a href="${esc(t.source_url)}" target="_blank" rel="noopener">${esc(t.source_name||t.source_url)}</a></div>`:""}
    </div>`).join("");

  document.getElementById("industry").innerHTML = (D.industry||[]).map(i=>`
    <li>${esc(i.text)} ${i.source_url?`· <a href="${esc(i.source_url)}" target="_blank" rel="noopener">${esc(i.source_name||"來源")}</a>`:""}</li>`).join("");

  const tm = D.term||{};
  document.getElementById("term").innerHTML = `
    <div class="term">
      <div class="name">${esc(tm.zh||"")}<span class="en">${esc(tm.en||"")}</span></div>
      <p>${esc(tm.explain||"")}</p>
      ${tm.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(tm.analogy)}</div>`:""}
      ${tm.why?`<p class="why"><b>為什麼重要：</b>${esc(tm.why)}</p>`:""}
    </div>`;

  document.getElementById("footer").innerHTML =
    "每天自動更新 · 由 Claude 依當日公開新聞整理，僅供快速掌握趨勢，重要決策請點來源查證<br>#" +
    (D.day||"") + " · " + (D.date||"");
</script>
