<!--
  每日 AI 情報 網頁範本（終端機／hacker 風，強制深色）
  build_ai_page.py 會把 content.json 的內容以 JSON 塞進 {"day": 9, "date": "2026-09-25", "weekday": "週五", "headline": "Anthropic 讓 950 個 Claude agent 花 21 小時翻遍 20 萬個酵素，找到一套長得像 CRISPR、但功能還不知道的新系統；同一天它又簽下 116 億美元的算力合約，這次買的是 CPU 不是 GPU——agent 跑得越多，吃的硬體也跟著變了。", "top": [{"tag": "研究", "title": "950 個 Claude agent、21 小時、2.1 億 token：Anthropic 生科團隊找到一套新的酵素系統", "body": "Anthropic 公布今年春天成立的生命科學研究團隊第一個成果：讓 950 個 Claude agent 在 21 小時內從序列資料庫收集 20 多萬個反轉錄酶（reverse transcriptase，把 RNA 抄回 DNA 的酵素），篩出約 3,500 個候選系統、再收斂到 20 個寫成詳細報告，其中一個被命名為 ART（array-associated reverse transcriptases）：反轉錄酶＋一個功能未知的夥伴蛋白＋一串排列整齊、結構像 CRISPR 的 DNA 重複序列。人類科學家負責下題目、審候選報告、決定哪些值得做實驗，濕實驗全部由人做；初步實驗確認那串重複序列會被表現成一段段短 RNA。Anthropic 自己強調：ART 到底有什麼功能還不知道，也還沒證明能做基因編輯，反轉錄酶本身先前就有人發現過，新的是「這三樣組成一套系統」這個認定。", "analogy": "像產線上的全檢站：950 台 AOI 同時掃 20 萬片板子，機器負責「大量看、先淘汰」，最後剩 20 片可疑品送到品保工程師桌上，由人決定哪幾片要切片分析。機器省下的是看的時間，判斷跟實驗還是人在做。", "why": "這是目前公開過規模最大的一次「多 agent 分頭找、層層收斂、最後人把關」的實戰紀錄，架構跟你在用的 subagent 分工是同一套思路，只是放大到 950 倍；也順便示範了怎麼誠實地寫研究結果——做到哪、沒做到哪都寫清楚。", "source_name": "Anthropic 官方公告", "source_url": "https://www.anthropic.com/news/claude-discovers-novel-enzyme-system"}, {"tag": "基礎設施", "title": "Anthropic 跟 Akamai 簽 7 年 116 億美元合約，買的是分散式 CPU 算力", "body": "CDN 起家的 Akamai 9/24 宣布與 Anthropic 簽下 7 年、116 億美元的合約，最多可再擴充 90 億、合計約 200 億美元。公告寫明是支援 Anthropic「快速成長的 CPU 工作負載」，用的是 Akamai 分布在全球數千個節點的雲端。Anthropic 同時拿到最多 5% 的 Akamai 認股權（先給約 2%，擴約再給 3%）。Akamai 為此今年要多花約 17 億美元資本支出，主要是先搶購記憶體等關鍵零件。", "analogy": "過去幾年大家搶的是 GPU，像搶最貴的那台打件機；但 agent 在跑的時候，大量時間花在呼叫工具、跑程式、開網頁、搬資料——這些是周邊的測試站、搬運與倉儲，用 CPU 就夠，而且要靠近使用者。這筆合約就是在補那一段產能。", "why": "你每次看到 Claude Code 在跑 Bash、讀檔、開瀏覽器，那一段就是 CPU 工作。算力需求從「只缺 GPU」擴大到 CPU 跟記憶體，連 CDN 業者都要先囤記憶體——做硬體的你排 BOM 時，記憶體類零件的交期與報價值得多看一眼。", "source_name": "Akamai 官方新聞稿", "source_url": "https://www.globenewswire.com/news-release/2026/09/24/3368729/0/en/akamai-announces-11-6-billion-multi-year-agreement-with-anthropic-to-support-growing-demand.html"}, {"tag": "工具", "title": "Amazon 把賣家後台開放給外部 AI agent，第一個接上的是 Claude", "body": "Amazon 在 9/23 的賣家大會 Accelerate 宣布：Seller Central 的資料與功能開放給外部 AI agent，先推出美國站測試版外掛，讓賣家直接在 Claude（或 Amazon 自家的 Quick）裡查庫存、看銷售分析、改商品頁跟價格，不用登入後台。連接約 60 秒、不用寫程式；賣家自己選要開放哪些資料，而且每個動作執行前都要賣家核准。Amazon 說約九成賣家已經在用外部 AI 處理部分營運。有意思的對照：Amazon 前陣子才把 Meta 的購物 agent Muse 擋在門外——賣家端的 agent 歡迎，買家端的 agent 暫時不行。", "why": "上週 Shopify 開放的是「買方 agent 來店裡結帳」，這週 Amazon 開放的是「賣方的後台被接進 agent」。公司的通路雖然不在 Amazon，但這種「選要開放哪些資料＋每個動作都要人按確認」的設計，就是之後把 ERP 或電商後台接給 AI 時該照抄的安全範本。", "source_name": "GeekWire", "source_url": "https://www.geekwire.com/2026/amazon-opens-its-seller-tools-to-outside-ai-agents-starting-with-anthropics-claude/"}, {"tag": "工具", "title": "Claude Code 2.1.282：auto mode 的安全判斷改由伺服器端預設處理，還修了續接對話會「失憶」", "body": "9/24 的 2.1.282 版有幾個跟日常使用直接相關的變動：直接連 Anthropic API 時，auto mode 預設改用伺服器端的分類器來判斷指令安不安全（可用 CLAUDE_CODE_AUTO_MODE_SERVER=0 關掉）；修正續接或恢復的對話會把先前訊息以「改過的樣子」重送、導致模型的推理內容遺失；修正 Windows 上 Bash／PowerShell 因暫存檔太大撞到磁碟配額時，只顯示「Exit code 1」而看不出原因；設定檔裡帶 :* 的 Bash 權限規則原本會被略過，現在會生效。另外新增 maxProseWidth 設定，讓寬螢幕上的文字不要拉得太長。", "analogy": "像把產線的安全聯鎖判斷從每台機台自己的 PLC，改成由中控系統統一判斷：規則更新不用每台重刷韌體，但判斷的依據也就不在你手邊了。", "why": "你的排程幾乎都跑在 auto mode、又是 Windows 環境，這一版同時動到「誰來決定這個指令能不能跑」跟「Windows 上的錯誤訊息看不看得懂」。之後如果發現 auto mode 放行或攔截的行為跟以前不一樣，先想到這一版。", "source_name": "Claude Code 官方 Changelog", "source_url": "https://code.claude.com/docs/en/changelog"}], "industry": [{"text": "川習會 9/24 落幕：美中貿易休戰延長到 2027 年 1 月 10 日，但 AI 方面沒有簽下任何協議，雙邊 AI 熱線仍在規劃階段；川普維持輕管制立場，習近平則強調要管控風險、「確保 AI 始終在人類控制之下」。", "source_name": "Saxo Bank 分析", "source_url": "https://www.home.saxo/en-ch/content/articles/macro/trumpxi-summit-stability-not-a-breakthrough-25092026"}, {"text": "DeepSeek 年化營收衝到 10 億美元，幾個月前還不到 5 億；上個月 API 漲價 2.3–4.5 倍客戶沒跑掉，正準備在上海科創板掛牌募資——「最便宜的模型」也開始漲價了。", "source_name": "Tech Startups", "source_url": "https://techstartups.com/2026/09/24/deepseek-hits-1-billion-revenue-run-rate-as-chinese-ai-startup-targets-7-5-billion-raise/"}, {"text": "給醫師用的 AI 醫學文獻查詢服務 OpenEvidence 募得 2.5 億美元、估值 150 億（1 月時是 120 億），年化營收約 3 億美元——垂直領域的 AI 搜尋也跑出規模了。", "source_name": "AI Weekly", "source_url": "https://aiweekly.co/ai-news-today"}], "term": {"zh": "編排者–工作者模式", "en": "Orchestrator–Workers", "explain": "一種 agent 架構：一個「編排者」負責把大任務拆成很多小任務、分派出去，一群「工作者」各自平行處理一小塊，做完把結果交回來，再由編排者彙整、篩選、決定下一步。它適合事先不知道要拆成幾份、每份要做什麼的任務——拆法由編排者看情況決定，不是寫死的流程。今天 Anthropic 用 950 個 agent 分頭掃 20 萬個酵素、層層收斂到 20 個候選，就是這種分工方式的大規模版本。代價也很明確：工作者越多、token 燒越多（那次用了 2.1 億 token），而且彙整那一步如果沒篩好，錯誤會被放大。", "analogy": "像生管排工單：生管（編排者）拿到一張大訂單，看料況跟機台狀態拆成幾十張工單派給各條線（工作者），各線做完回報，生管再決定哪批要重工、哪批可以出貨。工單拆得好不好、回報的格式清不清楚，決定了整張訂單的品質。", "why": "你平常叫 Claude 派 subagent 去掃檔、審查、再彙整，就是在當這個模式的使用者。知道它的名字與取捨，可以判斷什麼時候值得開多個 agent（大量、可切分、彼此獨立的工作），什麼時候一個 agent 從頭做完反而比較省、比較不會出錯（前後步驟高度相依的工作）。"}} 佔位符。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>
<div class="term-window">
  <div class="term-bar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="file" id="term-file">ai-daily.log</span>
  </div>
  <div class="wrap">
    <header>
      <div class="kicker">每日 AI 情報</div>
      <h1 id="h-title">AI 每日速報</h1>
      <div class="date" id="h-date"></div>
    </header>
    <div class="headline" id="headline"></div>

    <div class="sec-title">今日重點</div>
    <div id="top"></div>

    <div class="sec-title">產業動態</div>
    <ul class="ind" id="industry"></ul>

    <div class="sec-title">今日一詞</div>
    <div id="term"></div>

    <footer id="footer"></footer>
  </div>

<script>
  const D = {"day": 9, "date": "2026-09-25", "weekday": "週五", "headline": "Anthropic 讓 950 個 Claude agent 花 21 小時翻遍 20 萬個酵素，找到一套長得像 CRISPR、但功能還不知道的新系統；同一天它又簽下 116 億美元的算力合約，這次買的是 CPU 不是 GPU——agent 跑得越多，吃的硬體也跟著變了。", "top": [{"tag": "研究", "title": "950 個 Claude agent、21 小時、2.1 億 token：Anthropic 生科團隊找到一套新的酵素系統", "body": "Anthropic 公布今年春天成立的生命科學研究團隊第一個成果：讓 950 個 Claude agent 在 21 小時內從序列資料庫收集 20 多萬個反轉錄酶（reverse transcriptase，把 RNA 抄回 DNA 的酵素），篩出約 3,500 個候選系統、再收斂到 20 個寫成詳細報告，其中一個被命名為 ART（array-associated reverse transcriptases）：反轉錄酶＋一個功能未知的夥伴蛋白＋一串排列整齊、結構像 CRISPR 的 DNA 重複序列。人類科學家負責下題目、審候選報告、決定哪些值得做實驗，濕實驗全部由人做；初步實驗確認那串重複序列會被表現成一段段短 RNA。Anthropic 自己強調：ART 到底有什麼功能還不知道，也還沒證明能做基因編輯，反轉錄酶本身先前就有人發現過，新的是「這三樣組成一套系統」這個認定。", "analogy": "像產線上的全檢站：950 台 AOI 同時掃 20 萬片板子，機器負責「大量看、先淘汰」，最後剩 20 片可疑品送到品保工程師桌上，由人決定哪幾片要切片分析。機器省下的是看的時間，判斷跟實驗還是人在做。", "why": "這是目前公開過規模最大的一次「多 agent 分頭找、層層收斂、最後人把關」的實戰紀錄，架構跟你在用的 subagent 分工是同一套思路，只是放大到 950 倍；也順便示範了怎麼誠實地寫研究結果——做到哪、沒做到哪都寫清楚。", "source_name": "Anthropic 官方公告", "source_url": "https://www.anthropic.com/news/claude-discovers-novel-enzyme-system"}, {"tag": "基礎設施", "title": "Anthropic 跟 Akamai 簽 7 年 116 億美元合約，買的是分散式 CPU 算力", "body": "CDN 起家的 Akamai 9/24 宣布與 Anthropic 簽下 7 年、116 億美元的合約，最多可再擴充 90 億、合計約 200 億美元。公告寫明是支援 Anthropic「快速成長的 CPU 工作負載」，用的是 Akamai 分布在全球數千個節點的雲端。Anthropic 同時拿到最多 5% 的 Akamai 認股權（先給約 2%，擴約再給 3%）。Akamai 為此今年要多花約 17 億美元資本支出，主要是先搶購記憶體等關鍵零件。", "analogy": "過去幾年大家搶的是 GPU，像搶最貴的那台打件機；但 agent 在跑的時候，大量時間花在呼叫工具、跑程式、開網頁、搬資料——這些是周邊的測試站、搬運與倉儲，用 CPU 就夠，而且要靠近使用者。這筆合約就是在補那一段產能。", "why": "你每次看到 Claude Code 在跑 Bash、讀檔、開瀏覽器，那一段就是 CPU 工作。算力需求從「只缺 GPU」擴大到 CPU 跟記憶體，連 CDN 業者都要先囤記憶體——做硬體的你排 BOM 時，記憶體類零件的交期與報價值得多看一眼。", "source_name": "Akamai 官方新聞稿", "source_url": "https://www.globenewswire.com/news-release/2026/09/24/3368729/0/en/akamai-announces-11-6-billion-multi-year-agreement-with-anthropic-to-support-growing-demand.html"}, {"tag": "工具", "title": "Amazon 把賣家後台開放給外部 AI agent，第一個接上的是 Claude", "body": "Amazon 在 9/23 的賣家大會 Accelerate 宣布：Seller Central 的資料與功能開放給外部 AI agent，先推出美國站測試版外掛，讓賣家直接在 Claude（或 Amazon 自家的 Quick）裡查庫存、看銷售分析、改商品頁跟價格，不用登入後台。連接約 60 秒、不用寫程式；賣家自己選要開放哪些資料，而且每個動作執行前都要賣家核准。Amazon 說約九成賣家已經在用外部 AI 處理部分營運。有意思的對照：Amazon 前陣子才把 Meta 的購物 agent Muse 擋在門外——賣家端的 agent 歡迎，買家端的 agent 暫時不行。", "why": "上週 Shopify 開放的是「買方 agent 來店裡結帳」，這週 Amazon 開放的是「賣方的後台被接進 agent」。公司的通路雖然不在 Amazon，但這種「選要開放哪些資料＋每個動作都要人按確認」的設計，就是之後把 ERP 或電商後台接給 AI 時該照抄的安全範本。", "source_name": "GeekWire", "source_url": "https://www.geekwire.com/2026/amazon-opens-its-seller-tools-to-outside-ai-agents-starting-with-anthropics-claude/"}, {"tag": "工具", "title": "Claude Code 2.1.282：auto mode 的安全判斷改由伺服器端預設處理，還修了續接對話會「失憶」", "body": "9/24 的 2.1.282 版有幾個跟日常使用直接相關的變動：直接連 Anthropic API 時，auto mode 預設改用伺服器端的分類器來判斷指令安不安全（可用 CLAUDE_CODE_AUTO_MODE_SERVER=0 關掉）；修正續接或恢復的對話會把先前訊息以「改過的樣子」重送、導致模型的推理內容遺失；修正 Windows 上 Bash／PowerShell 因暫存檔太大撞到磁碟配額時，只顯示「Exit code 1」而看不出原因；設定檔裡帶 :* 的 Bash 權限規則原本會被略過，現在會生效。另外新增 maxProseWidth 設定，讓寬螢幕上的文字不要拉得太長。", "analogy": "像把產線的安全聯鎖判斷從每台機台自己的 PLC，改成由中控系統統一判斷：規則更新不用每台重刷韌體，但判斷的依據也就不在你手邊了。", "why": "你的排程幾乎都跑在 auto mode、又是 Windows 環境，這一版同時動到「誰來決定這個指令能不能跑」跟「Windows 上的錯誤訊息看不看得懂」。之後如果發現 auto mode 放行或攔截的行為跟以前不一樣，先想到這一版。", "source_name": "Claude Code 官方 Changelog", "source_url": "https://code.claude.com/docs/en/changelog"}], "industry": [{"text": "川習會 9/24 落幕：美中貿易休戰延長到 2027 年 1 月 10 日，但 AI 方面沒有簽下任何協議，雙邊 AI 熱線仍在規劃階段；川普維持輕管制立場，習近平則強調要管控風險、「確保 AI 始終在人類控制之下」。", "source_name": "Saxo Bank 分析", "source_url": "https://www.home.saxo/en-ch/content/articles/macro/trumpxi-summit-stability-not-a-breakthrough-25092026"}, {"text": "DeepSeek 年化營收衝到 10 億美元，幾個月前還不到 5 億；上個月 API 漲價 2.3–4.5 倍客戶沒跑掉，正準備在上海科創板掛牌募資——「最便宜的模型」也開始漲價了。", "source_name": "Tech Startups", "source_url": "https://techstartups.com/2026/09/24/deepseek-hits-1-billion-revenue-run-rate-as-chinese-ai-startup-targets-7-5-billion-raise/"}, {"text": "給醫師用的 AI 醫學文獻查詢服務 OpenEvidence 募得 2.5 億美元、估值 150 億（1 月時是 120 億），年化營收約 3 億美元——垂直領域的 AI 搜尋也跑出規模了。", "source_name": "AI Weekly", "source_url": "https://aiweekly.co/ai-news-today"}], "term": {"zh": "編排者–工作者模式", "en": "Orchestrator–Workers", "explain": "一種 agent 架構：一個「編排者」負責把大任務拆成很多小任務、分派出去，一群「工作者」各自平行處理一小塊，做完把結果交回來，再由編排者彙整、篩選、決定下一步。它適合事先不知道要拆成幾份、每份要做什麼的任務——拆法由編排者看情況決定，不是寫死的流程。今天 Anthropic 用 950 個 agent 分頭掃 20 萬個酵素、層層收斂到 20 個候選，就是這種分工方式的大規模版本。代價也很明確：工作者越多、token 燒越多（那次用了 2.1 億 token），而且彙整那一步如果沒篩好，錯誤會被放大。", "analogy": "像生管排工單：生管（編排者）拿到一張大訂單，看料況跟機台狀態拆成幾十張工單派給各條線（工作者），各線做完回報，生管再決定哪批要重工、哪批可以出貨。工單拆得好不好、回報的格式清不清楚，決定了整張訂單的品質。", "why": "你平常叫 Claude 派 subagent 去掃檔、審查、再彙整，就是在當這個模式的使用者。知道它的名字與取捨，可以判斷什麼時候值得開多個 agent（大量、可切分、彼此獨立的工作），什麼時候一個 agent 從頭做完反而比較省、比較不會出錯（前後步驟高度相依的工作）。"}};
