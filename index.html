  .card p{margin:6px 0;font-size:15.5px}

  .analogy b{color:var(--accent)}
  .why{font-size:14px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:13px;margin-top:10px}

  ul.ind{list-style:none;padding:0;margin:0}

    padding:12px 14px;margin-bottom:8px;font-size:15px;box-shadow:var(--shadow)}
  ul.ind li a{color:var(--accent);text-decoration:none;font-size:13px}
  .term{background:linear-gradient(135deg,var(--accent-soft),var(--card));
    border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
  .term .name{font-size:20px;font-weight:800}
  .term .en{font-size:14px;color:var(--sub);font-weight:600;margin-left:6px}
  .term p{margin:8px 0;font-size:15.5px}

跟電子產品出貨後發現某個環境條件（例如強光下感應異常）會誤判類似，差別是他們的「產品」是會自己開上路的車，出包風險更高，只能靠 OTA 韌體更新緊急補洞。", "why": "這是軟硬整合產品最真實的縮影：感測器、韌體、AI 判斷三者環環相扣，任何一環在邊緣情境失準，最終都得靠韌體更新收尾——跟你做電子紙產品要顧的邏輯是同一套。", "source_name": "Bloomberg", "source_url": "https://www.bloomberg.com/news/articles/2026-07-17/zoox-recalls-robotaxis-after-incident-at-smoky-scene-of-a-fire"}], "industry": [{"text": "美國伊利諾州州長簽署《AI 安全措施法》（7/6生效），要求 AI 模型開發商公布安全框架，重大風險事故須在 24 小時內通報，跟進加州、紐約已有的類似法規。", "source_name": "WTTW News", "source_url": "https://news.wttw.com/2026/07/06/pritzker-signs-landmark-ai-regulation-bill-aims-mitigate-risks"}, {"text": "Anthropic 把 Claude Fable 5 的免費試用期延到 7/19，五週內第三次延長，外界解讀是在正面回應 OpenAI GPT-5.6 Sol 帶來的競爭壓力。", "source_name": "AIToolsRecap", "source_url": "https://aitoolsrecap.com/Blog/AINewsJuly2026.aspx"}, {"text": "中國機器人廠優必選（UBTECH）的量產人形機器人 UWORLD U1 系列（售價約 11.98 萬人民幣起）累積訂單已破 1.3 萬台，主打陪伴、接待與長照應用。", "source_name": "PR Newswire", "source_url": "https://www.prnewswire.com/news-releases/ubtech-launches-uworld-u1-the-worlds-first-full-size-mass-produced-ultra-bionic-humanoid-robot-302815272.html"}, {"text": "深圳舉辦全球第一場全尺寸人形機器人格鬥賽，一台機器人被踢到頭部飛脫，斷頭後仍持續出拳應戰，畫面在網路上瘋傳。", "source_name": "ZeroHedge", "source_url": "https://www.zerohedge.com/ai/humanoid-robot-loses-its-head-worlds-first-full-size-robot-combat-tournament-and-keeps-fighting"}], "term": {"zh": "混合專家模型", "en": "Mixture of Experts, MoE", "explain": "一種 AI 模型架構：把一個巨大的模型拆成很多個「小專家」，每次處理一個問題時，系統只挑其中一小部分專家出來做事，其他人先待命不動作。這樣模型可以做得非常巨大（參數多、懂的東西多），但實際運算量和成本卻不會跟著等比例暴增。", "analogy": "像一間有幾百條產線的大工廠，接到訂單時只啟動跟這張訂單有關的幾條產線，其餘產線先關著省電——工廠規模可以蓋很大，但每張訂單的用電成本沒有跟著等比例變貴。", "why": "今天的主角 Kimi K3 用的就是這個架構，這也是目前所有頂尖大模型（包含 Claude）能維持「又大又聰明、但用起來不會貴到爆」的關鍵技巧。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

    (D.day||"") + " · " + (D.date||"");
