<!--
  每日 AI 情報 網頁範本（終端機／hacker 風，強制深色）
  build_ai_page.py 會把 content.json 的內容以 JSON 塞進 {"day": 41, "date": "2026-11-13", "weekday": "週五", "headline": "Anthropic 推出 Claude for Manufacturing：17 個 skill＋Autodesk Fusion、Infor 等四個連接器，從報價、檢驗不良到設計比較都先打草稿、最後由人簽核；Google 推出又快又便宜的 Gemini 4 Hydrogen，主打跟大模型搭配分工；Nvidia 執行長黃仁勳 11/12 辭職，財務長 Colette Kress 暫代。", "top": [{"tag": "工具", "title": "Claude for Manufacturing：給工廠用的 17 個 skill＋Autodesk Fusion 等四個連接器，每份草稿都要人簽核", "body": "Anthropic 11/12 推出 Claude for Manufacturing，是一個外掛（plugin），裡面有 17 個 skill，涵蓋業務、品質、生產、採購、設計與設定。官方舉的例子：讀客戶需求、列出缺的資訊、比對類似案子成本後擬報價；檢驗不合格時整理失效紀錄、查過去同樣問題、排出可能原因、擬矯正措施報告（CAR）；讀感測器匯出檔、維修紀錄與手冊，排出停機可能原因；從既有 Fusion 模型產生設計變化、依工程師的目標打分數並寫決策備忘。連接器有 Autodesk Fusion、Infor、Microsoft 365、Oracle NetSuite 四個；沒有連接器的系統，把匯出檔放進 Microsoft 365 也能用。Anthropic 強調每個流程都停在「人審核、放行」那一步，Claude 不操作設備。依 Manufacturing Dive 採訪，擁有 Claude 企業方案的客戶就能安裝。", "analogy": "像新進的生管助理：資料他去各系統撈齊、初稿他寫好，但報價單要業務主管蓋章、CAR 要品保工程師簽名才發出去——權責沒有移交，只是把「跑腿彙整」那段外包掉。", "why": "這是 Anthropic 第一次把整包 skill 做成產業專用版，而且直接連 Fusion（含 PCB 的 CAD 平台）；你自己在寫 skill 管硬體流程，可以拿它的分工（skill 負責步驟、connector 負責拿資料、人負責簽核）對照自己的設計。", "source_name": "Anthropic（claude.com）", "source_url": "https://claude.com/resources/articles/claude-for-manufacturing"}, {"tag": "工具", "title": "Claude Code 2.1.323：實驗性「Code Mode」讓 Claude 寫 JavaScript 呼叫工具，外掛可宣告支援的版本範圍", "body": "Claude Code 2.1.323 於 11/12（UTC）上架。最大的新東西是 Code Mode：實驗性、預設關閉，開了以後 Claude 改成寫一段 JavaScript 去呼叫它的工具，而不是一個一個工具輪流呼叫；組織也可以統一關掉。其他跟你環境有關的：外掛的 plugin.json 可以寫明支援哪個 Claude Code 版本範圍，不符合就不安裝、不載入；`claude -p` 與 SDK 執行長時間 hook 時每 30 秒回報一次進度，避免 Claude Desktop 誤判卡住而結束這一輪；修正 /compact 把 Claude 還沒回答的訊息一起摘要掉；修正 session 在背景被換成另一個登入帳號（現在會停下來告知）；Bash allow 規則的變數值裡有 `*` 時開機會警告。", "analogy": "原本像操作員對著機台一個按鈕一個按鈕按，每按一下都要回頭看結果；Code Mode 像先寫好一段 PLC 程式，一次下載進去跑完整串動作，再把總結果交回來。", "why": "你的排程（每日 AI、日文、多益）都在 Claude Desktop 背景跑 hook 和腳本，「長 hook 被誤判卡住」與「背景換帳號」這兩個修正直接關係排程穩不穩；Code Mode 還在實驗階段，先知道有這個選項就好，Code Mode 的說明頁目前打不開，細節以 CHANGELOG 為準。", "source_name": "GitHub：claude-code CHANGELOG", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "新模型", "title": "Google 推出 Gemini 4 Hydrogen：每百萬 token 輸入 1.5／輸出 7.5 美元，定位是跟大模型搭配的「執行手」", "body": "Google 11/12 發表 Gemini 4 Hydrogen，定位是快速、便宜、做日常寫程式與 agent 工作的模型，Gemini app、搜尋、Gemini API 各層級都上。Google 自報：Artificial Analysis 智慧指數在預設思考等級是 51，略高於自家前沿模型 Argon 的 50；整個 100 萬 token 脈絡都是同一價（輸入 1.5、輸出 7.5 美元／百萬 token）；比上一代 3.8 Flash 快 2.5 倍、Terminal-Bench 4.1 從 18.2% 升到 57%、捏造內容減少 5 倍以上。同時推出 Antigravity 的 Orchestrator：同一個工作階段自動在 Carbon（大模型）和 Hydrogen（小模型）之間切換，Google 說在 Terminal-Bench 4.0 達到接近純用 Carbon 的成功率，平均少用 24% 額度、快 19%。以上數字都是 Google 自報。", "analogy": "像產線上的總工程師配技術員：架構與疑難雜症給總工（Carbon），量大重複的焊接、測試給技術員（Hydrogen），整條線的人力成本就降下來。", "why": "「大模型想、小模型做」正變成各家的標準配置——你用 Claude Code 時讓 subagent 用 haiku 掃檔、opus 審查，就是同一個思路；Google 這次把它做成自動切換。", "source_name": "Google Blog", "source_url": "https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/"}, {"tag": "產業", "title": "Nvidia 執行長黃仁勳 11/12 辭職，財務長 Colette Kress 暫代，董事會說產品路線圖不變", "body": "Nvidia 11/12 宣布共同創辦人、擔任執行長 33 年的黃仁勳卸任，財務長 Colette Kress 暫代執行長，公司會從內外部找正式接班人。董事會主席 Harvey Jones 在公告中說，營運、客戶承諾與產品路線圖都會照常進行。起因是過去一週接連的個人行為報導，其中牽涉一名被美國情報單位懷疑替中國蒐集情報的商界人士；CNBC 報導黃仁勳已同意在感恩節前到國會作證。依 The Neuron 整理，Nvidia 表示目前沒有發現公司或國安機密外洩的證據。TechCrunch 報導，Nvidia 收購 Hugging Face 的案子預計仍在 2027 年完成。", "why": "Nvidia 是整個 AI 算力供應鏈的源頭，黃仁勳本人也是主導對外投資、出口管制遊說的關鍵人物；換人不會讓明天的 GPU 停貨，但接下來對開源模型、對中國出口、對 AI 新創的投資態度可能轉向，值得持續觀察。", "source_name": "CNBC", "source_url": "https://www.cnbc.com/2026/11/12/nvidia-jensen-huang-ceo-live-updates.html"}], "industry": [{"text": "Anthropic 11/12 推出自架版 Claude Managed Agents：整套 Managed Agents 服務（不只是沙箱）都可以跑在公司自己的機器上，agent、對話與歷史紀錄都存在自己那邊，模型請求預設送 Anthropic、也可以自選供應商；要找 Anthropic 業務窗口申請。", "source_name": "Claude Platform 版本說明", "source_url": "https://platform.claude.com/docs/en/release-notes/overview"}, {"text": "AI 模型代管平台 Fireworks AI 遭入侵：攻擊者先打進它的雲端供應商、再進到開發系統，取走客戶帳務資料與部分資料集；Notion 證實約 1% 客戶受影響，用過 Notion AI「Insights」功能的對話紀錄被拿走，Notion 已在 11/3 切斷與 Fireworks 的連線。", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/11/12/cyberattack-on-fireworks-ai-allowed-hackers-to-access-notion-customers-chat-transcripts/"}, {"text": "SpaceX 宣布將在德州與亞利桑那州投資超過 740 億美元蓋 AI 超級運算園區，亞利桑那單一園區約 500 億、還要等郡政府核准，德州園區設計成自己發電（路透原文未讀到，依 The Neuron 轉述）。", "source_name": "Reuters", "source_url": "https://www.reuters.com/business/media-telecom/spacex-invest-over-74-billion-supercompute-facilities-texas-arizona-2026-11-12/"}, {"text": "一群非營利組織對 OpenAI、Anthropic、Google、Meta、SpaceX 提告，要求法院禁止它們開發比現有系統更強的模型，引用的正是各家自己對極端 AI 風險的警告（路透原文未讀到，依 The Neuron 轉述）。", "source_name": "Reuters", "source_url": "https://www.reuters.com/business/openai-google-anthropic-hit-with-lawsuit-seeking-halt-frontier-ai-development-2026-11-12/"}], "term": {"zh": "模型路由", "en": "Model Routing", "explain": "同一個系統裡準備好幾個大小、價格不同的模型，依每個子任務的難度決定送給哪一個：難的規劃、判斷給大模型，大量重複的讀檔、寫程式、跑測試給小模型。路由可以寫死成規則（例如「掃檔一律用小模型」），也可以讓一個模型或分類器即時判斷。Google 今天推出的 Antigravity Orchestrator 就是自動路由：同一個工作階段在 Carbon 和 Hydrogen 之間切換，Google 說成功率接近純用大模型，額度少用 24%。重點在於「路由判斷錯」的代價——難題被丟給小模型，結果可能看起來完整但其實錯了，所以通常要配一個檢查關卡。", "analogy": "像 SMT 產線依料件分機台：0402 被動元件丟高速貼片機，BGA、異形件才送精密泛用機。分得好，產能和成本都漂亮；分錯了，BGA 被高速機貼歪，後面 AOI 不擋就直接流到客戶手上。", "why": "你在 CLAUDE.md 寫的「掃檔用 haiku、一般用 sonnet、審查用 opus」就是一份手寫的路由表；懂這個概念，就能判斷哪些工作值得自動路由、哪些關鍵步驟應該固定給大模型或加上人工檢查。"}} 佔位符。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>
<div class="term-window">
  <div class="term-bar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>

  <div class="wrap">

      <div class="kicker">每日 AI 情報</div>

    <div class="headline" id="headline"></div>

    <div class="sec-title">今日重點</div>
    <div id="top"></div>

    <div class="sec-title">產業動態</div>
    <ul class="ind" id="industry"></ul>

    <div class="sec-title">今日一詞</div>
    <div id="term"></div>

    <footer id="footer"></footer>
  </div>

<script>
  const D = {"day": 41, "date": "2026-11-13", "weekday": "週五", "headline": "Anthropic 推出 Claude for Manufacturing：17 個 skill＋Autodesk Fusion、Infor 等四個連接器，從報價、檢驗不良到設計比較都先打草稿、最後由人簽核；Google 推出又快又便宜的 Gemini 4 Hydrogen，主打跟大模型搭配分工；Nvidia 執行長黃仁勳 11/12 辭職，財務長 Colette Kress 暫代。", "top": [{"tag": "工具", "title": "Claude for Manufacturing：給工廠用的 17 個 skill＋Autodesk Fusion 等四個連接器，每份草稿都要人簽核", "body": "Anthropic 11/12 推出 Claude for Manufacturing，是一個外掛（plugin），裡面有 17 個 skill，涵蓋業務、品質、生產、採購、設計與設定。官方舉的例子：讀客戶需求、列出缺的資訊、比對類似案子成本後擬報價；檢驗不合格時整理失效紀錄、查過去同樣問題、排出可能原因、擬矯正措施報告（CAR）；讀感測器匯出檔、維修紀錄與手冊，排出停機可能原因；從既有 Fusion 模型產生設計變化、依工程師的目標打分數並寫決策備忘。連接器有 Autodesk Fusion、Infor、Microsoft 365、Oracle NetSuite 四個；沒有連接器的系統，把匯出檔放進 Microsoft 365 也能用。Anthropic 強調每個流程都停在「人審核、放行」那一步，Claude 不操作設備。依 Manufacturing Dive 採訪，擁有 Claude 企業方案的客戶就能安裝。", "analogy": "像新進的生管助理：資料他去各系統撈齊、初稿他寫好，但報價單要業務主管蓋章、CAR 要品保工程師簽名才發出去——權責沒有移交，只是把「跑腿彙整」那段外包掉。", "why": "這是 Anthropic 第一次把整包 skill 做成產業專用版，而且直接連 Fusion（含 PCB 的 CAD 平台）；你自己在寫 skill 管硬體流程，可以拿它的分工（skill 負責步驟、connector 負責拿資料、人負責簽核）對照自己的設計。", "source_name": "Anthropic（claude.com）", "source_url": "https://claude.com/resources/articles/claude-for-manufacturing"}, {"tag": "工具", "title": "Claude Code 2.1.323：實驗性「Code Mode」讓 Claude 寫 JavaScript 呼叫工具，外掛可宣告支援的版本範圍", "body": "Claude Code 2.1.323 於 11/12（UTC）上架。最大的新東西是 Code Mode：實驗性、預設關閉，開了以後 Claude 改成寫一段 JavaScript 去呼叫它的工具，而不是一個一個工具輪流呼叫；組織也可以統一關掉。其他跟你環境有關的：外掛的 plugin.json 可以寫明支援哪個 Claude Code 版本範圍，不符合就不安裝、不載入；`claude -p` 與 SDK 執行長時間 hook 時每 30 秒回報一次進度，避免 Claude Desktop 誤判卡住而結束這一輪；修正 /compact 把 Claude 還沒回答的訊息一起摘要掉；修正 session 在背景被換成另一個登入帳號（現在會停下來告知）；Bash allow 規則的變數值裡有 `*` 時開機會警告。", "analogy": "原本像操作員對著機台一個按鈕一個按鈕按，每按一下都要回頭看結果；Code Mode 像先寫好一段 PLC 程式，一次下載進去跑完整串動作，再把總結果交回來。", "why": "你的排程（每日 AI、日文、多益）都在 Claude Desktop 背景跑 hook 和腳本，「長 hook 被誤判卡住」與「背景換帳號」這兩個修正直接關係排程穩不穩；Code Mode 還在實驗階段，先知道有這個選項就好，Code Mode 的說明頁目前打不開，細節以 CHANGELOG 為準。", "source_name": "GitHub：claude-code CHANGELOG", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "新模型", "title": "Google 推出 Gemini 4 Hydrogen：每百萬 token 輸入 1.5／輸出 7.5 美元，定位是跟大模型搭配的「執行手」", "body": "Google 11/12 發表 Gemini 4 Hydrogen，定位是快速、便宜、做日常寫程式與 agent 工作的模型，Gemini app、搜尋、Gemini API 各層級都上。Google 自報：Artificial Analysis 智慧指數在預設思考等級是 51，略高於自家前沿模型 Argon 的 50；整個 100 萬 token 脈絡都是同一價（輸入 1.5、輸出 7.5 美元／百萬 token）；比上一代 3.8 Flash 快 2.5 倍、Terminal-Bench 4.1 從 18.2% 升到 57%、捏造內容減少 5 倍以上。同時推出 Antigravity 的 Orchestrator：同一個工作階段自動在 Carbon（大模型）和 Hydrogen（小模型）之間切換，Google 說在 Terminal-Bench 4.0 達到接近純用 Carbon 的成功率，平均少用 24% 額度、快 19%。以上數字都是 Google 自報。", "analogy": "像產線上的總工程師配技術員：架構與疑難雜症給總工（Carbon），量大重複的焊接、測試給技術員（Hydrogen），整條線的人力成本就降下來。", "why": "「大模型想、小模型做」正變成各家的標準配置——你用 Claude Code 時讓 subagent 用 haiku 掃檔、opus 審查，就是同一個思路；Google 這次把它做成自動切換。", "source_name": "Google Blog", "source_url": "https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/"}, {"tag": "產業", "title": "Nvidia 執行長黃仁勳 11/12 辭職，財務長 Colette Kress 暫代，董事會說產品路線圖不變", "body": "Nvidia 11/12 宣布共同創辦人、擔任執行長 33 年的黃仁勳卸任，財務長 Colette Kress 暫代執行長，公司會從內外部找正式接班人。董事會主席 Harvey Jones 在公告中說，營運、客戶承諾與產品路線圖都會照常進行。起因是過去一週接連的個人行為報導，其中牽涉一名被美國情報單位懷疑替中國蒐集情報的商界人士；CNBC 報導黃仁勳已同意在感恩節前到國會作證。依 The Neuron 整理，Nvidia 表示目前沒有發現公司或國安機密外洩的證據。TechCrunch 報導，Nvidia 收購 Hugging Face 的案子預計仍在 2027 年完成。", "why": "Nvidia 是整個 AI 算力供應鏈的源頭，黃仁勳本人也是主導對外投資、出口管制遊說的關鍵人物；換人不會讓明天的 GPU 停貨，但接下來對開源模型、對中國出口、對 AI 新創的投資態度可能轉向，值得持續觀察。", "source_name": "CNBC", "source_url": "https://www.cnbc.com/2026/11/12/nvidia-jensen-huang-ceo-live-updates.html"}], "industry": [{"text": "Anthropic 11/12 推出自架版 Claude Managed Agents：整套 Managed Agents 服務（不只是沙箱）都可以跑在公司自己的機器上，agent、對話與歷史紀錄都存在自己那邊，模型請求預設送 Anthropic、也可以自選供應商；要找 Anthropic 業務窗口申請。", "source_name": "Claude Platform 版本說明", "source_url": "https://platform.claude.com/docs/en/release-notes/overview"}, {"text": "AI 模型代管平台 Fireworks AI 遭入侵：攻擊者先打進它的雲端供應商、再進到開發系統，取走客戶帳務資料與部分資料集；Notion 證實約 1% 客戶受影響，用過 Notion AI「Insights」功能的對話紀錄被拿走，Notion 已在 11/3 切斷與 Fireworks 的連線。", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/11/12/cyberattack-on-fireworks-ai-allowed-hackers-to-access-notion-customers-chat-transcripts/"}, {"text": "SpaceX 宣布將在德州與亞利桑那州投資超過 740 億美元蓋 AI 超級運算園區，亞利桑那單一園區約 500 億、還要等郡政府核准，德州園區設計成自己發電（路透原文未讀到，依 The Neuron 轉述）。", "source_name": "Reuters", "source_url": "https://www.reuters.com/business/media-telecom/spacex-invest-over-74-billion-supercompute-facilities-texas-arizona-2026-11-12/"}, {"text": "一群非營利組織對 OpenAI、Anthropic、Google、Meta、SpaceX 提告，要求法院禁止它們開發比現有系統更強的模型，引用的正是各家自己對極端 AI 風險的警告（路透原文未讀到，依 The Neuron 轉述）。", "source_name": "Reuters", "source_url": "https://www.reuters.com/business/openai-google-anthropic-hit-with-lawsuit-seeking-halt-frontier-ai-development-2026-11-12/"}], "term": {"zh": "模型路由", "en": "Model Routing", "explain": "同一個系統裡準備好幾個大小、價格不同的模型，依每個子任務的難度決定送給哪一個：難的規劃、判斷給大模型，大量重複的讀檔、寫程式、跑測試給小模型。路由可以寫死成規則（例如「掃檔一律用小模型」），也可以讓一個模型或分類器即時判斷。Google 今天推出的 Antigravity Orchestrator 就是自動路由：同一個工作階段在 Carbon 和 Hydrogen 之間切換，Google 說成功率接近純用大模型，額度少用 24%。重點在於「路由判斷錯」的代價——難題被丟給小模型，結果可能看起來完整但其實錯了，所以通常要配一個檢查關卡。", "analogy": "像 SMT 產線依料件分機台：0402 被動元件丟高速貼片機，BGA、異形件才送精密泛用機。分得好，產能和成本都漂亮；分錯了，BGA 被高速機貼歪，後面 AOI 不擋就直接流到客戶手上。", "why": "你在 CLAUDE.md 寫的「掃檔用 haiku、一般用 sonnet、審查用 opus」就是一份手寫的路由表；懂這個概念，就能判斷哪些工作值得自動路由、哪些關鍵步驟應該固定給大模型或加上人工檢查。"}};
