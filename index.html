<!--

  build_ai_page.py 會把 content.json 的內容以 JSON 塞進 {"day": 14, "date": "2026-09-30", "weekday": "週三", "headline": "白宮午餐會的結果出來了：Anthropic、OpenAI、Google、Meta、xAI、Nvidia 簽下一份「自願但道德上有約束力」的超級智慧協議，自己設內控、找外部稽核——沒有法律罰則；同一天 OpenAI 在 DevDay 推出 24 小時不下班的 agent「dots」，Claude Code 則開始替背景指令設 30 分鐘上限。", "top": [{"tag": "工具", "title": "Claude Code 2.1.285：背景指令預設跑滿 30 分鐘就被停掉、可以整個關掉 WebFetch、修掉 PowerShell 權限規則被略過的漏洞", "body": "9/29 釋出的 2.1.285 有 136 項變更。跟你最有關的三件：一、用 run_in_background 跑的 Bash／PowerShell 指令現在有時間上限，預設 30 分鐘、最多可設到 2 小時，時間到會自動停止並通知 Claude；二、新增環境變數 CLAUDE_CODE_DISABLE_WEB_FETCH，可以整個關掉 WebFetch 工具，管理員也能用 allowedProviders 限制這台機器只能連哪些 API 供應商；三、修正 PowerShell 工具在指令解析器啟動失敗時會「略過拒絕／詢問規則」的問題。另外 Windows 上 ALLUSERSPROFILE、SystemDrive 這類系統變數不能再從專案設定的 env 改，要改放使用者設定或受管設定。", "analogy": "像產線的烤箱加了計時斷電：以前忘了關就一直烤，現在預設 30 分鐘自動跳脫——安全多了，但本來就要烤 35 分鐘的製程得先把計時器調長。", "why": "這個 AI 情報的發布腳本最壞情況要跑約 35 分鐘（內建重試），剛好超過新的 30 分鐘預設上限；平常幾分鐘就結束不受影響，但遇到 GitHub 故障時可能被中途停掉。PowerShell 那個修正則代表：你在 settings 裡設的「這類指令要先問我」，之前在某些情況下可能沒生效。", "source_name": "DevelopersIO（Claude Code v2.1.285 更新整理）", "source_url": "https://dev.classmethod.jp/en/articles/20260930-cc-updates-v2-1-285/"}, {"tag": "政策", "title": "白宮《超級智慧協議》：六家 AI 公司自願承諾內控＋外部稽核＋董事會審查，川普稱「道德上有約束力」，但沒有法律罰則", "body": "上一期提到的白宮 AI 午餐會（9/29）有結果了。Anthropic 的 Amodei、OpenAI 的 Brockman、Google 的 Pichai、Meta 的祖克柏、xAI 的馬斯克、Nvidia 的黃仁勳等人簽下「White House Accord on Superintelligence」，承諾三層把關：公司內部風險審查與監控團隊、找獨立的外部稽核與評測單位、由董事會獨立審閱稽核報告，各家也會定期開會訂標準。川普說這份協議「幾乎像一部憲法」、是「道德上有約束力的」，並表示會指派一位顧問監督；多家媒體報導他同時簽行政命令，要聯邦機關改用「超級智慧（Super Intelligence, SI）」一詞取代 AI。重點是：這是自願承諾，文件本身沒有罰則。", "analogy": "像廠商自己簽的品質承諾書：答應會做進料檢驗、請第三方驗證機構來抽查、報告給董事會看——但跟 BSMI、FCC 這種「沒過不能上市」的法規認證不一樣，沒做到也沒有主管機關開罰。", "why": "這跟第 11 期紐約市議會要「每次違規罰 2.5 萬美元」的強制路線正好相反，美國聯邦層級目前選的是自律。你在用的 Claude 背後的公司簽了，之後值得看它的外部稽核報告會不會公開。", "source_name": "Al Jazeera", "source_url": "https://www.aljazeera.com/news/2026/9/29/trump-top-tech-firms-sign-accord-to-self-police-ai-development"}, {"tag": "新模型", "title": "OpenAI DevDay：24 小時自己跑的 agent「dots」、只要 Astra 兩成價格的 GPT-6.1 Sol、貴 6 倍但快 6–8 倍的 Ultrafast 速度檔", "body": "OpenAI 9/29 在舊金山開 DevDay，宣布 20 多項更新。最大的是「dots」：住在 ChatGPT 裡、全天候運作的 agent，每個 dot 用 GPT-6 Astra 模型、有自己的雲端電腦和瀏覽器，朝你給的目標持續做事。新模型 GPT-6.1 Sol 號稱在 agent 寫程式、操作電腦上接近 Astra 等級，價格只要 Astra 的 20%（注意：上一期說延後的是 GPT-6.1 Astra，這次出的是 Sol，是不同型號）。另外推出付費加速檔 Ultrafast：Codex 最多快 8 倍、API 最多快 6 倍，價格是標準的 6 倍；還有能在 ChatGPT 裡做出完整小應用的外掛擴充（plugin extensions）。", "why": "三大家都往「常駐、自己有電腦的 agent」走（Meta Muse、xAI Grok Bot、現在 OpenAI dots），第 12 期 Muse 後門那種權限問題會越來越常見；Ultrafast 則把「速度」直接標價，是今天的今日一詞。", "source_name": "CNBC（DevDay 2026 整理）", "source_url": "https://www.cnbc.com/2026/09/29/openai-devday-2026-live-updates.html"}, {"tag": "產業", "title": "AMD 以約 82 億美元全股票收購李飛飛的 World Labs，要把「空間智慧」模型帶進晶片規劃", "body": "AMD 9/28 宣布收購 World Labs，這家新創由史丹佛教授、電腦視覺先驅李飛飛共同創辦，做的是能從文字、圖片、影片產生、重建並模擬可互動 3D 環境的「空間智慧」模型，也做機器人學習與模擬。交易約 82 億美元、全用股票支付，預計 2026 年底前完成（需主管機關核准）；完成後李飛飛出任 AMD 執行副總裁兼首席科學家，直接向蘇姿豐報告。這是 AMD 史上第二大收購，僅次於 2022 年約 500 億美元買 Xilinx。", "analogy": "像一家做 MCU 的晶片廠買下一家做馬達控制演算法的團隊：賣晶片的人開始自己握有「晶片要跑什麼」的第一手需求，下一代晶片就能照著那個工作負載去設計。", "why": "晶片廠往上游買模型團隊，代表機器人與實體 AI（physical AI）被當成下一個大算力市場；對做硬體產品的人來說，之後的邊緣 AI 晶片規格很可能會照這類 3D／感測工作負載來定。", "source_name": "AMD 官方新聞稿", "source_url": "https://newsroom.amd.com/news/amd-acquire-world-labs/"}], "industry": [{"text": "Anthropic 上市說明書後續：未來約十年至少要花 5,180 億美元在六家夥伴的算力與基礎設施上，其中約 80% 不能取消、用不用都得付；Reuters 報導上市時間可能延到 11 月美國期中選舉之後。", "source_name": "CNBC（引述 Reuters）", "source_url": "https://www.cnbc.com/2026/09/28/anthropics-ipo-prospectus-shows-sweeping-ai-vision-surging-costs-reuters.html"}, {"text": "9/29 美東上午 Claude、Claude Cowork 與 Claude Code 出現錯誤率升高，Anthropic 在狀態頁確認正在處理——那天如果你的 Claude Code 突然卡住，原因在伺服器端不在你的電腦。", "source_name": "TechRadar", "source_url": "https://www.techradar.com/news/live/claude-down-september-29-2026"}, {"text": "OpenAI 在 DevDay 公布：ChatGPT 每週活躍用戶超過 12 億，ChatGPT Work 與 Codex 每週用戶超過 3,500 萬，使用 OpenAI 產品的企業達 250 萬家（公司自報數字）。", "source_name": "OpenAI DevDay 2026 Recap", "source_url": "https://openai.com/index/devday-2026-recap/"}], "term": {"zh": "延遲與吞吐量", "en": "Latency vs Throughput", "explain": "延遲（Latency）是「一個請求從送出到拿到答案要等多久」，常細分成第一個字出來的時間（TTFT）和之後每秒吐幾個 token；吞吐量（Throughput）是「同一批 GPU 一秒總共能處理多少 token」。兩者常互相拉扯：伺服器把很多人的請求併成一大批一起算，GPU 利用率高、每個 token 便宜，但每個人要排隊、等比較久；想讓某個人特別快，就得少併批、多分配算力給他，成本自然變高。OpenAI 的 Ultrafast 檔「貴 6 倍、快 6–8 倍」就是把這個取捨直接標價賣給你。", "analogy": "像 SMT 產線排單：把同料號的單併成大批連續打，換線少、每片成本最低，但急單要排隊；插急單要停線換料，那張單很快出貨，代價是整條線的產能被吃掉——所以急件加價。", "why": "選模型不只看聰明程度和單價，還要看「等多久可以接受」：排程半夜跑的報告不在乎慢，互動式除錯就很在乎。互動任務付速度溢價可能值得，批次任務付了就是浪費。"}} 佔位符。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>
<div class="term-window">
  <div class="term-bar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="file" id="term-file">ai-daily.log</span>
  </div>
  <div class="wrap">
    <header>
      <div class="kicker">每日 AI 情報</div>
      <h1 id="h-title">AI 每日速報</h1>
      <div class="date" id="h-date"></div>
    </header>
    <div class="headline" id="headline"></div>

    <div class="sec-title">今日重點</div>
    <div id="top"></div>

    <div class="sec-title">產業動態</div>
    <ul class="ind" id="industry"></ul>

    <div class="sec-title">今日一詞</div>
    <div id="term"></div>

    <footer id="footer"></footer>
  </div>

<script>
  const D = {"day": 14, "date": "2026-09-30", "weekday": "週三", "headline": "白宮午餐會的結果出來了：Anthropic、OpenAI、Google、Meta、xAI、Nvidia 簽下一份「自願但道德上有約束力」的超級智慧協議，自己設內控、找外部稽核——沒有法律罰則；同一天 OpenAI 在 DevDay 推出 24 小時不下班的 agent「dots」，Claude Code 則開始替背景指令設 30 分鐘上限。", "top": [{"tag": "工具", "title": "Claude Code 2.1.285：背景指令預設跑滿 30 分鐘就被停掉、可以整個關掉 WebFetch、修掉 PowerShell 權限規則被略過的漏洞", "body": "9/29 釋出的 2.1.285 有 136 項變更。跟你最有關的三件：一、用 run_in_background 跑的 Bash／PowerShell 指令現在有時間上限，預設 30 分鐘、最多可設到 2 小時，時間到會自動停止並通知 Claude；二、新增環境變數 CLAUDE_CODE_DISABLE_WEB_FETCH，可以整個關掉 WebFetch 工具，管理員也能用 allowedProviders 限制這台機器只能連哪些 API 供應商；三、修正 PowerShell 工具在指令解析器啟動失敗時會「略過拒絕／詢問規則」的問題。另外 Windows 上 ALLUSERSPROFILE、SystemDrive 這類系統變數不能再從專案設定的 env 改，要改放使用者設定或受管設定。", "analogy": "像產線的烤箱加了計時斷電：以前忘了關就一直烤，現在預設 30 分鐘自動跳脫——安全多了，但本來就要烤 35 分鐘的製程得先把計時器調長。", "why": "這個 AI 情報的發布腳本最壞情況要跑約 35 分鐘（內建重試），剛好超過新的 30 分鐘預設上限；平常幾分鐘就結束不受影響，但遇到 GitHub 故障時可能被中途停掉。PowerShell 那個修正則代表：你在 settings 裡設的「這類指令要先問我」，之前在某些情況下可能沒生效。", "source_name": "DevelopersIO（Claude Code v2.1.285 更新整理）", "source_url": "https://dev.classmethod.jp/en/articles/20260930-cc-updates-v2-1-285/"}, {"tag": "政策", "title": "白宮《超級智慧協議》：六家 AI 公司自願承諾內控＋外部稽核＋董事會審查，川普稱「道德上有約束力」，但沒有法律罰則", "body": "上一期提到的白宮 AI 午餐會（9/29）有結果了。Anthropic 的 Amodei、OpenAI 的 Brockman、Google 的 Pichai、Meta 的祖克柏、xAI 的馬斯克、Nvidia 的黃仁勳等人簽下「White House Accord on Superintelligence」，承諾三層把關：公司內部風險審查與監控團隊、找獨立的外部稽核與評測單位、由董事會獨立審閱稽核報告，各家也會定期開會訂標準。川普說這份協議「幾乎像一部憲法」、是「道德上有約束力的」，並表示會指派一位顧問監督；多家媒體報導他同時簽行政命令，要聯邦機關改用「超級智慧（Super Intelligence, SI）」一詞取代 AI。重點是：這是自願承諾，文件本身沒有罰則。", "analogy": "像廠商自己簽的品質承諾書：答應會做進料檢驗、請第三方驗證機構來抽查、報告給董事會看——但跟 BSMI、FCC 這種「沒過不能上市」的法規認證不一樣，沒做到也沒有主管機關開罰。", "why": "這跟第 11 期紐約市議會要「每次違規罰 2.5 萬美元」的強制路線正好相反，美國聯邦層級目前選的是自律。你在用的 Claude 背後的公司簽了，之後值得看它的外部稽核報告會不會公開。", "source_name": "Al Jazeera", "source_url": "https://www.aljazeera.com/news/2026/9/29/trump-top-tech-firms-sign-accord-to-self-police-ai-development"}, {"tag": "新模型", "title": "OpenAI DevDay：24 小時自己跑的 agent「dots」、只要 Astra 兩成價格的 GPT-6.1 Sol、貴 6 倍但快 6–8 倍的 Ultrafast 速度檔", "body": "OpenAI 9/29 在舊金山開 DevDay，宣布 20 多項更新。最大的是「dots」：住在 ChatGPT 裡、全天候運作的 agent，每個 dot 用 GPT-6 Astra 模型、有自己的雲端電腦和瀏覽器，朝你給的目標持續做事。新模型 GPT-6.1 Sol 號稱在 agent 寫程式、操作電腦上接近 Astra 等級，價格只要 Astra 的 20%（注意：上一期說延後的是 GPT-6.1 Astra，這次出的是 Sol，是不同型號）。另外推出付費加速檔 Ultrafast：Codex 最多快 8 倍、API 最多快 6 倍，價格是標準的 6 倍；還有能在 ChatGPT 裡做出完整小應用的外掛擴充（plugin extensions）。", "why": "三大家都往「常駐、自己有電腦的 agent」走（Meta Muse、xAI Grok Bot、現在 OpenAI dots），第 12 期 Muse 後門那種權限問題會越來越常見；Ultrafast 則把「速度」直接標價，是今天的今日一詞。", "source_name": "CNBC（DevDay 2026 整理）", "source_url": "https://www.cnbc.com/2026/09/29/openai-devday-2026-live-updates.html"}, {"tag": "產業", "title": "AMD 以約 82 億美元全股票收購李飛飛的 World Labs，要把「空間智慧」模型帶進晶片規劃", "body": "AMD 9/28 宣布收購 World Labs，這家新創由史丹佛教授、電腦視覺先驅李飛飛共同創辦，做的是能從文字、圖片、影片產生、重建並模擬可互動 3D 環境的「空間智慧」模型，也做機器人學習與模擬。交易約 82 億美元、全用股票支付，預計 2026 年底前完成（需主管機關核准）；完成後李飛飛出任 AMD 執行副總裁兼首席科學家，直接向蘇姿豐報告。這是 AMD 史上第二大收購，僅次於 2022 年約 500 億美元買 Xilinx。", "analogy": "像一家做 MCU 的晶片廠買下一家做馬達控制演算法的團隊：賣晶片的人開始自己握有「晶片要跑什麼」的第一手需求，下一代晶片就能照著那個工作負載去設計。", "why": "晶片廠往上游買模型團隊，代表機器人與實體 AI（physical AI）被當成下一個大算力市場；對做硬體產品的人來說，之後的邊緣 AI 晶片規格很可能會照這類 3D／感測工作負載來定。", "source_name": "AMD 官方新聞稿", "source_url": "https://newsroom.amd.com/news/amd-acquire-world-labs/"}], "industry": [{"text": "Anthropic 上市說明書後續：未來約十年至少要花 5,180 億美元在六家夥伴的算力與基礎設施上，其中約 80% 不能取消、用不用都得付；Reuters 報導上市時間可能延到 11 月美國期中選舉之後。", "source_name": "CNBC（引述 Reuters）", "source_url": "https://www.cnbc.com/2026/09/28/anthropics-ipo-prospectus-shows-sweeping-ai-vision-surging-costs-reuters.html"}, {"text": "9/29 美東上午 Claude、Claude Cowork 與 Claude Code 出現錯誤率升高，Anthropic 在狀態頁確認正在處理——那天如果你的 Claude Code 突然卡住，原因在伺服器端不在你的電腦。", "source_name": "TechRadar", "source_url": "https://www.techradar.com/news/live/claude-down-september-29-2026"}, {"text": "OpenAI 在 DevDay 公布：ChatGPT 每週活躍用戶超過 12 億，ChatGPT Work 與 Codex 每週用戶超過 3,500 萬，使用 OpenAI 產品的企業達 250 萬家（公司自報數字）。", "source_name": "OpenAI DevDay 2026 Recap", "source_url": "https://openai.com/index/devday-2026-recap/"}], "term": {"zh": "延遲與吞吐量", "en": "Latency vs Throughput", "explain": "延遲（Latency）是「一個請求從送出到拿到答案要等多久」，常細分成第一個字出來的時間（TTFT）和之後每秒吐幾個 token；吞吐量（Throughput）是「同一批 GPU 一秒總共能處理多少 token」。兩者常互相拉扯：伺服器把很多人的請求併成一大批一起算，GPU 利用率高、每個 token 便宜，但每個人要排隊、等比較久；想讓某個人特別快，就得少併批、多分配算力給他，成本自然變高。OpenAI 的 Ultrafast 檔「貴 6 倍、快 6–8 倍」就是把這個取捨直接標價賣給你。", "analogy": "像 SMT 產線排單：把同料號的單併成大批連續打，換線少、每片成本最低，但急單要排隊；插急單要停線換料，那張單很快出貨，代價是整條線的產能被吃掉——所以急件加價。", "why": "選模型不只看聰明程度和單價，還要看「等多久可以接受」：排程半夜跑的報告不在乎慢，互動式除錯就很在乎。互動任務付速度溢價可能值得，批次任務付了就是浪費。"}};
