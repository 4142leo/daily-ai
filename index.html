  build_ai_page.py 會把 content.json 的內容以 JSON 塞進 {"day": 37, "date": "2026-11-07", "weekday": "週六", "headline": "METR 進駐 Anthropic 評估後說：Anthropic 模型能力進步的速度大約是過去的兩倍，其中約八成要算在「用 AI 幫忙做研發」上，但最關鍵的證據大多被 Anthropic 遮掉；OpenAI 公開資安專用的 GPT-6 Cyber；Claude Code 2.1.319 加了「遇到權限提示直接拒絕」的設定。", "top": [{"tag": "工具", "title": "Claude Code 2.1.319：遇到權限提示可設成直接拒絕、MCP 長任務自動移到背景、修正 Bash 拒絕規則漏抓帶引號的指令", "body": "11/6 上 npm 的版本，上一期只放了版號，這期補內容。跟你比較有關的幾項：新增 permissions.denyInsteadOfPrompting 設定，原本要停下來等你按「允許」的工具呼叫會直接被拒絕、這一輪繼續跑（官方寫適用終端機 session、subagent 和 teammate，沒寫桌面版）。MCP 伺服器如果把工具呼叫當成「任務」執行，終端機版會立刻移到背景、做完再通知 Claude。修正項目：Bash 的拒絕／詢問規則碰到帶引號的指令會漏抓；舊版握手協定的 MCP 伺服器連不上或回空結果；幾乎瞬間跑完的背景 Bash 指令輸出遺失卻回報完成；`timeout 30 rg foo` 這種包一層 timeout 的唯讀指令會多跳權限提示。另外 auto mode 在關閉遙測或走 LLM 閘道時，不再退回內建分類器，沒辦法檢查的動作改成詢問或拒絕。", "analogy": "denyInsteadOfPrompting 像產線上把「遇到異常就停線等班長」改成「遇到異常就把這件挑出來、產線繼續跑」：無人值守時不會整條線卡住，但被挑出來的那幾件要事後自己回頭看。", "why": "你的排程（每日 AI、多益、日文）都是沒人看著在跑，第 26 期就碰過工具要人工核准、只好繞路；這個設定能避免卡住，但會變成「靜悄悄地沒做」，要搭配回報裡寫清楚哪步被拒。", "source_name": "Claude Code CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "研究", "title": "METR 獨立評估：Anthropic 能力進步速度約為過去兩倍，約八成歸因於用 AI 做研發，但多數關鍵證據被遮蔽", "body": "第三方評估機構 METR 從 8/12 到 10/29 派人進 Anthropic 看內部研發資料、訪談約 15 位員工，11/5 公開報告。結論：到 2026 年 10 月，Anthropic 模型在「定義清楚的任務」上進步的速度，大約是 2024 年 3 月到 2025 年 10 月那段的兩倍（METR 自己說落在 1.3 倍到 3 倍都不意外）；用 Anthropic 版的能力指數（AECI）量，2025 年 10 月以後的成長是先前的 1.9 倍（95% 信賴區間 1.5–2.8 倍）。METR 確定加速不是因為訓練算力擴得更快，主觀估計目前的加速約八成來自 AI 協助研發；目前主要還是 AI 幫人做，沒有完全自主做出很關鍵的貢獻，但有「快要出現」的跡象。報告也明講：Anthropic 有權遮蔽非公開資訊，最有說服力的證據大多被遮掉，外界只能信 METR 的判斷。", "analogy": "員工在 Slack 投票自評「用了 AI 自己快了幾倍」，十月最高到 12 倍，但整體進度只快 2 倍——就像每個工站都說自己快了很多，整條線產出卻只多一倍，因為瓶頸站、物料、測試時間都還在。個人加速不等於整體加速。", "why": "這是第一次有外部機構拿到前沿實驗室內部資料，量「AI 幫忙做 AI」到底快了多少；你平常聽到的「AI 研發爆炸」終於有一個有數字、有誤差範圍的版本，也同時看到它有多少是看不到的。", "source_name": "METR（官方報告，11/5）", "source_url": "https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/"}, {"tag": "新模型", "title": "OpenAI 公開 GPT-6 Cyber：資安專用版，自家框架列「資安：最高級（Critical）」，只開放給審核過的 Daybreak Red 組織", "body": "OpenAI 11/5 發布 GPT-6 Cyber 的系統卡（System Card，模型的安全說明書）。它是 GPT-6 Astra 的資安特化版，專門做找漏洞、寫攻擊程式、網站滲透測試這類「有授權的」資安工作，訓練時刻意減少拒答。OpenAI 自評：一般資安協助與漏洞修補任務 100% 有做、攻擊程式開發 96%、紅隊任務 97%。在自家的準備度框架（Preparedness Framework）裡，資安能力評為 Critical（最高級）、生物化學 High、AI 自我改進「低於 High」，跟 GPT-6 Astra 相同。使用門檻：只給審核過的 Daybreak Red 使用者，要驗身分、單一登入、多因素驗證、API 限定來源 IP。上一期那篇 948 個 Linux 提權攻擊程式的研究用的是「即將推出的資安模型」，系統卡沒寫兩者是否同一個，這裡不直接畫等號。", "why": "攻擊能力被廠商自己評到最高級、改成「只賣給驗過身分的人」——你做的連網裝置，往後面對的可能就是這種等級的自動找漏洞工具，預設密碼與除錯埠更不能留。", "source_name": "OpenAI Deployment Safety Hub（GPT-6 Cyber 系統卡）", "source_url": "https://deploymentsafety.openai.com/gpt-6-cyber"}, {"tag": "新模型", "title": "Thinking Machines 推出 Inkling 2 Small：總參數 5,940 億、每次只動 170 億，預告下週開放權重", "body": "前 OpenAI 技術長 Mira Murati 創辦的 Thinking Machines Lab 11/5 發表第二代模型 Inkling 2 Small，是混合專家架構（總參數 5,940 億、每次推論啟用 170 億），支援圖片輸入與可調推論努力等級，在 Artificial Analysis 智力指數拿 31 分。重點放在長時程 agent 寫程式：用數十萬個長任務做強化學習，評分不只看單元測試過沒過，還有另一個 agent 看「解題過程」。目前只能在自家 Tinker 平台用（權重不公開），官方說外部安全測試與紅隊做完後，下週用 Apache 2.0 授權釋出完整權重。官方自己跑的 GPU 核心優化測驗（69 題、10 小時）平均解 54.25 題，低於 Claude Opus 5.5 的 60、GPT-6 Astra 的 63。", "analogy": "「先封閉試產、通過可靠度驗證再開放圖面」：權重就是完整的生產圖面，等外部驗證過才放出去，比直接開源多一道關卡。", "why": "第 34 期教過「開放權重」，這是一個現成例子：先收、驗、再放；如果下週真的放出來，又多一個能自己架、自己微調的中大型 coding 模型選項。", "source_name": "Thinking Machines Lab（官方，11/5）", "source_url": "https://thinkingmachines.ai/news/inkling-2-small/"}], "industry": [{"text": "彭博報導 Google 計畫在懷俄明州 Laramie County 投資約 170 億美元蓋第一座當地資料中心；電力有一部分來自 AEP 約 702 MW 的燃料電池案（Bloom Energy 供貨、Google 簽 20 年購電合約）。170 億這個數字我只看到彭博標題與彙整轉述。", "source_name": "Bloomberg", "source_url": "https://www.bloomberg.com/news/articles/2026-11-05/google-plans-to-spend-17-billion-on-wyoming-data-center"}, {"text": "Business Insider 報導 Thinking Machines 正在完成由 Accel 領投、50 億美元的募資，投前估值 400 億美元，Nvidia 另洽談投資約 25 億美元（公司未證實，我只讀到彙整轉述）。", "source_name": "AI Weekly（轉述 Business Insider）", "source_url": "https://aiweekly.co/ai-news-today/edition/2026-11-06"}, {"text": "Mistral 開放 Studio「託管 agent」公開預覽：Agents SDK、視覺化流程編排、程式沙箱與 subagent，私有雲與地端部署預計 11 月底（只讀到彙整轉述，未讀官方公告）。", "source_name": "AI Weekly", "source_url": "https://aiweekly.co/ai-news-today/edition/2026-11-06"}], "term": {"zh": "遞迴自我改進", "en": "Recursive Self-Improvement, RSI", "explain": "AI 幫忙做出更強的 AI，更強的 AI 又更快做出下一代，形成越轉越快的回饋迴路。要分清楚兩個階段：現在多半是「AI 協助人類研究員」讓研發變快（METR 在 Anthropic 看到的就是這種）；真正讓人擔心的是「AI 自主完成大部分研發」之後，迴路裡的人不再是瓶頸。判斷會不會失控的關鍵是瓶頸：算力、實驗用的機器、資料夠不夠，如果其中一項卡住，迴路就轉不快。METR 這次說「沒看到明顯瓶頸」，這是它覺得值得警惕的原因。", "analogy": "工具機的「母機」原理：用一台精度高的機床做出精度更高的下一代機床，下一代再做出更高的。它能不能一直轉下去，取決於鋼材、電力、量測儀器跟不跟得上——那就是瓶頸。", "why": "各家安全框架都有專門盯這件事的類別：OpenAI 的準備度框架叫「AI 自我改進」（GPT-6 Cyber 評為低於 High），Anthropic 叫「自動化研發風險」。看懂這個詞，才看得懂這類評估報告在擔心什麼。"}} 佔位符。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>

<script>
  const D = {"day": 37, "date": "2026-11-07", "weekday": "週六", "headline": "METR 進駐 Anthropic 評估後說：Anthropic 模型能力進步的速度大約是過去的兩倍，其中約八成要算在「用 AI 幫忙做研發」上，但最關鍵的證據大多被 Anthropic 遮掉；OpenAI 公開資安專用的 GPT-6 Cyber；Claude Code 2.1.319 加了「遇到權限提示直接拒絕」的設定。", "top": [{"tag": "工具", "title": "Claude Code 2.1.319：遇到權限提示可設成直接拒絕、MCP 長任務自動移到背景、修正 Bash 拒絕規則漏抓帶引號的指令", "body": "11/6 上 npm 的版本，上一期只放了版號，這期補內容。跟你比較有關的幾項：新增 permissions.denyInsteadOfPrompting 設定，原本要停下來等你按「允許」的工具呼叫會直接被拒絕、這一輪繼續跑（官方寫適用終端機 session、subagent 和 teammate，沒寫桌面版）。MCP 伺服器如果把工具呼叫當成「任務」執行，終端機版會立刻移到背景、做完再通知 Claude。修正項目：Bash 的拒絕／詢問規則碰到帶引號的指令會漏抓；舊版握手協定的 MCP 伺服器連不上或回空結果；幾乎瞬間跑完的背景 Bash 指令輸出遺失卻回報完成；`timeout 30 rg foo` 這種包一層 timeout 的唯讀指令會多跳權限提示。另外 auto mode 在關閉遙測或走 LLM 閘道時，不再退回內建分類器，沒辦法檢查的動作改成詢問或拒絕。", "analogy": "denyInsteadOfPrompting 像產線上把「遇到異常就停線等班長」改成「遇到異常就把這件挑出來、產線繼續跑」：無人值守時不會整條線卡住，但被挑出來的那幾件要事後自己回頭看。", "why": "你的排程（每日 AI、多益、日文）都是沒人看著在跑，第 26 期就碰過工具要人工核准、只好繞路；這個設定能避免卡住，但會變成「靜悄悄地沒做」，要搭配回報裡寫清楚哪步被拒。", "source_name": "Claude Code CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "研究", "title": "METR 獨立評估：Anthropic 能力進步速度約為過去兩倍，約八成歸因於用 AI 做研發，但多數關鍵證據被遮蔽", "body": "第三方評估機構 METR 從 8/12 到 10/29 派人進 Anthropic 看內部研發資料、訪談約 15 位員工，11/5 公開報告。結論：到 2026 年 10 月，Anthropic 模型在「定義清楚的任務」上進步的速度，大約是 2024 年 3 月到 2025 年 10 月那段的兩倍（METR 自己說落在 1.3 倍到 3 倍都不意外）；用 Anthropic 版的能力指數（AECI）量，2025 年 10 月以後的成長是先前的 1.9 倍（95% 信賴區間 1.5–2.8 倍）。METR 確定加速不是因為訓練算力擴得更快，主觀估計目前的加速約八成來自 AI 協助研發；目前主要還是 AI 幫人做，沒有完全自主做出很關鍵的貢獻，但有「快要出現」的跡象。報告也明講：Anthropic 有權遮蔽非公開資訊，最有說服力的證據大多被遮掉，外界只能信 METR 的判斷。", "analogy": "員工在 Slack 投票自評「用了 AI 自己快了幾倍」，十月最高到 12 倍，但整體進度只快 2 倍——就像每個工站都說自己快了很多，整條線產出卻只多一倍，因為瓶頸站、物料、測試時間都還在。個人加速不等於整體加速。", "why": "這是第一次有外部機構拿到前沿實驗室內部資料，量「AI 幫忙做 AI」到底快了多少；你平常聽到的「AI 研發爆炸」終於有一個有數字、有誤差範圍的版本，也同時看到它有多少是看不到的。", "source_name": "METR（官方報告，11/5）", "source_url": "https://metr.org/blog/2026-11-05-anthropic-ai-rd-acceleration-assessment/"}, {"tag": "新模型", "title": "OpenAI 公開 GPT-6 Cyber：資安專用版，自家框架列「資安：最高級（Critical）」，只開放給審核過的 Daybreak Red 組織", "body": "OpenAI 11/5 發布 GPT-6 Cyber 的系統卡（System Card，模型的安全說明書）。它是 GPT-6 Astra 的資安特化版，專門做找漏洞、寫攻擊程式、網站滲透測試這類「有授權的」資安工作，訓練時刻意減少拒答。OpenAI 自評：一般資安協助與漏洞修補任務 100% 有做、攻擊程式開發 96%、紅隊任務 97%。在自家的準備度框架（Preparedness Framework）裡，資安能力評為 Critical（最高級）、生物化學 High、AI 自我改進「低於 High」，跟 GPT-6 Astra 相同。使用門檻：只給審核過的 Daybreak Red 使用者，要驗身分、單一登入、多因素驗證、API 限定來源 IP。上一期那篇 948 個 Linux 提權攻擊程式的研究用的是「即將推出的資安模型」，系統卡沒寫兩者是否同一個，這裡不直接畫等號。", "why": "攻擊能力被廠商自己評到最高級、改成「只賣給驗過身分的人」——你做的連網裝置，往後面對的可能就是這種等級的自動找漏洞工具，預設密碼與除錯埠更不能留。", "source_name": "OpenAI Deployment Safety Hub（GPT-6 Cyber 系統卡）", "source_url": "https://deploymentsafety.openai.com/gpt-6-cyber"}, {"tag": "新模型", "title": "Thinking Machines 推出 Inkling 2 Small：總參數 5,940 億、每次只動 170 億，預告下週開放權重", "body": "前 OpenAI 技術長 Mira Murati 創辦的 Thinking Machines Lab 11/5 發表第二代模型 Inkling 2 Small，是混合專家架構（總參數 5,940 億、每次推論啟用 170 億），支援圖片輸入與可調推論努力等級，在 Artificial Analysis 智力指數拿 31 分。重點放在長時程 agent 寫程式：用數十萬個長任務做強化學習，評分不只看單元測試過沒過，還有另一個 agent 看「解題過程」。目前只能在自家 Tinker 平台用（權重不公開），官方說外部安全測試與紅隊做完後，下週用 Apache 2.0 授權釋出完整權重。官方自己跑的 GPU 核心優化測驗（69 題、10 小時）平均解 54.25 題，低於 Claude Opus 5.5 的 60、GPT-6 Astra 的 63。", "analogy": "「先封閉試產、通過可靠度驗證再開放圖面」：權重就是完整的生產圖面，等外部驗證過才放出去，比直接開源多一道關卡。", "why": "第 34 期教過「開放權重」，這是一個現成例子：先收、驗、再放；如果下週真的放出來，又多一個能自己架、自己微調的中大型 coding 模型選項。", "source_name": "Thinking Machines Lab（官方，11/5）", "source_url": "https://thinkingmachines.ai/news/inkling-2-small/"}], "industry": [{"text": "彭博報導 Google 計畫在懷俄明州 Laramie County 投資約 170 億美元蓋第一座當地資料中心；電力有一部分來自 AEP 約 702 MW 的燃料電池案（Bloom Energy 供貨、Google 簽 20 年購電合約）。170 億這個數字我只看到彭博標題與彙整轉述。", "source_name": "Bloomberg", "source_url": "https://www.bloomberg.com/news/articles/2026-11-05/google-plans-to-spend-17-billion-on-wyoming-data-center"}, {"text": "Business Insider 報導 Thinking Machines 正在完成由 Accel 領投、50 億美元的募資，投前估值 400 億美元，Nvidia 另洽談投資約 25 億美元（公司未證實，我只讀到彙整轉述）。", "source_name": "AI Weekly（轉述 Business Insider）", "source_url": "https://aiweekly.co/ai-news-today/edition/2026-11-06"}, {"text": "Mistral 開放 Studio「託管 agent」公開預覽：Agents SDK、視覺化流程編排、程式沙箱與 subagent，私有雲與地端部署預計 11 月底（只讀到彙整轉述，未讀官方公告）。", "source_name": "AI Weekly", "source_url": "https://aiweekly.co/ai-news-today/edition/2026-11-06"}], "term": {"zh": "遞迴自我改進", "en": "Recursive Self-Improvement, RSI", "explain": "AI 幫忙做出更強的 AI，更強的 AI 又更快做出下一代，形成越轉越快的回饋迴路。要分清楚兩個階段：現在多半是「AI 協助人類研究員」讓研發變快（METR 在 Anthropic 看到的就是這種）；真正讓人擔心的是「AI 自主完成大部分研發」之後，迴路裡的人不再是瓶頸。判斷會不會失控的關鍵是瓶頸：算力、實驗用的機器、資料夠不夠，如果其中一項卡住，迴路就轉不快。METR 這次說「沒看到明顯瓶頸」，這是它覺得值得警惕的原因。", "analogy": "工具機的「母機」原理：用一台精度高的機床做出精度更高的下一代機床，下一代再做出更高的。它能不能一直轉下去，取決於鋼材、電力、量測儀器跟不跟得上——那就是瓶頸。", "why": "各家安全框架都有專門盯這件事的類別：OpenAI 的準備度框架叫「AI 自我改進」（GPT-6 Cyber 評為低於 High），Anthropic 叫「自動化研發風險」。看懂這個詞，才看得懂這類評估報告在擔心什麼。"}};
