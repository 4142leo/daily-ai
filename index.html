<!--

  build_ai_page.py 會把 content.json 的內容以 JSON 塞進 {"day": 42, "date": "2026-11-14", "weekday": "週六", "headline": "Anthropic 公開「怎麼做出可信的安全評測」：先寫清楚要量什麼、評分模型要先跟人工比對、每個分數都要附誤差範圍——連自家 Opus 5 和 5.5 差 4 個百分點都不敢說誰比較好；美國 11/13 全國航班停飛四小時，部長說原因是老舊電信設備，跟三天前擴大上線的 AI 調度工具無關。", "top": [{"tag": "工具", "title": "Claude Code 2.1.325：修好「背景 session 偷用 shell 裡的 API 金鑰計費」、subagent 換錯模型，另有一個安全修補", "body": "11/13 發布（npm 20:07 UTC；同日稍早的 2.1.324 在 CHANGELOG 沒有獨立條目）。安全面：修補 zstd 壓縮回應解碼的安全問題。跟你最相關的幾條：用 claude.ai 帳號開的背景 session，原本可能改用啟動背景服務那個 shell 裡的 API 金鑰計費，已修正，背景換登入帳號一律拒絕並說明原因；subagent 指定了自己的模型時，原本讀檔、MCP 結果的大小限制卻照主 session 模型算，在 opusplan／haiku 設定下還會被換成 plan mode 的模型，都已修正；Claude Desktop 在資料夾搬移或預熱啟動後，專案自己的 MCP 伺服器（.mcp.json）會被列錯或不見，也修好了；另外讀取自己的 Artifact 不再多問一次權限。", "analogy": "像產線的計費工單貼錯料號：背景工單本來該記在公司帳上，卻抓到旁邊工作站留著的另一張帳號卡。修正後是「卡片不符就停線報錯」，而不是默默換一張卡繼續做。", "why": "你的派工規則是「每個 subagent 顯式指定 model」，這版修的正是指定模型後實際還被主模型或 plan 模型影響的問題；排程任務多半在背景跑，計費帳號被換的問題也直接關係你的額度。", "source_name": "Claude Code CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "研究", "title": "Anthropic 公開安全評測的做法：先講清楚量什麼、評分模型要過人工比對、分數一定附誤差", "body": "Anthropic 11/13 發表〈Building strong safety evaluations〉，把心理學「再現性危機」後的改革（先登記分析計畫、樣本要夠大）搬到 AI 評測。幾個重點：自傷相關對話不能只算「拒答率」，一律拒答會拿滿分但不代表更安全，所以改量「整段對話都恰當」的比例，一次失誤整段算不及格；多輪測試用另一個 Claude 扮演使用者逐步施壓；評分模型要先跟人工標註比對一致度，並換模型或換措辭重評，結論變了就代表量到的是評分者不是被測模型；複雜多輪題至少 100 題、單輪至少 1,000 題。官方舉例：網路交友詐騙評測 Opus 5 得 98%、Opus 5.5 得 94%，但差異不顯著，不能說誰比較好；Fable 5.1 的同一套評測，API 原始模型跟 claude.ai（加系統提示詞）可以差到 34 個百分點。", "analogy": "跟出貨檢驗規範一樣：先定義「良品」是什麼（只看有沒有焊上，還是連空焊、虛焊都算），檢驗機台要先用人工判讀過的樣品做比對（像量測系統分析 GR&R），抽樣數要夠，報告要附允收範圍；換一台 AOI 判定結果就翻盤，代表你量到的是機台，不是板子。", "why": "你看模型發表時的分數比較，至少可以問三件事：它量的到底是什麼、評分的是人還是模型、差距有沒有附誤差範圍；這三件沒交代，幾個百分點的差距不能拿來做選型決定。", "source_name": "Anthropic 研究文章", "source_url": "https://www.anthropic.com/research/building-strong-safety-evaluations"}, {"tag": "政策", "title": "美國全國航班停飛四小時：官方說是老舊類比電信設備過載，跟三天前擴大上線的 AI 調度工具 SMART 無關", "body": "11/13（美東時間）下午 3:54 起，FAA 下令全國停飛，晚上 8:15 解除，是 2023 年 1 月以來第一次全國停飛；美聯社引 Cirium 數據，到晚間 7 點至少 827 個航班轉降。因為 FAA 三天前才把 AI 航路調度建議工具 SMART 擴大到全美 22 個航管中心，國土安全部長 Mullin 記者會上說會一併調查 AI 是否有關。交通部長 Duffy 稍晚說明：原因是老舊類比電信設備的交換器和路由器過載，新裝的數位設備照常運作；SMART 只給航管員建議，沒有接到雷達與航跡核心系統（STARS、ERAM），「不可能」造成這次事故。官方也說沒發現網路攻擊跡象，但根本原因仍在調查。", "analogy": "像產線剛換上一套新的 AI 排程軟體，三天後整條線停擺，大家第一個懷疑新軟體；結果查到是舊配電盤過載。新軟體只是「建議排程」，沒接到設備控制迴路，所以碰不到故障點。", "why": "這是「先查架構再下結論」的好例子：AI 工具接在哪一層（只出建議，還是直接控制）決定它能不能闖這個禍；你設計 agent 權限時也一樣，只給建議的 agent 跟能直接動手的 agent 風險等級完全不同。", "source_name": "AVweb", "source_url": "https://avweb.com/aviation-news/faa-nationwide-ground-stop-lifts-smart-ai/"}, {"tag": "基礎設施", "title": "AMD 推出 MI450X，並宣稱 MI455X 推論比 Nvidia Vera Rubin 快最多 30%——但這是 AMD 自測對比對方公開成績", "body": "AMD 11/12 更新 MI400 系列：新款 MI450X 每顆 288 GB HBM4 記憶體，運算、記憶體頻寬與互連規格跟 MI455X 相同，讓 Helios 整櫃客戶多一個記憶體容量選項；給科學運算的 MI430X 有原生 FP64（雙精度浮點）、432 GB HBM4、每秒 23.3 TB 記憶體頻寬。AMD 也說 MI455X 跑 DeepSeek-R1 每顆每秒 21,333 個 token，比 Nvidia Vera Rubin 已公開的 MLPerf 離線成績高最多 30%；不過這是 AMD 實驗室依 MLPerf 設定自測，不是 MLCommons 正式審核的提交成績，Nvidia 沒有確認。", "analogy": "像供應商拿自家實驗室量的數據，去比競爭對手送第三方實驗室認證的報告：量測條件寫得再接近，也不是同一張認證報告，採購前會要求同條件、同實驗室再量一次。", "why": "這類「自報 vs 第三方」的比較在 AI 晶片和模型發表裡天天出現；跟今天 Anthropic 那篇評測文章一起看，就知道一個數字要先問「誰量的、在什麼條件下量的」。", "source_name": "AMD 新聞室", "source_url": "https://newsroom.amd.com/news/amd-advances-instinct-mi400-series-ai-scientific-computing/"}], "industry": [{"text": "黃仁勳辭職後續：據報導，參議院銀行委員會主席 Tim Scott 要求他與商務部長 Lutnick 下個月出席作證；南韓科技部長說 Nvidia 已確認先前承諾供應南韓 AI 資料中心的 26 萬顆 GPU 照常交貨。Nvidia 11/17 財報將由暫代執行長 Kress 主持。", "source_name": "路透（經 Investing.com）", "source_url": "https://www.investing.com/news/stock-market-news/south-korea-says-nvidia-will-keep-gpu-pledges-after-huangs-resignation-5024668"}, {"text": "Cerebras 第三季財報：據報導，執行長 Feldman 說已簽下約 700 MW 資料中心容量、2027 年底前交付，七成五以上在美國以外；財務長承認給 OpenAI 的第一批容量進度落後原訂時程。Q3 核心營收 2.309 億美元、年增 70%。（依彙整報導，未讀到財報原文）", "source_name": "AI Industry Today", "source_url": "https://aiindustrytoday.com/news/cerebras-700mw-contracted-capacity-end-2027/"}, {"text": "DeepSeek 11/13 擴充開發者 API：內建網頁搜尋、讀網頁、檔案分析與語音工具，另開源一個支援語音輸入與語音回覆的聊天示範程式。（依彙整報導，未讀到官方公告）", "source_name": "TokenPost", "source_url": "https://www.tokenpost.com/news/technology/56779"}], "term": {"zh": "建構效度", "en": "Construct Validity", "explain": "一個評測「量到的東西」跟「你真正想知道的東西」是否一致。例如想知道模型面對自傷話題是否安全，如果只量「拒答率」，一個什麼都拒答的模型會拿滿分，但它沒有做到安全該有的樣子（陪伴對方、指向求助資源、不給方法細節）——這就是建構效度差：分數很漂亮，量錯了東西。Anthropic 今天那篇文章把它列為「如果只做三件事」的第一件：收資料之前先寫下你要量的概念是什麼。另外兩件是評分模型要先跟人工判讀比對、每個數字都附誤差範圍。", "analogy": "像用「導通測試通過率」代表焊接品質：導通過了不代表沒有虛焊或冷焊，板子出貨後一震動就斷。測試項目要對準真正的失效模式，不是對準最容易量的那個數字。", "why": "你之後看任何 AI 排行榜，或自己設計 skill 的驗收標準（例如「看到 VERIFIED 才算發布成功」，而不是「印出 URL 就算」），問的都是同一件事：這個檢查到底有沒有量到你在乎的結果。"}} 佔位符。

  const D = {"day": 42, "date": "2026-11-14", "weekday": "週六", "headline": "Anthropic 公開「怎麼做出可信的安全評測」：先寫清楚要量什麼、評分模型要先跟人工比對、每個分數都要附誤差範圍——連自家 Opus 5 和 5.5 差 4 個百分點都不敢說誰比較好；美國 11/13 全國航班停飛四小時，部長說原因是老舊電信設備，跟三天前擴大上線的 AI 調度工具無關。", "top": [{"tag": "工具", "title": "Claude Code 2.1.325：修好「背景 session 偷用 shell 裡的 API 金鑰計費」、subagent 換錯模型，另有一個安全修補", "body": "11/13 發布（npm 20:07 UTC；同日稍早的 2.1.324 在 CHANGELOG 沒有獨立條目）。安全面：修補 zstd 壓縮回應解碼的安全問題。跟你最相關的幾條：用 claude.ai 帳號開的背景 session，原本可能改用啟動背景服務那個 shell 裡的 API 金鑰計費，已修正，背景換登入帳號一律拒絕並說明原因；subagent 指定了自己的模型時，原本讀檔、MCP 結果的大小限制卻照主 session 模型算，在 opusplan／haiku 設定下還會被換成 plan mode 的模型，都已修正；Claude Desktop 在資料夾搬移或預熱啟動後，專案自己的 MCP 伺服器（.mcp.json）會被列錯或不見，也修好了；另外讀取自己的 Artifact 不再多問一次權限。", "analogy": "像產線的計費工單貼錯料號：背景工單本來該記在公司帳上，卻抓到旁邊工作站留著的另一張帳號卡。修正後是「卡片不符就停線報錯」，而不是默默換一張卡繼續做。", "why": "你的派工規則是「每個 subagent 顯式指定 model」，這版修的正是指定模型後實際還被主模型或 plan 模型影響的問題；排程任務多半在背景跑，計費帳號被換的問題也直接關係你的額度。", "source_name": "Claude Code CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "研究", "title": "Anthropic 公開安全評測的做法：先講清楚量什麼、評分模型要過人工比對、分數一定附誤差", "body": "Anthropic 11/13 發表〈Building strong safety evaluations〉，把心理學「再現性危機」後的改革（先登記分析計畫、樣本要夠大）搬到 AI 評測。幾個重點：自傷相關對話不能只算「拒答率」，一律拒答會拿滿分但不代表更安全，所以改量「整段對話都恰當」的比例，一次失誤整段算不及格；多輪測試用另一個 Claude 扮演使用者逐步施壓；評分模型要先跟人工標註比對一致度，並換模型或換措辭重評，結論變了就代表量到的是評分者不是被測模型；複雜多輪題至少 100 題、單輪至少 1,000 題。官方舉例：網路交友詐騙評測 Opus 5 得 98%、Opus 5.5 得 94%，但差異不顯著，不能說誰比較好；Fable 5.1 的同一套評測，API 原始模型跟 claude.ai（加系統提示詞）可以差到 34 個百分點。", "analogy": "跟出貨檢驗規範一樣：先定義「良品」是什麼（只看有沒有焊上，還是連空焊、虛焊都算），檢驗機台要先用人工判讀過的樣品做比對（像量測系統分析 GR&R），抽樣數要夠，報告要附允收範圍；換一台 AOI 判定結果就翻盤，代表你量到的是機台，不是板子。", "why": "你看模型發表時的分數比較，至少可以問三件事：它量的到底是什麼、評分的是人還是模型、差距有沒有附誤差範圍；這三件沒交代，幾個百分點的差距不能拿來做選型決定。", "source_name": "Anthropic 研究文章", "source_url": "https://www.anthropic.com/research/building-strong-safety-evaluations"}, {"tag": "政策", "title": "美國全國航班停飛四小時：官方說是老舊類比電信設備過載，跟三天前擴大上線的 AI 調度工具 SMART 無關", "body": "11/13（美東時間）下午 3:54 起，FAA 下令全國停飛，晚上 8:15 解除，是 2023 年 1 月以來第一次全國停飛；美聯社引 Cirium 數據，到晚間 7 點至少 827 個航班轉降。因為 FAA 三天前才把 AI 航路調度建議工具 SMART 擴大到全美 22 個航管中心，國土安全部長 Mullin 記者會上說會一併調查 AI 是否有關。交通部長 Duffy 稍晚說明：原因是老舊類比電信設備的交換器和路由器過載，新裝的數位設備照常運作；SMART 只給航管員建議，沒有接到雷達與航跡核心系統（STARS、ERAM），「不可能」造成這次事故。官方也說沒發現網路攻擊跡象，但根本原因仍在調查。", "analogy": "像產線剛換上一套新的 AI 排程軟體，三天後整條線停擺，大家第一個懷疑新軟體；結果查到是舊配電盤過載。新軟體只是「建議排程」，沒接到設備控制迴路，所以碰不到故障點。", "why": "這是「先查架構再下結論」的好例子：AI 工具接在哪一層（只出建議，還是直接控制）決定它能不能闖這個禍；你設計 agent 權限時也一樣，只給建議的 agent 跟能直接動手的 agent 風險等級完全不同。", "source_name": "AVweb", "source_url": "https://avweb.com/aviation-news/faa-nationwide-ground-stop-lifts-smart-ai/"}, {"tag": "基礎設施", "title": "AMD 推出 MI450X，並宣稱 MI455X 推論比 Nvidia Vera Rubin 快最多 30%——但這是 AMD 自測對比對方公開成績", "body": "AMD 11/12 更新 MI400 系列：新款 MI450X 每顆 288 GB HBM4 記憶體，運算、記憶體頻寬與互連規格跟 MI455X 相同，讓 Helios 整櫃客戶多一個記憶體容量選項；給科學運算的 MI430X 有原生 FP64（雙精度浮點）、432 GB HBM4、每秒 23.3 TB 記憶體頻寬。AMD 也說 MI455X 跑 DeepSeek-R1 每顆每秒 21,333 個 token，比 Nvidia Vera Rubin 已公開的 MLPerf 離線成績高最多 30%；不過這是 AMD 實驗室依 MLPerf 設定自測，不是 MLCommons 正式審核的提交成績，Nvidia 沒有確認。", "analogy": "像供應商拿自家實驗室量的數據，去比競爭對手送第三方實驗室認證的報告：量測條件寫得再接近，也不是同一張認證報告，採購前會要求同條件、同實驗室再量一次。", "why": "這類「自報 vs 第三方」的比較在 AI 晶片和模型發表裡天天出現；跟今天 Anthropic 那篇評測文章一起看，就知道一個數字要先問「誰量的、在什麼條件下量的」。", "source_name": "AMD 新聞室", "source_url": "https://newsroom.amd.com/news/amd-advances-instinct-mi400-series-ai-scientific-computing/"}], "industry": [{"text": "黃仁勳辭職後續：據報導，參議院銀行委員會主席 Tim Scott 要求他與商務部長 Lutnick 下個月出席作證；南韓科技部長說 Nvidia 已確認先前承諾供應南韓 AI 資料中心的 26 萬顆 GPU 照常交貨。Nvidia 11/17 財報將由暫代執行長 Kress 主持。", "source_name": "路透（經 Investing.com）", "source_url": "https://www.investing.com/news/stock-market-news/south-korea-says-nvidia-will-keep-gpu-pledges-after-huangs-resignation-5024668"}, {"text": "Cerebras 第三季財報：據報導，執行長 Feldman 說已簽下約 700 MW 資料中心容量、2027 年底前交付，七成五以上在美國以外；財務長承認給 OpenAI 的第一批容量進度落後原訂時程。Q3 核心營收 2.309 億美元、年增 70%。（依彙整報導，未讀到財報原文）", "source_name": "AI Industry Today", "source_url": "https://aiindustrytoday.com/news/cerebras-700mw-contracted-capacity-end-2027/"}, {"text": "DeepSeek 11/13 擴充開發者 API：內建網頁搜尋、讀網頁、檔案分析與語音工具，另開源一個支援語音輸入與語音回覆的聊天示範程式。（依彙整報導，未讀到官方公告）", "source_name": "TokenPost", "source_url": "https://www.tokenpost.com/news/technology/56779"}], "term": {"zh": "建構效度", "en": "Construct Validity", "explain": "一個評測「量到的東西」跟「你真正想知道的東西」是否一致。例如想知道模型面對自傷話題是否安全，如果只量「拒答率」，一個什麼都拒答的模型會拿滿分，但它沒有做到安全該有的樣子（陪伴對方、指向求助資源、不給方法細節）——這就是建構效度差：分數很漂亮，量錯了東西。Anthropic 今天那篇文章把它列為「如果只做三件事」的第一件：收資料之前先寫下你要量的概念是什麼。另外兩件是評分模型要先跟人工判讀比對、每個數字都附誤差範圍。", "analogy": "像用「導通測試通過率」代表焊接品質：導通過了不代表沒有虛焊或冷焊，板子出貨後一震動就斷。測試項目要對準真正的失效模式，不是對準最容易量的那個數字。", "why": "你之後看任何 AI 排行榜，或自己設計 skill 的驗收標準（例如「看到 VERIFIED 才算發布成功」，而不是「印出 URL 就算」），問的都是同一件事：這個檢查到底有沒有量到你在乎的結果。"}};
