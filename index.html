ttps://alignment.anthropic.com/2026/worse-together/"}, {"tag": "工具", "title": "Lovable 生成的 app 大量資料庫沒上鎖：2.4 萬個專案不登入就回傳資料，含護照與 20 萬則聊天", "body": "德國資安公司 Crissy Field 與《商報》（Handelsblatt）合作，從 Common Crawl 網頁封存找出 159,041 個用 vibe coding 平台 Lovable 做出來的專案；其中 34,545 個用 Supabase 當資料庫，24,664 個在不登入的狀態下就回傳資料。外露的包括一家業者的 1,000 多筆護照資料、一個論壇 20 多萬則私人聊天、活動與餐廳的訂單和付款資訊。研究者只用網頁本來就交給瀏覽器的那把公開金鑰做唯讀查詢，沒有破解任何東西。根因是資料表沒設或設錯「列層級安全」（Row Level Security, RLS）規則，不是 Lovable 平台被駭；Lovable 回應說這是 Supabase 使用者普遍的設定問題。", "analogy": "像大樓發給訪客的臨時卡，本來只該開大廳門；但很多棟樓忘了在機房、檔案室門口設讀卡規則，訪客卡一刷全開——卡本身沒問題，是門沒設權限。", "why": "你的 daily-japanese 後端就是 Supabase、網頁裡帶著公開金鑰（anon key）——那把金鑰本來就是公開的，安全全靠 RLS。你當初有設 dj_state 的 RLS；之後新專案接 Supabase，上線前用「沒登入」的狀態實測一次讀不讀得到別人的資料。", "source_name": "Cybernews", "source_url": "https://cybernews.com/security/lovable-ai-apps-expose-personal-information/"}], "industry": [{"text": "Fireworks AI 這次外洩不只牽連 Cursor：Uber 向加州提交通報，說一家服務供應商的內部憑證被盜、司機駕照資料外流，TechCrunch 指出該供應商就是 Fireworks；Notion 上週也確認資料在 Fireworks 事件中被偷。", "source_name": "The Hacker News", "source_url": "https://thehackernews.com/2026/11/stolen-fireworks-ai-key-led-to-cursor.html"}, {"text": "Anthropic 上市進入最後一週：8.25 億股、每股 70–78 美元，最多募 644 億美元，預計 11/19 在 Nasdaq 以代號 ANT 開始交易；另有 260 億美元私募由 Google、Nvidia、AMD 等領投。", "source_name": "The Next Web", "source_url": "https://thenextweb.com/news/anthropic-ipo-terms-1-4-trillion-valuation"}, {"text": "Nvidia 11/17 公布第三季財報，這是黃仁勳 11/12 辭職、財務長 Kress 暫代執行長後的第一次財報（依彙整轉述 Nvidia 公告，未讀原文）。", "source_name": "BYOBot AI Daily Newsstand", "source_url": "https://byobot.ai/ai-news/ai-daily-newsstand-november-14-2026"}], "term": {"zh": "競態條件", "en": "Race Condition", "explain": "結果取決於「誰先到」的先後順序，而這個順序沒有被保證。今天 Anthropic 研究裡的團購例子就是：特殊要求的訊息已經寄出，但負責下單的 agent 在讀到之前就先按了下單——訊息有送到，只是比動作晚一步。多 agent 系統裡，每個 agent 各自讀寫共享狀態（購物車、檔案、預算），只要沒有「先讀完再動手」或「同一時間只准一個改」的規則，就會出現這種結果看運氣、難重現的 bug。", "analogy": "數位電路你很熟：兩條訊號走線長短不同，到正反器的先後不固定，就可能違反 setup／hold time，出現突波或亞穩態——邏輯本身沒錯，錯在時序沒被約束。修法也一樣：加同步（等大家都到了才鎖存），或加互斥（同一時刻只讓一條路寫）。", "why": "你平行派多個 subagent 改同一批檔案、或兩個排程同時寫同一份 log 時就可能踩到；研究裡「讀完訊息才准下單」就是軟體版的時脈同步，「指定隊長」就是互斥。"}} 佔位符。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>

  </div>
</div>

  const D = {"day": 43, "date": "2026-11-15", "weekday": "週日", "headline": "Cursor 公布惡意 Claude Code 擴充的來龍去脈：外包推論廠 Fireworks 的金鑰外流，對話紀錄裡沒遮掉的 API 金鑰被一路串成攻擊鏈；Anthropic 研究發現「每人各派一個 agent」的團隊，結果比一個 agent 統籌全部差 10–45 個百分點；Lovable 生成的 app 有 2.4 萬個資料庫不用登入就讀得到。", "top": [{"tag": "工具", "title": "Cursor 公布根因：外包廠 Fireworks 的金鑰外流 → 對話紀錄裡的金鑰被撿走 → 市集被放進假 Claude Code 擴充", "body": "Cursor 11/13 公布 10/29 事件的完整經過：他們發給 AI 推論供應商 Fireworks AI 的一把存取金鑰外流，攻擊者用它複製一個唯讀儲存桶，裡面是以 2025 年為主、沒開隱私模式（Privacy Mode）使用者的 coding agent 對話紀錄（traces）。紀錄裡有沒被遮掉的 API 金鑰，攻擊者拿來進入 Cursor 用的幾套 SaaS 工具，再拿到能往擴充市集快取放檔案的憑證，10/29 放上竄改過的 Claude Code 擴充 2.1.312／2.1.313，掛了約 11 小時，最多約 5,000 人可能下載到，會嘗試裝 SSH 後門。Cursor 說對話紀錄外露的使用者不到 0.05%、API 憑證外露的客戶不到 0.01%，已把推論流量全部搬離 Fireworks；Anthropic 官方擴充與 Open VSX 沒被動到。", "analogy": "像品牌廠把客戶測試紀錄分享給外包測試廠，紀錄裡夾著廠區門禁卡號；外包廠被偷，小偷拿門禁卡進廠，在出貨倉把一批貨換成仿冒品——客戶下單的是正牌型號，拿到的卻是倉庫被掉包的那批。", "why": "你用的 Claude 桌面版與官方 CLI 不走 Cursor 市集，這次沒受影響；但教訓直接適用：貼進對話的金鑰會跟著紀錄流到你看不到的地方（跟 11/10 那則 settings.local.json 存密碼是同一類問題），金鑰要放憑證庫或環境變數，不要寫進對話或指令。", "source_name": "BleepingComputer", "source_url": "https://www.bleepingcomputer.com/news/security/cursor-confirms-security-breach-led-to-malicious-claude-code-extension/"}, {"tag": "研究", "title": "Anthropic 研究〈Worse Together〉：每人各派一個 agent 搶同一份資源，團隊結果比一個 agent 統籌全部差", "body": "Anthropic 對齊科學部落格 11/11 發表：做了四個多人共用資源的模擬環境（研究員共用 API token 預算、診所行事曆、團購／訂房、有截止時間的 merge 佇列），比較「一個協調者服務所有人」與「每人一個 agent、彼此可傳訊」。四個環境都是協調者贏，Claude Opus 5 與 Sonnet 5 都差約 10–45 個百分點。API 預算環境裡，Opus 5 協調者拿到最佳結果的 64%，每人一 agent 的團隊只有 30%；人越多越多 agent 乾脆不動作（Sonnet 5 從 4 人時 66% 有動作，降到 16 人時 10%）。團購環境裡，特殊要求（例如乳糜瀉要無麩質）有 94–99% 送到了負責下單的 agent，但下單當下真的在它脈絡裡的只有 47–67%。有效的修法很樸素：指定隊長＋寫清楚優先順序，或規定讀完訊息才准下單。其中三個環境釋出為基準測試 MAMUBench。", "analogy": "像每個工站各自排程搶同一台迴焊爐、沒有生管統一排：每站都覺得自己的單最急，有的站一直乾等、有的站把別人的批次擠掉，整條線產出反而比一個生管排的還低。", "why": "要注意研究情境是每個 agent 代表「不同使用者、不同目標」，跟你開會時多個 agent 同一目標不完全一樣；但「指定一個主控收斂」「讀完別人的回報才動手」這兩招，可以直接用在你的派工流程。", "source_name": "Anthropic Alignment Science Blog", "source_url": "https://alignment.anthropic.com/2026/worse-together/"}, {"tag": "工具", "title": "Lovable 生成的 app 大量資料庫沒上鎖：2.4 萬個專案不登入就回傳資料，含護照與 20 萬則聊天", "body": "德國資安公司 Crissy Field 與《商報》（Handelsblatt）合作，從 Common Crawl 網頁封存找出 159,041 個用 vibe coding 平台 Lovable 做出來的專案；其中 34,545 個用 Supabase 當資料庫，24,664 個在不登入的狀態下就回傳資料。外露的包括一家業者的 1,000 多筆護照資料、一個論壇 20 多萬則私人聊天、活動與餐廳的訂單和付款資訊。研究者只用網頁本來就交給瀏覽器的那把公開金鑰做唯讀查詢，沒有破解任何東西。根因是資料表沒設或設錯「列層級安全」（Row Level Security, RLS）規則，不是 Lovable 平台被駭；Lovable 回應說這是 Supabase 使用者普遍的設定問題。", "analogy": "像大樓發給訪客的臨時卡，本來只該開大廳門；但很多棟樓忘了在機房、檔案室門口設讀卡規則，訪客卡一刷全開——卡本身沒問題，是門沒設權限。", "why": "你的 daily-japanese 後端就是 Supabase、網頁裡帶著公開金鑰（anon key）——那把金鑰本來就是公開的，安全全靠 RLS。你當初有設 dj_state 的 RLS；之後新專案接 Supabase，上線前用「沒登入」的狀態實測一次讀不讀得到別人的資料。", "source_name": "Cybernews", "source_url": "https://cybernews.com/security/lovable-ai-apps-expose-personal-information/"}], "industry": [{"text": "Fireworks AI 這次外洩不只牽連 Cursor：Uber 向加州提交通報，說一家服務供應商的內部憑證被盜、司機駕照資料外流，TechCrunch 指出該供應商就是 Fireworks；Notion 上週也確認資料在 Fireworks 事件中被偷。", "source_name": "The Hacker News", "source_url": "https://thehackernews.com/2026/11/stolen-fireworks-ai-key-led-to-cursor.html"}, {"text": "Anthropic 上市進入最後一週：8.25 億股、每股 70–78 美元，最多募 644 億美元，預計 11/19 在 Nasdaq 以代號 ANT 開始交易；另有 260 億美元私募由 Google、Nvidia、AMD 等領投。", "source_name": "The Next Web", "source_url": "https://thenextweb.com/news/anthropic-ipo-terms-1-4-trillion-valuation"}, {"text": "Nvidia 11/17 公布第三季財報，這是黃仁勳 11/12 辭職、財務長 Kress 暫代執行長後的第一次財報（依彙整轉述 Nvidia 公告，未讀原文）。", "source_name": "BYOBot AI Daily Newsstand", "source_url": "https://byobot.ai/ai-news/ai-daily-newsstand-november-14-2026"}], "term": {"zh": "競態條件", "en": "Race Condition", "explain": "結果取決於「誰先到」的先後順序，而這個順序沒有被保證。今天 Anthropic 研究裡的團購例子就是：特殊要求的訊息已經寄出，但負責下單的 agent 在讀到之前就先按了下單——訊息有送到，只是比動作晚一步。多 agent 系統裡，每個 agent 各自讀寫共享狀態（購物車、檔案、預算），只要沒有「先讀完再動手」或「同一時間只准一個改」的規則，就會出現這種結果看運氣、難重現的 bug。", "analogy": "數位電路你很熟：兩條訊號走線長短不同，到正反器的先後不固定，就可能違反 setup／hold time，出現突波或亞穩態——邏輯本身沒錯，錯在時序沒被約束。修法也一樣：加同步（等大家都到了才鎖存），或加互斥（同一時刻只讓一條路寫）。", "why": "你平行派多個 subagent 改同一批檔案、或兩個排程同時寫同一份 log 時就可能踩到；研究裡「讀完訊息才准下單」就是軟體版的時脈同步，「指定隊長」就是互斥。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  document.title = "每日 AI 情報 #" + (D.day||"") + " · " + (D.date||"");
  document.getElementById("term-file").textContent = "ai-daily.log — day " + (D.day||"") + " (" + (D.date||"") + ")";
  document.getElementById("h-title").textContent = "AI 每日速報 #" + (D.day||"");
  document.getElementById("h-date").textContent = (D.date||"") + (D.weekday?("（"+D.weekday+"）"):"");
  document.getElementById("headline").textContent = D.headline||"";

  document.getElementById("top").innerHTML = (D.top||[]).map(t=>`
    <div class="card">
      ${t.tag?`<span class="chip">${esc(t.tag)}</span>`:""}
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.body)}</p>
      ${t.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(t.analogy)}</div>`:""}
      ${t.why?`<div class="why"><b>為什麼你該知道：</b>${esc(t.why)}</div>`:""}
      ${t.source_url?`<div class="src">來源：<a href="${esc(t.source_url)}" target="_blank" rel="noopener">${esc(t.source_name||t.source_url)}</a></div>`:""}
    </div>`).join("");

  document.getElementById("industry").innerHTML = (D.industry||[]).map(i=>`
    <li>${esc(i.text)} ${i.source_url?`· <a href="${esc(i.source_url)}" target="_blank" rel="noopener">${esc(i.source_name||"來源")}</a>`:""}</li>`).join("");

  const tm = D.term||{};
  document.getElementById("term").innerHTML = `
    <div class="term">
      <div class="name">${esc(tm.zh||"")}<span class="en">${esc(tm.en||"")}</span></div>
      <p>${esc(tm.explain||"")}</p>
      ${tm.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(tm.analogy)}</div>`:""}
      ${tm.why?`<p class="why"><b>為什麼重要：</b>${esc(tm.why)}</p>`:""}
    </div>`;

  document.getElementById("footer").innerHTML =
    "每天自動更新 · 由 Claude 依當日公開新聞整理，僅供快速掌握趨勢，重要決策請點來源查證<br>#" +
    (D.day||"") + " · " + (D.date||"");
</script>
