星第三季營業利益初估 107.4 兆韓元、年增約 8.8 倍，南韓企業首次單季破百兆；記憶體缺貨預期延續到 2027 年以後", "body": "三星 10/8 公布初步財測：第三季營業利益約 107.4 兆韓元（約 800 億美元），2025 年同期是 12.17 兆；營收約 195 兆韓元。這是南韓企業第一次單季營業利益破百兆，也是三星連續第四季創新高。主因是一般 DRAM 和 NAND 供給吃緊、價格上漲，加上 AI 晶片用的高頻寬記憶體（HBM）需求持續增加。缺貨會持續多久各家說法不同，有報導說到 2027 年、也有說到 2028 年。這是初估數字，完整財報預計 10/29 公布。", "analogy": "跟上一期 Apple 砍單是同一條供應鏈的兩端：記憶體廠把產能優先給出價最高的 AI 資料中心，賺到創紀錄的錢；買不到便宜記憶體的消費性產品，就只能漲價或減產。", "why": "記憶體廠賺得越多，代表買方越吃虧。你的電子紙產品如果用到 Flash 或帶記憶體的 MCU，這兩年報價和交期都可能被擠壓，備料時可以提早鎖價或多找一家來源。", "source_name": "The Next Web", "source_url": "https://thenextweb.com/news/samsung-q3-2026-record-profit-ai-memory"}], "industry": [{"text": "Apple 10/13（美東時間，台灣週二晚間）在紐約舉辦「Welcome home」活動，外界預期發表第一台智慧家庭中樞（傳約 6 吋方形螢幕、以 Siri AI 語音操作），也可能更新 HomePod mini 和 Apple TV。產品規格與價格目前都是傳聞，Apple 尚未公布。", "source_name": "iPhone in Canada", "source_url": "https://www.iphoneincanada.ca/2026/10/08/apple-october-13-welcome-home/"}, {"text": "USA Today Co. 與旗下 19 家報紙 10/8 在曼哈頓聯邦法院控告 OpenAI，指其未經許可用數十萬篇文章訓練模型，求償超過 2.5 億美元並要求禁止侵權。這些是起訴書的主張，法院尚未判斷；OpenAI 當時未回應。", "source_name": "Windows Report（轉述 Reuters）", "source_url": "https://windowsreport.com/?p=1511893"}, {"text": "中共中央與國務院 10/9 發布發展「新質生產力」的指導意見：全面推動「AI+」、加快 AI 手機、電腦與人形機器人上市，同時要建立 AI 風險監測與預警機制，並警告避免盲目投資和科技泡沫，造成重大損失的官員要被追責。", "source_name": "The Standard（轉述 Reuters）", "source_url": "https://www.thestandard.com.hk/innovation/article/345071/China-vows-to-curb-tech-bubbles-keep-AI-risks-in-check"}], "term": {"zh": "最小權限原則", "en": "Principle of Least Privilege", "explain": "只給一個程式或 agent 完成任務「剛好需要」的權限，多一點都不給。要整理報告的 agent 只需要讀那個資料夾，就不給它寫入權、不給它整顆硬碟、也不給它連網。這樣它就算被惡意網頁誘導，或者自己判斷錯誤，能造成的損害也只限在那一小塊範圍裡。實務上通常分三步：先列出任務真正會用到的資源，再預設全部拒絕、逐項開放，最後用紀錄檢查有沒有開太多。微軟 MXC 的「學習模式」就是第三步的工具：先跑一輪，看 agent 實際碰了哪些東西，再把政策收緊。", "analogy": "像無塵室的門禁分級：清潔人員的卡只開走廊，製程工程師的卡只開他負責的那區，沒有人拿一張萬用卡進出全廠。某張卡掉了，損失也只限於那一區。", "why": "你的 settings 裡那些允許規則，本質上就是在調權限範圍。每次覺得權限彈窗很煩、想直接開大一點的時候，先想一下：這個 agent 真的需要這麼大的範圍嗎？上一期 Anthropic 報告裡那些「做過頭」的案例，大多是因為模型手上剛好有那個權限。"}} 佔位符。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>

  const D = {"day": 23, "date": "2026-10-12", "weekday": "週一", "headline": "微軟把「管 agent 的規則」正式搬到 agent 外面：Execution Containers 上市，由作業系統決定 agent 能碰哪些檔案、能不能連網，Claude Code 列在「即將支援」；同一週 CrowdStrike 追南韓銀行駭客，線索來自攻擊者自己沒鎖好的 AI 對話紀錄。", "top": [{"tag": "工具", "title": "微軟 Execution Containers 正式上市：agent 能讀哪些資料夾、能不能連網，由作業系統層的政策決定，agent 自己改不了", "body": "微軟 10/7 宣布 Microsoft Execution Containers（MXC）正式上市。它是一層獨立於 agent 之外的執行環境：開發者或 IT 先寫好政策，規定 agent 可以改哪些位置、哪些只能讀、哪些完全不能碰，能不能對外連線，能不能操作桌面畫面，然後由系統強制執行。隔離強度分四級：最輕的 process container（Windows 11、macOS、Linux 都有）、獨立 Windows 帳號的 session container、WSL container，以及仍屬實驗性質的 MicroVM（硬體虛擬化）。另有「學習模式」：超出範圍的動作會被擋下並記成 JSON 報告，方便邊跑邊調政策。已支援的包括 GitHub Copilot、OpenAI Codex、LM Studio 等；Anthropic 的 Claude Code 列在「將陸續支援」，尚無時程。", "analogy": "像產線上的安全圍籬加門禁卡：不是在機器手臂的程式裡寫「請不要伸出圍籬」，而是直接把圍籬焊在地上，手臂程式寫錯了也伸不出去。學習模式就像試產期先裝感測器記錄「哪裡差點撞到」，再決定圍籬要拉多寬。", "why": "你現在擋 agent 亂動檔案，靠的是 Claude Code 自己的權限規則和 hooks，也就是「agent 自己守規矩」。MXC 是在它外面多一道作業系統層的牆。等 Claude Code 支援、你的 Windows 11 也能用時，值得評估要不要讓排程任務跑在這種隔離環境裡。", "source_name": "Windows Developer Blog", "source_url": "https://blogs.windows.com/windowsdeveloper/2026/10/07/microsoft-execution-containers-policy-driven-containment-for-ai-agents/"}, {"tag": "研究", "title": "CrowdStrike 追南韓銀行駭客：攻擊者用 AI 工具打銀行，自己的 AI 對話紀錄卻放在公開資料夾，露出年齡與住處線索", "body": "CrowdStrike 10/7 發布報告：9 月底到 10 月初鎖定南韓金融機構的攻擊，攻擊者用了中國開發的開源滲透測試工具 ARTEX，搭配 Claude Code 等 AI 工具。研究人員在攻擊者架設的伺服器上，找到放在公開資料夾裡的 AI 對話紀錄，其中一段要 Claude 寫一份含年齡、大學與廣東住址的履歷，另一段在問南韓外洩資料去哪裡賣。CrowdStrike 以「中等信心」判斷攻擊者說中文、為錢犯案，但也說這些細節不一定能確定指向某個人；目前沒有人被點名或起訴。南韓警方調查涵蓋 7 家金融機構，新韓銀行約 2.5 萬名客戶個資外洩。報導時 Anthropic 尚未回應。", "analogy": "像有人用借來的精密量測設備去偷測別人的產品，結果把整份量測記錄（含自己的工號）留在共用磁碟上沒鎖。工具本身讓門檻變低，但操作記錄也成了最直接的證據。", "why": "兩個面向跟你有關。第一，AI 工具降低了攻擊門檻，這是第 19 期新韓銀行事件的後續。第二，AI 對話紀錄和記憶檔裡常常藏著你自己都忘了寫進去的個人資訊；你的 session 紀錄、記憶檔、每週備份上雲的內容，一樣要注意存放位置和權限。", "source_name": "The Next Web", "source_url": "https://thenextweb.com/news/crowdstrike-south-korea-bank-hack-suspect-china"}, {"tag": "基礎設施", "title": "三星第三季營業利益初估 107.4 兆韓元、年增約 8.8 倍，南韓企業首次單季破百兆；記憶體缺貨預期延續到 2027 年以後", "body": "三星 10/8 公布初步財測：第三季營業利益約 107.4 兆韓元（約 800 億美元），2025 年同期是 12.17 兆；營收約 195 兆韓元。這是南韓企業第一次單季營業利益破百兆，也是三星連續第四季創新高。主因是一般 DRAM 和 NAND 供給吃緊、價格上漲，加上 AI 晶片用的高頻寬記憶體（HBM）需求持續增加。缺貨會持續多久各家說法不同，有報導說到 2027 年、也有說到 2028 年。這是初估數字，完整財報預計 10/29 公布。", "analogy": "跟上一期 Apple 砍單是同一條供應鏈的兩端：記憶體廠把產能優先給出價最高的 AI 資料中心，賺到創紀錄的錢；買不到便宜記憶體的消費性產品，就只能漲價或減產。", "why": "記憶體廠賺得越多，代表買方越吃虧。你的電子紙產品如果用到 Flash 或帶記憶體的 MCU，這兩年報價和交期都可能被擠壓，備料時可以提早鎖價或多找一家來源。", "source_name": "The Next Web", "source_url": "https://thenextweb.com/news/samsung-q3-2026-record-profit-ai-memory"}], "industry": [{"text": "Apple 10/13（美東時間，台灣週二晚間）在紐約舉辦「Welcome home」活動，外界預期發表第一台智慧家庭中樞（傳約 6 吋方形螢幕、以 Siri AI 語音操作），也可能更新 HomePod mini 和 Apple TV。產品規格與價格目前都是傳聞，Apple 尚未公布。", "source_name": "iPhone in Canada", "source_url": "https://www.iphoneincanada.ca/2026/10/08/apple-october-13-welcome-home/"}, {"text": "USA Today Co. 與旗下 19 家報紙 10/8 在曼哈頓聯邦法院控告 OpenAI，指其未經許可用數十萬篇文章訓練模型，求償超過 2.5 億美元並要求禁止侵權。這些是起訴書的主張，法院尚未判斷；OpenAI 當時未回應。", "source_name": "Windows Report（轉述 Reuters）", "source_url": "https://windowsreport.com/?p=1511893"}, {"text": "中共中央與國務院 10/9 發布發展「新質生產力」的指導意見：全面推動「AI+」、加快 AI 手機、電腦與人形機器人上市，同時要建立 AI 風險監測與預警機制，並警告避免盲目投資和科技泡沫，造成重大損失的官員要被追責。", "source_name": "The Standard（轉述 Reuters）", "source_url": "https://www.thestandard.com.hk/innovation/article/345071/China-vows-to-curb-tech-bubbles-keep-AI-risks-in-check"}], "term": {"zh": "最小權限原則", "en": "Principle of Least Privilege", "explain": "只給一個程式或 agent 完成任務「剛好需要」的權限，多一點都不給。要整理報告的 agent 只需要讀那個資料夾，就不給它寫入權、不給它整顆硬碟、也不給它連網。這樣它就算被惡意網頁誘導，或者自己判斷錯誤，能造成的損害也只限在那一小塊範圍裡。實務上通常分三步：先列出任務真正會用到的資源，再預設全部拒絕、逐項開放，最後用紀錄檢查有沒有開太多。微軟 MXC 的「學習模式」就是第三步的工具：先跑一輪，看 agent 實際碰了哪些東西，再把政策收緊。", "analogy": "像無塵室的門禁分級：清潔人員的卡只開走廊，製程工程師的卡只開他負責的那區，沒有人拿一張萬用卡進出全廠。某張卡掉了，損失也只限於那一區。", "why": "你的 settings 裡那些允許規則，本質上就是在調權限範圍。每次覺得權限彈窗很煩、想直接開大一點的時候，先想一下：這個 agent 真的需要這麼大的範圍嗎？上一期 Anthropic 報告裡那些「做過頭」的案例，大多是因為模型手上剛好有那個權限。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  document.title = "每日 AI 情報 #" + (D.day||"") + " · " + (D.date||"");
  document.getElementById("term-file").textContent = "ai-daily.log — day " + (D.day||"") + " (" + (D.date||"") + ")";
  document.getElementById("h-title").textContent = "AI 每日速報 #" + (D.day||"");
  document.getElementById("h-date").textContent = (D.date||"") + (D.weekday?("（"+D.weekday+"）"):"");
  document.getElementById("headline").textContent = D.headline||"";

  document.getElementById("top").innerHTML = (D.top||[]).map(t=>`
    <div class="card">
      ${t.tag?`<span class="chip">${esc(t.tag)}</span>`:""}
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.body)}</p>
      ${t.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(t.analogy)}</div>`:""}
      ${t.why?`<div class="why"><b>為什麼你該知道：</b>${esc(t.why)}</div>`:""}
      ${t.source_url?`<div class="src">來源：<a href="${esc(t.source_url)}" target="_blank" rel="noopener">${esc(t.source_name||t.source_url)}</a></div>`:""}
    </div>`).join("");

  document.getElementById("industry").innerHTML = (D.industry||[]).map(i=>`
    <li>${esc(i.text)} ${i.source_url?`· <a href="${esc(i.source_url)}" target="_blank" rel="noopener">${esc(i.source_name||"來源")}</a>`:""}</li>`).join("");

  const tm = D.term||{};
  document.getElementById("term").innerHTML = `
    <div class="term">
      <div class="name">${esc(tm.zh||"")}<span class="en">${esc(tm.en||"")}</span></div>
      <p>${esc(tm.explain||"")}</p>
      ${tm.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(tm.analogy)}</div>`:""}
      ${tm.why?`<p class="why"><b>為什麼重要：</b>${esc(tm.why)}</p>`:""}
    </div>`;

  document.getElementById("footer").innerHTML =
    "每天自動更新 · 由 Claude 依當日公開新聞整理，僅供快速掌握趨勢，重要決策請點來源查證<br>#" +
    (D.day||"") + " · " + (D.date||"");
</script>
