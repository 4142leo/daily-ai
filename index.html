OpenAI 10/26 推出 GPT-6.1 Terra，API 價格是每百萬輸入 token 1 美元、輸出 5 美元，官方說比上一代 GPT-5.6 Terra 和自家的 GPT-6.1 Sol 都便宜一半。ChatGPT Work 與 Codex 的 Plus、Pro、Enterprise、Edu 用戶已經可以用。官方說它做電腦操作任務比 GPT-6 Astra、GPT-6.1 Sol 快 3 倍以上；在一套 OpenAI 自己設計、專門誘發錯誤的測試裡，低努力等級的錯誤率從上一代的 53.6% 降到 16.7%。這些數字全部是 OpenAI 自己報的；寫程式方面，Terminal-Bench 4.0 拿到 50.3%，OpenAI 也說最難的程式工作還是建議用 Sol 或 Astra。", "why": "中階模型便宜一半、速度快 3 倍，代表「讓 AI 幫忙點網頁、填表單」這類工作會越做越便宜。不過 16.7% 是故意挑難題的測試結果，不能直接當成平常使用的錯誤率。", "source_name": "BleepingComputer（10/26）", "source_url": "https://bleepingcomputer.com/news/artificial-intelligence/openai-launches-gpt-61-terra-with-3x-faster-ai-agents-50-percent-lower-pricing"}], "industry": [{"text": "OpenAI 執行長 Altman 10/31 短暫訪韓，跟三星集團、SK 集團的高層見面；Digitimes 說背景是記憶體供貨越來越緊，會談的具體內容和數字報導沒有寫（全文需付費，只讀到開頭）。", "source_name": "Digitimes（11/2）", "source_url": "https://digitimes.com/news/a20261102VL211/openai-sam-altman-samsung-sk-hynix-memory-chips-demand.html"}, {"text": "月之暗面（Moonshot）10/23 開放 Kimi K3.1 Pro 的 API，答應 11/4 公開完整權重（總參數 2.8 兆、每次啟用 1,040 億）。目前權重還沒釋出，授權條款也還沒公布；上一版 K3 的權重有照承諾的日期放出來。", "source_name": "Let's Data Science", "source_url": "https://letsdatascience.com/news/moonshot-releases-kimi-k31-pro-api-open-weights-due-nov-4-786e160c"}, {"text": "TechCrunch 報導新創 Runware 想用造車的方式量產資料中心：把模組先在工廠組好，運到現場後 48 小時內上線。", "source_name": "TechCrunch（10/30）", "source_url": "https://techcrunch.com/2026/10/30/can-ai-data-centers-be-mass-produced-like-cars-and-online-in-48-hours-this-startup-aims-to-find-out"}], "term": {"zh": "開放權重與開源", "en": "Open Weights vs Open Source", "explain": "模型的「權重」就是訓練完成後的那一大串數字，有了它就能在自己的機器上跑模型。「開放權重」指公開這串數字讓人下載，但訓練資料、訓練程式通常不會公開，使用條件也要看授權條款，有些禁止商用，有些限制用戶規模。「開源」原本的意思更嚴格：要能看到完整原始碼、自由修改、自由再散布。所以 Kimi、Llama 這類模型大多該叫「開放權重」，不一定算真正的開源。判斷一個模型能不能拿來用，要看三件事：權重能不能下載、授權允許做什麼、自己的硬體跑不跑得動（例如 K3 整包約 1.4 TB）。", "analogy": "開放權重像廠商給你一顆已經燒好韌體的晶片，可以裝進產品，但拿不到原始碼和編譯環境，也不能自己重編。開源則是連韌體原始碼、建置腳本一起給你。授權條款就是那份規定能不能量產販售的合約。", "why": "你手上有本機 RAG 這類在自己電腦跑的工具，以後想換一個本機模型時，先看授權能不能用在 Aqive 的產品或工作上，再看自己的硬體跑不跑得動，不要看到「開源」兩個字就直接拿來用。" <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>

  <div class="term-bar">

    <ul class="ind" id="industry"></ul>

    <div class="sec-title">今日一詞</div>
    <div id="term"></div>

    <footer id="footer"></footer>
  </div>
</div>
<script>
  const D = {"day": 34, "date": "2026-11-02", "weekday": "週一", "headline": "Anthropic 10/26 公開上市申請書（S-1），預計在 Nasdaq 掛牌、代號 ANT：今年上半年營收 163 億美元，第二季第一次營業獲利；同一天 OpenAI 推出價格只有一半的 GPT-6.1 Terra；Claude Code 2.1.316 加了「subagent 預設努力等級」設定，也修好 PowerShell hook 某些寫法擋不住的問題。", "top": [{"tag": "工具", "title": "Claude Code 2.1.316：可以統一設定 subagent 的努力等級，修好 PowerShell hook 和 Windows 搜尋卡住的問題", "body": "npm 上 2.1.315（10/30）和 2.1.316（10/31）兩版都已發布，但官方 CHANGELOG 只寫了 2.1.316，2.1.315 改了什麼沒有說明。2.1.316 跟你比較有關的有四項：①新增環境變數 CLAUDE_CODE_SUBAGENT_EFFORT，subagent 沒被指定努力等級時就用這個值，不再沿用主對話的等級；②修好 PowerShell hook 的一個問題：指令開頭是型別轉換、param、using 或屬性時，hook 回傳結束碼 2 卻沒擋下；③修好 Windows 上 Grep／Glob 逾時後搜尋程序沒結束、工具一直不回應；④修好「subagent 沿用上一層 subagent 的模型，被背景工作喚醒後卻換成主模型」。另外公告：Opus 4.8 的快速模式（fast mode）從 10/30 起停用，11/30 正式移除，移除後不會自動改用一般模式，而是直接報錯。", "analogy": "努力等級像機台的加工參數。以前子產線一律照母產線的參數跑，現在可以另外設一組子產線預設值，簡單的工單不必用最精細的那檔慢慢做。", "why": "你的規則是派工要指定模型；現在連努力等級也能統一設，掃檔用的 haiku subagent 可以設低一點，省時間也省額度。你用 PowerShell 寫 hook，第②項修好的正是 hook 會漏擋的情況。", "source_name": "Claude Code 官方 CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "產業", "title": "Anthropic 公開上市申請書：上半年營收 163 億美元、Q2 首度營業獲利，也寫進「4 個模型連到真實系統」的風險", "body": "Anthropic 10/26 向美國證管會公開 S-1 申請書，計畫在 Nasdaq 上市、代號 ANT，承銷商由 Goldman Sachs、Morgan Stanley 帶頭，發行價和股數還沒填。2026 上半年營收 163 億美元，去年同期是 11.6 億；第二季營收 116 億，營業利益 9.74 億美元，是公司第一次營業獲利。上半年帳面淨損 807 億美元，大部分是可轉債隨公司估值上漲重新評價造成的，不是實際付出去的現金。創辦人透過一張特別股握有 50.1% 投票權。風險章節寫到一次測試設定出錯，讓模型連上網路，4 個模型因此碰到第三方的真實系統，Anthropic 說已通知受影響的單位。另外多家媒體引述申請書指出，Anthropic 曾把新一代基礎模型的預訓練延後一個多月，先補強模型權重防竊的措施。", "analogy": "S-1 像公司上市前交出的完整驗廠報告：營收、虧損、客戶集中度、出過的品質事故都要白紙黑字寫出來，寫錯要負法律責任。比起看新聞稿，讀這份文件更接近真實狀況。", "why": "你每天用的 Claude 背後是這家公司。上市之後財報和事故每季都得公開，像這次寫進去的測試事故，以後會有比較穩定的資訊管道可以追蹤。", "source_name": "The Next Web（10/26）", "source_url": "https://thenextweb.com/news/anthropic-ipo-filing-nasdaq-ant-s-1"}, {"tag": "新模型", "title": "OpenAI 推出 GPT-6.1 Terra：中階模型，價格只有上一代一半，主打代替人操作電腦", "body": "OpenAI 10/26 推出 GPT-6.1 Terra，API 價格是每百萬輸入 token 1 美元、輸出 5 美元，官方說比上一代 GPT-5.6 Terra 和自家的 GPT-6.1 Sol 都便宜一半。ChatGPT Work 與 Codex 的 Plus、Pro、Enterprise、Edu 用戶已經可以用。官方說它做電腦操作任務比 GPT-6 Astra、GPT-6.1 Sol 快 3 倍以上；在一套 OpenAI 自己設計、專門誘發錯誤的測試裡，低努力等級的錯誤率從上一代的 53.6% 降到 16.7%。這些數字全部是 OpenAI 自己報的；寫程式方面，Terminal-Bench 4.0 拿到 50.3%，OpenAI 也說最難的程式工作還是建議用 Sol 或 Astra。", "why": "中階模型便宜一半、速度快 3 倍，代表「讓 AI 幫忙點網頁、填表單」這類工作會越做越便宜。不過 16.7% 是故意挑難題的測試結果，不能直接當成平常使用的錯誤率。", "source_name": "BleepingComputer（10/26）", "source_url": "https://bleepingcomputer.com/news/artificial-intelligence/openai-launches-gpt-61-terra-with-3x-faster-ai-agents-50-percent-lower-pricing"}], "industry": [{"text": "OpenAI 執行長 Altman 10/31 短暫訪韓，跟三星集團、SK 集團的高層見面；Digitimes 說背景是記憶體供貨越來越緊，會談的具體內容和數字報導沒有寫（全文需付費，只讀到開頭）。", "source_name": "Digitimes（11/2）", "source_url": "https://digitimes.com/news/a20261102VL211/openai-sam-altman-samsung-sk-hynix-memory-chips-demand.html"}, {"text": "月之暗面（Moonshot）10/23 開放 Kimi K3.1 Pro 的 API，答應 11/4 公開完整權重（總參數 2.8 兆、每次啟用 1,040 億）。目前權重還沒釋出，授權條款也還沒公布；上一版 K3 的權重有照承諾的日期放出來。", "source_name": "Let's Data Science", "source_url": "https://letsdatascience.com/news/moonshot-releases-kimi-k31-pro-api-open-weights-due-nov-4-786e160c"}, {"text": "TechCrunch 報導新創 Runware 想用造車的方式量產資料中心：把模組先在工廠組好，運到現場後 48 小時內上線。", "source_name": "TechCrunch（10/30）", "source_url": "https://techcrunch.com/2026/10/30/can-ai-data-centers-be-mass-produced-like-cars-and-online-in-48-hours-this-startup-aims-to-find-out"}], "term": {"zh": "開放權重與開源", "en": "Open Weights vs Open Source", "explain": "模型的「權重」就是訓練完成後的那一大串數字，有了它就能在自己的機器上跑模型。「開放權重」指公開這串數字讓人下載，但訓練資料、訓練程式通常不會公開，使用條件也要看授權條款，有些禁止商用，有些限制用戶規模。「開源」原本的意思更嚴格：要能看到完整原始碼、自由修改、自由再散布。所以 Kimi、Llama 這類模型大多該叫「開放權重」，不一定算真正的開源。判斷一個模型能不能拿來用，要看三件事：權重能不能下載、授權允許做什麼、自己的硬體跑不跑得動（例如 K3 整包約 1.4 TB）。", "analogy": "開放權重像廠商給你一顆已經燒好韌體的晶片，可以裝進產品，但拿不到原始碼和編譯環境，也不能自己重編。開源則是連韌體原始碼、建置腳本一起給你。授權條款就是那份規定能不能量產販售的合約。", "why": "你手上有本機 RAG 這類在自己電腦跑的工具，以後想換一個本機模型時，先看授權能不能用在 Aqive 的產品或工作上，再看自己的硬體跑不跑得動，不要看到「開源」兩個字就直接拿來用。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  document.title = "每日 AI 情報 #" + (D.day||"") + " · " + (D.date||"");
  document.getElementById("term-file").textContent = "ai-daily.log — day " + (D.day||"") + " (" + (D.date||"") + ")";
  document.getElementById("h-title").textContent = "AI 每日速報 #" + (D.day||"");
  document.getElementById("h-date").textContent = (D.date||"") + (D.weekday?("（"+D.weekday+"）"):"");
  document.getElementById("headline").textContent = D.headline||"";

  document.getElementById("top").innerHTML = (D.top||[]).map(t=>`
    <div class="card">
      ${t.tag?`<span class="chip">${esc(t.tag)}</span>`:""}
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.body)}</p>
      ${t.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(t.analogy)}</div>`:""}
      ${t.why?`<div class="why"><b>為什麼你該知道：</b>${esc(t.why)}</div>`:""}
      ${t.source_url?`<div class="src">來源：<a href="${esc(t.source_url)}" target="_blank" rel="noopener">${esc(t.source_name||t.source_url)}</a></div>`:""}
    </div>`).join("");

  document.getElementById("industry").innerHTML = (D.industry||[]).map(i=>`
    <li>${esc(i.text)} ${i.source_url?`· <a href="${esc(i.source_url)}" target="_blank" rel="noopener">${esc(i.source_name||"來源")}</a>`:""}</li>`).join("");

  const tm = D.term||{};
  document.getElementById("term").innerHTML = `
    <div class="term">
      <div class="name">${esc(tm.zh||"")}<span class="en">${esc(tm.en||"")}</span></div>
      <p>${esc(tm.explain||"")}</p>
      ${tm.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(tm.analogy)}</div>`:""}
      ${tm.why?`<p class="why"><b>為什麼重要：</b>${esc(tm.why)}</p>`:""}
    </div>`;

  document.getElementById("footer").innerHTML =
    "每天自動更新 · 由 Claude 依當日公開新聞整理，僅供快速掌握趨勢，重要決策請點來源查證<br>#" +
    (D.day||"") + " · " + (D.date||"");
</script>
