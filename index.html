ack、Shopify 等，平常自己讀資料、打草稿，只在需要你決定時才通知。發信、付款、簽文件、刪除東西之前會先列出要做的動作等你核准；交易證券、帳戶間轉帳則是核准了也不做。底層是 Opus 5.5，預覽期間跟其他 Claude 功能共用額度。", "why": "這跟你在電腦上用排程跑 agent 是同一個方向，只是搬到雲端、面向一般人；它把「哪些動作要人核准、哪些永遠不給做」寫得很清楚，是你設計自己 hook 與權限規則時可以直接參考的分級。", "source_name": "Claude 官方說明", "source_url": "https://claude.com/resources/articles/claude-duet"}, {"tag": "產業", "title": "美光桃園工會 10/22 罷工聲援台中：台灣半導體業首見，爭的是 AI 記憶體賺的錢怎麼分", "body": "中央社報導，美光桃園廠工會 10/20 晚間宣布 10/22 罷工（當地媒體報導為一天），聲援正與公司協商分紅的台中工會；工會要求把營業利益的 15% 長期分給員工，並批評現行獎金制度不透明。10/7 的罷工投票 2,012 人投票、1,994 人同意（約 99%）。美光回應尊重員工合法權利、會持續與兩個工會討論。AI 帶動高頻寬記憶體（HBM）缺貨，是這波獲利與爭議的背景。罷工當天的實際參與人數與對產線的影響，截稿前查無報導。", "why": "記憶體是你 BOM 裡也會用到的料；這兩個月記憶體缺貨已經讓手機廠下修訂單，若台灣記憶體產線出現勞資不穩，交期與報價都值得留意。", "source_name": "Focus Taiwan（中央社）", "source_url": "https://focustaiwan.tw/business/202610200021"}], "industry": [{"text": "OpenAI 10/21 宣布模型與 Codex 上架 Google Cloud 的 Model Garden，先以邀請制私人預覽，正式上線預計「數週內」；可用 Google Cloud 既有的消費承諾折抵——至此 OpenAI 模型在美國三大雲端都買得到。", "source_name": "The Next Web", "source_url": "https://thenextweb.com/news/openai-models-codex-google-cloud"}, {"text": "Walmart 推出 Agent Gateway（一個 MCP 伺服器），讓獲准的 AI agent 查庫存、代客下單，先以測試版開放給核准的業者；每個 agent 有獨立的 Agent Profile，可另外看它的購買紀錄、設自主程度或直接關掉。跟 Amazon 開始封鎖外部購物 agent 正好相反。", "source_name": "Winzheng（彙整 TechCrunch 等報導）", "source_url": "https://www.winzheng.com/en/article/walmart-ai-agents-vs-amazon"}, {"text": "新創 Recursive 以 Apache 2.0 開源程式模型 Flint：總參數約 398 億、每個 token 只動用約 25 億，創辦人 Richard Socher 自報在 MacBook Pro 上每秒超過 125 個 token。跑分與速度都是自報，尚無第三方評測。", "source_name": "Richard Socher（X）", "source_url": "https://x.com/RichardSocher/status/2112944385415426249"}], "term": {"zh": "人在迴路中", "en": "Human-in-the-loop, HITL", "explain": "讓 agent 自己跑大部分的工作，但在特定關卡停下來，等人看過、按下核准才繼續。重點不在「每一步都問」，而在「哪些步驟要問」：讀資料、打草稿這類可以撤回的動作放行；送出、付款、刪除這類收不回來的動作才停下來；有些動作（像 Claude Duet 的轉帳）乾脆寫死不給做。問得太多，人會開始不看就按核准（核准疲勞），等於沒有關卡。", "analogy": "像產線的 QC 站：不是每個工站後面都放檢驗員，而是放在「過了就難重工」的位置——上膠前、封殼前、出貨前。站放太多，檢驗員只會蓋章放行。", "why": "今天 Claude Duet 的核准分級、Walmart 的逐筆核准與自主程度設定，都是在設計這道 <style>

  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}

    background:var(--panel2);border-bottom:1px solid var(--line);

  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>

知。發信、付款、簽文件、刪除東西之前會先列出要做的動作等你核准；交易證券、帳戶間轉帳則是核准了也不做。底層是 Opus 5.5，預覽期間跟其他 Claude 功能共用額度。", "why": "這跟你在電腦上用排程跑 agent 是同一個方向，只是搬到雲端、面向一般人；它把「哪些動作要人核准、哪些永遠不給做」寫得很清楚，是你設計自己 hook 與權限規則時可以直接參考的分級。", "source_name": "Claude 官方說明", "source_url": "https://claude.com/resources/articles/claude-duet"}, {"tag": "產業", "title": "美光桃園工會 10/22 罷工聲援台中：台灣半導體業首見，爭的是 AI 記憶體賺的錢怎麼分", "body": "中央社報導，美光桃園廠工會 10/20 晚間宣布 10/22 罷工（當地媒體報導為一天），聲援正與公司協商分紅的台中工會；工會要求把營業利益的 15% 長期分給員工，並批評現行獎金制度不透明。10/7 的罷工投票 2,012 人投票、1,994 人同意（約 99%）。美光回應尊重員工合法權利、會持續與兩個工會討論。AI 帶動高頻寬記憶體（HBM）缺貨，是這波獲利與爭議的背景。罷工當天的實際參與人數與對產線的影響，截稿前查無報導。", "why": "記憶體是你 BOM 裡也會用到的料；這兩個月記憶體缺貨已經讓手機廠下修訂單，若台灣記憶體產線出現勞資不穩，交期與報價都值得留意。", "source_name": "Focus Taiwan（中央社）", "source_url": "https://focustaiwan.tw/business/202610200021"}], "industry": [{"text": "OpenAI 10/21 宣布模型與 Codex 上架 Google Cloud 的 Model Garden，先以邀請制私人預覽，正式上線預計「數週內」；可用 Google Cloud 既有的消費承諾折抵——至此 OpenAI 模型在美國三大雲端都買得到。", "source_name": "The Next Web", "source_url": "https://thenextweb.com/news/openai-models-codex-google-cloud"}, {"text": "Walmart 推出 Agent Gateway（一個 MCP 伺服器），讓獲准的 AI agent 查庫存、代客下單，先以測試版開放給核准的業者；每個 agent 有獨立的 Agent Profile，可另外看它的購買紀錄、設自主程度或直接關掉。跟 Amazon 開始封鎖外部購物 agent 正好相反。", "source_name": "Winzheng（彙整 TechCrunch 等報導）", "source_url": "https://www.winzheng.com/en/article/walmart-ai-agents-vs-amazon"}, {"text": "新創 Recursive 以 Apache 2.0 開源程式模型 Flint：總參數約 398 億、每個 token 只動用約 25 億，創辦人 Richard Socher 自報在 MacBook Pro 上每秒超過 125 個 token。跑分與速度都是自報，尚無第三方評測。", "source_name": "Richard Socher（X）", "source_url": "https://x.com/RichardSocher/status/2112944385415426249"}], "term": {"zh": "人在迴路中", "en": "Human-in-the-loop, HITL", "explain": "讓 agent 自己跑大部分的工作，但在特定關卡停下來，等人看過、按下核准才繼續。重點不在「每一步都問」，而在「哪些步驟要問」：讀資料、打草稿這類可以撤回的動作放行；送出、付款、刪除這類收不回來的動作才停下來；有些動作（像 Claude Duet 的轉帳）乾脆寫死不給做。問得太多，人會開始不看就按核准（核准疲勞），等於沒有關卡。", "analogy": "像產線的 QC 站：不是每個工站後面都放檢驗員，而是放在「過了就難重工」的位置——上膠前、封殼前、出貨前。站放太多，檢驗員只會蓋章放行。", "why": "今天 Claude Duet 的核准分級、Walmart 的逐筆核准與自主程度設定，都是在設計這道關卡；你自己的 hook 與權限規則也是同一件事，可以用「收不收得回來」來決定哪些動作要停下來問。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  document.title = "每日 AI 情報 #" + (D.day||"") + " · " + (D.date||"");
  document.getElementById("term-file").textContent = "ai-daily.log — day " + (D.day||"") + " (" + (D.date||"") + ")";
  document.getElementById("h-title").textContent = "AI 每日速報 #" + (D.day||"");
  document.getElementById("h-date").textContent = (D.date||"") + (D.weekday?("（"+D.weekday+"）"):"");
  document.getElementById("headline").textContent = D.headline||"";

  document.getElementById("top").innerHTML = (D.top||[]).map(t=>`
    <div class="card">
      ${t.tag?`<span class="chip">${esc(t.tag)}</span>`:""}
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.body)}</p>
      ${t.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(t.analogy)}</div>`:""}
      ${t.why?`<div class="why"><b>為什麼你該知道：</b>${esc(t.why)}</div>`:""}
      ${t.source_url?`<div class="src">來源：<a href="${esc(t.source_url)}" target="_blank" rel="noopener">${esc(t.source_name||t.source_url)}</a></div>`:""}
    </div>`).join("");

  document.getElementById("industry").innerHTML = (D.industry||[]).map(i=>`
    <li>${esc(i.text)} ${i.source_url?`· <a href="${esc(i.source_url)}" target="_blank" rel="noopener">${esc(i.source_name||"來源")}</a>`:""}</li>`).join("");

  const tm = D.term||{};
  document.getElementById("term").innerHTML = `
    <div class="term">
      <div class="name">${esc(tm.zh||"")}<span class="en">${esc(tm.en||"")}</span></div>
      <p>${esc(tm.explain||"")}</p>
      ${tm.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(tm.analogy)}</div>`:""}
      ${tm.why?`<p class="why"><b>為什麼重要：</b>${esc(tm.why)}</p>`:""}
    </div>`;

  document.getElementById("footer").innerHTML =
    "每天自動更新 · 由 Claude 依當日公開新聞整理，僅供快速掌握趨勢，重要決策請點來源查證<br>#" +
    (D.day||"") + " · " + (D.date||"");
</script>
