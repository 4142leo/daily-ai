nder Full 56 分、Wonder 52 分，仍低於 Claude Opus 5.5 的 58 分。Meta 自稱在記憶類測試 MemoryBench 贏過對手，但沒公布原始數字；權重也不開放。", "why": "前沿模型多了第四個選手，但「貴一倍、跑分沒贏、強的那顆不開 API」，對你目前的 Claude 工作流沒有換的理由；值得留意的是它主打的跨對話記憶（Active Memory），這會是各家下一輪比拚的功能。", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/10/12/meta-releases-its-first-frontier-model-muse-wonder/"}, {"tag": "政策", "title": "白宮讓步：英國 AI 安全研究所停權 17 天後恢復搶先測模型", "body": "9 月底美國國家網路主任辦公室要求實驗室先別把新模型交給英國 AI 安全研究所（AISI）做上市前測試，等美方自己的國安審查做完；期間 Anthropic 的 Claude Mythos 5.1 也只開放給美國機構。英國 AI 部長 Kanishka Narayan 外交施壓後，白宮撤回限制，AISI 恢復對 Anthropic、Google DeepMind、OpenAI 模型的早期存取。依 Reuters 引述，恢復的是原本的自願性條款，不是新的正式協議；美方審查結論、Mythos 5.1 何時開放給 AISI 都還沒說清楚。", "why": "「誰能在上市前先驗模型」已經變成國與國的談判籌碼——你用的模型多快上線、在哪些地區能用，越來越受這類政治因素影響，而不只是技術進度。", "source_name": "The Decoder（轉引 Telegraph）", "source_url": "https://the-decoder.com/white-house-reverses-course-and-restores-uk-ai-safety-institutes-access-to-frontier-models/"}], "industry": [{"text": "Anthropic 宣布新的反蒸餾措施（收緊推理內容存取、改給推理摘要、擋代理網路），自估被偷採的資料減少 90–99%，已封禁數萬個帳號並點名智譜（Z.ai）；數字為 Anthropic 自報、未經獨立驗證。", "source_name": "Analytics Insight", "source_url": "https://www.analyticsinsight.net/news/anthropic-claude-security-data-harvesting-drops-by-up-to-99"}, {"text": "Apple 發表 299 美元的 HomeView 智慧螢幕（搭新版 Siri、能辨識是誰在看），以及 149 美元的 HomePod mini 2；HomeView 不在歐盟推出。", "source_name": "PhoneArena", "source_url": "https://www.phonearena.com/news/apple-reveals-homeview-a-299-smart-display-that-knows-whos-looking-at-it_id184040"}], "term": {"zh": "管線平行", "en": "Pipeline Parallelism", "explain": "模型太大、一台機器的記憶體裝不下時，把模型的「層」按順序切成幾段，每台機器負責其中幾層；資料在第一台算完傳給第二台，再傳第三台……一路接力算到最後。今天 Anthropic 紅隊把 26B 模型拆到 15 台電視盒上跑，就是這個做法。代價是每一段都要等上一段算完、再加上機器之間傳資料的時間，所以單一請求會變慢（電視盒那組只有每秒 0.3 多個 token）；要提高效率，得同時塞很多筆請求進管線，讓每一站都有活做。另一種切法叫張量平行（Tensor Parallelism）：不按層切，而是把同一層的矩陣拆給多台一起算，速度快但機器之間通訊非常頻繁，通常只在同一台伺服器內的 GPU 之間用。", "analogy": "就是產線分站：一顆大模型像工序很長的產品，一個工站做不完，就拆成 15 個工站接力。只送一件時，它得從頭走到尾、其他工站都在閒（延遲高）；連續投料讓每站都有料在做，產出才拉得上來（吞吐量）。站與站之間的輸送帶太慢，整條線就被卡住。", "why": "看到「 <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>每日 AI 情報</title>
<style>
  :root{

  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>

e Opus 5.5 的 58 分。Meta 自稱在記憶類測試 MemoryBench 贏過對手，但沒公布原始數字；權重也不開放。", "why": "前沿模型多了第四個選手，但「貴一倍、跑分沒贏、強的那顆不開 API」，對你目前的 Claude 工作流沒有換的理由；值得留意的是它主打的跨對話記憶（Active Memory），這會是各家下一輪比拚的功能。", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/10/12/meta-releases-its-first-frontier-model-muse-wonder/"}, {"tag": "政策", "title": "白宮讓步：英國 AI 安全研究所停權 17 天後恢復搶先測模型", "body": "9 月底美國國家網路主任辦公室要求實驗室先別把新模型交給英國 AI 安全研究所（AISI）做上市前測試，等美方自己的國安審查做完；期間 Anthropic 的 Claude Mythos 5.1 也只開放給美國機構。英國 AI 部長 Kanishka Narayan 外交施壓後，白宮撤回限制，AISI 恢復對 Anthropic、Google DeepMind、OpenAI 模型的早期存取。依 Reuters 引述，恢復的是原本的自願性條款，不是新的正式協議；美方審查結論、Mythos 5.1 何時開放給 AISI 都還沒說清楚。", "why": "「誰能在上市前先驗模型」已經變成國與國的談判籌碼——你用的模型多快上線、在哪些地區能用，越來越受這類政治因素影響，而不只是技術進度。", "source_name": "The Decoder（轉引 Telegraph）", "source_url": "https://the-decoder.com/white-house-reverses-course-and-restores-uk-ai-safety-institutes-access-to-frontier-models/"}], "industry": [{"text": "Anthropic 宣布新的反蒸餾措施（收緊推理內容存取、改給推理摘要、擋代理網路），自估被偷採的資料減少 90–99%，已封禁數萬個帳號並點名智譜（Z.ai）；數字為 Anthropic 自報、未經獨立驗證。", "source_name": "Analytics Insight", "source_url": "https://www.analyticsinsight.net/news/anthropic-claude-security-data-harvesting-drops-by-up-to-99"}, {"text": "Apple 發表 299 美元的 HomeView 智慧螢幕（搭新版 Siri、能辨識是誰在看），以及 149 美元的 HomePod mini 2；HomeView 不在歐盟推出。", "source_name": "PhoneArena", "source_url": "https://www.phonearena.com/news/apple-reveals-homeview-a-299-smart-display-that-knows-whos-looking-at-it_id184040"}], "term": {"zh": "管線平行", "en": "Pipeline Parallelism", "explain": "模型太大、一台機器的記憶體裝不下時，把模型的「層」按順序切成幾段，每台機器負責其中幾層；資料在第一台算完傳給第二台，再傳第三台……一路接力算到最後。今天 Anthropic 紅隊把 26B 模型拆到 15 台電視盒上跑，就是這個做法。代價是每一段都要等上一段算完、再加上機器之間傳資料的時間，所以單一請求會變慢（電視盒那組只有每秒 0.3 多個 token）；要提高效率，得同時塞很多筆請求進管線，讓每一站都有活做。另一種切法叫張量平行（Tensor Parallelism）：不按層切，而是把同一層的矩陣拆給多台一起算，速度快但機器之間通訊非常頻繁，通常只在同一台伺服器內的 GPU 之間用。", "analogy": "就是產線分站：一顆大模型像工序很長的產品，一個工站做不完，就拆成 15 個工站接力。只送一件時，它得從頭走到尾、其他工站都在閒（延遲高）；連續投料讓每站都有料在做，產出才拉得上來（吞吐量）。站與站之間的輸送帶太慢，整條線就被卡住。", "why": "看到「某模型跑在手機／樹莓派叢集上」這種新聞，可以馬上判斷：多半是管線平行硬拼出來的，能跑不等於好用——要看每秒幾個 token、機器之間怎麼連。之後想在產品端或多台設備上跑模型，這是第一個會碰到的取捨。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  document.title = "每日 AI 情報 #" + (D.day||"") + " · " + (D.date||"");
  document.getElementById("term-file").textContent = "ai-daily.log — day " + (D.day||"") + " (" + (D.date||"") + ")";
  document.getElementById("h-title").textContent = "AI 每日速報 #" + (D.day||"");
  document.getElementById("h-date").textContent = (D.date||"") + (D.weekday?("（"+D.weekday+"）"):"");
  document.getElementById("headline").textContent = D.headline||"";

  document.getElementById("top").innerHTML = (D.top||[]).map(t=>`
    <div class="card">
      ${t.tag?`<span class="chip">${esc(t.tag)}</span>`:""}
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.body)}</p>
      ${t.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(t.analogy)}</div>`:""}
      ${t.why?`<div class="why"><b>為什麼你該知道：</b>${esc(t.why)}</div>`:""}
      ${t.source_url?`<div class="src">來源：<a href="${esc(t.source_url)}" target="_blank" rel="noopener">${esc(t.source_name||t.source_url)}</a></div>`:""}
    </div>`).join("");

  document.getElementById("industry").innerHTML = (D.industry||[]).map(i=>`
    <li>${esc(i.text)} ${i.source_url?`· <a href="${esc(i.source_url)}" target="_blank" rel="noopener">${esc(i.source_name||"來源")}</a>`:""}</li>`).join("");

  const tm = D.term||{};
  document.getElementById("term").innerHTML = `
    <div class="term">
      <div class="name">${esc(tm.zh||"")}<span class="en">${esc(tm.en||"")}</span></div>
      <p>${esc(tm.explain||"")}</p>
      ${tm.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(tm.analogy)}</div>`:""}
      ${tm.why?`<p class="why"><b>為什麼重要：</b>${esc(tm.why)}</p>`:""}
    </div>`;

  document.getElementById("footer").innerHTML =
    "每天自動更新 · 由 Claude 依當日公開新聞整理，僅供快速掌握趨勢，重要決策請點來源查證<br>#" +
    (D.day||"") + " · " + (D.date||"");
</script>
