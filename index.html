<!doctype html>
<!--
  每日 AI 情報 網頁範本（終端機／hacker 風，強制深色）
  build_ai_page.py 會把 content.json 的內容以 JSON 塞進 {"day": 36, "date": "2026-11-06", "weekday": "週五", "headline": "OpenAI 公開一條全自動找漏洞流水線：一次跑出 948 個 Linux 提權攻擊程式、花 121 萬美元；Anthropic 給 Claude Enterprise 加上安全中心與「先送資安工具檢查」的 hook；美股晶片股 11/5 大跌，Nvidia 收跌 9%、AMD 跌 17%。", "top": [{"tag": "工具", "title": "Claude Enterprise 安全更新：設定體檢頁、提示詞與工具呼叫先送資安工具檢查、Cowork 虛擬機裡可裝 EDR", "body": "Anthropic 11/5 發文，給企業版 Claude 一批管理功能。一是「安全中心」（beta）：把聊天、Cowork、Claude Code 的設定跟官方建議值逐項對照，可匯出報告給稽核，但官方明講這只是建議、不是合規認證。二是「推論 hook（Inference Hooks）」正式上線：使用者送出的提示詞、以及 Claude 要執行的工具呼叫，都可以先送到公司既有的資料外洩防護（DLP）工具檢查。三是 Cowork 在使用者電腦上跑程式用的隔離虛擬機，現在可以裝公司的端點偵測（EDR）感測器，每次開機先驗廠商簽章，只回報不阻擋，也只涵蓋本機、不含雲端 session。另外還有一鍵把某人從所有裝置登出（但不會停掉 API 金鑰、已在跑的雲端 session 和排程）、在公司電腦上的 Claude Desktop 擋掉私人帳號。", "analogy": "像產線加了進料檢驗站：零件（提示詞、工具呼叫）上線前，先過公司原本就有的檢驗機台，不用為了 AI 另外買一套。EDR 則是在隔離工作站裡也裝一支監視攝影機，只錄影、不擋人。", "why": "「工具呼叫執行前先檢查」就是你在 Claude Code 用的 PreToolUse hook，只是搬到企業層級、接上資安廠商。另外注意那個登出 API：它停不掉已經在跑的排程，這正是你自己的排程類設計也要想清楚的「關掉開關，哪些東西其實還在跑」。", "source_name": "Claude 官方文章（11/5）", "source_url": "https://claude.com/resources/articles/claude-enterprise-security-updates"}, {"tag": "研究", "title": "OpenAI 自動找漏洞流水線：一次跑出 948 個 Linux 提權攻擊程式，平均每個 1,279 美元", "body": "OpenAI 11/4 發表研究，用一個尚未推出的資安模型搭一條全自動流水線：先找出 Linux 核心裡跟安全有關的區塊、靜態掃描、在隔離環境實際重現、寫出攻擊程式證明真的可以用，最後產生修補程式交給人審。10 月中跑一次，2,308 個候選問題裡重現了 1,724 個，做出 948 個能從一般使用者拿到最高權限（root）的攻擊程式，目標是一般常見發行版的標準桌面系統。整次 API 花費 121 萬美元。對照：6 月用 GPT-5.5 Cyber 只做出 24 個。OpenAI 說掃描期間 10 天內，已有 100 多個被其他人修掉或準備修，另約 300 個在公開討論。", "analogy": "以前找漏洞像老師傅一顆一顆拆機做失效分析；現在變成一條自動化測試線：上料、跑測、復現、出報告、附改善對策，一次跑完一整批。瓶頸從「找得到」移到「後面的人修不修得完」。", "why": "前提是攻擊者已經能登入那台機器（不是遠端直接入侵），但數量說明了一件事：發現漏洞的成本正在掉，修補速度跟不上。你在做的連網硬體如果跑 Linux，韌體更新管道的重要性只會越來越高。以上數字全是 OpenAI 自報。", "source_name": "OpenAI 研究文章（11/4）", "source_url": "https://openai.com/index/a-thousand-fewer-paths-to-root/"}, {"tag": "產業", "title": "Meta 收購 Conductor：能同時開好幾個 coding agent 平行做事的工具，雲端服務 11/20 關閉", "body": "TechCrunch 11/4 報導，Meta 確認收購 AI 程式開發新創 Conductor，金額未公開。Conductor 2024 年成立，產品讓工程師把一個專案拆成幾塊，各丟給一個 agent 在獨立工作區平行做；底下跑的不是自家模型，而是 Claude Code、Codex 等現成 agent。創辦人說明年初會有新東西，舊功能暫時照常，但雲端服務 11/20 關閉，之後開始刪除客戶雲端資料。", "analogy": "Conductor 賣的不是機台，而是「產線排程系統」：同時調度好幾台不同廠牌的機台，各做一個工站，再合流。Meta 買的是排程能力和團隊。", "why": "你平常用的多 agent 分工（主控＋subagent），市面上已經有人做成獨立產品並被大廠買走，表示「調度層」被認為有價值。也提醒一件實務事：依賴新創的雲端工具，被收購後可能幾週內就關掉，資料要自己留一份。", "source_name": "TechCrunch（11/4）", "source_url": "https://techcrunch.com/2026/11/04/meta-acquires-ai-coding-startup-conductor/"}, {"tag": "產業", "title": "美股晶片股 11/5 大跌：Nvidia 收跌 9.26%、AMD 跌 17.26%、那斯達克跌 5.52%", "body": "11/5 收盤，Nvidia 收在 181.60 美元、跌 9.26%，是 4 月以來最低；AMD 跌 17.26%、Broadcom 跌 10.43%；S&P 500 跌 4.36%，那斯達克跌 5.52%。Motley Fool 的解讀是期中選舉結果帶來政策不確定性、市場擔心資料中心需求，而不是哪家公司本身出了事。11/6 開盤 Nvidia 反彈約 5%。下一個觀察點是 Nvidia 11/17 的財報。", "analogy": "股價是市場對「未來訂單」的預估，不是現在的出貨量。就像客戶還沒砍單，但業務聽到風聲就先下修預測。", "why": "跟你每天用 AI 工具沒有直接關係，價格和額度不會因為一天的股價改變。但如果資料中心建設真的放慢，長期會影響 GPU 供應和 API 價格走勢，值得放在背景留意。漲跌原因是分析師解讀，不是定論。", "source_name": "The Motley Fool（11/5 收盤）", "source_url": "https://www.fool.com/coverage/stock-market-today/2026/11/05/stock-market-today-nov-5-nvidia-slides-on-ai-chip-selloff-as-election-uncertainty-weighs/"}], "industry": [{"text": "Supermicro 將銷售「Nvidia GPU 讀提示詞、SambaNova SN50 晶片負責吐字」的混搭推論機櫃，初期規劃 1 萬顆 SN50（目前只見 Unite.ai 報導，效能數字為 SambaNova 自報）。", "source_name": "Unite.ai", "source_url": "https://www.unite.ai/?p=501328"}, {"text": "Claude 推出個人理財功能（Personal Finance）：連結自己的帳戶後可以直接問花費與收支。", "source_name": "Claude 官方文章（11/5）", "source_url": "https://claude.com/resources/articles/introducing-personal-finance-in-claude"}, {"text": "Adweek 報導 Anthropic 簽下第一份付費新聞授權：向美聯社（AP）取得期中選舉即時資料給 Claude 使用（The Neuron 轉述，未讀到原文）。", "source_name": "The Neuron（11/5）", "source_url": "https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-thursday-november-5-2026/"}, {"text": "Claude Code 2.1.319 已上 npm（11/6 00:58 UTC），官方 CHANGELOG 還沒寫這版改了什麼，下期再補。", "source_name": "npm @anthropic-ai/claude-code", "source_url": "https://www.npmjs.com/package/@anthropic-ai/claude-code"}], "term": {"zh": "預填與解碼", "en": "Prefill vs Decode", "explain": "模型回答一個問題分成兩段。預填（prefill）：把你整段提示詞一次讀進去，所有 token 可以平行算，瓶頸在算力。解碼（decode）：一個字一個字往外吐，每吐一個字都要把整個模型權重和前面的記憶（KV cache）從記憶體搬一次，瓶頸在記憶體頻寬，算力反而閒著。兩段的硬體需求完全不同，所以今天產業動態裡 SambaNova 才會把它們拆給兩種晶片做。", "analogy": "像 SMT 產線：進料時整盤料一次掃描建檔（預填，吃的是掃描機速度）；貼片時一顆一顆貼（解碼，卡在供料器送料速度，不是貼片頭不夠快）。兩個工站卡的地方不同，就該配不同機台。", "why": "這解釋了你看到的很多現象：API 的輸出 token 比輸入 token 貴好幾倍；提示詞快取省的是預填那段；「第一個字多久出現」主要看預填，「之後吐字多快」主要看解碼。長脈絡讓兩段都變慢，但慢的原因不一樣。"}} 佔位符。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>
<div class="term-window">
  <div class="term-bar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="file" id="term-file">ai-daily.log</span>
  </div>
  <div class="wrap">
    <header>
      <div class="kicker">每日 AI 情報</div>
      <h1 id="h-title">AI 每日速報</h1>
      <div class="date" id="h-date"></div>
    </header>
    <div class="headline" id="headline"></div>

    <div class="sec-title">今日重點</div>
    <div id="top"></div>

    <div class="sec-title">產業動態</div>
    <ul class="ind" id="industry"></ul>

    <div class="sec-title">今日一詞</div>
    <div id="term"></div>

    <footer id="footer"></footer>
  </div>
</div>
<script>
  const D = {"day": 36, "date": "2026-11-06", "weekday": "週五", "headline": "OpenAI 公開一條全自動找漏洞流水線：一次跑出 948 個 Linux 提權攻擊程式、花 121 萬美元；Anthropic 給 Claude Enterprise 加上安全中心與「先送資安工具檢查」的 hook；美股晶片股 11/5 大跌，Nvidia 收跌 9%、AMD 跌 17%。", "top": [{"tag": "工具", "title": "Claude Enterprise 安全更新：設定體檢頁、提示詞與工具呼叫先送資安工具檢查、Cowork 虛擬機裡可裝 EDR", "body": "Anthropic 11/5 發文，給企業版 Claude 一批管理功能。一是「安全中心」（beta）：把聊天、Cowork、Claude Code 的設定跟官方建議值逐項對照，可匯出報告給稽核，但官方明講這只是建議、不是合規認證。二是「推論 hook（Inference Hooks）」正式上線：使用者送出的提示詞、以及 Claude 要執行的工具呼叫，都可以先送到公司既有的資料外洩防護（DLP）工具檢查。三是 Cowork 在使用者電腦上跑程式用的隔離虛擬機，現在可以裝公司的端點偵測（EDR）感測器，每次開機先驗廠商簽章，只回報不阻擋，也只涵蓋本機、不含雲端 session。另外還有一鍵把某人從所有裝置登出（但不會停掉 API 金鑰、已在跑的雲端 session 和排程）、在公司電腦上的 Claude Desktop 擋掉私人帳號。", "analogy": "像產線加了進料檢驗站：零件（提示詞、工具呼叫）上線前，先過公司原本就有的檢驗機台，不用為了 AI 另外買一套。EDR 則是在隔離工作站裡也裝一支監視攝影機，只錄影、不擋人。", "why": "「工具呼叫執行前先檢查」就是你在 Claude Code 用的 PreToolUse hook，只是搬到企業層級、接上資安廠商。另外注意那個登出 API：它停不掉已經在跑的排程，這正是你自己的排程類設計也要想清楚的「關掉開關，哪些東西其實還在跑」。", "source_name": "Claude 官方文章（11/5）", "source_url": "https://claude.com/resources/articles/claude-enterprise-security-updates"}, {"tag": "研究", "title": "OpenAI 自動找漏洞流水線：一次跑出 948 個 Linux 提權攻擊程式，平均每個 1,279 美元", "body": "OpenAI 11/4 發表研究，用一個尚未推出的資安模型搭一條全自動流水線：先找出 Linux 核心裡跟安全有關的區塊、靜態掃描、在隔離環境實際重現、寫出攻擊程式證明真的可以用，最後產生修補程式交給人審。10 月中跑一次，2,308 個候選問題裡重現了 1,724 個，做出 948 個能從一般使用者拿到最高權限（root）的攻擊程式，目標是一般常見發行版的標準桌面系統。整次 API 花費 121 萬美元。對照：6 月用 GPT-5.5 Cyber 只做出 24 個。OpenAI 說掃描期間 10 天內，已有 100 多個被其他人修掉或準備修，另約 300 個在公開討論。", "analogy": "以前找漏洞像老師傅一顆一顆拆機做失效分析；現在變成一條自動化測試線：上料、跑測、復現、出報告、附改善對策，一次跑完一整批。瓶頸從「找得到」移到「後面的人修不修得完」。", "why": "前提是攻擊者已經能登入那台機器（不是遠端直接入侵），但數量說明了一件事：發現漏洞的成本正在掉，修補速度跟不上。你在做的連網硬體如果跑 Linux，韌體更新管道的重要性只會越來越高。以上數字全是 OpenAI 自報。", "source_name": "OpenAI 研究文章（11/4）", "source_url": "https://openai.com/index/a-thousand-fewer-paths-to-root/"}, {"tag": "產業", "title": "Meta 收購 Conductor：能同時開好幾個 coding agent 平行做事的工具，雲端服務 11/20 關閉", "body": "TechCrunch 11/4 報導，Meta 確認收購 AI 程式開發新創 Conductor，金額未公開。Conductor 2024 年成立，產品讓工程師把一個專案拆成幾塊，各丟給一個 agent 在獨立工作區平行做；底下跑的不是自家模型，而是 Claude Code、Codex 等現成 agent。創辦人說明年初會有新東西，舊功能暫時照常，但雲端服務 11/20 關閉，之後開始刪除客戶雲端資料。", "analogy": "Conductor 賣的不是機台，而是「產線排程系統」：同時調度好幾台不同廠牌的機台，各做一個工站，再合流。Meta 買的是排程能力和團隊。", "why": "你平常用的多 agent 分工（主控＋subagent），市面上已經有人做成獨立產品並被大廠買走，表示「調度層」被認為有價值。也提醒一件實務事：依賴新創的雲端工具，被收購後可能幾週內就關掉，資料要自己留一份。", "source_name": "TechCrunch（11/4）", "source_url": "https://techcrunch.com/2026/11/04/meta-acquires-ai-coding-startup-conductor/"}, {"tag": "產業", "title": "美股晶片股 11/5 大跌：Nvidia 收跌 9.26%、AMD 跌 17.26%、那斯達克跌 5.52%", "body": "11/5 收盤，Nvidia 收在 181.60 美元、跌 9.26%，是 4 月以來最低；AMD 跌 17.26%、Broadcom 跌 10.43%；S&P 500 跌 4.36%，那斯達克跌 5.52%。Motley Fool 的解讀是期中選舉結果帶來政策不確定性、市場擔心資料中心需求，而不是哪家公司本身出了事。11/6 開盤 Nvidia 反彈約 5%。下一個觀察點是 Nvidia 11/17 的財報。", "analogy": "股價是市場對「未來訂單」的預估，不是現在的出貨量。就像客戶還沒砍單，但業務聽到風聲就先下修預測。", "why": "跟你每天用 AI 工具沒有直接關係，價格和額度不會因為一天的股價改變。但如果資料中心建設真的放慢，長期會影響 GPU 供應和 API 價格走勢，值得放在背景留意。漲跌原因是分析師解讀，不是定論。", "source_name": "The Motley Fool（11/5 收盤）", "source_url": "https://www.fool.com/coverage/stock-market-today/2026/11/05/stock-market-today-nov-5-nvidia-slides-on-ai-chip-selloff-as-election-uncertainty-weighs/"}], "industry": [{"text": "Supermicro 將銷售「Nvidia GPU 讀提示詞、SambaNova SN50 晶片負責吐字」的混搭推論機櫃，初期規劃 1 萬顆 SN50（目前只見 Unite.ai 報導，效能數字為 SambaNova 自報）。", "source_name": "Unite.ai", "source_url": "https://www.unite.ai/?p=501328"}, {"text": "Claude 推出個人理財功能（Personal Finance）：連結自己的帳戶後可以直接問花費與收支。", "source_name": "Claude 官方文章（11/5）", "source_url": "https://claude.com/resources/articles/introducing-personal-finance-in-claude"}, {"text": "Adweek 報導 Anthropic 簽下第一份付費新聞授權：向美聯社（AP）取得期中選舉即時資料給 Claude 使用（The Neuron 轉述，未讀到原文）。", "source_name": "The Neuron（11/5）", "source_url": "https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-thursday-november-5-2026/"}, {"text": "Claude Code 2.1.319 已上 npm（11/6 00:58 UTC），官方 CHANGELOG 還沒寫這版改了什麼，下期再補。", "source_name": "npm @anthropic-ai/claude-code", "source_url": "https://www.npmjs.com/package/@anthropic-ai/claude-code"}], "term": {"zh": "預填與解碼", "en": "Prefill vs Decode", "explain": "模型回答一個問題分成兩段。預填（prefill）：把你整段提示詞一次讀進去，所有 token 可以平行算，瓶頸在算力。解碼（decode）：一個字一個字往外吐，每吐一個字都要把整個模型權重和前面的記憶（KV cache）從記憶體搬一次，瓶頸在記憶體頻寬，算力反而閒著。兩段的硬體需求完全不同，所以今天產業動態裡 SambaNova 才會把它們拆給兩種晶片做。", "analogy": "像 SMT 產線：進料時整盤料一次掃描建檔（預填，吃的是掃描機速度）；貼片時一顆一顆貼（解碼，卡在供料器送料速度，不是貼片頭不夠快）。兩個工站卡的地方不同，就該配不同機台。", "why": "這解釋了你看到的很多現象：API 的輸出 token 比輸入 token 貴好幾倍；提示詞快取省的是預填那段；「第一個字多久出現」主要看預填，「之後吐字多快」主要看解碼。長脈絡讓兩段都變慢，但慢的原因不一樣。"}};
