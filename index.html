<!--
  每日 AI 情報 網頁範本（終端機／hacker 風，強制深色）
  build_ai_page.py 會把 content.json 的內容以 JSON 塞進 {"day": 35, "date": "2026-11-05", "weekday": "週四", "headline": "OpenAI 說 GPT-6 Astra 不到一週就畫完一台小裝置的外殼、電路板和韌體，但打樣改了好幾輪，問題出在沒顧到製造公差和組裝；Anthropic 公開 FlashProve，能用密碼學證明「這個回答真的是那個模型產生的」；Claude Code 2.1.317／318 修好桌面版 Code 分頁的 MCP 斷線、搜尋逾時被當成搜完，以及 SSL 攔截環境的憑證錯誤。", "top": [{"tag": "工具", "title": "Claude Code 2.1.317／2.1.318：桌面版 MCP 斷線、搜尋只搜一半卻當成搜完、SSL 攔截憑證錯誤都修好了", "body": "npm 上 2.1.317（11/2）和 2.1.318（11/3）兩版，官方 CHANGELOG 都有寫。跟你比較有關的有五項：①修好桌面版 Code 分頁裡，專案層級的 MCP 伺服器在第一輪對話後斷線；②修好 Grep／Glob 搜到時間上限只拿到部分結果，Claude 卻當成完整結果；③修好部分會檢查 SSL 的公司代理伺服器，在根憑證更新後出現「unable to get local issuer certificate」錯誤；NODE_EXTRA_CA_CERTS 指到空檔或壞檔時，也不會再讓所有連線失敗；④新增檢查：網頁或 shell 工具要把你的帳號 email 送上網路前，會先問你；⑤背景 subagent 的 shell 指令跑超過 3 分鐘就移到背景，避免提示詞快取過期。另外，subagent 用的模型跟主對話不同時，改用那個模型自己存的努力等級，不再沿用主對話的。", "analogy": "第②項像量測機台：時間到了只量完一半的點，報表上卻寫「全部合格」。修好之後，沒量完的會標成「未完成」，不會混進合格品。", "why": "你的電腦就是有 SSL 攔截的環境，第③項正好修到這種情況；你每天用桌面版 Code 分頁，第①項修的也是你會遇到的斷線。第②項影響更大：以前搜尋逾時，Claude 可能會告訴你「找不到」，其實是還沒搜完。", "source_name": "Claude Code 官方 CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "新模型", "title": "OpenAI 說 GPT-6 Astra 不到一週就做完一台硬體裝置的設計，但打樣改了好幾輪", "body": "OpenAI 本週發文說，硬體團隊以業餘專案的方式做了一台用來跟 Codex 對話的小裝置：外殼設計、電路板 layout（選料、走線）、韌體和操作介面，全部交給 GPT-6 Astra 處理，設計不到一週完成，代工廠不到一個月做出一小批原型。不過原型改了好幾輪，原因是 Astra 沒有每次都考慮到製造限制、公差和組裝細節。OpenAI 另外公布一個 3D 零件與 PCB 連接辨識的測試 BenchCAD 2.0：Astra 最高推論等級拿 0.594，一個沒公開細節的內部新模型拿 0.875；也說硬體團隊的 token 用量從 2 月到現在成長 23 倍。以上都是 OpenAI 自己說的，原文無法讀取，本則依 The Decoder 的轉述。", "analogy": "就像一個很會畫圖、但從沒進過產線的新人：線路圖和外殼畫得很快，送去打樣才發現螺絲柱跟元件撞到、公差沒留夠。設計速度變快了，但 DFM（可製造性設計）這一關還是要有經驗的人把關。", "why": "這是目前 AI 最接近你本業的案例。重點不是「AI 能畫板子」，而是它卡在製造公差和組裝——跟你在 PCB 走線規則、嘉立創製程規格上累積的經驗剛好是同一塊。把這些規則寫清楚交給 AI，正是補它弱項的做法。", "source_name": "The Decoder（11/3，轉述 OpenAI 原文）", "source_url": "https://the-decoder.com/openai-says-gpt-6-astra-designed-a-hardware-device-from-scratch-in-under-a-week/"}, {"tag": "研究", "title": "Anthropic 公開 FlashProve：不用給出權重，就能證明一個回答確實出自某個模型", "body": "Anthropic 11/2 發表研究原型 FlashProve，以 Apache 2.0 授權開源。做法分兩段：先公開一個「承諾值」，像指紋一樣鎖定某一份模型權重但不透露內容；之後每個回答附一份證明檔，任何人只要有承諾值、提問和回答，就能用一般 CPU 檢查是不是那個模型產生的。測試用的是 4000 億參數的 Llama 4 Maverick（每個 token 啟用約 170 億），一張 H100 每秒能產生約 110 個 token 的證明，每 1,024 個 token 的證明約 19 MB，驗證約 17–21 秒。限制也不少：GPU 時間是一般推論的約 70–95 倍、脈絡只到 1,024 token、只支援混合專家架構和固定取樣方式。Anthropic 和其他實驗室目前都沒有部署計畫。", "analogy": "像出貨時附上的原廠驗證碼：客戶不用拿到你的韌體原始碼，就能確認板子上燒的是你承諾的那一版，不是被偷偷換成便宜版本。", "why": "你透過 API 或第三方平台用模型時，很難確認對方給你的是不是付費的那個模型。這類技術成熟後，「付高階模型的錢、拿到便宜模型」就可以被驗證出來；現在還在研究階段，成本太高，先知道有這個方向就好。", "source_name": "Anthropic 研究文章（11/2）", "source_url": "https://www.anthropic.com/research/provable-inference"}, {"tag": "產業", "title": "Anthropic 更新上市申請書：第三季營收 170 億美元，但又回到營業虧損", "body": "Euronews 報導，Anthropic 11/2 送出更新版上市申請書，加進第三季數字：營收 170 億美元，比第二季多 47%；營業虧損 5.67 億美元（第二季是獲利 9.74 億）。公司說虧損部分原因是需求超過長期合約，臨時買了 50 億美元的短期算力，價格貴很多，另外還有一筆 20 億的員工捐款配對非現金費用。申請書列出約 8,954 億美元的採購與租賃承諾、大部分是算力，其中約 700 億一年內到期；同時估計前九個月營收有 5–7% 來自違反使用規範的客戶，取締後可能影響成長。發行價還沒定。以上數字依 Euronews 引述，本期沒有直接讀到申請書。", "analogy": "像接單接到產能不夠，只好臨時找外包急件代工，單價貴好幾倍。營收衝上去了，毛利卻被急件費吃掉。", "why": "算力不夠是 Claude 偶爾變慢、用量限制收緊的背後原因之一。申請書寫到要取締違規使用，未來使用條款可能會更嚴格。", "source_name": "Euronews（11/3）", "source_url": "https://www.euronews.com/2026/11/03/anthropic-swings-back-to-operating-loss-as-895-billion-compute-bill-looms-over-ipo"}], "industry": [{"text": "OpenAI 11/2 宣布找新創 Cathedral 幫忙測自家防禦，也提高漏洞獎金（最高 17.2 萬美元）——Cathedral 就是 10 月用 AI agent 進到 Anthropic 部分內部系統的那家。隔天路透引述 5 位知情人士說，OpenAI 員工從 2022 年起就反映內部資安問題；OpenAI 否認忽視資安。", "source_name": "OpenAI 官方公告（11/2）", "source_url": "https://openai.com/index/preparing-our-next-security-sprint-to-harden-openai/"}, {"text": "英國金融科技公司 Revolut 讓約 2,000 名工程師改用自架的 GLM 開放權重模型寫程式（56 張 B200），說推論成本降約 90%，主要取代 Claude Code；看圖、做 UI 的需求仍轉給其他模型。數字都是 Revolut 自報。", "source_name": "The Register（11/3）", "source_url": "https://www.theregister.com/ai-and-ml/2026/11/03/british-fintech-revolut-slashes-ai-coding-costs-10x-by-cutting-out-claude-and-going-self-hosted/5307345"}, {"text": "OpenAI 公開自建的 Git 相容後端 Pando，已經在跑公司的主要程式庫，說 push 延遲中位數降了將近 80%。", "source_name": "OpenAI 官方文章", "source_url": "https://openai.com/index/scaling-git-at-openai/"}], "term": {"zh": "零知識證明", "en": "Zero-Knowledge Proof", "explain": "一種密碼學方法：讓一方證明「某件事是真的」，但不透露讓它成真的祕密。以 FlashProve 為例，模型公司要證明「這段回答是用那份權重算出來的」，卻不用把權重交出去。好的零知識證明有四個性質：誠實的證明一定會通過、假的證明偽造不出來、過程不洩漏祕密、證明檔小又檢查得快。它原本大量用在區塊鏈，用來證明一批交易算對了；現在開始被拿來驗證 AI 推論。代價是產生證明很耗運算，FlashProve 目前要多花約 70–95 倍的 GPU 時間。", "analogy": "像出貨檢驗只給客戶一張由第三方簽章的檢驗報告：客戶能確定產品照規格做，卻看不到你的配方和製程參數。差別是零知識證明不需要信任第三方，數學本身就是那個簽章。", "why": "AI 越來越多是「黑盒子透過網路回答你」，零知識證明是少數能在不公開模型的情況下讓使用者驗證的方法。之後看到「可驗證推論」「verifiable AI」的新聞，背後多半是這個技術。"}} 佔位符。

<meta charset="utf-8">

<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);

    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}

    background:var(--panel2);border-bottom:1px solid var(--line);

    font-size:14.5px;color:var(--ink)}

    display:inline-block;border-radius:1px}

    padding:15px 16px;margin-bottom:12px}

    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}

  .why b{color:var(--ink)}

  ul.ind{list-style:none;padding:0;margin:0}

  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}

<script>
  const D = {"day": 35, "date": "2026-11-05", "weekday": "週四", "headline": "OpenAI 說 GPT-6 Astra 不到一週就畫完一台小裝置的外殼、電路板和韌體，但打樣改了好幾輪，問題出在沒顧到製造公差和組裝；Anthropic 公開 FlashProve，能用密碼學證明「這個回答真的是那個模型產生的」；Claude Code 2.1.317／318 修好桌面版 Code 分頁的 MCP 斷線、搜尋逾時被當成搜完，以及 SSL 攔截環境的憑證錯誤。", "top": [{"tag": "工具", "title": "Claude Code 2.1.317／2.1.318：桌面版 MCP 斷線、搜尋只搜一半卻當成搜完、SSL 攔截憑證錯誤都修好了", "body": "npm 上 2.1.317（11/2）和 2.1.318（11/3）兩版，官方 CHANGELOG 都有寫。跟你比較有關的有五項：①修好桌面版 Code 分頁裡，專案層級的 MCP 伺服器在第一輪對話後斷線；②修好 Grep／Glob 搜到時間上限只拿到部分結果，Claude 卻當成完整結果；③修好部分會檢查 SSL 的公司代理伺服器，在根憑證更新後出現「unable to get local issuer certificate」錯誤；NODE_EXTRA_CA_CERTS 指到空檔或壞檔時，也不會再讓所有連線失敗；④新增檢查：網頁或 shell 工具要把你的帳號 email 送上網路前，會先問你；⑤背景 subagent 的 shell 指令跑超過 3 分鐘就移到背景，避免提示詞快取過期。另外，subagent 用的模型跟主對話不同時，改用那個模型自己存的努力等級，不再沿用主對話的。", "analogy": "第②項像量測機台：時間到了只量完一半的點，報表上卻寫「全部合格」。修好之後，沒量完的會標成「未完成」，不會混進合格品。", "why": "你的電腦就是有 SSL 攔截的環境，第③項正好修到這種情況；你每天用桌面版 Code 分頁，第①項修的也是你會遇到的斷線。第②項影響更大：以前搜尋逾時，Claude 可能會告訴你「找不到」，其實是還沒搜完。", "source_name": "Claude Code 官方 CHANGELOG（GitHub）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "新模型", "title": "OpenAI 說 GPT-6 Astra 不到一週就做完一台硬體裝置的設計，但打樣改了好幾輪", "body": "OpenAI 本週發文說，硬體團隊以業餘專案的方式做了一台用來跟 Codex 對話的小裝置：外殼設計、電路板 layout（選料、走線）、韌體和操作介面，全部交給 GPT-6 Astra 處理，設計不到一週完成，代工廠不到一個月做出一小批原型。不過原型改了好幾輪，原因是 Astra 沒有每次都考慮到製造限制、公差和組裝細節。OpenAI 另外公布一個 3D 零件與 PCB 連接辨識的測試 BenchCAD 2.0：Astra 最高推論等級拿 0.594，一個沒公開細節的內部新模型拿 0.875；也說硬體團隊的 token 用量從 2 月到現在成長 23 倍。以上都是 OpenAI 自己說的，原文無法讀取，本則依 The Decoder 的轉述。", "analogy": "就像一個很會畫圖、但從沒進過產線的新人：線路圖和外殼畫得很快，送去打樣才發現螺絲柱跟元件撞到、公差沒留夠。設計速度變快了，但 DFM（可製造性設計）這一關還是要有經驗的人把關。", "why": "這是目前 AI 最接近你本業的案例。重點不是「AI 能畫板子」，而是它卡在製造公差和組裝——跟你在 PCB 走線規則、嘉立創製程規格上累積的經驗剛好是同一塊。把這些規則寫清楚交給 AI，正是補它弱項的做法。", "source_name": "The Decoder（11/3，轉述 OpenAI 原文）", "source_url": "https://the-decoder.com/openai-says-gpt-6-astra-designed-a-hardware-device-from-scratch-in-under-a-week/"}, {"tag": "研究", "title": "Anthropic 公開 FlashProve：不用給出權重，就能證明一個回答確實出自某個模型", "body": "Anthropic 11/2 發表研究原型 FlashProve，以 Apache 2.0 授權開源。做法分兩段：先公開一個「承諾值」，像指紋一樣鎖定某一份模型權重但不透露內容；之後每個回答附一份證明檔，任何人只要有承諾值、提問和回答，就能用一般 CPU 檢查是不是那個模型產生的。測試用的是 4000 億參數的 Llama 4 Maverick（每個 token 啟用約 170 億），一張 H100 每秒能產生約 110 個 token 的證明，每 1,024 個 token 的證明約 19 MB，驗證約 17–21 秒。限制也不少：GPU 時間是一般推論的約 70–95 倍、脈絡只到 1,024 token、只支援混合專家架構和固定取樣方式。Anthropic 和其他實驗室目前都沒有部署計畫。", "analogy": "像出貨時附上的原廠驗證碼：客戶不用拿到你的韌體原始碼，就能確認板子上燒的是你承諾的那一版，不是被偷偷換成便宜版本。", "why": "你透過 API 或第三方平台用模型時，很難確認對方給你的是不是付費的那個模型。這類技術成熟後，「付高階模型的錢、拿到便宜模型」就可以被驗證出來；現在還在研究階段，成本太高，先知道有這個方向就好。", "source_name": "Anthropic 研究文章（11/2）", "source_url": "https://www.anthropic.com/research/provable-inference"}, {"tag": "產業", "title": "Anthropic 更新上市申請書：第三季營收 170 億美元，但又回到營業虧損", "body": "Euronews 報導，Anthropic 11/2 送出更新版上市申請書，加進第三季數字：營收 170 億美元，比第二季多 47%；營業虧損 5.67 億美元（第二季是獲利 9.74 億）。公司說虧損部分原因是需求超過長期合約，臨時買了 50 億美元的短期算力，價格貴很多，另外還有一筆 20 億的員工捐款配對非現金費用。申請書列出約 8,954 億美元的採購與租賃承諾、大部分是算力，其中約 700 億一年內到期；同時估計前九個月營收有 5–7% 來自違反使用規範的客戶，取締後可能影響成長。發行價還沒定。以上數字依 Euronews 引述，本期沒有直接讀到申請書。", "analogy": "像接單接到產能不夠，只好臨時找外包急件代工，單價貴好幾倍。營收衝上去了，毛利卻被急件費吃掉。", "why": "算力不夠是 Claude 偶爾變慢、用量限制收緊的背後原因之一。申請書寫到要取締違規使用，未來使用條款可能會更嚴格。", "source_name": "Euronews（11/3）", "source_url": "https://www.euronews.com/2026/11/03/anthropic-swings-back-to-operating-loss-as-895-billion-compute-bill-looms-over-ipo"}], "industry": [{"text": "OpenAI 11/2 宣布找新創 Cathedral 幫忙測自家防禦，也提高漏洞獎金（最高 17.2 萬美元）——Cathedral 就是 10 月用 AI agent 進到 Anthropic 部分內部系統的那家。隔天路透引述 5 位知情人士說，OpenAI 員工從 2022 年起就反映內部資安問題；OpenAI 否認忽視資安。", "source_name": "OpenAI 官方公告（11/2）", "source_url": "https://openai.com/index/preparing-our-next-security-sprint-to-harden-openai/"}, {"text": "英國金融科技公司 Revolut 讓約 2,000 名工程師改用自架的 GLM 開放權重模型寫程式（56 張 B200），說推論成本降約 90%，主要取代 Claude Code；看圖、做 UI 的需求仍轉給其他模型。數字都是 Revolut 自報。", "source_name": "The Register（11/3）", "source_url": "https://www.theregister.com/ai-and-ml/2026/11/03/british-fintech-revolut-slashes-ai-coding-costs-10x-by-cutting-out-claude-and-going-self-hosted/5307345"}, {"text": "OpenAI 公開自建的 Git 相容後端 Pando，已經在跑公司的主要程式庫，說 push 延遲中位數降了將近 80%。", "source_name": "OpenAI 官方文章", "source_url": "https://openai.com/index/scaling-git-at-openai/"}], "term": {"zh": "零知識證明", "en": "Zero-Knowledge Proof", "explain": "一種密碼學方法：讓一方證明「某件事是真的」，但不透露讓它成真的祕密。以 FlashProve 為例，模型公司要證明「這段回答是用那份權重算出來的」，卻不用把權重交出去。好的零知識證明有四個性質：誠實的證明一定會通過、假的證明偽造不出來、過程不洩漏祕密、證明檔小又檢查得快。它原本大量用在區塊鏈，用來證明一批交易算對了；現在開始被拿來驗證 AI 推論。代價是產生證明很耗運算，FlashProve 目前要多花約 70–95 倍的 GPU 時間。", "analogy": "像出貨檢驗只給客戶一張由第三方簽章的檢驗報告：客戶能確定產品照規格做，卻看不到你的配方和製程參數。差別是零知識證明不需要信任第三方，數學本身就是那個簽章。", "why": "AI 越來越多是「黑盒子透過網路回答你」，零知識證明是少數能在不公開模型的情況下讓使用者驗證的方法。之後看到「可驗證推論」「verifiable AI」的新聞，背後多半是這個技術。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
