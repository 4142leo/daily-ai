錢反而更賺的」分開算帳。接著本週四 Trump 在白宮會見習近平，AI 是主要議題之一；會前談判美方提出建立美中「AI 安全事件通報機制」，但美國貿易代表講得很明白：晶片與半導體設備的出口管制不在這輪 AI 談判範圍內。", "analogy": "有點像整個產業同意「把產線節拍放慢一點好做品管」，結果賣設備的股票先跌，因為訂單量是照節拍算的。", "why": "「放慢」就算從口號變規則，第一個被綁住的是前沿模型的能力推進，不是你在用的工具；但晶片出口管制照舊，對台灣硬體供應鏈的影響反而比模型端直接得多。", "source_name": "SiliconANGLE", "source_url": "https://siliconangle.com/2026/09/13/sam-altman-and-elon-musk-back-dario-amodeis-call-to-slow-down-the-frontier-of-ai-development/"}, {"tag": "基礎設施", "title": "8MB 的模型跑在微控制器上：Cactus 的 Needle 3 專做工具呼叫，直接放棄聊天能力", "body": "Cactus Compute 開源（Apache-2.0）的 Needle 3，完整模型只有 1.21 億參數，用 2-bit 量化壓成單一檔案 8–29 MB，小到可以直接包進 App 或燒進裝置，從手機、穿戴、智慧家庭到 RISC-V 微控制器都能跑；官方在 Raspberry Pi 5 上實測 400–4000 tokens／秒。它刻意放棄通用聊天能力，只練三件事：挑工具並填好參數（tool calling）、從雜亂文字抽出結構化欄位、產生文字向量供本機搜尋。官方宣稱在手機端工具呼叫上贏過大它 10 倍的模型，抽取任務上打平大它 2–3 倍的模型。", "analogy": "這不是把伺服器等級的 SoC 縮小，而是直接換成一顆專用 MCU——通用運算能力砍掉九成，換來幾毫瓦的功耗跟塞得進產品外殼的體積。", "why": "這條線最貼近你做的東西——不用連雲端、不用付 API 費、離線也能動的裝置端 AI，正好落在 NFC／電子紙這類低功耗裝置的射程內。", "source_name": "Cactus Compute（官方）", "source_url": "https://cactuscompute.com/needle"}], "industry": [{"text": "Anthropic 傳將於 10 月在 Nasdaq 掛牌，目標估值上看 2 兆美元；6/1 已向 SEC 秘密遞件，但最終定價與時程官方尚未證實。", "source_name": "Benzinga", "source_url": "https://www.benzinga.com/markets/tech/26/09/61756404/anthropic-nasdaq-2-trillion-ipo-second-consecutive-profitable-quarter"}, {"text": "MCP 規格 7/28 完成自「加入授權機制」以來最大改版：協定層改成無狀態（stateless），每個請求自帶完整資訊、不必維持長連線，也新增 MCP Apps 與 Tasks 擴充；8/22 發布新版 roadmap。", "source_name": "MCP Blog", "source_url": "https://blog.modelcontextprotocol.io/posts/2026-07-28/"}, {"text": "同一週兩款長脈絡模型發布：StepFun 的 Step 5（6000 億參數、100 萬 token 脈絡）與阿里的 Qwen3.8-Omni-Flash（多模態、同樣 100 萬 token）。", "source_name": "AI News Roundup", "source_url": "https://aialvin.substack.com/p/ai-news-roundup-10-developments-to"}, {"text": "PwC 9 月《全球資料中心展望》：資料中心年資本支出將從 2026 年的約 8000 億美元，一路升到 2050 年的每年 1.8 兆美元，美國吃下其中約 48%。", "source_name": "PwC", "source_url": "https://www.pwc.com/gx/en/news-room/press-releases/2026/global-investment-in-ai-infrastructure.html"}], "term": {"zh": "量化", "en": "Quantization", "explain": "把模型裡每個權重（weight，就是訓練出來的那一堆數字）從高精度換成低精度來存。原本一個權重用 16 位元，量化成 4 位元就少掉四分之三的容量，2 位元更極端。代價是精度會掉，所以真功夫不在「壓多小」，而在「哪些權重可以粗、哪些必須留細」。今天講的 Needle 3 就是靠 2-bit 量化，才把模型壓到 8MB 塞得進微控制器。", "analogy": "像電子紙的灰階。同一張圖，16 灰階細緻但更新慢、耗電高；壓成純黑白 2 階，檔案小、刷得快，代價是漸層變色塊。量化就是在決定模型要留幾灰階——而好的量化懂得「臉部保留灰階、背景直接二值化」。", "why": "這是「這個模型到底塞不塞得進我的裝置」的決定性因素，也是為什麼同一個開源模型下載頁會列出一堆 Q4、Q8、INT8 版本——你挑本機跑的模型時，看的就是這個數字。"}} 佔位符。

<style>

    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);

    display:inline-block;border-radius:1px}

    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}

    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}

    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>

  const D = {"day": 5, "date": "2026-09-21", "weekday": "週一", "headline": "Anthropic 自曝 Claude 已經主導 26% 的自家模型研發（今年 2 月還是 0%）；同一週 Amodei 喊「放慢前沿」、對手數小時內附和、晶片股應聲下跌——AI 圈第一次出現「踩煞車」與「照樣跑」同時發生的一週。", "top": [{"tag": "工具", "title": "Claude Code 三連發：AGENTS.md 上線、claude.ai 的 skill 會自動同步到終端機、TaskOutput 工具正式移除", "body": "9/18 官方 changelog 一口氣推了 2.1.275 到 2.1.277。對每天在用的人有三件事會有感：一、專案裡如果沒有 CLAUDE.md，Claude Code 會改讀 AGENTS.md（跨工具通用的那個格式）。二、你在 claude.ai 帳號上啟用的 skill 與 plugin，現在會自動同步進終端機 session，不想要可以用 syncClaudeAiSkills: false 關掉。三、棄用已久的 TaskOutput 工具正式拿掉，背景任務的輸出改用 Read 直接讀檔。另外 subagent 回傳的結果現在會加上「這是 subagent 輸出」的標頭並縮排，避免子代理吐出來的文字被主對話誤讀成使用者指令。", "analogy": "像韌體大版本更新——外觀沒什麼變，但有幾支舊 API 被拔掉、設定檔多認一種檔名。不看 release note 直接燒進去，就會在某個角落炸給你看。", "why": "你手上十幾個 skill 加一整套 CLAUDE.md／handbook 制度，這三項每一項都會直接動到你每天跑的流程——尤其 skill 自動同步，可能讓本機版跟帳號版同時存在、互相蓋台。", "source_name": "Claude Code CHANGELOG（官方）", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}, {"tag": "研究", "title": "Anthropic 公布數字：Claude 現在主導 26% 的自家模型研發，今年 2 月這個數字是 0", "body": "9/18 Anthropic 發文自揭進度：Claude 參與了公司約 90% 的研發工作（多半是在人類緊盯下做大塊執行），其中 26% 是由 Claude「主導」——意思是能從一句高階指令把任務大致從頭做到尾，人類仍在監督、還沒有完全自主。今年 2 月這個主導比例是 0，八個月從 0 爬到 26%。同一篇也承認：模型參與自我改良會讓系統「更難被人類理解或控制」，並說應該盡量縮小前沿實驗室知道的事跟大眾知道的事之間的落差。", "analogy": "像產線上的 AOI 自動光學檢測，從「幫你標出可疑點、人來判」變成「自己判、自己回頭調參數，人只做抽檢」。產出效率跳一階，但你對它為什麼那樣調的掌握度也同時掉一階。", "why": "這是目前少數有實際數字、而不是形容詞的「AI 做 AI」進度指標；也順便解釋了為什麼 Claude Code 這半年的更新節奏會快到你追不完。", "source_name": "U.S. News（Reuters 稿）", "source_url": "https://www.usnews.com/news/business/articles/2026-09-17/anthropic-says-its-model-claude-is-helping-to-build-the-next-version-of-itself"}, {"tag": "政策", "title": "Amodei 喊「放慢前沿」，對手數小時內附和，市場立刻用腳投票；本週四 Trump–習峰會 AI 上桌", "body": "9/13 Anthropic 執行長 Dario Amodei 發表〈We Must Pace the Frontier〉，主張不是停下來，而是把能力推進的速度放慢到安全研究與治理跟得上，具體提案包括讓獨立第三方評測員進駐各實驗室內部。OpenAI 的 Altman、xAI 的 Musk 與 Google DeepMind 高層在數小時內公開表態支持。市場反應很分裂：NVIDIA 跌超過 3%，Meta、微軟、Alphabet 反而上漲——投資人開始把「非砸錢不可的」跟「少花錢反而更賺的」分開算帳。接著本週四 Trump 在白宮會見習近平，AI 是主要議題之一；會前談判美方提出建立美中「AI 安全事件通報機制」，但美國貿易代表講得很明白：晶片與半導體設備的出口管制不在這輪 AI 談判範圍內。", "analogy": "有點像整個產業同意「把產線節拍放慢一點好做品管」，結果賣設備的股票先跌，因為訂單量是照節拍算的。", "why": "「放慢」就算從口號變規則，第一個被綁住的是前沿模型的能力推進，不是你在用的工具；但晶片出口管制照舊，對台灣硬體供應鏈的影響反而比模型端直接得多。", "source_name": "SiliconANGLE", "source_url": "https://siliconangle.com/2026/09/13/sam-altman-and-elon-musk-back-dario-amodeis-call-to-slow-down-the-frontier-of-ai-development/"}, {"tag": "基礎設施", "title": "8MB 的模型跑在微控制器上：Cactus 的 Needle 3 專做工具呼叫，直接放棄聊天能力", "body": "Cactus Compute 開源（Apache-2.0）的 Needle 3，完整模型只有 1.21 億參數，用 2-bit 量化壓成單一檔案 8–29 MB，小到可以直接包進 App 或燒進裝置，從手機、穿戴、智慧家庭到 RISC-V 微控制器都能跑；官方在 Raspberry Pi 5 上實測 400–4000 tokens／秒。它刻意放棄通用聊天能力，只練三件事：挑工具並填好參數（tool calling）、從雜亂文字抽出結構化欄位、產生文字向量供本機搜尋。官方宣稱在手機端工具呼叫上贏過大它 10 倍的模型，抽取任務上打平大它 2–3 倍的模型。", "analogy": "這不是把伺服器等級的 SoC 縮小，而是直接換成一顆專用 MCU——通用運算能力砍掉九成，換來幾毫瓦的功耗跟塞得進產品外殼的體積。", "why": "這條線最貼近你做的東西——不用連雲端、不用付 API 費、離線也能動的裝置端 AI，正好落在 NFC／電子紙這類低功耗裝置的射程內。", "source_name": "Cactus Compute（官方）", "source_url": "https://cactuscompute.com/needle"}], "industry": [{"text": "Anthropic 傳將於 10 月在 Nasdaq 掛牌，目標估值上看 2 兆美元；6/1 已向 SEC 秘密遞件，但最終定價與時程官方尚未證實。", "source_name": "Benzinga", "source_url": "https://www.benzinga.com/markets/tech/26/09/61756404/anthropic-nasdaq-2-trillion-ipo-second-consecutive-profitable-quarter"}, {"text": "MCP 規格 7/28 完成自「加入授權機制」以來最大改版：協定層改成無狀態（stateless），每個請求自帶完整資訊、不必維持長連線，也新增 MCP Apps 與 Tasks 擴充；8/22 發布新版 roadmap。", "source_name": "MCP Blog", "source_url": "https://blog.modelcontextprotocol.io/posts/2026-07-28/"}, {"text": "同一週兩款長脈絡模型發布：StepFun 的 Step 5（6000 億參數、100 萬 token 脈絡）與阿里的 Qwen3.8-Omni-Flash（多模態、同樣 100 萬 token）。", "source_name": "AI News Roundup", "source_url": "https://aialvin.substack.com/p/ai-news-roundup-10-developments-to"}, {"text": "PwC 9 月《全球資料中心展望》：資料中心年資本支出將從 2026 年的約 8000 億美元，一路升到 2050 年的每年 1.8 兆美元，美國吃下其中約 48%。", "source_name": "PwC", "source_url": "https://www.pwc.com/gx/en/news-room/press-releases/2026/global-investment-in-ai-infrastructure.html"}], "term": {"zh": "量化", "en": "Quantization", "explain": "把模型裡每個權重（weight，就是訓練出來的那一堆數字）從高精度換成低精度來存。原本一個權重用 16 位元，量化成 4 位元就少掉四分之三的容量，2 位元更極端。代價是精度會掉，所以真功夫不在「壓多小」，而在「哪些權重可以粗、哪些必須留細」。今天講的 Needle 3 就是靠 2-bit 量化，才把模型壓到 8MB 塞得進微控制器。", "analogy": "像電子紙的灰階。同一張圖，16 灰階細緻但更新慢、耗電高；壓成純黑白 2 階，檔案小、刷得快，代價是漸層變色塊。量化就是在決定模型要留幾灰階——而好的量化懂得「臉部保留灰階、背景直接二值化」。", "why": "這是「這個模型到底塞不塞得進我的裝置」的決定性因素，也是為什麼同一個開源模型下載頁會列出一堆 Q4、Q8、INT8 版本——你挑本機跑的模型時，看的就是這個數字。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  document.title = "每日 AI 情報 #" + (D.day||"") + " · " + (D.date||"");
  document.getElementById("term-file").textContent = "ai-daily.log — day " + (D.day||"") + " (" + (D.date||"") + ")";
  document.getElementById("h-title").textContent = "AI 每日速報 #" + (D.day||"");
  document.getElementById("h-date").textContent = (D.date||"") + (D.weekday?("（"+D.weekday+"）"):"");
  document.getElementById("headline").textContent = D.headline||"";

  document.getElementById("top").innerHTML = (D.top||[]).map(t=>`
    <div class="card">
      ${t.tag?`<span class="chip">${esc(t.tag)}</span>`:""}
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.body)}</p>
      ${t.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(t.analogy)}</div>`:""}
      ${t.why?`<div class="why"><b>為什麼你該知道：</b>${esc(t.why)}</div>`:""}
      ${t.source_url?`<div class="src">來源：<a href="${esc(t.source_url)}" target="_blank" rel="noopener">${esc(t.source_name||t.source_url)}</a></div>`:""}
    </div>`).join("");

  document.getElementById("industry").innerHTML = (D.industry||[]).map(i=>`
    <li>${esc(i.text)} ${i.source_url?`· <a href="${esc(i.source_url)}" target="_blank" rel="noopener">${esc(i.source_name||"來源")}</a>`:""}</li>`).join("");

  const tm = D.term||{};
  document.getElementById("term").innerHTML = `
    <div class="term">
      <div class="name">${esc(tm.zh||"")}<span class="en">${esc(tm.en||"")}</span></div>
      <p>${esc(tm.explain||"")}</p>
      ${tm.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(tm.analogy)}</div>`:""}
      ${tm.why?`<p class="why"><b>為什麼重要：</b>${esc(tm.why)}</p>`:""}
    </div>`;

  document.getElementById("footer").innerHTML =
    "每天自動更新 · 由 Claude 依當日公開新聞整理，僅供快速掌握趨勢，重要決策請點來源查證<br>#" +
    (D.day||"") + " · " + (D.date||"");
</script>
