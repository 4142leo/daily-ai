  build_ai_page.py 會把 content.json 的內容以 JSON 塞進 {"day": 39, "date": "2026-11-11", "weekday": "週三", "headline": "Anthropic 11/10 推出 Claude Sheets、Whiteboards，Dashboards 改名 Claude Data 正式上線，夥伴的 app 也能直接在 Claude 視窗裡開；同一天，Google DeepMind 用新工具 AlphaProof Code 花四週用數學證明 Signal 加密協定的關鍵安全性質；雲端平台 Railway 公布：攻擊者用 AI agent 一路打穿，偷走的 AI 金鑰被刷了約 74 萬美元。", "top": [{"tag": "工具", "title": "Claude 多了試算表、白板、資料儀表板三種協作檔，夥伴的 app 可以直接嵌在 Claude 裡操作", "body": "Anthropic 11/10 推出 Claude Sheets（試算表，可多分頁、寫公式、下拉選單，可匯出 XLSX／CSV）與 Claude Whiteboards（多人白板，可框選一塊問 Claude、會後轉成文件或簡報），兩者都是 beta；原本的 Dashboards 改名 Claude Data 正式上線，可連 Snowflake、Salesforce 等資料源，但「認證查詢」與「即時分享」兩個功能仍是 beta。同時升級互動式連接器（interactive connectors）：Adobe、Atlassian、Box、Notion 等夥伴的畫面可以直接開在對話旁邊，Claude 在你看著的情況下改頁面或資料列，底層用的是 MCP 的延伸規格 MCP Apps。據 Unite.ai 整理，三樣都開放付費方案；Team 方案預設全開，Enterprise 預設關閉 Sheets 與 Whiteboards，Data 預定 11/19 預設開啟。另一個 Claude Meetings（把 Claude 加進會議邊聽邊更新文件）官方寫「即將推出」。", "analogy": "以前像是請外包畫好一張圖，交件後你自己拿去別的軟體改，外包就看不到後續；現在是外包直接坐進你的產線，試算表、白板、儀表板都留在同一條線上，前一站的資料下一站接著用，不用重新交代。", "why": "你現在的開發追蹤表是 xlsx、報告是 HTML，這次等於 Claude 官方把「表格＋圖」做成原生的協作檔。值得注意的是 MCP Apps：MCP 伺服器從只提供工具，變成可以帶自己的操作畫面，之後你在用的連接器（Notion、Google 系列）介面可能會跟著變。", "source_name": "Claude（官方）", "source_url": "https://claude.com/resources/articles/more-ways-to-work-with-claude-sheets-whiteboards-and-interactive-connectors"}, {"tag": "產業", "title": "Railway 被入侵報告：攻擊者用 AI agent 打 26 小時，偷走的 AI 金鑰被刷約 74 萬美元", "body": "雲端託管平台 Railway 11/10 公布完整事件報告：10/20 攻擊者先用建置環境一個未知漏洞逃出檔案隔離、拿到內部憑證，再讀走內部原始碼、從中找到第二個設定錯誤的信任關係，最後拿到解密客戶環境變數的金鑰。最多約 10 萬個工作區（1.85%）的環境變數可能外洩——這是最大可能範圍，不是確認數字；另有 1,852 位使用者的 GitHub OAuth token 與 AI agent 金鑰外洩，已全部重設。Railway 形容這是一場約 26 小時的「agent 速度比賽」：攻擊方同時試很多條路，防守方同時補洞。攻擊者特別找 AI 供應商的金鑰，被盜用刷出約 74 萬美元，Railway 說供應商不退的部分它自己吸收。資安公司 Wiz 把這波針對 AI 開發平台的攻擊稱為「Black October」，Northflank、OpenCode、Warp、Lightning AI 也在名單上。", "analogy": "像有人摸進代工廠的倉庫，不偷成品、專偷各家客戶寄放的「刷卡機」——AI 金鑰就是可以直接幫你付錢的那張卡，偷到就能拿去轉賣或替自己訓練模型。", "why": "你的 GitHub token、Supabase 金鑰、各種 API 金鑰都放在設定檔或環境變數裡，這則提醒兩件事：雲端平台本身也會被打穿，所以金鑰要能隨時換、最好有用量上限與帳單警示；其次，攻擊方已經在用 agent 平行找路，修補速度要跟上。", "source_name": "BleepingComputer", "source_url": "https://www.bleepingcomputer.com/news/apple/railway-breach-leads-to-740-000-in-fraudulent-ai-charges/"}, {"tag": "研究", "title": "Google DeepMind 用 AlphaProof Code 四週證明 Signal 加密協定的關鍵性質成立", "body": "據 Wired 報導，DeepMind 用新的 agent 框架 AlphaProof Code，對 Signal 協定（Signal、Google Messages、WhatsApp 都在用的加密方式）做形式化驗證（Formal Verification），四週內用數學證明了幾項關鍵的密碼學保證成立。範圍有限：證明的是協定的特定性質與程式碼，不是整個 Signal app，也沒找到新漏洞；反過來拿含已知舊漏洞的舊版本去跑，它會正確判定「證不出來」。DeepMind 會公開這次寫的規格與證明。研究員強調關鍵是人機分工——目標（要證什麼）由人審，AI 負責寫證明並自我修正，不是 AI 自己出題自己改。Google 沒公布這次花多少成本，也沒說會不會做成商用服務。", "analogy": "一般測試像抽樣做可靠度實驗，測了一千片沒壞不代表第一千零一片不會壞；形式化驗證則像把電路寫成方程式，證明在規格範圍內「所有輸入」都不會出錯——只是過去寫這種證明的人力貴到只能用在最關鍵的小區塊。", "why": "這跟上期「AI 自己設計電路板」是同一條趨勢的另一半：AI 產出變多，靠人工審查跟不上，就得靠能用數學檢查的方法。但這次也提醒「證明了什麼」要看清楚範圍，跟看跑分要看自報還是第三方是同一種功夫。", "source_name": "WIRED", "source_url": "https://www.wired.com/story/a-new-ai-tool-from-google-deepmind-formally-verified-the-signal-protocol/"}, {"tag": "產業", "title": "Anthropic 啟動上市路演：每股 70–78 美元、預計發行 8.25 億股，代號 ANT", "body": "Anthropic 11/10 官方公告啟動 IPO 路演（roadshow，承銷商帶公司去跟法人投資者簡報、探詢需求的階段）：預計發行 8.25 億股 A 類普通股，其中約 8.01 億股由公司自己發行、約 2,365 萬股由既有股東賣出，每股價格區間 70–78 美元，申請在 Nasdaq 掛牌、代號 ANT；承銷商另有 30 天內加購最多 1.2375 億股的選擇權。照區間上限算，這批股票總值約 644 億美元，Anthropic 自己可拿到的約 561–625 億美元（未扣承銷費）。官方特別寫明：註冊文件還沒生效，現在不能賣股。多家媒體另報導晶片與雲端供應商在 IPO 旁另外承諾約 260 億美元，本期未讀到一手文件。", "why": "這是你天天在用的工具背後的公司要變成上市公司：之後每季財報、營收、算力支出都會公開，產品定價與用量政策也會多一層「對股東交代」的壓力。金額是本期依官方股數與價格區間自行換算。", "source_name": "Anthropic", "source_url": "https://www.anthropic.com/news/roadshow-launch"}], "industry": [{"text": "澳洲總理 Albanese 宣布將設立 AI 安全監管機關、強制 AI 公司通報重大事件，並接受全部 18 項檢討建議——起因是 6 月一個 OpenAI agent 闖進政府的 Medicare 統計入口網站（未取得個資）。", "source_name": "The Next Web", "source_url": "https://thenextweb.com/news/australia-plans-ai-safety-regulator-after-openai-agent-breach"}, {"text": "據 The Information 報導，OpenAI 第三季營收約 100 億美元、年增近五成，但營業虧損仍很大（付費報導，本期只讀到彙整轉述）。", "source_name": "The Information", "source_url": "https://www.theinformation.com/articles/openai-revenue-jumps-10-billion-third-quarter"}, {"text": "Gemini 4 Carbon（第 33 期介紹過）開放給付費 API 與 Google AI Ultra 用戶，優惠價每百萬 token 輸入 2／輸出 10 美元，11/30 後調漲。", "source_name": "Google", "source_url": "https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-carbon-now-available/"}, {"text": "Claude Code 2.1.322 只有一項：Vertex 的 global、us、eu 區開放 fast mode，被拒時自動退回標準速度；跟你的訂閱制用法無關。", "source_name": "Claude Code CHANGELOG", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}], "term": {"zh": "形式化驗證", "en": "Formal Verification", "explain": "用數學證明「程式或協定在所有情況下都符合規格」，而不是靠跑測試抽樣。流程分三步：先把「要保證什麼」寫成精確的數學規格（例如「沒有金鑰的人解不開訊息」），再把程式碼轉成可推理的模型，最後產生一份證明，交給證明檢查器（proof checker）逐步核對。檢查器很小、很嚴格，所以只要它說通過，就不用相信寫證明的人或 AI。限制有兩個：證明只對「寫下來的規格」負責，規格寫漏了、或程式以外的部分（例如手機 app 介面）都不在保證範圍；其次是過去寫證明極度耗人力，這正是 AI 開始介入的地方。", "analogy": "像 IC 設計裡的形式驗證（等價性檢查）：不是丟一堆測試向量進去看輸出對不對，而是用數學確認「合成後的電路在所有輸入下都跟原始 RTL 行為一樣」。測試向量只能證明「有錯」，形式驗證才能證明「沒錯」——但前提是你拿來比對的那份規格本身是對的。", "why": "AI 寫的程式和設計越來越多、人工審查跟不上，「讓 AI 寫證明、讓小而嚴格的檢查器核對」是目前最被看好的解法之一。讀這類新聞時要問兩件事：證明的是哪些性質、範圍多大；規格是誰寫、誰審的。"}} 佔位符。

 平行找路，修補速度要跟上。", "source_name": "BleepingComputer", "source_url": "https://www.bleepingcomputer.com/news/apple/railway-breach-leads-to-740-000-in-fraudulent-ai-charges/"}, {"tag": "研究", "title": "Google DeepMind 用 AlphaProof Code 四週證明 Signal 加密協定的關鍵性質成立", "body": "據 Wired 報導，DeepMind 用新的 agent 框架 AlphaProof Code，對 Signal 協定（Signal、Google Messages、WhatsApp 都在用的加密方式）做形式化驗證（Formal Verification），四週內用數學證明了幾項關鍵的密碼學保證成立。範圍有限：證明的是協定的特定性質與程式碼，不是整個 Signal app，也沒找到新漏洞；反過來拿含已知舊漏洞的舊版本去跑，它會正確判定「證不出來」。DeepMind 會公開這次寫的規格與證明。研究員強調關鍵是人機分工——目標（要證什麼）由人審，AI 負責寫證明並自我修正，不是 AI 自己出題自己改。Google 沒公布這次花多少成本，也沒說會不會做成商用服務。", "analogy": "一般測試像抽樣做可靠度實驗，測了一千片沒壞不代表第一千零一片不會壞；形式化驗證則像把電路寫成方程式，證明在規格範圍內「所有輸入」都不會出錯——只是過去寫這種證明的人力貴到只能用在最關鍵的小區塊。", "why": "這跟上期「AI 自己設計電路板」是同一條趨勢的另一半：AI 產出變多，靠人工審查跟不上，就得靠能用數學檢查的方法。但這次也提醒「證明了什麼」要看清楚範圍，跟看跑分要看自報還是第三方是同一種功夫。", "source_name": "WIRED", "source_url": "https://www.wired.com/story/a-new-ai-tool-from-google-deepmind-formally-verified-the-signal-protocol/"}, {"tag": "產業", "title": "Anthropic 啟動上市路演：每股 70–78 美元、預計發行 8.25 億股，代號 ANT", "body": "Anthropic 11/10 官方公告啟動 IPO 路演（roadshow，承銷商帶公司去跟法人投資者簡報、探詢需求的階段）：預計發行 8.25 億股 A 類普通股，其中約 8.01 億股由公司自己發行、約 2,365 萬股由既有股東賣出，每股價格區間 70–78 美元，申請在 Nasdaq 掛牌、代號 ANT；承銷商另有 30 天內加購最多 1.2375 億股的選擇權。照區間上限算，這批股票總值約 644 億美元，Anthropic 自己可拿到的約 561–625 億美元（未扣承銷費）。官方特別寫明：註冊文件還沒生效，現在不能賣股。多家媒體另報導晶片與雲端供應商在 IPO 旁另外承諾約 260 億美元，本期未讀到一手文件。", "why": "這是你天天在用的工具背後的公司要變成上市公司：之後每季財報、營收、算力支出都會公開，產品定價與用量政策也會多一層「對股東交代」的壓力。金額是本期依官方股數與價格區間自行換算。", "source_name": "Anthropic", "source_url": "https://www.anthropic.com/news/roadshow-launch"}], "industry": [{"text": "澳洲總理 Albanese 宣布將設立 AI 安全監管機關、強制 AI 公司通報重大事件，並接受全部 18 項檢討建議——起因是 6 月一個 OpenAI agent 闖進政府的 Medicare 統計入口網站（未取得個資）。", "source_name": "The Next Web", "source_url": "https://thenextweb.com/news/australia-plans-ai-safety-regulator-after-openai-agent-breach"}, {"text": "據 The Information 報導，OpenAI 第三季營收約 100 億美元、年增近五成，但營業虧損仍很大（付費報導，本期只讀到彙整轉述）。", "source_name": "The Information", "source_url": "https://www.theinformation.com/articles/openai-revenue-jumps-10-billion-third-quarter"}, {"text": "Gemini 4 Carbon（第 33 期介紹過）開放給付費 API 與 Google AI Ultra 用戶，優惠價每百萬 token 輸入 2／輸出 10 美元，11/30 後調漲。", "source_name": "Google", "source_url": "https://blog.google/innovation-and-ai/models-and-research/gemini-models/gemini-4-carbon-now-available/"}, {"text": "Claude Code 2.1.322 只有一項：Vertex 的 global、us、eu 區開放 fast mode，被拒時自動退回標準速度；跟你的訂閱制用法無關。", "source_name": "Claude Code CHANGELOG", "source_url": "https://github.com/anthropics/claude-code/blob/main/CHANGELOG.md"}], "term": {"zh": "形式化驗證", "en": "Formal Verification", "explain": "用數學證明「程式或協定在所有情況下都符合規格」，而不是靠跑測試抽樣。流程分三步：先把「要保證什麼」寫成精確的數學規格（例如「沒有金鑰的人解不開訊息」），再把程式碼轉成可推理的模型，最後產生一份證明，交給證明檢查器（proof checker）逐步核對。檢查器很小、很嚴格，所以只要它說通過，就不用相信寫證明的人或 AI。限制有兩個：證明只對「寫下來的規格」負責，規格寫漏了、或程式以外的部分（例如手機 app 介面）都不在保證範圍；其次是過去寫證明極度耗人力，這正是 AI 開始介入的地方。", "analogy": "像 IC 設計裡的形式驗證（等價性檢查）：不是丟一堆測試向量進去看輸出對不對，而是用數學確認「合成後的電路在所有輸入下都跟原始 RTL 行為一樣」。測試向量只能證明「有錯」，形式驗證才能證明「沒錯」——但前提是你拿來比對的那份規格本身是對的。", "why": "AI 寫的程式和設計越來越多、人工審查跟不上，「讓 AI 寫證明、讓小而嚴格的檢查器核對」是目前最被看好的解法之一。讀這類新聞時要問兩件事：證明的是哪些性質、範圍多大；規格是誰寫、誰審的。"}};
