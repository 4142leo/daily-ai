統的事故會通知相關單位。前 Anthropic 研究員 Coxon 等吹哨者在會中呼籲放慢前沿模型開發。議會接下來會再發書面問題，尚無表決時程。", "analogy": "像供應商稽核時問「這批料出問題誰賠」，對方只說「我們一向很重視品質」——態度有了，合約條款沒有。", "why": "這是第 11 期紐約市「AI 關機開關」等 10 個法案的後續。地方政府開始要求第三方驗證和事故通報，未來這類要求可能一路往下傳到使用 AI 的廠商——包括用 AI 做客服、做產品的公司。", "source_name": "amNY", "source_url": "https://www.amny.com/news/ai-giants-nyc-council-whistleblower-warnings/"}, {"tag": "產業", "title": "ChatGPT 生圖時要開始放圖片廣告了：每週 12 億人用，廣告業務上線約 200 天就破 10 億美元年化", "body": "OpenAI 10/5 宣布，本月稍晚在美國免費版測試「視覺廣告」：你等 ChatGPT 生圖的時候，進度框下方會出現品牌的圖片廣告，標明是廣告、跟生成的圖分開。OpenAI 同時加入 DoubleVerify、Kochava 等第三方追蹤夥伴，讓廣告主量得到有沒有帶來購買。OpenAI 說廣告不影響 ChatGPT 的回答；ChatGPT 每週觸及 12 億人，廣告業務約 200 天達到 10 億美元年化營收。", "why": "免費 AI 工具開始走「看廣告換使用」的老路。對品牌方來說，ChatGPT 正在變成新的廣告通路；對使用者來說，免費版的體驗會越來越像其他平台。", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/10/05/openai-launches-visual-ads-that-appear-alongside-image-generation-results/"}], "industry": [{"text": "AMD 執行長蘇姿丰 10/5 閃電來台，主要任務是跟台積電與封裝、測試、載板供應商協調產能——AI 晶片的瓶頸已經從晶圓擴散到封裝和載板，供應吃緊、價格上漲。台積電 10/15 法說會將是下一個觀察點。", "source_name": "DIGITIMES", "source_url": "https://digitimes.com/news/a20261005PD238/amd-taiwan-ceo-capacity-packaging.html"}, {"text": "南韓新韓銀行 9/29–30 遭入侵、約 2.5 萬名客戶的姓名、電話、年收入與貸款額度外洩；調查人員在疑似相關的伺服器上找到 AI 滲透測試工具 ARTEX AI 的痕跡，攻擊手法是用外洩帳密大量撞庫。KB 國民、Hana 銀行也各有數十到上百名客戶受影響，金融監督院已進場檢查。", "source_name": "Insurance Journal（Bloomberg）", "source_url": "https://www.insurancejournal.com/news/international/2026/10/02/887749.htm"}], "term": {"zh": "測試集污染", "en": "Benchmark Contamination / Data Contamination", "explain": "模型在訓練時，已經從網路上「看過」考題或答案，考試時其實是在背答案，不是真的會解。題目一公開就會被爬進下一代模型的訓練資料，所以越老、越有名的基準，分數越容易虛高。今天新聞裡的 LiveBench 就是為了對付這件事設計的：每個月換掉約六分之一的題目、新題先保密一個月，題目來源是最近的競賽、論文與新聞，而且只用有標準答案的題目自動評分。", "analogy": "像供應商拿到你的進料檢驗抽樣規則，就專門把會被抽到的那幾箱做好。對策是抽樣規則不公開、而且定期換——LiveBench 的「每月換題、新題先保密」就是這個邏輯。", "why": "看到「某模型在某基準拿高分」，先問兩件事：這份考卷公開多久了？有沒有定期換題？舊基準上的分差，可能只是誰背得比較多。你自己測 skill 或 prompt 時也一樣：拿來調參的那幾題，不要同時拿來當驗收題。"}} 佔位符。

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#0a0d10; --panel:#12161b; --panel2:#0d1116; --line:#1f2730;
    --ink:#d7dadd; --sub:#7d868f; --accent:#ffb000; --accent-soft:rgba(255,176,0,.12);
    --shadow:0 0 0 1px rgba(255,176,0,.04),0 10px 28px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box}
  html{color-scheme:dark}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"JetBrains Mono","Consolas","Menlo","Noto Sans Mono TC","Microsoft JhengHei",monospace;
    line-height:1.7;-webkit-font-smoothing:antialiased;font-size:15px}
  a{color:var(--accent)}
  .term-window{max-width:720px;margin:0 auto;min-height:100vh;
    background:var(--panel);border-left:1px solid var(--line);border-right:1px solid var(--line);
    box-shadow:var(--shadow)}
  .term-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;
    background:var(--panel2);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:1}
  .term-bar .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .term-bar .dot.r{background:#ff5f56}
  .term-bar .dot.y{background:#ffbd2e}
  .term-bar .dot.g{background:#27c93f}
  .term-bar .file{margin-left:6px;font-size:12px;color:var(--sub);letter-spacing:.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrap{padding:22px 18px 64px}
  header{padding:4px 2px 18px}
  .kicker{font-size:12.5px;color:var(--accent);font-weight:700;letter-spacing:.05em}
  h1{font-size:22px;margin:6px 0 4px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .date{font-size:13px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:15px 16px;background:var(--accent-soft);
    border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:4px;
    font-size:14.5px;color:var(--ink)}
  .sec-title{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.05em;
    margin:30px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:3px;height:14px;background:var(--accent);
    display:inline-block;border-radius:1px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:15px 16px;margin-bottom:12px}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--accent);
    background:var(--accent-soft);border:1px solid rgba(255,176,0,.25);
    padding:2px 9px;border-radius:3px;margin-bottom:9px;letter-spacing:.02em}
  .card h3{font-size:16.5px;margin:2px 0 8px;font-weight:700;line-height:1.5;color:var(--ink)}
  .card p{margin:6px 0;font-size:14.5px;color:var(--ink)}
  .analogy{background:var(--bg);border:1px solid var(--line);border-radius:4px;
    padding:9px 12px;font-size:13.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:13px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:12.5px;margin-top:10px;color:var(--sub)}
  .src a{text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;font-size:14px;color:var(--ink)}
  ul.ind li a{text-decoration:none;font-size:12.5px}
  ul.ind li a:hover{text-decoration:underline}
  .term{background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent);
    border-radius:6px;padding:17px}
  .term .name{font-size:18px;font-weight:700;color:var(--ink)}
  .term .en{font-size:13px;color:var(--accent);font-weight:600;margin-left:7px}
  .term p{margin:8px 0;font-size:14.5px;color:var(--ink)}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:11.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>
<div class="term-window">
  <div class="term-bar">
    <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
    <span class="file" id="term-file">ai-daily.log</span>
  </div>
  <div class="wrap">
    <header>
      <div class="kicker">每日 AI 情報</div>
      <h1 id="h-title">AI 每日速報</h1>
      <div class="date" id="h-date"></div>
    </header>
    <div class="headline" id="headline"></div>

    <div class="sec-title">今日重點</div>
    <div id="top"></div>

    <div class="sec-title">產業動態</div>
    <ul class="ind" id="industry"></ul>

    <div class="sec-title">今日一詞</div>
    <div id="term"></div>

    <footer id="footer"></footer>
  </div>
</div>
<script>
  const D = {"day": 19, "date": "2026-10-06", "weekday": "週二", "headline": "Bloomberg Intelligence 算出中美頂尖模型的跑分差距只剩 3%（年初還有 15%），而且 DeepSeek 每百萬 token 便宜幾十倍；同一天紐約市議會讓 Anthropic、OpenAI、Google、Meta 宣誓作證，四家都沒正面回答「出事誰負責」——能力差距在縮小，責任歸屬還是一片空白。", "top": [{"tag": "工具", "title": "Claude Code 2.1.290／2.1.291：hook 終於分得出「是 subagent 還是主對話」在要權限，另修好「退出時最後幾則訊息會不見」", "body": "10/5 的 2.1.290 是一次大改版（官方說另含 200 多項修正）。跟你最有關的幾項：plugin hook 的權限檢查事件多了 `agentId`，hook 可以分辨這次要權限的是 subagent 還是主對話；`claude attach`／`claude logs` 可以只打 session 名稱的一部分；組織的管理設定（managed settings）如果蓋掉你自己設的沙箱白名單，`/status` 和 doctor 會跳警告。10/6 緊接著出 2.1.291，修掉兩個回歸錯誤：雲端 session 可能吃掉你對權限提示的回答，以及 2.1.288 引入的「退出時 session 最後幾則訊息可能遺失」。", "analogy": "`agentId` 就像產線上每個工站的刷卡記錄多了「工號」欄位：以前只知道有人開了門，現在知道是領班還是派遣工開的，門禁規則就能分開設。", "why": "你大量派 subagent 掃檔、審查；以後可以寫 hook 讓 subagent 的權限比主對話更緊。另外如果你在 2.1.288～2.1.290 之間遇過「重開後少了最後幾句」，原因就是這個，更新到 2.1.291 就好。", "source_name": "Claude Code 官方 Changelog", "source_url": "https://code.claude.com/docs/en/changelog"}, {"tag": "產業", "title": "中美頂尖模型跑分差距縮到 3%：DeepSeek V4.1 Flash 在 LiveBench 拿 81.1，Anthropic 最高 83.4", "body": "Bloomberg Intelligence 10/4 的報告：9 月 DeepSeek 推出 V4.1 Flash 之後，中國最強模型跟美國最強模型在基準測試上只差約 3%，5 月時約 9%、年初約 15%。V4.1 Flash 在 LiveBench 拿 81.1 分、全球第六，Anthropic 旗艦 83.4 分。價格差更大：以每百萬 token 計，Anthropic 旗艦比 DeepSeek 貴 42 到 83 倍。但報告也說，中國 AI 公司因為價格戰，可能要到 2030 年才賺錢。", "analogy": "像兩家廠的良率只差 3 個百分點，但一家報價是另一家的幾十倍。買家會不會轉單，看的不只是良率，還有交期、售後、能不能進你的供應鏈名單。", "why": "「差 3%」是平均分數，不代表你的實際任務也只差 3%——尤其是 agent 長流程、工具呼叫這類 LiveBench 沒怎麼考的能力。看到這種標題，先問「考的是哪張卷、跟我的工作像不像」（見今日一詞）。", "source_name": "Bloomberg", "source_url": "https://www.bloomberg.com/news/articles/2026-10-04/us-lead-in-ai-over-china-narrows-after-deepseek-gains-bi-says"}, {"tag": "政策", "title": "紐約市議會讓四家 AI 公司宣誓作證：被問「出事誰負責」「沒通過安全測試會不會停發」，都沒給明確答案", "body": "10/5 的全體委員會聽證，OpenAI、Anthropic、Google、Meta 各派一位代表宣誓作證；三家是在傳票威脅下才答應出席，xAI（SpaceXAI）收到傳票仍沒到。議長 Menin 追問災難性風險的機率、AI 造成傷亡時公司要不要負法律責任、第三方驗證沒過是否就不發布，各家都沒有給出全面承諾；OpenAI 只承諾影響紐約市系統的事故會通知相關單位。前 Anthropic 研究員 Coxon 等吹哨者在會中呼籲放慢前沿模型開發。議會接下來會再發書面問題，尚無表決時程。", "analogy": "像供應商稽核時問「這批料出問題誰賠」，對方只說「我們一向很重視品質」——態度有了，合約條款沒有。", "why": "這是第 11 期紐約市「AI 關機開關」等 10 個法案的後續。地方政府開始要求第三方驗證和事故通報，未來這類要求可能一路往下傳到使用 AI 的廠商——包括用 AI 做客服、做產品的公司。", "source_name": "amNY", "source_url": "https://www.amny.com/news/ai-giants-nyc-council-whistleblower-warnings/"}, {"tag": "產業", "title": "ChatGPT 生圖時要開始放圖片廣告了：每週 12 億人用，廣告業務上線約 200 天就破 10 億美元年化", "body": "OpenAI 10/5 宣布，本月稍晚在美國免費版測試「視覺廣告」：你等 ChatGPT 生圖的時候，進度框下方會出現品牌的圖片廣告，標明是廣告、跟生成的圖分開。OpenAI 同時加入 DoubleVerify、Kochava 等第三方追蹤夥伴，讓廣告主量得到有沒有帶來購買。OpenAI 說廣告不影響 ChatGPT 的回答；ChatGPT 每週觸及 12 億人，廣告業務約 200 天達到 10 億美元年化營收。", "why": "免費 AI 工具開始走「看廣告換使用」的老路。對品牌方來說，ChatGPT 正在變成新的廣告通路；對使用者來說，免費版的體驗會越來越像其他平台。", "source_name": "TechCrunch", "source_url": "https://techcrunch.com/2026/10/05/openai-launches-visual-ads-that-appear-alongside-image-generation-results/"}], "industry": [{"text": "AMD 執行長蘇姿丰 10/5 閃電來台，主要任務是跟台積電與封裝、測試、載板供應商協調產能——AI 晶片的瓶頸已經從晶圓擴散到封裝和載板，供應吃緊、價格上漲。台積電 10/15 法說會將是下一個觀察點。", "source_name": "DIGITIMES", "source_url": "https://digitimes.com/news/a20261005PD238/amd-taiwan-ceo-capacity-packaging.html"}, {"text": "南韓新韓銀行 9/29–30 遭入侵、約 2.5 萬名客戶的姓名、電話、年收入與貸款額度外洩；調查人員在疑似相關的伺服器上找到 AI 滲透測試工具 ARTEX AI 的痕跡，攻擊手法是用外洩帳密大量撞庫。KB 國民、Hana 銀行也各有數十到上百名客戶受影響，金融監督院已進場檢查。", "source_name": "Insurance Journal（Bloomberg）", "source_url": "https://www.insurancejournal.com/news/international/2026/10/02/887749.htm"}], "term": {"zh": "測試集污染", "en": "Benchmark Contamination / Data Contamination", "explain": "模型在訓練時，已經從網路上「看過」考題或答案，考試時其實是在背答案，不是真的會解。題目一公開就會被爬進下一代模型的訓練資料，所以越老、越有名的基準，分數越容易虛高。今天新聞裡的 LiveBench 就是為了對付這件事設計的：每個月換掉約六分之一的題目、新題先保密一個月，題目來源是最近的競賽、論文與新聞，而且只用有標準答案的題目自動評分。", "analogy": "像供應商拿到你的進料檢驗抽樣規則，就專門把會被抽到的那幾箱做好。對策是抽樣規則不公開、而且定期換——LiveBench 的「每月換題、新題先保密」就是這個邏輯。", "why": "看到「某模型在某基準拿高分」，先問兩件事：這份考卷公開多久了？有沒有定期換題？舊基準上的分差，可能只是誰背得比較多。你自己測 skill 或 prompt 時也一樣：拿來調參的那幾題，不要同時拿來當驗收題。"}};
  const esc = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  document.title = "每日 AI 情報 #" + (D.day||"") + " · " + (D.date||"");
  document.getElementById("term-file").textContent = "ai-daily.log — day " + (D.day||"") + " (" + (D.date||"") + ")";
  document.getElementById("h-title").textContent = "AI 每日速報 #" + (D.day||"");
  document.getElementById("h-date").textContent = (D.date||"") + (D.weekday?("（"+D.weekday+"）"):"");
  document.getElementById("headline").textContent = D.headline||"";

  document.getElementById("top").innerHTML = (D.top||[]).map(t=>`
    <div class="card">
      ${t.tag?`<span class="chip">${esc(t.tag)}</span>`:""}
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.body)}</p>
      ${t.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(t.analogy)}</div>`:""}
      ${t.why?`<div class="why"><b>為什麼你該知道：</b>${esc(t.why)}</div>`:""}
      ${t.source_url?`<div class="src">來源：<a href="${esc(t.source_url)}" target="_blank" rel="noopener">${esc(t.source_name||t.source_url)}</a></div>`:""}
    </div>`).join("");

  document.getElementById("industry").innerHTML = (D.industry||[]).map(i=>`
    <li>${esc(i.text)} ${i.source_url?`· <a href="${esc(i.source_url)}" target="_blank" rel="noopener">${esc(i.source_name||"來源")}</a>`:""}</li>`).join("");

  const tm = D.term||{};
  document.getElementById("term").innerHTML = `
    <div class="term">
      <div class="name">${esc(tm.zh||"")}<span class="en">${esc(tm.en||"")}</span></div>
      <p>${esc(tm.explain||"")}</p>
      ${tm.analogy?`<div class="analogy"><b>用硬體比喻：</b>${esc(tm.analogy)}</div>`:""}
      ${tm.why?`<p class="why"><b>為什麼重要：</b>${esc(tm.why)}</p>`:""}
    </div>`;

  document.getElementById("footer").innerHTML =
    "每天自動更新 · 由 Claude 依當日公開新聞整理，僅供快速掌握趨勢，重要決策請點來源查證<br>#" +
    (D.day||"") + " · " + (D.date||"");
</script>
