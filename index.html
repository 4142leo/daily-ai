<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日 AI 情報</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --ink:#1a1c1f; --sub:#5a6069; --line:#e6e8ec;
    --accent:#3b5bdb; --accent-soft:#e7ecfb; --chip:#eef1f6; --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#0f1115; --card:#181b21; --ink:#e8eaed; --sub:#9aa1ac; --line:#262a31;
      --accent:#8aa2ff; --accent-soft:#1e2740; --chip:#232833; --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,"Segoe UI",Roboto,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    line-height:1.65;-webkit-font-smoothing:antialiased;font-size:16px}
  .wrap{max-width:680px;margin:0 auto;padding:20px 16px 64px}
  header{padding:8px 2px 18px}
  .kicker{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.04em}
  h1{font-size:26px;margin:6px 0 4px;font-weight:800;letter-spacing:-.01em}
  .date{font-size:14px;color:var(--sub)}
  .headline{margin:16px 0 8px;padding:16px 18px;background:var(--accent-soft);border-radius:14px;
    font-size:16px;font-weight:600;color:var(--ink);border:1px solid var(--line)}
  .sec-title{font-size:14px;font-weight:800;color:var(--sub);letter-spacing:.06em;
    text-transform:none;margin:28px 4px 12px;display:flex;align-items:center;gap:8px}
  .sec-title::before{content:"";width:4px;height:16px;background:var(--accent);border-radius:2px;display:inline-block}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;
    margin-bottom:12px;box-shadow:var(--shadow)}
  .chip{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);
    background:var(--chip);padding:3px 10px;border-radius:999px;margin-bottom:8px}
  .card h3{font-size:18px;margin:2px 0 8px;font-weight:750;line-height:1.4}
  .card p{margin:6px 0;font-size:15.5px}
  .analogy{background:var(--chip);border-radius:10px;padding:9px 12px;font-size:14.5px;color:var(--ink);margin:10px 0}
  .analogy b{color:var(--accent)}
  .why{font-size:14px;color:var(--sub);margin-top:8px}
  .why b{color:var(--ink)}
  .src{font-size:13px;margin-top:10px}
  .src a{color:var(--accent);text-decoration:none}
  .src a:hover{text-decoration:underline}
  ul.ind{list-style:none;padding:0;margin:0}
  ul.ind li{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;font-size:15px;box-shadow:var(--shadow)}
  ul.ind li a{color:var(--accent);text-decoration:none;font-size:13px}
  .term{background:linear-gradient(135deg,var(--accent-soft),var(--card));
    border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
  .term .name{font-size:20px;font-weight:800}
  .term .en{font-size:14px;color:var(--sub);font-weight:600;margin-left:6px}
  .term p{margin:8px 0;font-size:15.5px}
  footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--sub);text-align:center;line-height:1.8}
</style>
<div class="wrap">
  <header>
    <div class="kicker">每日 AI 情報</div>
    <h1 id="h-title">AI 每日速報</h1>
    <div class="date" id="h-date"></div>
  </header>
  <div class="headline" id="headline"></div>

  <div class="sec-title">今日重點</div>
  <div id="top"></div>

  <div class="sec-title">產業動態</div>
  <ul class="ind" id="industry"></ul>

  <div class="sec-title">今日一詞</div>
  <div id="term"></div>

  <footer id="footer"></footer>
</div>
